        <p>漏掉的那家页还挂着。马秀兰可能继续按娘家日子卖纸马，崔伯的红码还在柜上，齐小满的垃圾袋句子还在黄页置顶。居民再投诉，值班室会把星辉的名字写在前面。</p>
        <p>你不是没看见，是少点了两下。饭票还在下层，他不让你动。</p>
