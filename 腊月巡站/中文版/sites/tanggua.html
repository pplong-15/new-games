      <section>
        <p>甘老三。西关十字南，糖锅支在人行道里侧。我按西关出摊，二十三黄昏前糖是热的。南边念四我不管。灶码纸马我没有，别问我关哪家店。麦芽三块四，熟客两块九，少秤的自己带秤来对。</p>
        <div class="swatch" title=""></div>
        <p>路桂芬办公室的人来要过一筐，我说公家不记账。章树生也不向我批发年货，他不给街道备糖，我更不给。这铺子只卖糖，日子跟县里布告走。有人把我写进关停名单，那是看花了眼。</p>
        <p>光驱上别放糖。方正平下午来拿过两块，说夜班垫肚子。账记在他墙上，不记在回执上。电话 5503，打通了先报斤数。</p>
      </section>
    </main>
    <footer>甘老三手打　模板是复印店剩的米黄　出摊到二十三夜里收锅</footer>
