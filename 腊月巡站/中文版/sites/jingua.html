        <h3>净瓜家政　侯秋生</h3>
        <p>有人把我们看成净轩。她扫尘，我只抹玻璃。龛里那碗灰我连手都不伸。换纱窗、刮水渍、阳台外层，这些我干。灶台、神龛、香灰，这些我回绝。</p>
        <p>电话 8091。一窗八块，外层加倍。腊月人少，我还能排上。名字近，不是一家。齐小满置顶费她自己交，我连黄页置顶都没买，这条是分类栏免费挂的。</p>
        <p>夜班要是看花眼，把净瓜勾进关停，值班室会退。我页上没写灰进桶，也没写错日，更没有红码。擦窗的活过完年还在。</p>
      </div>
