        <div class="scroll">报价不进黄页置顶。来电话问。</div>
        <p>一室三十五，两室五十。比净轩贵十五的那档，贵在瓷盏。灰盛进瓷盏，亲手递回东家。笤帚停在龛外。谁要把龛灰跟墙土捆走，去请别人。</p>
        <p>安津西关听二十三。我们过了黄昏才进门。江南亲戚念四，班表不跟。东家自己提前揭码，我们也在二十三夜里再动灶沿。</p>
        <p>公家来要年货，回过不备。名录挂在信息站，那是名录。有人嫌这页扎眼，扎眼也比乱写强。路婶上周来要过，我没给。这页只报工钱，不报私怨。</p>
