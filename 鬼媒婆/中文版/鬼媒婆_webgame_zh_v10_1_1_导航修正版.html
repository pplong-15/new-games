<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b1110">
    <meta
      name="description"
      content="一份待核对的旧网页资料。通过论坛、历史快照和公开索引还原来源。"
    >
    <title>城南问答｜资料互助</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b1110'/%3E%3Cpath d='M18 15h28v34H18z' fill='%23841f24'/%3E%3Cpath d='M24 23h16M24 31h16M24 39h10' stroke='%23ead9b8' stroke-width='3'/%3E%3C/svg%3E">
    <style>
:root {
  color-scheme: light;
  --focus: #d67910;
  font-synthesis: none;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  scroll-behavior: smooth;
  touch-action: manipulation;
  pointer-events: auto;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: #202326;
  background: #fff;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  touch-action: manipulation;
  pointer-events: auto;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}

button {
  cursor: pointer;
}

code {
  overflow-wrap: anywhere;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

.site-width {
  width: min(1160px, calc(100% - 32px));
  margin-inline: auto;
}

.skip-link {
  position: fixed;
  z-index: 999;
  top: 8px;
  left: 8px;
  padding: 9px 14px;
  color: #fff;
  background: #111;
  transform: translateY(-150%);
}

.skip-link:focus {
  transform: translateY(0);
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

#main-content:focus {
  outline: none;
}

.noscript-panel {
  max-width: 640px;
  margin: 60px auto;
  padding: 24px;
  border: 1px solid #aaa;
}

/* Browser note: deliberately neutral and separate from every in-world site. */
.notebook-toggle {
  position: fixed;
  z-index: 90;
  right: 18px;
  bottom: 18px;
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 38px;
  padding: 0 14px;
  color: #f2f2f2;
  background: #24282c;
  border: 1px solid #080909;
  border-radius: 3px;
  box-shadow: 0 2px 9px rgb(0 0 0 / 24%);
  font-size: 13px;
}

.notebook-toggle span {
  color: #ffd676;
}

.notebook-scrim {
  position: fixed;
  z-index: 91;
  inset: 0;
  visibility: hidden;
  pointer-events: none;
  background: rgb(0 0 0 / 20%);
  opacity: 0;
  transition: opacity 160ms ease;
}

.notebook-scrim.open {
  visibility: visible;
  pointer-events: auto;
  opacity: 1;
}

.notebook {
  position: fixed;
  z-index: 92;
  top: 0;
  right: 0;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  width: min(380px, 92vw);
  height: 100dvh;
  color: #252525;
  background: #f5f1e6;
  border-left: 1px solid #5f5a4d;
  box-shadow: -9px 0 28px rgb(0 0 0 / 24%);
  transform: translateX(102%);
  transition: transform 180ms ease;
}

.notebook.open {
  transform: translateX(0);
}

.notebook > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 14px;
  color: #eee;
  background: #292c2f;
  border-bottom: 4px solid #c9a745;
}

.notebook > header small {
  color: #b8bec3;
  font-size: 11px;
}

.notebook > header h2 {
  margin: 2px 0 0;
  font: 700 19px/1.2 Arial, sans-serif;
}

.notebook > header button {
  width: 32px;
  height: 32px;
  color: #fff;
  background: transparent;
  border: 1px solid #71777d;
  font-size: 22px;
}

.notebook-recent {
  margin: 0;
  padding: 11px 20px;
  color: #5f5b51;
  background: #e9e3d4;
  border-bottom: 1px solid #cbc2af;
  font-size: 12px;
}

.notebook ol {
  overflow: auto;
  margin: 0;
  padding: 12px 20px 24px;
  list-style: none;
}

.notebook li {
  padding: 12px 4px;
  border-bottom: 1px dashed #bbb09b;
}

.notebook li span {
  display: block;
  margin-bottom: 5px;
  color: #746d60;
  font-size: 11px;
}

.notebook li code {
  display: block;
  font-size: 12px;
  line-height: 1.55;
}

.notebook li.empty {
  color: #777063;
  font: 13px/1.7 Georgia, "Songti SC", serif;
}

.notebook > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 16px;
  background: #e4dece;
  border-top: 1px solid #bcb29e;
  font-size: 11px;
}

.notebook > footer button {
  padding: 5px 8px;
  color: #6d281e;
  background: transparent;
  border: 1px solid #a58f7c;
}

/* Entry */
body[data-theme="entry"] {
  background: #dfe4e7;
}

.entry-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 16px;
  background:
    linear-gradient(rgb(255 255 255 / 42%) 1px, transparent 1px),
    linear-gradient(90deg, rgb(255 255 255 / 42%) 1px, transparent 1px),
    #dfe4e7;
  background-size: 24px 24px;
}

.entry-window {
  width: min(760px, 100%);
  background: #f8f9fa;
  border: 1px solid #919aa1;
  box-shadow: 0 18px 55px rgb(52 63 70 / 24%);
}

.entry-window > header {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 14px;
  color: #eaf0f5;
  background: #334a5f;
  border-bottom: 1px solid #1b2f41;
  font-size: 12px;
}

.entry-window > header div {
  display: flex;
  align-items: center;
  gap: 8px;
}

.entry-window > header small,
.entry-window > header time {
  color: #c6d1db;
}

.entry-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e09a39;
  box-shadow: 0 0 0 3px rgb(224 154 57 / 20%);
}

.entry-window-body {
  padding: 42px 50px 36px;
}

.entry-unread {
  display: inline-block;
  margin: 0 0 16px;
  padding: 4px 8px;
  color: #8b2a1e;
  background: #fff0e7;
  border: 1px solid #dfb39b;
  font-size: 12px;
}

.entry-window h1 {
  max-width: 580px;
  margin: 0;
  color: #1c2933;
  font: 700 31px/1.35 "Microsoft YaHei", sans-serif;
  letter-spacing: -.03em;
}

.entry-window-body > p:not(.entry-unread) {
  max-width: 630px;
  margin: 19px 0 24px;
  color: #53606a;
  font-size: 15px;
  line-height: 1.9;
}

.entry-thread-preview {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px 16px;
  margin: 0 0 24px;
  background: #fff;
  border: 1px solid #c7cdd2;
  border-left: 4px solid #517596;
}

.entry-thread-preview > span {
  flex: 0 0 auto;
  padding: 3px 7px;
  color: #fff;
  background: #a84b3a;
  font-size: 11px;
}

.entry-thread-preview div {
  min-width: 0;
}

.entry-thread-preview b,
.entry-thread-preview small {
  display: block;
}

.entry-thread-preview b {
  overflow: hidden;
  color: #263b4e;
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.entry-thread-preview small {
  margin-top: 5px;
  color: #899198;
  font-size: 11px;
}

.entry-window-body > button {
  min-width: 132px;
  padding: 10px 22px;
  color: #fff;
  background: #2f638e;
  border: 1px solid #204968;
  box-shadow: inset 0 1px rgb(255 255 255 / 20%);
  font-weight: 700;
}

.entry-window-body > button:hover {
  background: #254f70;
}

.entry-window-body > .entry-reset {
  min-width: auto;
  margin-left: 10px;
  color: #64717a;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  font-weight: 400;
}

.entry-window > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 14px;
  color: #79828a;
  background: #eef1f3;
  border-top: 1px solid #cbd1d5;
  font-size: 11px;
}

.entry-window details {
  text-align: right;
}

.entry-window details p {
  max-width: 360px;
  margin: 8px 0 0;
  line-height: 1.5;
}

/* Forum: dense local BBS, square and practical. */
body[data-theme="forum"] {
  background: #e9edf1;
  font-size: 13px;
}

.forum-top {
  height: 28px;
  color: #69737c;
  background: #f4f5f6;
  border-bottom: 1px solid #d2d7db;
  font-size: 11px;
}

.forum-top .site-width {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 100%;
}

.forum-login {
  margin-left: auto;
  color: #2a5d89;
}

.forum-header {
  background: #fff;
}

.forum-brand-row {
  min-height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}

.forum-logo {
  color: #254b6d;
  text-decoration: none;
}

.forum-logo b {
  display: block;
  font: 800 30px/1 "Microsoft YaHei", sans-serif;
  letter-spacing: -.08em;
}

.forum-logo small {
  display: block;
  margin-top: 4px;
  color: #8b9cab;
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.forum-search {
  display: flex;
  width: min(400px, 46vw);
}

.forum-search input {
  min-width: 0;
  flex: 1;
  height: 34px;
  padding: 0 10px;
  border: 2px solid #3a6488;
  border-right: 0;
}

.forum-search button {
  width: 72px;
  color: #fff;
  background: #3a6488;
  border: 0;
}

.forum-header > nav {
  color: #fff;
  background: #365f83;
  border-bottom: 3px solid #d98d36;
}

.forum-header > nav .site-width {
  display: flex;
}

.forum-header > nav a {
  padding: 12px 22px;
  border-right: 1px solid rgb(255 255 255 / 12%);
  text-decoration: none;
  font-weight: 700;
}

.forum-header > nav a:hover,
.forum-header > nav a.active {
  background: #294c6a;
}

.forum-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  color: #65727d;
  font-size: 12px;
}

.forum-breadcrumb a {
  color: #2e628f;
  text-decoration: none;
}

.forum-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  gap: 14px;
  align-items: start;
  padding-bottom: 30px;
}

.forum-content {
  min-width: 0;
}

.thread-head {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  min-height: 64px;
  background: #fff;
  border: 1px solid #c4ccd3;
  border-bottom: 0;
}

.thread-head > div:first-child {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 10px;
  padding: 13px 16px;
}

.thread-head h1 {
  overflow: hidden;
  margin: 0;
  color: #273b4b;
  font-size: 18px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.forum-badge {
  flex: 0 0 auto;
  padding: 3px 6px;
  color: #fff;
  background: #b45240;
  font-size: 11px;
}

.thread-head dl {
  display: grid;
  grid-template-columns: repeat(2, 58px);
  margin: 0;
  border-left: 1px solid #e0e4e7;
}

.thread-head dl div {
  display: grid;
  place-content: center;
  text-align: center;
}

.thread-attention {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 14px;
  color: #314c61;
  background: #edf5fa;
  border: 1px solid #b8cedd;
  border-bottom: 0;
  text-decoration: none;
}

.thread-attention span {
  display: grid;
  gap: 2px;
}

.thread-attention b {
  font-size: 13px;
}

.thread-attention small {
  color: #687b89;
  font-size: 11px;
}

.thread-attention em {
  flex: 0 0 auto;
  color: #2e628f;
  font-size: 12px;
  font-style: normal;
  font-weight: 700;
}

.thread-head dt {
  color: #90979c;
  font-size: 10px;
}

.thread-head dd {
  margin: 3px 0 0;
  color: #40576b;
  font-weight: 700;
}

.thread-tools {
  display: flex;
  gap: 14px;
  align-items: center;
  min-height: 34px;
  padding: 0 12px;
  color: #677681;
  background: #f7f8f9;
  border: 1px solid #c4ccd3;
  font-size: 11px;
}

.thread-tools .page-current {
  margin-left: auto;
  padding: 2px 7px;
  color: #fff;
  background: #557795;
}

.forum-post {
  display: grid;
  grid-template-columns: 148px minmax(0, 1fr);
  background: #fff;
  border: 1px solid #c4ccd3;
  border-top: 0;
}

.forum-post.original-post {
  border-top: 3px solid #577896;
}

.forum-user {
  padding: 16px 13px;
  text-align: center;
  color: #77838c;
  background: #f1f4f6;
  border-right: 1px solid #d8dde1;
  font-size: 10px;
}

.forum-avatar {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin: 0 auto 9px;
  color: #486780;
  background: #dce5eb;
  border: 1px solid #aab9c5;
  font: 700 25px "SimSun", serif;
}

.forum-user strong,
.forum-user small {
  display: block;
}

.forum-user strong {
  color: #2e618b;
  font-size: 12px;
}

.forum-user small {
  margin-top: 4px;
  color: #9a5c2c;
}

.forum-user p {
  margin: 10px 0 0;
  line-height: 1.7;
}

.forum-post-body {
  min-width: 0;
  min-height: 154px;
  padding: 0 17px 14px;
  color: #2c3237;
  font-size: 14px;
  line-height: 1.9;
}

.forum-post-body > header {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 17px;
  padding: 8px 0;
  color: #89939a;
  border-bottom: 1px dashed #d6dadd;
  font-size: 10px;
}

.forum-post-body p {
  margin: 10px 0;
}

.forum-post-body code {
  padding: 1px 3px;
  color: #724333;
  background: #f7f2ec;
}

.reply-to {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 5px;
  color: #52708a;
  background: #eef4f7;
  border: 1px solid #cbd8e0;
  font-size: 10px;
}

.moderator-note {
  padding: 8px 10px;
  color: #76523a;
  background: #fff8e8;
  border: 1px solid #e1cfaa;
}

.forum-post-body footer {
  margin-top: 20px;
  padding-top: 8px;
  color: #9a9fa3;
  border-top: 1px dashed #ddd;
  font-size: 10px;
}

.forum-post-body footer.signature {
  color: #8c949a;
  font-style: italic;
}

.forum-attachment {
  display: flex;
  gap: 12px;
  align-items: center;
  width: min(560px, 100%);
  margin: 14px 0;
  padding: 10px;
  background: #f6f7f8;
  border: 1px solid #d4d9dc;
}

.forum-attachment > div:last-child strong,
.forum-attachment > div:last-child span,
.forum-attachment > div:last-child small {
  display: block;
}

.forum-attachment > div:last-child span {
  color: #68757e;
  font-size: 12px;
}

.forum-attachment > div:last-child small {
  margin-top: 4px;
  color: #9aa1a6;
  font-size: 10px;
}

.forum-attachment.small > span {
  padding: 2px 6px;
  color: #fff;
  background: #768c9d;
  font-size: 10px;
}

.forum-attachment.small {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
}

.scan-paper {
  position: relative;
  flex: 0 0 142px;
  min-height: 92px;
  overflow: hidden;
  padding: 13px 10px;
  color: #645c4e;
  background:
    repeating-linear-gradient(0deg, transparent 0 15px, rgb(91 78 55 / 10%) 16px),
    #eee5cc;
  border: 1px solid #b2a789;
  box-shadow: 1px 2px 4px rgb(0 0 0 / 14%);
  transform: rotate(-1.4deg);
  font-family: "SimSun", serif;
}

.scan-paper i {
  position: absolute;
  right: -9px;
  bottom: -16px;
  width: 52px;
  height: 52px;
  border: 3px double rgb(135 44 34 / 34%);
  border-radius: 50%;
}

.scan-paper b,
.scan-paper span,
.scan-paper em {
  position: relative;
  display: block;
  font-size: 10px;
}

.scan-paper span {
  margin-top: 10px;
}

.scan-paper em {
  margin-top: 4px;
  color: #5c5245;
  font: 10px "Comic Sans MS", cursive;
}

.saved-link {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 13px 0;
  padding: 8px 10px;
  background: #f5f7f8;
  border-left: 3px solid #7994aa;
}

.saved-link > span {
  flex: 0 0 auto;
  color: #657986;
  font-size: 11px;
}

.saved-link a {
  min-width: 0;
  color: #2e6695;
}

.forum-sidebar {
  display: grid;
  gap: 12px;
}

.forum-sidebar section,
.forum-ad {
  background: #fff;
  border: 1px solid #c4ccd3;
}

.forum-sidebar h2 {
  margin: 0;
  padding: 9px 11px;
  color: #3b5367;
  background: #eef2f5;
  border-bottom: 1px solid #d4dce2;
  font-size: 13px;
}

.forum-sidebar section > p,
.forum-sidebar section > a {
  margin: 10px 12px;
  font-size: 11px;
  line-height: 1.7;
}

.forum-sidebar section > a {
  display: block;
  color: #2e6695;
}

.forum-sidebar dl {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 0;
  padding: 10px 8px;
}

.forum-sidebar dl div {
  text-align: center;
  border-right: 1px solid #e1e5e8;
}

.forum-sidebar dl div:last-child {
  border-right: 0;
}

.forum-sidebar dt {
  color: #939ba1;
  font-size: 9px;
}

.forum-sidebar dd {
  margin: 3px 0 0;
  color: #445e72;
  font-weight: 700;
}

.forum-sidebar ol {
  margin: 0;
  padding: 4px 10px 8px;
  list-style: none;
}

.forum-sidebar li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  padding: 7px 2px;
  border-bottom: 1px dashed #dde1e4;
  font-size: 11px;
}

.forum-sidebar li a {
  color: #3f5e76;
  text-decoration: none;
}

.forum-sidebar li span {
  color: #a0a6aa;
}

.online-users {
  color: #487193;
}

.forum-ad {
  padding: 14px;
  color: #635b49;
  background: #fffaf0;
}

.forum-ad span,
.forum-ad b,
.forum-ad small {
  display: block;
}

.forum-ad span {
  color: #a16b2f;
  font-size: 9px;
}

.forum-ad b {
  margin-top: 5px;
  font-size: 13px;
}

.forum-ad small {
  margin-top: 5px;
  line-height: 1.5;
}

.forum-reply-box {
  margin-top: 14px;
  background: #fff;
  border: 1px solid #c4ccd3;
}

.forum-reply-box > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  color: #41596b;
  background: #eef2f5;
  border-bottom: 1px solid #d4dce2;
}

.forum-reply-box > header h2 {
  margin: 0;
  font-size: 14px;
}

.forum-reply-box > header span {
  color: #8b949a;
  font-size: 10px;
}

#forum-evidence-form {
  padding: 16px;
}

.reply-help {
  margin: 0 0 13px;
  color: #697680;
  font-size: 12px;
}

#forum-evidence-form fieldset {
  margin: 0 0 14px;
  padding: 10px;
  border: 1px solid #ced5da;

  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 8px 10px;

  background: #edf3f7;
  border-bottom: 1px solid #c5d0d7;
  font-size: 13px;
}

.correction-form > section > h2 span {

  width: 20px;
  height: 20px;

}

.correction-form > section > p {

  color: #6e7c85;
  font-size: 10px;
}

}

.issue-select,
.correction-note {
  color: #52646f;
  font-size: 10px;
}

.correction-code-row input,
.issue-select select,
.correction-note textarea {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 7px 8px;
  background: #fff;
  border: 1px solid #9eabb3;
}

.correction-visits {
  max-height: 370px;
  overflow: auto;
  margin: 0 12px 12px;
  border: 1px solid #cfd6da;
}

.correction-visits label {
  display: grid;
  grid-template-columns: auto 1fr 30px;
  gap: 9px;
  align-items: center;
  padding: 8px 9px;
  border-bottom: 1px solid #e0e5e8;
}

.correction-visits label:nth-child(even) {
  background: #f8f9fa;
}

.correction-visits label:has(input:checked) {
  background: #eaf3f8;
}

.correction-visits b,
.correction-visits small {
  display: block;
}

.correction-visits b {
  color: #425d6f;
  font: 10px Consolas, monospace;
}

.correction-visits small {
  margin-top: 3px;
  color: #77838b;
  font-size: 9px;
}

.correction-visits em {
  color: #a2a9ae;
  font-style: normal;
  font-size: 9px;
}

.issue-select {
  display: block;
  padding: 12px 12px 0;
}

.correction-form fieldset {
  margin: 13px 12px;
  padding: 10px;
  border: 1px solid #c9d1d6;
}

.correction-form legend {
  color: #52646f;
  font-size: 10px;
}

.clause-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.clause-options label {
  position: relative;
}

.clause-options input {
  position: absolute;
  opacity: 0;
}

.clause-options span {
  display: block;
  padding: 5px 9px;
  color: #526876;
  background: #f4f6f7;
  border: 1px solid #bfc9cf;
}

  color: #fff;
  background: #3c708f;
  border-color: #2b5a75;
}

.correction-note {
  display: block;
  margin: 0 12px 13px;
}

.correction-note textarea {
  resize: vertical;
}

.correction-form > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 12px;
  background: #f3f6f8;
  border: 1px solid #c5d0d7;
}

.correction-form > footer p {
  margin: 0;
  color: #7b858c;
  font-size: 9px;
}

.correction-form > footer button {
  min-height: 34px;
  padding: 0 20px;
}

.correction-success {
  margin: 18px;
  border: 1px solid #bdc9d0;
}

.correction-success > header {
  padding: 18px;
  background: #edf4f7;

}

.correction-success > header span {
  display: inline-block;
  padding: 2px 6px;
  color: #fff;
  background: #3e7653;
  font-size: 9px;
}

.correction-success > header h2 {
  margin: 7px 0 4px;
  color: #2f5369;
  font-size: 17px;
}

.correction-success > header p {
  margin: 0;
  color: #7b868d;
  font-size: 9px;
}

.correction-summary {
  padding: 15px;
}

.correction-summary > p {
  margin: 0 0 12px;
  line-height: 1.8;
}

.correction-summary table {
  width: 100%;
  border-collapse: collapse;
}

.correction-summary th,
.correction-summary td {
  padding: 7px;
  border: 1px solid #d2d9dd;
  text-align: left;
  font-size: 9px;
}

.correction-summary th {
  color: #536b79;
  background: #f3f6f7;
}

.continuity-check {
  padding: 16px;
  background: #fffaf0;
  border-top: 1px solid #dfd3b9;
}

.continuity-check h2 {
  margin: 0;
  color: #664c2d;
  font-size: 15px;
}

.continuity-check p {

}

.number-sequence {
  display: flex;
  gap: 7px;
  margin: 13px 0;
}

.number-sequence code {
  display: grid;
  place-items: center;
  width: 36px;
  height: 30px;
  background: #fff;
  border: 1px solid #b8aa8d;
}

.number-sequence code.missing {
  color: #8a3027;
  background: #fff0e7;
  border: 1px dashed #a44c3c;
}

.continuity-check dl {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 0 0 13px;
}

.continuity-check dl div {
  padding: 8px;
  background: #fff;
  border: 1px solid #ddd3bd;
}

.continuity-check dt {
  color: #998b70;
  font-size: 8px;
}

.continuity-check dd {
  margin: 4px 0 0;
}

.continuity-check > a {
  display: inline-block;
  padding: 7px 12px;
  color: #fff;
  background: #735a36;
  text-decoration: none;
}

.records-no-result {
  margin: 18px;
  padding: 28px;
  border: 1px solid #ccd4d9;
  text-align: center;
}

.records-no-result h2 {
  color: #526874;
}

.records-no-result p {
  color: #7f898f;
}

.records-no-result a {
  color: #2c6791;
}

/* Withdrawn index record: same system, colder printed sheet. */
.withdrawn-main {
  margin-bottom: 42px;
  background: #fff;
  border: 1px solid #cbd3d9;
}

.withdrawn-main > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 20px;
  border-bottom: 2px solid #2d6b98;
}

.withdrawn-main > header h1 {
  margin: 0;
  color: #244c69;
  font-size: 19px;
}

.withdrawn-main > header p {
  margin: 5px 0 0;
  color: #7b868d;
  font-size: 10px;
}

.withdrawn-main > header > span {
  padding: 3px 8px;
  color: #687984;
  background: #eef1f2;
  border: 1px solid #b7c0c5;
}

.withdrawn-sheet {
  margin: 24px auto;
  width: min(820px, calc(100% - 40px));

    linear-gradient(90deg, transparent 49.8%, rgb(80 80 80 / 4%) 50%, transparent 50.2%),

  border: 1px solid #9da8ad;
  box-shadow: 0 4px 12px rgb(26 38 46 / 12%);
}

.sheet-number {
  padding: 8px 12px;
  color: #69747b;
  background: #f1f3f4;
  border-bottom: 1px solid #bbc4c9;
  font: 10px Consolas, monospace;
}

.withdrawn-sheet table {
  width: 100%;
  border-collapse: collapse;
}

.withdrawn-sheet th,
.withdrawn-sheet td {
  padding: 12px;
  border-right: 1px solid #cdd3d6;
  border-bottom: 1px solid #cdd3d6;
  text-align: left;
  vertical-align: top;
}

.withdrawn-sheet th {
  width: 110px;
  color: #687680;
  background: #f5f6f6;
  font-weight: 500;
}

.withdrawn-sheet .empty-field {
  color: #9a4a3a;
}

.withdrawn-sheet .abstract-field {
  color: #382f29;
  font: 700 15px/1.8 "SimSun", serif;
  letter-spacing: .03em;
}

.withdrawn-sheet footer {
  display: flex;
  justify-content: space-between;
  padding: 8px 11px;
  color: #899298;
  font: 9px Consolas, monospace;
}

.withdrawn-last {
  width: min(720px, calc(100% - 40px));
  margin: 35px auto 30px;
  text-align: center;
}

.withdrawn-last > p {
  color: #5f686e;
  line-height: 1.8;
}

.dead-page {
  display: grid;
  gap: 7px;
  margin-top: 18px;
  padding: 24px;
  color: #dce0e2;
  background: #252a2d;
  border: 1px solid #0f1214;
  box-shadow: inset 0 0 30px rgb(0 0 0 / 35%);
}

.dead-page small {
  color: #879197;
  font-size: 9px;
}

.dead-page b {
  font: 700 24px "SimSun", serif;
  letter-spacing: .12em;
}

.dead-page code {
  color: #aeb7bc;
}

.dead-page span {
  justify-self: center;
  padding: 3px 7px;
  color: #d8a094;
  border: 1px solid #805044;
  font: 10px Consolas, monospace;
}

.withdrawn-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 30px;
}

.withdrawn-actions a,
.withdrawn-actions button {
  padding: 8px 13px;
  color: #455d6c;
  background: #fff;
  border: 1px solid #9eabb3;
  text-decoration: none;
}

.peripheral-forum {
  min-height: 520px;
  padding: 20px;
  background: #fff;
  border: 1px solid #c4ccd3;
}

.peripheral-forum h1 {
  color: #304e65;
  font-size: 20px;
}

.return-link {
  color: #2e6695;
}

.not-found {
  min-height: 100vh;

  place-items: center;
  text-align: center;
}

.not-found > div {
  max-width: 500px;
  padding: 40px;
  background: #fff;
  border: 1px solid #aab2b8;
}

.not-found > div > span {
  font-size: 60px;
  color: #516371;
}

.not-found button {
  padding: 8px 15px;
  background: #fff;
  border: 1px solid #89959d;
}

.not-found-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

.not-found-actions a {
  padding: 8px 15px;
  color: #304e65;
  background: #eef3f6;
  border: 1px solid #89959d;
}

.seven-day-strip {
  display: grid;
  grid-template-columns: repeat(7, minmax(86px, 1fr));

  overflow-x: auto;
  background: #8a796b;

    grid-template-columns: 1fr;
    gap: 0.2rem;
  }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;

    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}

  color: #fff;
  background: #466a5a;
  text-decoration: none;
}

.source-record > dl {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin: 26px 0;
  border-top: 1px solid #ccd5ce;
  border-left: 1px solid #ccd5ce;
}

.source-record > dl div {
  padding: 12px 14px;
  border-right: 1px solid #ccd5ce;
  border-bottom: 1px solid #ccd5ce;
}

.source-record dt {
  color: #6a776f;
  font-size: 12px;
}

.source-record dd {
  margin: 5px 0 0;
}

.source-record section {
  margin: 26px 0;
  padding: 20px;
  border-left: 4px solid #879d8f;
  background: #f2f5f2;
  line-height: 1.8;
}

.catalog-footer {
  padding: 22px;
  color: #dbe3de;
  background: #2e4038;
  text-align: center;
  font-size: 12px;
}

.reprint-page {
  min-height: 100vh;
  color: #25282a;
  background: #f4f1ea;
  font-family: "Microsoft YaHei", Arial, sans-serif;
}

.reprint-header {
  border-bottom: 1px solid #d7d0c4;
  background: #fff;
}

.reprint-header > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1040px;
  min-height: 78px;
  margin: 0 auto;
  padding: 0 24px;
}

.reprint-header a {
  color: inherit;
  text-decoration: none;
}

.reprint-header b {
  display: block;
  color: #9c3e2f;
  font-family: STKaiti, KaiTi, serif;
  font-size: 28px;
}

.reprint-header span {
  color: #8a8174;
  font-size: 11px;
}

.reprint-header nav {
  display: flex;
  gap: 24px;
  font-size: 13px;
}

.reprint-main {
  max-width: 850px;
  min-height: 650px;
  margin: 0 auto;
  padding: 28px 24px 70px;
}

.reprint-crumb {
  color: #8a8176;
  font-size: 12px;
}

.reprint-main article {
  margin-top: 20px;
  padding: 46px 64px;
  background: #fff;
  box-shadow: 0 3px 18px #6a59411a;
  line-height: 2;
}

.reprint-main article header > span {
  color: #a24e3c;
  font-size: 12px;
}

.reprint-main article h1 {
  margin: 8px 0;
  font-family: STSong, Songti SC, serif;
  font-size: 34px;
}

.reprint-main article blockquote {
  margin: 32px 0;
  padding: 14px 24px;
  border-left: 3px solid #b7634f;
  background: #faf6ee;
}

.reprint-main article footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-top: 38px;
  padding-top: 18px;
  border-top: 1px solid #e4ded4;
  color: #7b7369;
  font-size: 12px;
}

.author-card {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 26px;
  margin-top: 34px;
  padding: 36px;
  background: #fff;
}

.author-avatar {
  display: grid;
  width: 82px;
  height: 82px;
  place-items: center;
  color: #fff;
  border-radius: 50%;
  background: #a15242;
  font-family: STKaiti, KaiTi, serif;
  font-size: 34px;
}

.author-card h1 {
  margin: 0;
}

.author-card dl div {
  display: grid;
  grid-template-columns: 90px 1fr;
  padding: 9px 0;
  border-bottom: 1px solid #ece6dc;
}

.author-card dt {
  color: #8a8175;
}

.author-card dd {
  margin: 0;
}

.reprint-log {
  width: 100%;
  margin: 24px 0;
  border-collapse: collapse;
  background: #fff;
}

.reprint-log th,
.reprint-log td {
  padding: 12px;
  border: 1px solid #ddd5c8;
  text-align: left;
  vertical-align: top;
}

.reprint-log th {
  background: #eee8de;
}

.reprint-source {
  margin-bottom: 28px;
  padding: 18px 22px;
  background: #fff;
}

.reprint-source div {
  display: grid;
  grid-template-columns: 100px 1fr;
  padding: 6px 0;
}

.reprint-source dd {
  margin: 0;
}

.reprint-footer {
  padding: 26px;
  color: #8f867b;
  border-top: 1px solid #d7d0c4;
  background: #fff;
  text-align: center;
  font-size: 12px;
}

.archive-meta {
  padding-top: 34px;
  padding-bottom: 70px;
}

.archive-meta > a:first-child {
  display: inline-block;
  margin-bottom: 24px;
}

.archive-meta > header {
  margin-bottom: 22px;
  padding-bottom: 20px;
  border-bottom: 1px solid #cbd5dc;
}

.archive-meta > header > span {
  color: #5c7485;
  font-size: 12px;
  text-transform: uppercase;
}

.archive-meta h1 {
  margin: 5px 0 8px;
  color: #142934;
  font-size: 26px;
}

.archive-meta > table {
  width: 100%;
  margin: 20px 0;
  border-collapse: collapse;
  background: #fff;
}

.archive-meta > table th,
.archive-meta > table td {
  padding: 13px;
  border: 1px solid #cbd5dc;
  text-align: left;
}

.archive-meta > table th {
  width: 145px;
  background: #eaf0f3;
}

.archive-job-log {
  margin: 24px 0;
  padding: 0;
  list-style: none;
}

.archive-job-log li {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 18px;
  padding: 16px 0;
  border-bottom: 1px solid #d7e0e5;
}

.archive-job-log time {
  color: #5d7380;
  font-family: monospace;
}

.archive-job-log b,
.archive-job-log p {
  display: block;
  margin: 0;
}

.archive-job-note {
  margin: 24px 0;
  padding: 18px 20px;
  border-left: 4px solid #6c8797;
  background: #e8eff3;
}

@media (max-width: 760px) {
  .trail-pdf-toolbar {
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 8px 14px;
  }

  .trail-pdf-toolbar strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .trail-pdf-toolbar span {
    display: none;
  }

  .trail-pdf-stage {
    grid-template-columns: 1fr;
    padding: 18px 12px 40px;
  }

  .trail-paper {
    min-height: 0;
    padding: 42px 28px;
  }

  .trail-paper-note {
    margin-top: 80px;
  }

  .catalog-header {
    align-items: start;
    flex-direction: column;
    gap: 12px;
    padding: 18px 20px;
  }

  .catalog-main {
    padding: 22px 16px 48px;
  }

  .catalog-detail {
    display: block;
    overflow-x: auto;
  }

  .source-record > dl {
    grid-template-columns: 1fr;
  }

  .catalog-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .reprint-header > div {
    align-items: start;
    flex-direction: column;
    gap: 12px;
    padding: 14px 18px;
  }

  .reprint-header nav {
    width: 100%;
    gap: 14px;
    overflow-x: auto;
  }

  .reprint-main {
    padding: 22px 12px 48px;
  }

  .reprint-main article {
    padding: 30px 24px;
  }

  .reprint-main article footer {
    align-items: start;
    flex-direction: column;
  }

  .author-card {
    grid-template-columns: 1fr;
    padding: 24px;
  }

  .reprint-log {
    display: block;
    overflow-x: auto;
  }

  .archive-meta {
    padding-right: 14px;
    padding-left: 14px;
  }

  .archive-meta > table {
    display: block;
    overflow-x: auto;
  }
}

@media (max-width: 390px) {
  .trail-paper {
    padding: 32px 20px;
    font-size: 14px;
  }

  .trail-paper h1 {
    font-size: 23px;
  }

  .trail-paper blockquote {
    margin: 28px 0;
    padding: 14px;
    font-size: 16px;
  }

  .trail-paper-note {
    align-items: start;
    flex-direction: column;
  }

  .catalog-header nav,
  .catalog-title,
  .author-card dl div,
  .reprint-source div {
    align-items: start;
    grid-template-columns: 1fr;
    flex-direction: column;
  }

  .archive-job-log li {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}

/* ========================================================================== 
   Ghost Matchmaker v9 Chinese design system
   version: v9-cn-web-archive-ds-0.1-frozen
   Direction: seven independent in-world sites plus one neutral browser session.
   These rules intentionally override the inherited v8.1 surface only where the
   new evidence workspace, responsive behavior, or accessibility contract needs
   a coherent repair.
   ========================================================================== */

:root {
  --v9-ds-version: v9-cn-web-archive-ds-0.1-frozen;
  --v9-session-canvas: #f4f1e8;
  --v9-session-surface: #fffdf7;
  --v9-session-text: #252627;
  --v9-session-muted: #67645e;
  --v9-session-border: #aaa399;
  --v9-session-primary: #384e5b;
  --v9-session-primary-hover: #2d414c;
  --v9-session-accent: #c9a745;
  --v9-session-focus: #b85d00;
  --v9-session-info: #2d638c;
  --v9-session-success: #2f6f4e;
  --v9-session-warning: #8a5800;
  --v9-session-danger: #9f2f2f;
  --v9-session-font: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --v9-code-font: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --v9-session-strip-height: 48px;
  --v9-session-dock-height: 58px;
  --v9-content-measure: 72ch;
  --focus: var(--v9-session-focus);
}

html {
  min-width: 320px;
  text-size-adjust: 100%;
}

/* The v9 entry uses a compact, neutral session card rather than the legacy
   v8 `.entry-window` markup. Keep it calm, legible, and clearly outside the
   seven in-world sites. */
.entry-card {
  width: min(760px, 100%);
  padding: 38px 42px 34px;
  color: var(--v9-session-text);
  background: rgb(255 253 247 / 96%);
  border: 1px solid var(--v9-session-border);
  border-top: 5px solid var(--v9-session-primary);
  box-shadow: 0 18px 48px rgb(38 43 48 / 18%);
  font-family: var(--v9-session-font);
}

.entry-card h1 {
  max-width: 18em;
  margin: 8px 0 18px;
  color: #253039;
  font-size: clamp(27px, 4vw, 38px);
  line-height: 1.3;
}

.entry-card > p {
  max-width: 66ch;
  color: #4f585d;
  font-size: 15px;
  line-height: 1.85;
}

.entry-card > button {
  min-height: 44px;
  padding: 9px 19px;
  color: #fff;
  background: var(--v9-session-primary);
  border: 1px solid #233944;
  border-radius: 0;
  font: 700 15px/1.3 var(--v9-session-font);
}

.entry-card > button:hover {
  background: var(--v9-session-primary-hover);
}

.entry-card .entry-fineprint {
  margin-bottom: 0;
  color: var(--v9-session-muted);
  font-size: 13px;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled {
  cursor: not-allowed;
  opacity: .62;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--v9-session-focus);
  outline-offset: 2px;
}

input[aria-invalid="true"],
select[aria-invalid="true"],
textarea[aria-invalid="true"] {
  border-color: var(--v9-session-danger) !important;
  box-shadow: 0 0 0 1px var(--v9-session-danger);
}

/* v8.1 risk removals: no floating corner obstruction, no route highlighting,
   and no world-character shortcut that gives away the next correct page. */
.notebook-toggle {
  display: none !important;
}

.capture-table tr.viewed {
  background: transparent;
}

.owner-world-hint {
  display: none !important;
}

.world-content .compare-tool .comparison-result .positive,
.world-content .compare-tool .comparison-result .negative {
  color: inherit;
}

/* Browser-session chrome: deliberately neutral and outside every fictional
   website. It occupies layout space; it never floats over reading content. */
.session-strip {
  position: sticky;
  z-index: 160;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: var(--v9-session-strip-height);
  padding: 0 max(14px, calc((100vw - 1240px) / 2));
  color: #f3f4f4;
  background: #262b30;
  border-bottom: 3px solid var(--v9-session-accent);
  font-family: var(--v9-session-font);
  font-size: 13px;
  line-height: 1.35;
}

.session-strip > :first-child {
  min-width: 0;
}

.session-strip strong,
.session-strip b {
  color: #fff;
}

.session-strip small {
  color: #b9c0c4;
}

.session-mobile-return {
  display: none;
}

.session-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  min-width: 0;
}

.session-actions a,
.session-actions button,
.session-return {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 11px;
  color: #eef3f5;
  background: #343c42;
  border: 1px solid #5d686f;
  border-radius: 2px;
  font: 600 12px/1.25 var(--v9-session-font);
  text-decoration: none;
  white-space: nowrap;
}

.session-actions a:hover,
.session-actions button:hover,
.session-return:hover {
  background: #414b52;
}

.session-actions [aria-pressed="true"],
.session-actions .active {
  color: #1f2529;
  background: #e6c875;
  border-color: #f0d98f;
}

.session-return {
  max-width: min(46vw, 520px);
  overflow: hidden;
  color: #eef3f5;
  background: transparent;
  border-color: transparent;
  text-overflow: ellipsis;
}

.session-return::before {
  content: "\2190";
  flex: 0 0 auto;
  margin-right: 7px;
  color: #e6c875;
}

.session-dock {
  display: none;
}

.session-drawer {
  position: fixed;
  z-index: 190;
  top: 0;
  right: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: min(440px, 40vw);
  height: 100dvh;
  color: var(--v9-session-text);
  background: var(--v9-session-surface);
  border-left: 1px solid #6c6962;
  box-shadow: -10px 0 34px rgb(0 0 0 / 24%);
  visibility: hidden;
  transform: translateX(102%);
  transition: transform 180ms ease, visibility 0s linear 180ms;
  pointer-events: none;
  font-family: var(--v9-session-font);
}

.session-drawer.open {
  visibility: visible;
  transform: translateX(0);
  transition-delay: 0s;
  pointer-events: auto;
}

.session-drawer > header,
.session-drawer > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
}

.session-drawer > header {
  color: #f1f3f4;
  background: #292e32;
  border-bottom: 4px solid var(--v9-session-accent);
}

.session-drawer > header h2,
.session-drawer > header p,
.session-drawer > footer p {
  margin: 0;
}

.session-drawer > footer {
  background: #ebe5d7;
  border-top: 1px solid #c6bead;
}

.session-drawer > header button,
.session-drawer > footer button {
  min-width: 44px;
  min-height: 44px;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
}

.session-drawer > :not(header):not(footer) {
  min-height: 0;
  overflow: auto;
  padding: 16px 18px 28px;
}

/* The workspace is product UI, not an eighth fictional site. */
.workspace-page {
  min-height: calc(100vh - var(--v9-session-strip-height));
  color: var(--v9-session-text);
  background: var(--v9-session-canvas);
  font-family: var(--v9-session-font);
  font-size: 15px;
}

.workspace-shell {
  width: min(1200px, calc(100% - 32px));
  margin-inline: auto;
  padding: 28px 0 64px;
}

.workspace-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 2px solid #747067;
}

.workspace-header > div {
  min-width: 0;
}

.workspace-header h1 {
  margin: 0;
  max-width: 32ch;
  color: #252627;
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.35;
}

.workspace-header p {
  max-width: var(--v9-content-measure);
  margin: 8px 0 0;
  color: var(--v9-session-muted);
  line-height: 1.75;
}

.workspace-grid {
  display: grid;
  grid-template-columns: minmax(260px, .72fr) minmax(0, 1.28fr);
  gap: 20px;
  align-items: start;
}

.workspace-source,
.workspace-form {
  min-width: 0;
  color: var(--v9-session-text);
  background: var(--v9-session-surface);
  border: 1px solid var(--v9-session-border);
  border-radius: 2px;
}

.workspace-source {
  position: sticky;
  top: calc(var(--v9-session-strip-height) + 16px);
  max-height: calc(100dvh - var(--v9-session-strip-height) - 32px);
  overflow: auto;
}

.workspace-source > header,
.workspace-form > header {
  padding: 13px 16px;
  background: #ebe7dd;
  border-bottom: 1px solid #bdb7aa;
}

.workspace-source > header h2,
.workspace-form > header h2 {
  margin: 0;
  color: #343532;
  font-size: 16px;
}

.workspace-source > header p,
.workspace-form > header p {
  margin: 5px 0 0;
  color: var(--v9-session-muted);
  font-size: 12px;
  line-height: 1.55;
}

.workspace-source > :not(header),
.workspace-form > :not(header) {
  margin-inline: 16px;
}

.workspace-source > :last-child,
.workspace-form > :last-child {
  margin-bottom: 18px;
}

.workspace-form fieldset {
  margin-top: 16px;
  padding: 14px;
  border: 1px solid #c3bdb1;
}

.workspace-form legend {
  padding: 0 6px;
  color: #3f5663;
  font-weight: 700;
}

.workspace-form label {
  color: #42433f;
  font-size: 13px;
  font-weight: 650;
}

.workspace-form input,
.workspace-form select,
.workspace-form textarea {
  width: 100%;
  margin-top: 6px;
  padding: 9px 10px;
  color: #222;
  background: #fff;
  border: 1px solid #8f918c;
  border-radius: 2px;
}

.workspace-form textarea {
  min-height: 110px;
  line-height: 1.65;
  resize: vertical;
}

.workspace-form button,
.workspace-header button,
.workspace-header a,
.hint-panel button,
.correction-column button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 16px;
  color: #fff;
  background: var(--v9-session-primary);
  border: 1px solid #293b45;
  border-radius: 2px;
  font-weight: 700;
  text-decoration: none;
}

.workspace-form button:hover,
.workspace-header button:hover,
.workspace-header a:hover,
.hint-panel button:hover,
.correction-column button:hover {
  background: var(--v9-session-primary-hover);
}

.workspace-form button.secondary,
.workspace-header button.secondary,
.workspace-header a.secondary,
.hint-panel button.secondary {
  color: #35434a;
  background: #f8f6f0;
  border-color: #8d918e;
}

.compare-columns {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0;
  margin-top: 16px;
  background: #fff;
  border: 1px solid #b8b3aa;
}

.compare-pane {
  min-width: 0;
  padding: 16px;
}

.compare-pane + .compare-pane {
  border-left: 1px solid #b8b3aa;
}

.compare-pane > header {
  margin: -16px -16px 14px;
  padding: 10px 13px;
  background: #efede7;
  border-bottom: 1px solid #c8c3b8;
}

.compare-pane h2,
.compare-pane h3,
.compare-pane p {
  margin-top: 0;
}

.compare-pane pre,
.compare-pane code {
  max-width: 100%;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  font-family: var(--v9-code-font);
  font-size: 12px;
  line-height: 1.65;
}

.compare-pane mark,
.compare-pane ins {
  color: inherit;
  background: #f5e8bb;
  text-decoration: none;
  box-shadow: inset 0 -2px #9b7025;
}

.compare-pane del {
  color: #563838;
  background: #f1dddd;
  text-decoration-thickness: 1px;
}

.classification-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.classification-grid > section,
.classification-grid > fieldset {
  min-width: 0;
  margin: 0;
  padding: 0 12px 12px;
  background: #fff;
  border: 1px solid #bdb8ae;
  border-top: 4px solid #66747b;
}

.classification-grid h2,
.classification-grid h3,
.classification-grid legend {
  margin: 0;
  padding: 11px 0 9px;
  color: #343a3d;
  font-size: 14px;
}

.classification-item {
  display: grid;
  gap: 5px;
  width: 100%;
  margin-top: 8px;
  padding: 10px 11px;
  color: #282a29;
  background: #fbfaf6;
  border: 1px solid #c3beb4;
  border-radius: 2px;
  text-align: left;
  line-height: 1.55;
}

.classification-item small,
.classification-item .meta {
  color: #6d6b65;
  font-size: 11px;
}

.classification-item:hover {
  background: #f5f2e9;
  border-color: #8e8a81;
}

.classification-item[aria-selected="true"],
.classification-item.selected {
  background: #edf2f3;
  border-color: #526d79;
  box-shadow: inset 3px 0 #526d79;
}

.classification-item.invalid,
.classification-item[aria-invalid="true"] {
  background: #fff4f1;
  border-color: #ac655c;
  box-shadow: inset 3px 0 var(--v9-session-danger);
}

.classification-item.success,
.classification-item[data-state="earned"] {
  background: #f6f7f3;
  border-color: #7d897e;
  box-shadow: inset 3px 0 #687a6b;
}

.hint-panel {
  color: var(--v9-session-text);
  background: var(--v9-session-surface);
  border: 1px solid var(--v9-session-border);
  border-left: 4px solid #78868d;
  border-radius: 2px;
}

.hint-panel > header,
.hint-panel > section,
.hint-panel > footer {
  padding: 13px 15px;
}

.hint-panel > header {
  background: #ebe8df;
  border-bottom: 1px solid #c4beb2;
}

.hint-panel h2,
.hint-panel h3,
.hint-panel p {
  margin-top: 0;
}

.hint-rungs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.hint-rungs li {
  min-width: 0;
  padding: 8px;
  color: #73716b;
  background: #f2f0e9;
  border: 1px solid #d0cbc0;
  font-size: 11px;
  text-align: center;
}

.hint-rungs li[aria-current="step"],
.hint-rungs li.current {
  color: #24333b;
  background: #e5ecef;
  border-color: #6d818c;
  font-weight: 700;
}

.hint-rungs li.revealed {
  color: #4a504b;
  border-style: solid;
}

.hint-panel .direct-answer {
  padding: 12px 14px;
  color: #493b21;
  background: #fff8df;
  border: 1px solid #c8ad6a;
}

.correction-columns {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.correction-column {
  min-width: 0;
  padding: 14px;
  background: #fff;
  border: 1px solid #bcb7ad;
  border-top: 4px solid #566c76;
}

.correction-column[data-status="confirmed"] {
  border-top-color: #446f59;
}

.correction-column[data-status="disproved"] {
  border-top-color: #8b554e;
}

.correction-column[data-status="unresolved"] {
  border-top-color: #8a742f;
  border-top-style: dashed;
}

.correction-column h2,
.correction-column h3 {
  margin: 0 0 10px;
  color: #303332;
  font-size: 16px;
}

.correction-column > p {
  color: var(--v9-session-muted);
  line-height: 1.65;
}

.correction-column ul {
  margin: 0;
  padding-left: 20px;
}

.correction-column li {
  padding: 6px 0;
  line-height: 1.55;
}

.content-note {
  margin: 14px 0;
  padding: 11px 13px;
  color: #4e4535;
  background: #f7f2e3;
  border: 1px solid #cfc2a0;
  border-left: 4px solid var(--v9-session-warning);
  border-radius: 0;
  font: 13px/1.7 var(--v9-session-font);
}

.content-note b {
  color: #604412;
}

.world-content {
  width: 100%;
  max-width: var(--v9-content-measure);
  color: inherit;
  line-height: 1.75;
}

/* `.world-content` also marks evidence-bearing regions for state isolation.
   Several of those regions are full site layouts, not prose columns. Do not
   let the reading measure collapse a forum/grid/table container. */
.site-width.world-content,
.forum-layout.world-content,
.oldstories-layout.world-content,
.nanqiao-single.world-content {
  max-width: none;
}

.site-width.world-content {
  width: min(1160px, calc(100% - 32px));
}

.site-width.world-content > .world-article:only-child {
  width: 100%;
  max-width: var(--v9-content-measure);
  margin-inline: auto;
}

.nanqiao-single.world-content,
.oldstories-reading > .content-note,
.oldstories-reading > .oldstories-article {
  width: min(var(--v9-content-measure), calc(100% - 32px));
  max-width: var(--v9-content-measure);
  margin-inline: auto;
}

/* v9 forum attachments are text-only evidence cards with four direct
   children. The legacy viewer expected an inner wrapper, so give the new DOM
   an explicit grid instead of letting its caption collapse vertically. */
.forum-attachment {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
}

.forum-attachment > strong {
  grid-column: 1;
  grid-row: 1;
}

.forum-attachment > small {
  grid-column: 1;
  grid-row: 2;
  color: #68757e;
}

.forum-attachment > pre {
  grid-column: 2;
  grid-row: 1 / span 2;
  min-width: 0;
  margin: 0;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.forum-attachment > a {
  grid-column: 3;
  grid-row: 1 / span 2;
}

/* The result template exposes meta, title and summary as siblings. Keep the
   summary with its title instead of allowing auto-placement into the date
   column. */
.oldnews-results li {
  grid-template-columns: 120px minmax(0, 1fr);
}

.oldnews-results li > .page-meta {
  grid-column: 1;
  grid-row: 1 / span 2;
  margin: 0;
}

.oldnews-results li > h2 {
  grid-column: 2;
  margin: 0;
}

.oldnews-results li > p:not(.page-meta) {
  grid-column: 2;
}

.workspace-form input[type="checkbox"],
.workspace-form input[type="radio"] {
  flex: 0 0 auto;
  width: 1rem;
  min-width: 1rem;
  height: 1rem;
  margin: .18rem 0 0;
  padding: 0;
}

.workspace-form fieldset > label {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 8px 0;
  line-height: 1.55;
}

.workspace-form fieldset > label > span {
  flex: 1 1 auto;
  min-width: 0;
}

.field-list > div,
.field-list dd {
  min-width: 0;
}

.field-list dd {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.not-found-page {
  min-height: calc(100vh - var(--v9-session-strip-height));
  display: grid;
  place-items: center;
  padding: clamp(20px, 6vw, 48px);
  color: var(--v9-session-text);
  background: var(--v9-session-canvas);
  font-family: var(--v9-session-font);
}

.not-found-page > article {
  width: min(560px, 100%);
  padding: clamp(22px, 5vw, 38px);
  background: var(--v9-session-surface);
  border: 1px solid var(--v9-session-border);
}

.not-found-page .button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}

.not-found-page .button-row a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 8px 13px;
  color: #fff;
  background: var(--v9-session-primary);
  border: 1px solid #293b45;
  text-decoration: none;
}

.world-content > :first-child,
.reaction-card > :first-child,
.completion-panel > :first-child {
  margin-top: 0;
}

.world-content > :last-child,
.reaction-card > :last-child,
.completion-panel > :last-child {
  margin-bottom: 0;
}

.reaction-card {
  margin: 14px 0;
  padding: 13px 15px;
  color: #34332e;
  background: #fffdf3;
  border: 1px solid #d4c79c;
  border-left: 4px solid #9d7a3c;
  border-radius: 0;
  line-height: 1.8;
}

.reaction-card header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 7px;
  color: #6b552c;
  border-bottom: 1px dotted #c9bc91;
  font-size: 12px;
}

.completion-panel {
  margin: 18px 0;
  padding: 18px 20px;
  color: #283b2f;
  background: #edf4ee;
  border: 1px solid #90aa98;
  border-left: 5px solid var(--v9-session-success);
  border-radius: 0;
  line-height: 1.75;
}

.completion-panel h2,
.completion-panel h3 {
  margin: 5px 0 8px;
  color: #274232;
}

.query-feedback,
.field-error,
.status-line {
  font-family: var(--v9-session-font);
}

.query-feedback:empty,
.field-error:empty,
.status-line:empty {
  display: none;
}

.query-feedback {
  margin-top: 10px;
  padding: 9px 11px;
  color: #3f484c;
  background: #f3f5f5;
  border: 1px solid #bfc6c8;
  border-left: 4px solid #667d88;
  font-size: 13px;
  line-height: 1.6;
}

.query-feedback[data-state="error"],
.query-feedback.error {
  color: #702f2b;
  background: #fff3ef;
  border-color: #d0a49d;
  border-left-color: var(--v9-session-danger);
}

.query-feedback[data-state="empty"] {
  color: #5b5447;
  background: #faf7ee;
  border-color: #cdc5b3;
  border-left-color: #897c5e;
}

.query-feedback[data-state="success"] {
  color: #31503e;
  background: #eff5f0;
  border-color: #a8bdad;
  border-left-color: var(--v9-session-success);
}

.field-error {
  display: block;
  margin-top: 6px;
  color: var(--v9-session-danger);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
}

.status-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 12px 0;
  padding: 9px 11px;
  color: #474a47;
  background: #f4f3ef;
  border-left: 4px solid #7d8587;
  font-size: 13px;
  line-height: 1.6;
}

.status-line[data-state="success"] {
  border-left-color: var(--v9-session-success);
}

.status-line[data-state="warning"] {
  border-left-color: var(--v9-session-warning);
}

.status-line[data-state="error"] {
  border-left-color: var(--v9-session-danger);
}

.status-line code,
.query-feedback code,
.field-error code,
.workspace-page code {
  overflow-wrap: anywhere;
  font-family: var(--v9-code-font);
}

/* A legacy world-return banner may remain in old routes during migration. Make
   it clearly session chrome, but keep the new .session-return as the contract. */
.browser-session-return {
  min-height: 40px;
  color: #e8edf0;
  background: #2f363b;
  border-bottom: 3px solid var(--v9-session-accent);
  font-family: var(--v9-session-font);
}

.browser-session-return span {
  color: #bdc5ca;
}

.browser-session-return a {
  color: #fff;
}

/* Workspace tables default to semantic cards on narrow screens. Add
   .data-table--scroll to the few ordinary, wide datasets that genuinely need
   horizontal inspection instead. */
.workspace-page table {
  width: 100%;
  border-collapse: collapse;
}

.workspace-page th,
.workspace-page td {
  padding: 9px 10px;
  border: 1px solid #c8c3b9;
  text-align: left;
  vertical-align: top;
}

.workspace-page th {
  color: #464c4f;
  background: #eceae4;
}

.data-table-wrap,
.capture-table-wrap,
.records-table-wrap {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 1000px) {
  .workspace-grid {
    grid-template-columns: minmax(220px, .62fr) minmax(0, 1.38fr);
  }

  .classification-grid,
  .correction-columns {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .classification-grid > :last-child,
  .correction-columns > :last-child {
    grid-column: 1 / -1;
  }
}

@media (max-width: 640px) {
  body {
    padding-bottom: calc(var(--v9-session-dock-height) + 14px + env(safe-area-inset-bottom));
  }

  .entry-page {
    align-items: start;
    padding: 18px 10px 30px;
  }

  .entry-card {
    padding: 24px 18px 22px;
  }

  .entry-card h1 {
    font-size: 27px;
  }

  .forum-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .forum-thread,
  .forum-side {
    min-width: 0;
  }

  .forum-attachment {
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
  }

  .forum-attachment > strong,
  .forum-attachment > small,
  .forum-attachment > pre,
  .forum-attachment > a {
    grid-column: 1;
    grid-row: auto;
  }

  .forum-attachment > a {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }

  .workspace-form fieldset > label {
    min-height: 44px;
  }

  .oldnews-search-layout > section {
    order: 1;
  }

  .oldnews-search-layout > aside {
    order: 2;
  }

  .oldnews-results li > .page-meta,
  .oldnews-results li > h2,
  .oldnews-results li > p:not(.page-meta) {
    grid-column: 1;
    grid-row: auto;
  }

  .oldnews-results li {
    grid-template-columns: minmax(0, 1fr);
    gap: 4px;
  }

  button,
  [role="button"],
  input[type="button"],
  input[type="submit"],
  .workspace-header a,
  .session-return {
    min-height: 44px;
  }

  input,
  select,
  textarea {
    font-size: 16px;
  }

  .forum-header > nav a,
  .records-header nav a,
  .records-side-menu > a,
  .archive-header nav a,
  .capture-toolbar nav a,
  .old-nav a,
  .chengnanli-header nav a,
  .oldnews-header nav a,
  .catalog-actions a,
  .trail-return,
  .archive-meta-next,
  .browser-session-return a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
  }

  .session-strip {
    gap: 8px;
    min-height: 44px;
    padding-inline: 10px;
    border-bottom-width: 2px;
  }

  .session-strip .session-actions {
    display: none;
  }

  .session-mobile-return {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-left: auto;
    padding: 0 8px;
    color: #f2f4f5;
    border: 1px solid #5d686f;
    font: 650 12px/1.2 var(--v9-session-font);
    text-decoration: none;
    white-space: nowrap;
  }

  .session-return {
    max-width: calc(100vw - 20px);
    min-height: 44px;
    padding-inline: 4px;
    justify-content: flex-start;
  }

  .session-dock {
    position: fixed;
    z-index: 200;
    right: 0;
    bottom: 0;
    left: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    min-height: calc(var(--v9-session-dock-height) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    color: #eef1f2;
    background: #272d31;
    border-top: 3px solid var(--v9-session-accent);
    box-shadow: 0 -3px 14px rgb(0 0 0 / 20%);
    font-family: var(--v9-session-font);
  }

  .session-dock a,
  .session-dock button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: var(--v9-session-dock-height);
    padding: 5px 7px;
    color: #f2f4f5;
    background: transparent;
    border: 0;
    border-right: 1px solid #4a5257;
    border-radius: 0;
    font: 650 13px/1.25 var(--v9-session-font);
    text-align: center;
    text-decoration: none;
  }

  .session-dock > :last-child {
    border-right: 0;
  }

  .session-dock [aria-pressed="true"],
  .session-dock .active {
    color: #202528;
    background: #e2c46e;
  }

  .session-drawer {
    top: var(--v9-session-strip-height);
    bottom: calc(var(--v9-session-dock-height) + env(safe-area-inset-bottom));
    left: 0;
    width: 100vw;
    height: auto;
    border-top: 0;
    border-left: 0;
    box-shadow: 0 0 28px rgb(0 0 0 / 28%);
  }

  .workspace-page {
    min-height: calc(100vh - 44px - var(--v9-session-dock-height));
  }

  .workspace-shell {
    width: min(100% - 20px, 1200px);
    padding: 18px 0 40px;
  }

  .workspace-header {
    align-items: stretch;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
  }

  .workspace-header h1 {
    max-width: none;
    font-size: 24px;
  }

  .workspace-grid,
  .compare-columns,
  .classification-grid,
  .correction-columns {
    grid-template-columns: minmax(0, 1fr);
  }

  .classification-grid > :last-child,
  .correction-columns > :last-child {
    grid-column: auto;
  }

  .workspace-source {
    position: static;
    max-height: none;
    overflow: visible;
  }

  .compare-pane + .compare-pane {
    border-top: 1px solid #b8b3aa;
    border-left: 0;
  }

  .classification-item {
    min-height: 44px;
  }

  .hint-rungs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .world-content {
    max-width: none;
  }

  .reaction-card header {
    align-items: flex-start;
    flex-direction: column;
    gap: 3px;
  }

  .workspace-page table:not(.data-table--scroll),
  .workspace-page table:not(.data-table--scroll) tbody,
  .workspace-page table:not(.data-table--scroll) tr,
  .workspace-page table:not(.data-table--scroll) td {
    display: block;
    width: 100%;
  }

  .workspace-page table:not(.data-table--scroll) thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }

  .workspace-page table:not(.data-table--scroll) tr {
    margin: 10px 0;
    background: #fff;
    border: 1px solid #c8c3b9;
  }

  .workspace-page table:not(.data-table--scroll) td {
    display: grid;
    grid-template-columns: minmax(88px, 36%) minmax(0, 1fr);
    gap: 10px;
    padding: 8px 10px;
    border: 0;
    border-bottom: 1px solid #e1ded6;
  }

  .workspace-page table:not(.data-table--scroll) td:last-child {
    border-bottom: 0;
  }

  .workspace-page table:not(.data-table--scroll) td::before {
    content: attr(data-label);
    color: #596268;
    font-weight: 700;
  }

  .mobile-card-table,
  .mobile-card-table tbody,
  .mobile-card-table tr,
  .mobile-card-table td,
  table[data-mobile="cards"],
  table[data-mobile="cards"] tbody,
  table[data-mobile="cards"] tr,
  table[data-mobile="cards"] td {
    display: block;
    width: 100%;
  }

  .mobile-card-table thead,
  table[data-mobile="cards"] thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }

  .mobile-card-table tr,
  table[data-mobile="cards"] tr {
    margin: 9px 0;
    border: 1px solid #c8cdd1;
    background: #fff;
  }

  .mobile-card-table td,
  table[data-mobile="cards"] td {
    display: grid;
    grid-template-columns: minmax(88px, 36%) minmax(0, 1fr);
    gap: 9px;
    padding: 8px 9px;
    border: 0;
    border-bottom: 1px solid #e0e4e7;
  }

  .mobile-card-table td::before,
  table[data-mobile="cards"] td::before {
    content: attr(data-label);
    color: #586975;
    font-weight: 700;
  }

  .mobile-card-table td:last-child,
  table[data-mobile="cards"] td:last-child {
    border-bottom: 0;
  }

  .browser-session-return {
    min-height: 44px;
    padding-inline: 10px;
  }
}

@media (max-width: 430px) {
  .site-width,
  .chengnanli-header > div,
  .chengnanli-header nav,
  .chengnanli-layout,
  .chengnanli-index,
  .oldnews-header > div,
  .oldnews-header nav,
  .oldnews-main {
    width: calc(100% - 20px);
  }

  .session-drawer {
    top: auto;
    bottom: calc(var(--v9-session-dock-height) + env(safe-area-inset-bottom));
    width: 100vw;
    height: calc(100dvh - var(--v9-session-strip-height) - var(--v9-session-dock-height) - env(safe-area-inset-bottom));
    border-top: 1px solid #6c6962;
    transform: translateY(102%);
  }

  .session-drawer.open {
    transform: translateY(0);
  }

  .session-drawer > :not(header):not(footer) {
    padding-inline: 14px;
  }

  .workspace-shell {
    width: calc(100% - 20px);
  }

  .workspace-source,
  .workspace-form {
    border-inline: 0;
  }

  .workspace-form fieldset {
    padding: 11px;
  }

  .forum-layout {
    width: calc(100% - 18px);
  }

  .thread-head {
    min-height: auto;
  }

  .thread-head > div:first-child {
    align-items: flex-start;
    padding: 11px 10px;
  }

  .thread-head h1 {
    overflow: visible;
    display: -webkit-box;
    margin: 0;
    font-size: 16px;
    line-height: 1.45;
    text-overflow: clip;
    white-space: normal;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
  }

  .forum-post {
    display: block;
  }

  .forum-user {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 2px 9px;
    align-items: center;
    padding: 8px 10px;
    text-align: left;
    border-right: 0;
    border-bottom: 1px solid #d8dde1;
  }

  const ENDING_REQUIRED_TOKENS = deepFreeze([
    "token-helishu-capture-set", "token-hls06-code", "token-visitor-v7c2f", "token-oldnews-result-set",
    "token-river-exclusion", "token-nanqiao-capture-set", "token-2004-continuation",
    "token-posthumous-relation", "token-hls07-midnight", "token-folklore-rule",
    "token-ghost-sedan-cluster", "token-seven-day-rule-match",
  ]);
  const ENDING_SOURCE_GROUPS = deepFreeze(["原件", "公开网页", "日期比较", "无法确认"]);

  function validateArchiveBagSubmission(payload, context = {}) {
    const input = payloadObject(payload);
    const tokenValues = context.earnedTokenIds instanceof Set ? [...context.earnedTokenIds] : toArray(context.earnedTokenIds);
    const tokenSet = new Set(tokenValues.map(String));
    const errors = [];
    for (const tokenId of ENDING_REQUIRED_TOKENS) if (!tokenSet.has(tokenId)) errors.push(`missing-token:${tokenId}`);
    if (normalizeCompact(input.originalRelation) !== "表妹") errors.push("archive-original-relation");
    if (normalizeCompact(input.realRelation).toLowerCase() !== "unverified") errors.push("archive-real-relation");
    if (normalizeCompact(input.hls07Body).toLowerCase() !== "unavailable") errors.push("archive-hls-body");
    if (normalizeCompact(input.heLingDeathCause).toLowerCase() !== "unconfirmed") errors.push("archive-heling-cause");
    if (normalizeCompact(input.chenDeathCause).toLowerCase() !== "unconfirmed") errors.push("archive-chen-cause");
    if (normalizeCompact(input.anomalyMeaning).toLowerCase() !== "documented-rule-conflict") errors.push("archive-anomaly-meaning");
    if (normalizeCompact(input.supernaturalCause).toLowerCase() !== "unresolved") errors.push("archive-supernatural-cause");

      chenDeathCause: "unconfirmed",

  const BEAT_VALIDATORS = Object.freeze({
    "puzzle-archive-helishu": validateArchiveHelishu,
    "puzzle-compare-helishu-versions": validateCompareHelishu,
    "puzzle-lookup-hls06": validateLookupHls06,
    "puzzle-classify-procedure": validateProcedureClassification,
    "puzzle-triangulate-zhao": validateZhaoTriangulation,
    "puzzle-trace-ghost-name": validateGhostName,
    "puzzle-search-oldnews": validateOldNewsSearch,
    "puzzle-classify-river": validateRiverClassification,
    "puzzle-archive-nanqiao": validateArchiveNanqiao,
    "puzzle-compare-nanqiao": validateCompareNanqiao,
    "puzzle-compare-posthumous-relation": validatePosthumousRelation,
    "puzzle-inspect-hls07-midnight": validateHls07Midnight,
    "puzzle-trace-ghost-matchmaker-tradition": validateGhostMatchmakerTradition,
    "puzzle-triangulate-ghost-sedan": validateGhostSedanTriangulation,
    "puzzle-compare-seven-day-rule": validateSevenDayRule,
    "puzzle-submit-archive-bag": validateArchiveBagSubmission,
  });

  function validateBeat(beatId, payload, context = {}) {
    const validator = BEAT_VALIDATORS[String(beatId || "")];
    if (!validator) return makeValidation(["unknown-beat"], {}, []);
    const hasProgressContext = context && (
      context.earnedTokenIdSet instanceof Set
      || context.earnedTokenIds instanceof Set
      || Array.isArray(context.earnedTokenIds)
    );
    if (hasProgressContext) {
      const earned = context.earnedTokenIdSet instanceof Set
        ? context.earnedTokenIdSet
        : new Set(context.earnedTokenIds instanceof Set ? [...context.earnedTokenIds] : context.earnedTokenIds);
      const missing = requiredProducedInputTokenIds(beatId).filter((tokenId) => !earned.has(tokenId));
      if (missing.length) return makeValidation(missing.map((tokenId) => `missing-input-token:${tokenId}`), {}, []);
    }
    return validator(payload, context);
  }

  function createInitialState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      eventLog: [],
      evidenceHistory: [],
      queryContexts: {},
      drafts: {},
      hints: {},
    };
  }

  function safeTimestamp(value) {
    const text = normalizeText(value);
    return text && !Number.isNaN(Date.parse(text)) ? text : new Date(0).toISOString();
  }

  function deriveFromValidatedEvents(events) {
    const completedBeatIds = [];
    const completed = new Set();
    const earned = new Set();
    const postedReactionIds = [];
    const posted = new Set();
    const read = new Set();
    let endingId = null;

    for (const event of events) {
      if (event.type === "beat.completed" && BEATS_BY_ID[event.beatId] && !completed.has(event.beatId)) {
        completed.add(event.beatId);
        completedBeatIds.push(event.beatId);
        for (const tokenId of BEATS_BY_ID[event.beatId].output_token_ids) earned.add(tokenId);
      } else if (event.type === "reaction.posted" && REACTIONS.some((reaction) => reaction.id === event.reactionId) && !posted.has(event.reactionId)) {
        posted.add(event.reactionId);
        postedReactionIds.push(event.reactionId);
      } else if (event.type === "reaction.read" && posted.has(event.reactionId)) {
        read.add(event.reactionId);
      } else if (event.type === "ending.completed" && event.endingId === ENDING_BRANCH.id) {
        endingId = ENDING_BRANCH.id;
      }
    }

    const unreadReaction = [...postedReactionIds].reverse().find((reactionId) => !read.has(reactionId)) || null;
    const firstUnposted = REACTIONS.find((reaction) => !posted.has(reaction.id)) || null;
    const readyReactionId = !unreadReaction && firstUnposted && firstUnposted.readyAfterBeatIds.every((beatId) => completed.has(beatId))
      ? firstUnposted.id
      : null;
    const stageIds = [...new Set(PUZZLE_BEATS.map((beat) => beat.stage_id))];
    const completedStageIds = stageIds.filter((stageId) => (
      PUZZLE_BEATS.filter((beat) => beat.stage_id === stageId).every((beat) => completed.has(beat.id))
    ));

    return {
      completedBeatIds,
      completedBeatIdSet: completed,
      earnedTokenIds: [...earned],
      earnedTokenIdSet: earned,
      postedReactionIds,
      unreadReactionId: unreadReaction,
      readyReactionId,
      completedStageIds,
      endingId,
      storyComplete: endingId === ENDING_BRANCH.id,
    };
  }

  function nextPostableReaction(events) {
    const progress = deriveFromValidatedEvents(events);
    if (progress.unreadReactionId) return null;
    const next = REACTIONS.find((reaction) => !progress.postedReactionIds.includes(reaction.id));
    if (!next) return null;
    return next.readyAfterBeatIds.every((beatId) => progress.completedBeatIdSet.has(beatId)) ? next : null;
  }

  function sanitizeEventLog(value) {
    const input = Array.isArray(value) ? value.slice(0, 200) : [];
    const clean = [];
    for (const candidate of input) {
      if (!isPlainObject(candidate)) continue;
      if (candidate.type === "beat.completed") {
        const beatId = String(candidate.beatId || "");
        if (!BEATS_BY_ID[beatId]) continue;
        const progress = deriveFromValidatedEvents(clean);
        if (progress.completedBeatIdSet.has(beatId)) continue;
        const result = validateBeat(beatId, candidate.normalizedAnswer ?? candidate.answer ?? {}, progress);
        if (!result.ok) continue;
        clean.push({
          seq: clean.length + 1,
          type: "beat.completed",
          beatId,
          normalizedAnswer: result.normalized,
          at: safeTimestamp(candidate.at),
        });
      } else if (candidate.type === "reaction.posted") {
        const next = nextPostableReaction(clean);
        if (!next || candidate.reactionId !== next.id) continue;
        clean.push({ seq: clean.length + 1, type: "reaction.posted", reactionId: next.id, at: safeTimestamp(candidate.at) });
      } else if (candidate.type === "reaction.read") {
        const progress = deriveFromValidatedEvents(clean);
        if (!progress.unreadReactionId || candidate.reactionId !== progress.unreadReactionId) continue;
        clean.push({ seq: clean.length + 1, type: "reaction.read", reactionId: candidate.reactionId, at: safeTimestamp(candidate.at) });
      } else if (candidate.type === "ending.completed") {
        const progress = deriveFromValidatedEvents(clean);
        if (progress.endingId || !progress.completedBeatIdSet.has("puzzle-submit-archive-bag") || !progress.postedReactionIds.includes("reaction-archive-bag")) continue;
        clean.push({ seq: clean.length + 1, type: "ending.completed", endingId: ENDING_BRANCH.id, at: safeTimestamp(candidate.at) });
      }
    }
    return clean;
  }

  function sanitizeSimpleDraft(value, depth = 0) {
    if (depth > 2) return undefined;
    if (typeof value === "string") return value.slice(0, 2000);
    if (typeof value === "boolean" || (typeof value === "number" && Number.isFinite(value))) return value;
    if (Array.isArray(value)) return value.slice(0, 40).map((item) => sanitizeSimpleDraft(item, depth + 1)).filter((item) => item !== undefined);
    if (!isPlainObject(value)) return undefined;
    const clean = {};
    for (const [key, item] of Object.entries(value).slice(0, 40)) {
      if (!/^[a-zA-Z0-9_-]{1,64}$/.test(key)) continue;
      const next = sanitizeSimpleDraft(item, depth + 1);
      if (next !== undefined) clean[key] = next;
    }
    return clean;
  }

  function sanitizeState(raw) {
    if (!isPlainObject(raw) || raw.schemaVersion !== SCHEMA_VERSION) return createInitialState();
    const sourceIdSet = new Set(SOURCE_IDS);
    const evidenceHistory = [];
    for (const entry of Array.isArray(raw.evidenceHistory) ? raw.evidenceHistory.slice(-200) : []) {
      if (typeof entry === "string" && (sourceIdSet.has(entry) || isPublicRoute(entry))) evidenceHistory.push(entry);
      else if (isPlainObject(entry)) {
        const sourceId = sourceIdSet.has(entry.sourceId) ? entry.sourceId : "";
        const route = isPublicRoute(entry.route) ? normalizeRoute(entry.route) : "";
        if (sourceId || route) evidenceHistory.push({ sourceId, route, at: safeTimestamp(entry.at) });
      }
    }

    const queryContexts = {};
    if (isPlainObject(raw.queryContexts)) {
      const allowed = new Set(["search-page-time", "search-chengnan-records", "search-oldnews"]);
      for (const [key, context] of Object.entries(raw.queryContexts)) {
        if (!allowed.has(key) || !isPlainObject(context)) continue;
        queryContexts[key] = {
          term: normalizeText(context.term).slice(0, 400),
          page: Math.max(1, Math.min(99, Number.parseInt(context.page, 10) || 1)),
          focusId: normalizeText(context.focusId).slice(0, 100),
        };
      }
    }

    const drafts = {};
    if (isPlainObject(raw.drafts)) {
      for (const [key, value] of Object.entries(raw.drafts).slice(0, 20)) {
        if (!/^[a-zA-Z0-9_-]{1,64}$/.test(key)) continue;
        const clean = sanitizeSimpleDraft(value);
        if (clean !== undefined) drafts[key] = clean;
      }
    }

    const hints = {};
    if (isPlainObject(raw.hints)) {
      for (const beat of PUZZLE_BEATS) {
        const hint = raw.hints[beat.id];
        if (!isPlainObject(hint)) continue;
        hints[beat.id] = {
          rung: Math.max(0, Math.min(4, Number.parseInt(hint.rung, 10) || 0)),
          attempts: Math.max(0, Math.min(99, Number.parseInt(hint.attempts, 10) || 0)),
          returns: Math.max(0, Math.min(99, Number.parseInt(hint.returns, 10) || 0)),
          answerShown: hint.answerShown === true,
        };
      }
    }

    return {
      schemaVersion: SCHEMA_VERSION,
      eventLog: sanitizeEventLog(raw.eventLog),
      evidenceHistory,
      queryContexts,
      drafts,
      hints,
    };
  }

  function deriveProgress(state) {
    const eventLog = sanitizeEventLog(isPlainObject(state) ? state.eventLog : []);
    return deriveFromValidatedEvents(eventLog);
  }

  function completeBeat(state, beatId, payload) {
    const cleanState = sanitizeState(state);
    const before = deriveFromValidatedEvents(cleanState.eventLog);
    const beat = BEATS_BY_ID[String(beatId || "")];
    if (!beat) return { ok: false, state: cleanState, errors: ["unknown-beat"], warnings: [], earnedTokenIds: before.earnedTokenIds };
    if (before.completedBeatIdSet.has(beat.id)) {
      const repeated = validateBeat(beat.id, payload, before);
      return { ok: repeated.ok, state: cleanState, errors: repeated.errors, warnings: repeated.ok ? ["already-completed"] : repeated.warnings, earnedTokenIds: before.earnedTokenIds };
    }
    const result = validateBeat(beat.id, payload, before);
    if (!result.ok) return { ok: false, state: cleanState, errors: result.errors, warnings: result.warnings, earnedTokenIds: before.earnedTokenIds };
    const event = {
      seq: cleanState.eventLog.length + 1,
      type: "beat.completed",
      beatId: beat.id,
      normalizedAnswer: result.normalized,
      at: new Date().toISOString(),
    };
    const nextState = { ...cleanState, eventLog: [...cleanState.eventLog, event] };
    const after = deriveFromValidatedEvents(nextState.eventLog);
    return { ok: true, state: nextState, errors: [], warnings: result.warnings, earnedTokenIds: after.earnedTokenIds };
  }

  function appendBeatEvent(state, beatId, payload) {
    return completeBeat(state, beatId, payload);
  }

  function postNextReaction(state) {
    const cleanState = sanitizeState(state);
    const before = deriveFromValidatedEvents(cleanState.eventLog);
    if (before.unreadReactionId) return { ok: false, state: cleanState, reactionId: null, reason: "unread-reaction" };
    const reaction = nextPostableReaction(cleanState.eventLog);
    if (!reaction) return { ok: false, state: cleanState, reactionId: null, reason: "not-ready" };
    const event = { seq: cleanState.eventLog.length + 1, type: "reaction.posted", reactionId: reaction.id, at: new Date().toISOString() };
    return { ok: true, state: { ...cleanState, eventLog: [...cleanState.eventLog, event] }, reactionId: reaction.id, reason: "posted" };
  }

  function markReactionRead(state, reactionId) {
    const cleanState = sanitizeState(state);
    const before = deriveFromValidatedEvents(cleanState.eventLog);
    if (before.unreadReactionId !== reactionId) {
      const alreadyRead = before.postedReactionIds.includes(reactionId) && !before.unreadReactionId;
      return { ok: alreadyRead, state: cleanState, reactionId, reason: alreadyRead ? "already-read" : "not-unread" };
    }
    const event = { seq: cleanState.eventLog.length + 1, type: "reaction.read", reactionId, at: new Date().toISOString() };
    return { ok: true, state: { ...cleanState, eventLog: [...cleanState.eventLog, event] }, reactionId, reason: "read" };
  }

  function completeEnding(state) {
    const cleanState = sanitizeState(state);
    const progress = deriveFromValidatedEvents(cleanState.eventLog);
    if (progress.endingId) return { ok: true, state: cleanState, endingId: progress.endingId, reason: "already-completed" };
    if (!progress.completedBeatIdSet.has("puzzle-submit-archive-bag") || !progress.postedReactionIds.includes("reaction-archive-bag")) {
      return { ok: false, state: cleanState, endingId: null, reason: "ending-not-ready" };
    }
    const event = { seq: cleanState.eventLog.length + 1, type: "ending.completed", endingId: ENDING_BRANCH.id, at: new Date().toISOString() };
    return { ok: true, state: { ...cleanState, eventLog: [...cleanState.eventLog, event] }, endingId: ENDING_BRANCH.id, reason: "completed" };
  }

  function buildEndingPreview(stateOrProgress) {
    const progress = stateOrProgress && Array.isArray(stateOrProgress.earnedTokenIds)
      ? stateOrProgress
      : deriveProgress(stateOrProgress);
    const earned = new Set(progress.earnedTokenIds || []);
    const missingTokenIds = ENDING_REQUIRED_TOKENS.filter((tokenId) => !earned.has(tokenId));
    const mapClaims = (ids) => ids.map((id) => CLAIMS_BY_ID[id]);
    return deepFreeze({
      branchId: ENDING_BRANCH.id,
      ready: missingTokenIds.length === 0,
      missingTokenIds,
