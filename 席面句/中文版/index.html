<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席面句</title>
  <link rel="icon" href="favicon.ico" sizes="16x16">
  <link rel="stylesheet" href="css/ximian.css">
</head>
<body>
  <div id="title-layer">
    <div class="title-chrome" aria-hidden="true">
      <p class="title-brand">桐江喜事</p>
      <p class="title-nav">首页　菜谱档期　案例　席面</p>
    </div>
    <figure class="title-stage">
      <img src="jpeg/01-xian.jpg" alt="席面横幅，人名可采">
      <p class="title-pick" aria-hidden="true"><span>韩承志</span>　新婚志喜　<span>林秋棠</span></p>
    </figure>
    <p class="title-slots" aria-hidden="true">谁　／　对谁　／　做什么</p>
    <p class="lock-line">今晚交这一句。句子是建议，不是批准。</p>
    <p>桐晚禾 · 桐喜档临08 · 建议。工钱认回传。</p>
    <p class="fiction">桐江喜事、桐晚禾、韩承志、林秋棠、韩守山、赵浦生都是写出来的。</p>
    <button type="button" id="btn-enter">进站</button>
  </div>

  <div id="app">
    <header class="chrome">
      <div class="brand">桐江喜事</div>
      <nav class="tabs">
        <button type="button" class="tab" data-go="intro">引言</button>
        <button type="button" class="tab" data-go="home">首页</button>
        <button type="button" class="tab" data-go="calendar">菜谱档期</button>
        <button type="button" class="tab" data-go="cases">案例</button>
        <button type="button" class="tab" data-go="join">招商加盟</button>
        <button type="button" class="tab" data-go="att-xian">席面</button>
        <button type="button" class="tab" data-go="desk">著录台</button>
        <button type="button" class="tab" data-go="att-hetong">合同</button>
        <button type="button" class="tab" data-go="att-weiji">病危</button>
        <button type="button" class="tab" data-go="att-lishu">历书</button>
      </nav>
    </header>
    <div id="page-foot"></div>
    <div id="view"></div>

    <section id="desk">
      <div class="desk-top">
        <div class="badge">
          桐江喜事 · 档期助理<br>
          <span id="player-name">桐晚禾</span>
          <span id="staff-id">桐喜档临08</span>
          权限 建议
        </div>
        <div class="lock-line" id="lock-line">今晚交这一句。句子是建议，不是批准。</div>
        <div id="clock">距十八点 600 秒</div>
        <div class="wage">今日工钱 <span id="wage">¥0</span></div>
      </div>
      <p>词在打开页上才进袋。台账印着：按原档开席。专名进了格，先拖回袋再换。</p>
      <div class="still-wrap" id="desk-still-wrap">
        <img id="desk-still" src="jpeg/01-xian.jpg" alt="席面静帧">
        <div class="hits" id="desk-hits">
          <button type="button" class="word hit-hcz" data-word="w-hcz">韩承志</button>
          <button type="button" class="word hit-lqt" data-word="w-lqt">林秋棠</button>
        </div>
      </div>
      <div class="desk-grid">
        <div>
          <p>词袋</p>
          <div class="bag" id="bag"></div>
        </div>
        <div class="slots">
          <p>句卡 <span id="who-flag" style="display:none">谁</span></p>
          <div class="slot" id="slot-who"><span class="lab">谁</span></div>
          <div class="slot" id="slot-whom"><span class="lab">对谁</span></div>
          <div class="slot" id="slot-did"><span class="lab">做什么</span></div>
        </div>
        <div class="send">
          <button type="button" id="btn-submit">不成组</button>
          <p>建议。不是批准。</p>
          <button type="button" id="btn-approve">批准开席</button>
          <p id="msg"></p>
          <button type="button" id="replay">重看</button>
        </div>
      </div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
