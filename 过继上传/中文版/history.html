      <h2>枣-083　柳条巷六号　已结</h2>
      <p>对象姚茂山户。事项房檐滴水，冲到对门墙根。当时争议归类写的「邻里排水」。传上去的栏是檐长、滴水方向、谁先翻瓦。没有嗣子，没有红纸，没有渠沿路。</p>
      <p>结案回访问的是雨天还漏不漏。姚茂山修了半截檐，对门签了字，单子变绿。检索里输入「份额」也会扫到本单，调解员备注写过「别把檐下空地当成份额」。那是滴水空地。</p>
      <p>相似纠纷一键带入去年带乱过一回，后来关了。本页无摘录钮。字段带入已关。尤广当时批：禁止串户。已结，不能复活，不能当别户旁证。</p>
