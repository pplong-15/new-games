<h1>浅磨对照　第三份</h1>
<div class="meta"><span>来源　现扫裁切</span><span>对照　丙寅拓</span></div>
<div class="shot"><img src="../img/smear-close.jpg" alt="浅磨特写"><a class="hot quiet" href="../shop/receipt.html" style="left:20%;top:30%;width:60%;height:40%" title="同道抹痕"></a></div><p class="cap noin">这道磨在回单附图里又出现过。点开能到赤土那张工单。</p>
<p>特写把停轮那一截放大。纤维被齐着切断，不像风雨。丙寅拓同一位置发白，宽度接近。二〇一一年回单把这道磨拍进附件，石满怕房头说没描到。</p>
<p>三份纸只证明浅磨是一道。不证明户籍改过。不证明所里应当把闻山当成匣名。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">特写第三份，仍是那道磨。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>特写裁切时把右侧花边切掉了。花边本来也不能点。停轮那一截在放大后像一道眉毛。翁苔不喜欢这个比喻，可她便签上还是画了一道，免得回头找不到位置。</p>
</article>
