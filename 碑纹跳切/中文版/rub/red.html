<h1>刀口红料</h1>
<div class="meta"><span>现见</span><span>清明后仍在</span></div>
<div class="shot"><img src="../img/red-trace.jpg" alt="描红"><a class="hot quiet" href="../shop/receipt.html" style="left:18%;top:28%;width:64%;height:36%" title="回单描红"></a></div><p class="cap noin">红料只填新口。旧残画在底下发灰。</p>
<p>朱砂或广告红，库内未做成分。红线贴着新刻的竖画走，不进浅磨最深的那条沟。沟里是空的，像砂轮走过以后没人填。</p>
<p>描红是把现成的字描一遍给人看。改刻是把旧字磨浅再刻。两件事叠在同一张脸上。本页只拍红，不教怎么下刀。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">红料页不写工价。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>红料在灯下有的地方发橘。库内未做成分，附注写「勿当朱砂鉴定」。清明过后红会淡。这张是淡之前拍的，淡之后的对比照没有入库，路值说预算不够。</p>
<p>有一块红料堆在刀口尽头，像谁收笔时多按了一下。多按的人可能是石满，也可能是后来上坟的孩子。孩子的手在回单上没有。</p>
</article>
