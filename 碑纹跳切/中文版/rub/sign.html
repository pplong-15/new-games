<h1>拓纸页边</h1>
<div class="meta"><span>贺纸庭习惯</span><span>无馆藏章</span></div>
<div class="shot"><img src="../img/margin-ink.jpg" alt="页边墨"><a class="hot quiet" href="../he/1986.html" style="left:6%;top:64%;width:20%;height:22%" title="墨团"></a></div><p class="cap noin">墨团连到他后来写的那篇谷雨。点墨不点姓名栏。</p>
<p>贺纸庭爱在纸边按一个团，再拉一笔。不是馆藏印。不是姓名检索。库内目录把他的习惯写成「页边墨」，免得有人拿去当印章鉴定。</p>
<p>本页证明丙寅那包是他经手。不证明他同意后人改字。他自己写过：刀口他没敢动。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">页边墨不是馆印。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>墨团边上有指纹浅印，汗。库内不鉴定是谁的汗。贺纸庭博客里写过夏天拓碑手会滑。滑了就按一个团，团里带自己的手温，后来手温变成干壳。</p>
<p>干壳裂开以后，墨心仍黑。黑得发闷。贺纸庭说那是怕混。混过的拓他见过，两家的纸叠在一个包里，后来打官司，官司不认墨团。</p>
</article>
