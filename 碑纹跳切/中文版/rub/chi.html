<h1>螭首左角残</h1>
<div class="meta"><span>石浦-碑-117</span><span>断面旧</span></div>
<div class="shot"><img src="../img/chi-local.jpg" alt="本碑螭首"><a class="hot quiet" href="../nei/chi.html" style="left:22%;top:16%;width:56%;height:52%" title="同形"></a></div><p class="cap noin">同形会跳到浦阴那通。跳过去以后要记得匣号不是这一匣。</p>
<p>左角缺，茬口发黑，苔痕嵌进层理。贺纸庭那张上已经缺。不是今夜磕的。所里有人爱把两通螭首叠着看，说同一路刀法。刀法同，碑不是一通。</p>
<p>本页只能证明 117 的首残在左。浦阴那通残在另一侧。抹痕对不上。匣号对不上。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">本碑螭首左缺。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>断面上有一小窝，像钉子垫过。贺纸庭那张上也有这窝，只是墨没吃进去。翁苔用指甲在屏幕上比了比窝的位置，比完觉得自己像在摸真石头，把手放下了。</p>
<p>首残断面不锋利，像磕在地上滚过。滚过的年代没人写。没人写的东西最容易被幻灯拿去当证据。</p>
</article>
