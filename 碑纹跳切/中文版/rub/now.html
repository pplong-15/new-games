<h1>石浦-碑-117　现见扫描</h1>
<div class="meta"><span>入库　今夜</span><span>拍摄　所内灯下</span></div>
<div class="shot"><img src="../img/smear-now.jpg" alt="现见碑阳"><a class="hot quiet" href="y1986.html" style="left:31%;top:44%;width:36%;height:16%" title="浅磨"></a><a class="hot quiet" href="red.html" style="left:40%;top:48%;width:18%;height:8%" title="描红"></a><a class="hot quiet" href="chi.html" style="left:36%;top:8%;width:28%;height:16%" title="螭首"></a><a class="hot quiet" href="box.html" style="left:8%;top:78%;width:16%;height:12%" title="匣沿"></a></div><p class="cap noin">现见字位作闻山。名旁浅磨、刀口红料、螭首左角、匣沿编号都在图上。</p>
<p>著录人未写刀口年代。只写现见。红料新，嵌在「山」字刀口。浅磨发白，走向自右上向左下，中段有一处停轮。螭首左角缺，断面旧，不像这一年新打。</p>
<p>房头口径要投闻山。本页只能证明墙上现在这两个字，不能证明匣里写过什么，也不能证明浅磨是谁的砂轮。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">现扫页不解释更名。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>灯下石皮反光，拍摄的人把角度偏了半寸，螭首更暗，字位更白。库内有人抱怨过这张不宜展览。夜班不管展览。夜班只管这张脸上有哪几块能跳。</p>
</article>
