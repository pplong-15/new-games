<h1>石浦-碑-117　碑阴</h1>
<div class="meta"><span>无讳</span><span>只有花纹</span></div>

<p>碑阴没有名字。浅龛，几道卷草，一只残龟跌的背。翁苔第一回夜班总想在阴面找出第四个名，找完只看见风化石皮。</p>
<p>立碑人题记若有过，风化掉了。库内不补。不补的意思是：不要用想象把阴面写成闻山或阿渡。</p>
<p>本页的用处只有一句：今晚要对的名不在阴面。名在阳，底在匣。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">碑阴空，不补字。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>龟跌背上一道裂，裂里填过水泥，水泥比石新。谁填的没人认。翁苔把裂拍进备注草稿，又删了。阴面的裂帮不上明早那一句，只会让路值嫌烦。</p>
<p>卷草尽头有一小块修补，颜色偏黄。黄的是树脂。树脂会老化。老化以后阴面更空。空对今晚有好处，免得再冒出一个名。</p>
</article>
