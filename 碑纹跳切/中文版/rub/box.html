<h1>石浦-志-117　匣沿</h1>
<div class="meta"><span>迁葬清点</span><span>二〇一八</span></div>
<div class="shot"><img src="../img/zhi-stone.jpg" alt="匣内石花"><a class="hot quiet" href="../zhi/scan.html" style="left:20%;top:18%;width:60%;height:64%" title="志石"></a></div><p class="cap noin">匣沿编号与志石是一匣。点石花进著录扫描。</p>
<p>牛皮纸匣，油笔写 117，写过一次又描深。迁葬那年开匣，著录抄讳，又封回去。封条是所里的，不是纪家的。</p>
<p>匣沿不能证明坟里此刻仍是原石。只能证明所里清点时这一匣对应这一通碑。志石扫描在下一页。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">匣沿油笔描过两次。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>油笔描第二遍时把 1 写成了 7 的肚子。后来又用刀背刮浅，刮痕比碑上那道细。迁葬封条骑缝章模糊，只剩半个「所」字。半个字不能当发文。</p>
<p>匣绳是尼龙的，结打得很死。迁葬的人怕再开，开一次要写报告。报告比拓纸厚。翁苔没见过那份报告，只见过绳。</p>
</article>
