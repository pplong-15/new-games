<h1>石浦-碑-117　丙寅谷雨拓</h1>
<div class="meta"><span>拓手　贺纸庭</span><span>纸包　丙寅那包</span></div>
<div class="shot"><img src="../img/smear-1986.jpg" alt="一九八六拓"><a class="hot" href="smear.html" style="left:30%;top:46%;width:38%;height:14%" title="浅磨"></a><a class="hot quiet" href="sign.html" style="left:2%;top:78%;width:16%;height:16%" title="页边墨"></a></div><p class="cap noin">字位仍作渡生。浅磨已经在。页边墨团是贺纸庭的习惯，不是检索栏。</p>
<p>墨未干时纸潮。贺纸庭把浅磨也拓下来，未补字，未刮墨。螭首左角在这张上已经缺。名旁砂轮印浅，渡生两字笔画仍连。</p>
<p>与今夜扫描对看：浅磨走向同一条。今夜字位换成闻山，红料填在新口。本张能证明一九八六年墙上还是渡生，不能证明谁在后来下的刀，也不能证明匣内讳。</p>

<p><span class="stamp">库内</span></p>
<p class="cap noin">旧拓页边有墨。</p>
<p class="noin"><a href="../desk/home.html">回台面</a></p>
<p>牛皮纸包上有水圈，像杯子放下过。贺纸庭自己写过纸潮。翁苔戴手套翻，手套是白班的尺码，大一圈。她把页边墨对准灯，墨发蓝，不像印泥。</p>
</article>
