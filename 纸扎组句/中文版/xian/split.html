      <h3>分炉通知摘</h3>
      <p>二零一九年冬，因铺号将开业灯与丧用同炉，文献站值班的人用红笔在页眉写「分」，字歪。歪的字后来被打印进摘抄，没人改。文献站摘了一条：彩扎与丧扎分时分炉。先烧喜货再烧丧货，仍记过。同炉即错位。</p>
      <p>街坊所称<a class="pick" data-w="喜丧混炉" href="#">喜丧混炉</a>，本摘只记投诉成立、铺号整改。不记纸人开口，不记阴司换人。今夜麦记是否又混，本摘不能定。能定的是规矩还挂着。</p>
      <p>娄石后来养成先拍照再收堆，跟这条有关。拍照仍只是帧，不是点火许可。</p>
