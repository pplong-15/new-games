      <h3>投诉摘抄</h3>
      <p>案由：开业灯与丧用同炉。处理栏写整改完毕，没有写谁的鼻子作准。摘抄员加括号：传闻气味不入档。处理：铺号整改，分炉通知存档。不写传承人真名。不写可实操的点火步骤。不把旅游鬼屋纸人写成当地丧俗。</p>
      <p>摘抄能说明县里认过这件事，不能说明今夜炉口又混了。今夜若要写混，须有堆、发票、档期，不是把旧案抄进空格。</p>
      <p>麦老抽屉里的旧著录样，跟本案不是同一夜。街坊楼老谭的帖，是闲话来源，不是本摘的附件。</p>
