      <h3>谁能勾准烧</h3>
      <p>申请栏写：丧主姓名、亡者户名、炉口、日期。栏宽不够，代办常把字挤到格外，挤到格外的一律作废。今夜没有送到的格，也就没有可作废的。匠人代填无效。临工代填无效。铺主可代送件，不可代勾<a class="pick" data-w="批准焚化" href="#">批准焚化</a>。</p>
      <p>井秋白是邵庭这边的丧主。她若要烧，应自己来栏里写。她今夜只在转文里催，没有把申请送到炉口。娄石档期因此未排。</p>
      <p>本栏说明手续，不说明有没有人已经偷偷点了。偷偷点了也要档期和灰来对。今夜灰是上一户的。</p>
