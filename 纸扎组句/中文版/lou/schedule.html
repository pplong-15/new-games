        <h2>今夜表</h2>
        <p>表是格子纸复印的。西口那一行用铅笔写「未排」，橡皮屑还在。东口那户的人来过，看了一眼就走，没问邵庭。</p>
        <p class="meta">今夜 19:02 | 分类：档期</p>
        <p><img alt="" src="../img/burn-ash.jpg" style="max-width:100%;height:auto"></p>
        <p>砖口是冷的。灰是上一户留下的，不是今晚邵庭的。表上写：邵庭这炉今夜未排。能写的是<a class="pick" data-w="未焚" href="#">未焚</a>。把<a class="pick" data-w="已焚" href="#">已焚</a>填进著录的人，跟这张表对不上。</p>
        <table>
          <tr><th>户</th><th>炉</th><th>今夜</th></tr>
          <tr><td>巷北周宅</td><td>东口</td><td>已收，未点</td></tr>
          <tr><td>邵庭</td><td>西口</td><td>未排，未收堆</td></tr>
          <tr><td>浦页开业</td><td>—</td><td>开业件不进<a class="pick" data-w="焚化炉" href="#">焚化炉</a></td></tr>
        </table>
        <p>表能证明哪一炉开没开，不能证明明天会不会开，也不能证明麦记后院谁先码的货。</p>
