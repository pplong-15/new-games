  <title>麦记·价目分列</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>价目两栏</strong>
      <div>
        <a class="ghost-btn" href="desk.html">台</a>
        <a class="ghost-btn" href="shift.html">权</a>
        <a class="ghost-btn" href="order.html">单</a>
        <form id="search-form" action="#" method="get" style="display:inline">
          <input id="search-input" name="q" placeholder="查单号…">
          <button type="submit">查找</button>
        </form>
      </div>
    </header>
    
    <div class="notice">
      <h2>丧用 / 开业 不合页</h2>
      <p>玻璃柜里的钉生锈，价目边卷起来。有人用铅笔在开业栏外画过问号，后又擦了，纸起毛。夜班不许改价，只许认栏。</p>
      <p>价目钉在玻璃柜里。丧扎一栏，彩扎一栏，中间划线。麦老不许夜班把两栏抄进同一张著录。</p>
      <table>
        <tr><th>栏</th><th>名称</th><th>备注</th></tr>
        <tr><td>丧</td><td><a class="pick" data-w="楼库" href="#">楼库</a></td><td>白纸，粗骨</td></tr>
        <tr><td>丧</td><td>童女</td><td>纸面空白，不画五官</td></tr>
        <tr><td>丧</td><td>金山银山</td><td>闷金，不配红穗</td></tr>
        <tr><td>喜</td><td><a class="pick" data-w="开业彩扎" href="#">开业彩扎</a></td><td>门面，不进丧堆</td></tr>
        <tr><td>喜</td><td><a class="pick" data-w="狮头" href="#">狮头</a></td><td>燥红，开业用</td></tr>
      </table>
      <p>两栏价格从略。这一页只能说明铺里怎么分名，不能说明后院已经按这个分好了。分好了就不会出现红金压白纸。</p>
      <p>柜下压着一本缺页的订货簿，二零一八年的，跟今夜两单无关。有人想拿旧簿对现码，麦老不许。</p>
      <div class="bagbox" id="wordbag"></div>
      <p id="bagflash"></p>
      <p><a href="yard.html">回去看堆</a> · <a href="../pu/goods.html">浦页要的货样</a></p>
    </div>

  </div>
