      <h2>临工能写什么</h2>
      <p>柜玻璃上还贴着去年扣工的告示，名字涂掉了，事由没涂：把准烧写进著录。麦老用这种告示吓后手。吓完仍只给建议栏。</p>
      <p>本台收建议。丧主才有焚化权。临工把事件写成一句，窗关交差。勾<a class="pick" data-w="批准焚化" href="#">批准焚化</a>，或者把扎作步骤附录进去，系统按越权退。退了，原堆仍停在待焚区边上，一句也不入账。</p>
      <p>麦老把批准权留在自己手里。他今晚不在。你不能代他勾。井秋白催得再凶，也只能把她的催写进袋，不能替她点火。</p>
      <p>娄石管炉口档期。他拍照，不听你准不准。县摘里也有一句：焚化须丧主申请。临工申请无效。</p>
      <p>这一页是规矩，不是批文。它说明谁能勾哪一栏，不能说明今夜烧了谁的货。</p>
