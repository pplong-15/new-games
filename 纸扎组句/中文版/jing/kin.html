    <h1>庭走了，浦还在回避</h1>
    <p class="meta"><span class="acct">井秋白</span>昨夜 22:05<span class="orig">转发</span></p>
    
    <p><a class="pick" data-w="邵庭" href="#">邵庭</a>是兄。庭在的时候骂过浦不会过日子，浦回骂庭只会撑场面。骂完仍是兄弟。<a class="pick" data-w="邵浦" href="#">邵浦</a>是弟。家里让弟回避，不进棚，不开吊。这是规矩，不是把他写成该送走的人。</p>
    <p>浦要开店。我拦过。他说铺租起算了。麦记两头都接，我知道。我只要他们别把店里的红金送到丧堆上。送到了，照片就变成我骂人的把柄。</p>
    <p>有人私下嘀咕，说弟也该有一份纸人。我不许。活人不定丧用。他的名写在文具店玻璃上，不写在我的单上。</p>
    <p>这段是家里的排法。它能说明谁回避、谁是丧主，不能说明货混了没有。货混没混，看堆和发票。</p>
