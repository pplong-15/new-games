    <h1>棚里的灯还没灭</h1>
    <p class="meta"><span class="acct">井秋白</span>今夜 17:10<span class="orig">转发</span></p>
    
    <p>我在棚里坐到天黑。草席潮，膝盖疼。来上香的人把童女两个字问成口头禅，我答到自己也嫌。来上香的人问童女到了没有。我说麦记回了码好。娄石的照片却让我心里空一块。</p>
    <p>五七不烧这一件，老人会说我把名分做矮了。我不是要跟浦过不去。他回避就回避。他的店，他的灯，别进我这堆。</p>
    <p>有人劝我：照片糊，也许童女在底下。也许。我仍要麦记写出一句，到底缺不缺，烧没烧。写<a class="pick" data-w="童女已焚" href="#">童女已焚</a>也可以，只要炉口认。炉口不认，就别写。</p>
    <p>我等的是一句能向家里念的话。不是批条。批条我自己都下不了，临工更下不了。</p>
