<p>下一班的门在原件柜里，跟这一班不一定相同。没有钉过的主张，柜门上抽不出来。抽不出来不是坏了，是还回去了。</p>
<p>交接格子里要填工号。工号填了不等于条交了。条在另一页。另一页不成组，格子只是格子。</p>
<p>钟还没到子时。子时之前仍可以再调三份。三份用完再还，还完再算下一班。</p>
