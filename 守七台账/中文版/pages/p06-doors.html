<div class="notice">
<h2>本班可调</h2>
<p>每班三份。已调的可以再看。交班后还柜。还柜的纸，本班名单上没有就抽不出来。名单每班换。换了不是跟你作对，是柜里的原件要给白班清点。</p>
<div id="door-list"></div>
<p>柜门上有人用指甲划过「先看讣告」。划痕是旧的，今晚还在。旧的划痕不是命令，是以前顶班的人留下的习惯。习惯可以跟，跟了仍要钉进本子。</p>
<p>柜是铁皮的，下层有潮。潮过的纸边会翘。翘的纸仍是原件，仍占一份。</p>
