<h1>寻：六七份子</h1>
<p>郝秀芬名下六七那一期未入账。条子是郝启明让人贴的，电话空号。分类站管理员说这类条子不审，烂了自己撕。</p>
<p>条子把「未交份子」写得很重，像今晚就能拿来挡厅。礼簿不这么分。礼簿把她的债放在六七。</p>
<p>此条能证明有人在催份子。不能证明今晚该停厅。</p>
<p>旁边还贴着转缝纫机、寻鸡。寻鸡那条写了三天，右爪缺一趾。</p>
