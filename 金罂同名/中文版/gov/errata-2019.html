      <h2>致谱牒扫描室　同名须按出生年拆条</h2>
      <p>你室电子页把柿树坪一九三八年生与东巷一九五一年生并成一行。本栏迁坟名单从不以乳名归并。请按出生年拆开，拆完把勘误送回，免得窗口按你的旧表销错户。</p>
      <p>另有邻县石灰窑来函，问西河有无一九四四那个林阿盛转入。本栏十一年、十八年两份名单均无此生年。回函已发：人不在西河，勿入金罂堂册。</p>
      <p>夜班若仍撞上合条旧表，以分房两页和本栏名单为准。租赁厅号本函不填，谱也不许替堂里并格。</p>
