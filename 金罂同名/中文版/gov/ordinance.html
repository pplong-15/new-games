      <h2>桐溪县金罂收堂试行条（摘与夜班有关）</h2>
      <p>乡下旧俗称捡金。收进堂以后，合同只写安放。金罂与后来的火化骨灰可同册，必须分厅分格，不许并格图省事。</p>
      <p>夜班职责写死三件：开册、对字段、出书面建议。禁止搬柜、启格、改标签。启坟检骨若还发生，由有资质的服务在堂外做，本条不列做法，也不介绍师傅。</p>
      <p>同名两户必须分格。销册须回执齐件。缺件则继续挂原名，停止新的认领。值班工号落在建议单上，不落在原物上。</p>
      <p>本条是乡里油印，不是拿去法庭的上位法。夜班窗口不受理乡里原件，也不批准搬柜。</p>
