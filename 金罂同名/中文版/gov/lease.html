      <h2>十年租期预审摘录　八月二十一日二十四时</h2>
      <p>南厅二二：安放人林阿盛，承租人吴晚香，十年期，状态在租。续租授权未交。过点进待清理，白天再想认回要加急。</p>
      <p>西厅〇七：安放人同名，备注写迁出未销。预审表不收这格的续租。窗口口径：挂名格不办十年期，先把缺件销册做完。</p>
      <p>本栏不管谁先开口报村名。只看承租栏和迁出备注。夜班若把西厅写成在租，与本栏冲突。邻县石灰窑那户不在本堂租册，生年一九四四的也不收。</p>
      <p>预审只管合同年期。金罂今夜还在不在柜里，仍要看出堂记录，本页没有照片。</p>
