      <h2>工人路八号筒子楼安置短告</h2>
      <p>二〇〇五年房管所。水泥厂集体户落在工人路八号。一九九六年以后迁入的制成车间职工，对外住址以集体户为准。原乡下门牌只留给迁坟名单用，不得再填作现住。</p>
      <p>短告点过一户：林阿盛，一九三八年生，制成车间，迁县后落在八号三层。配氏邱秀兰当时同户。此条只锁德房迁县后的落脚，对不上城关东巷，也对不上石灰窑。</p>
      <p>棚改后来另文。本告不管金罂堂厅号，也不给夜班开格。门牌对上了，只说明厂里那房住过这里。</p>
