      <h1>工人路八号底楼进水</h1>
      <p class="meta">社会短讯　二〇〇三年八月二十日　讣闻见报次日</p>
      <p>昨夜暴雨，水泥厂宿舍工人路八号筒子楼底楼进水。门牌钉还在，油漆剥了，用手摸得到「八」。集体户名册被湿，房管让各户自己报现住。</p>
      <p>短讯补一句门牌：迁县以后的林户，对外仍写工人路八号，不要改回乡下。本则不作第三条认领，金罂堂厅号一个字没写。</p>
      <p>东巷那年另有积水稿，巷名不同，别并进本则。石灰窑不在本县版面。</p>
