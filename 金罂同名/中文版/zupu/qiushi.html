    <h1>德房配氏　邱秀兰</h1>
    <div class="meta"><span>配氏专页</span><span>据一九九八年修谱补</span></div>
    <p>邱秀兰，一九四一年生。归德房阿盛。一九六五年结婚。一九九六年随迁工人路集体户。二〇〇三年丧偶后仍住筒子楼，未改嫁，未迁东巷。</p>
    <p>本页没有吴晚香三个字。把吴氏写入德房配栏的，都是看串了房。邱氏不是南厅承租人，身份证也不在秋禾带来的纸袋里。</p>
    <p>厂家属栏后来有她一则短讯，说金罂已让儿子转走，不找金罂堂续租。西厅迁出看乡栏。南厅那格别拿邱氏去对承租人。</p>
