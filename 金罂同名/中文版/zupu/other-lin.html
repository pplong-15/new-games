    <h1>邻乡附卷　林阿盛（石灰窑）</h1>
    <div class="meta"><span>不入桐溪正卷</span><span>只为排除同名</span></div>
    <p>林阿盛，一九四四年生。籍贯邻县石灰窑南坡。窑工。二〇〇九年卒，寄放石灰窑公墓，从未入桐溪金罂堂。配徐春花。子林石根。</p>
    <p>生年一九四四，对不上西厅的一九三八，也对不上南厅的一九五一。门牌不在柿树坪，不在东巷，不在工人路。今夜册上两行，字段对不上这三条。</p>
    <p>有人因乳名相同来堂里问过。附卷只为排除。不得把南厅或西厅写成窑上这人。讣闻里享年也写成六十五，年龄像，人不是。</p>
