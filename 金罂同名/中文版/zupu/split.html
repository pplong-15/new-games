    <h1>光绪十二年　东巷从柿树坪析出</h1>
    <div class="meta"><span>卷次　析出纪事</span><span>录文据旧谱残页</span></div>
    <p>当年德房人丁挤，一支迁城关赁屋，谱上另立东巷房。祭席仍回坪上办。小孩子认得席，认不得后来的巷子门牌。</p>
    <p>秋禾嘴里先吐柿树坪，多半是席上的记忆。东巷房居址栏仍写城关东巷三号，不因吃席改回十二号。扫描室听过这种串话，居址栏不动笔。</p>
    <p>此页只解释走亲戚为何把两房说成一户。不能拿析出把西厅那格认给东巷的女儿，也不能把德房金罂写成南厅的火化。</p>
    <p>石灰窑那支不在析出卷里。窑上一九四四生的阿盛，籍贯从来不是西河。</p>
    <p><span class="stamp">析出抄件</span></p>
  </article>
  <p style="text-align:center;color:#888;font-size:12px">蓝格子纸　朱笔只圈了光绪二字</p>
