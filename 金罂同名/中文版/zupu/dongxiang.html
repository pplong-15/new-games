    <h1>东巷房谱　阿盛行</h1>
    <div class="meta"><span>卷次　城关附页</span><span>录文据二〇一四年补记</span></div>
    <p>阿盛，东巷房，一九五一年生。居城关东巷三号，户籍未迁。二〇一六年卒。配吴氏晚香。女秋禾，一九七九年生，长年在外。</p>
    <p>旁注：此房于清光绪十二年从柿树坪析出。祭祖仍回柿树坪席上，小孩子容易把祖屋和自家门牌说成一处。谱馆的人听过这种串话，不拿它改居址栏。</p>
    <table>
      <tr><th>项</th><th>录</th></tr>
      <tr><td>生年</td><td>一九五一</td></tr>
      <tr><td>居址</td><td>城关东巷三号</td></tr>
      <tr><td>迁出</td><td>未迁</td></tr>
      <tr><td>配</td><td>吴晚香</td></tr>
      <tr><td>子息</td><td>林秋禾</td></tr>
    </table>
    <p>东巷房无柏年此子。把柏年写进本页的，都是看错房。安放若在金罂堂，应是火化直入，不是十一年那批乡下金罂。</p>
    <p><span class="stamp">东巷抄件</span></p>
