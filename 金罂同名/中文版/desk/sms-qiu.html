<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk" data-seen="smsQ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>裘晚秋短讯全文</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>主任短讯匣</strong>
      <div>
        <a class="ghost-btn" href="hall.html">回册</a>
        <a class="ghost-btn" href="claim.html">认领单</a>
        <form id="search-form" action="../search-results.html" method="get">
          <input id="search-input" name="q" placeholder="短讯里的字">
          <button type="submit">查档</button>
        </form>
      </div>
    </header>
    <div class="notice">
      <h2>裘晚秋　三条连发</h2>
      <p>八月二十一日十七点零四分。值班机拼成一页。她不解释厅号。</p>
    </div>
    <div class="sms">
      <p>一条。林秋禾今晚认格。册上两个林阿盛。工号褚慈，厅号写歪了按租赁违约走，押金和事故单找你。</p>
      <p>二条。只交建议。柜子你碰不着。别替人画押。白班我不下来对字段。</p>
      <p>三条。预审卡在二十四点。纸上没字按弃权。同名你自己对年和址。方永石问不到人，本子还在抽屉。</p>
    </div>
    <div class="rulebox">
      <p>褚慈回过一个字：收到。她没再回。违约落在工号，不落在她白天的章上。若上报同名，她得白天接手，会骂，可事故单不先找夜班。</p>
      <p>短讯不告诉你西厅南厅谁对。她要的是今夜有字，好应付明天的电话。</p>
    </div>
    <p class="foot-desk">短讯按值班机本地钟　钟慢七分钟</p>
  </div>
  <script src="../js/seen.js"></script>
  <script src="../js/keyword-search.js"></script>
