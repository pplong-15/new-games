<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk" data-seen="rules">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜班班规</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>班规夹</strong>
      <div>
        <a class="ghost-btn" href="hall.html">回册</a>
        <a class="ghost-btn" href="log.html">日志</a>
        <form id="search-form" action="../search-results.html" method="get">
          <input id="search-input" name="q" placeholder="班规用字">
          <button type="submit">查档</button>
        </form>
      </div>
    </header>
    <div class="notice">
      <h2>同名核验　复印纸</h2>
      <p>胶带粘在灯管下沿。没有印章。方永石手写，裘晚秋没改过。</p>
    </div>
    <div class="rulebox">
      <p>一、姓名对上了，先对出生年。讣闻里享年凑成一样的，拆开看生年。</p>
      <p>二、再对户籍住址。祖屋、集体户、承租门牌，三栏不是一处。</p>
      <p>三、再对迁出。挂名常见于附件没齐，不表示人还在格子里。</p>
      <p>四、夜班只出建议。不挪柜，不改原格，不替家属画押。</p>
    </div>
    <div class="oral">
      <p>红笔附注：邻县石灰窑窑工也有叫林阿盛的，户口写一九四四，金罂不在本堂。有人按姓名来问，打发回邻县。今夜两行只有西厅和南厅，别把窑上那条填进来。</p>
      <p>查档用汉字年份，像一九九六这种。数字键这台机子不认。</p>
    </div>
    <p class="foot-desk">胶带发黏　纸角掀起一指</p>
  </div>
  <script src="../js/seen.js"></script>
  <script src="../js/keyword-search.js"></script>
</body>
</html>
