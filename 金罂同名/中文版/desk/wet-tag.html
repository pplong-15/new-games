<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk" data-seen="wet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>西厅湿标签</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>标签袋</strong>
      <div>
        <a class="ghost-btn" href="hall.html">回册</a>
        <a class="ghost-btn" href="handover.html">交接本</a>
        <form id="search-form" action="../search-results.html" method="get">
          <input id="search-input" name="q" placeholder="标签上残字">
          <button type="submit">查档</button>
        </form>
      </div>
    </header>
    <div class="notice">
      <h2>半截黄纸　西厅〇七</h2>
      <p>曲别针别在交接本封三。边上铅笔：十一年四月，雨。</p>
    </div>
    <div class="cert">
      <h3>旧标签残件</h3>
      <p>正面还能辨：林，盛，西。中间那个字洇成一团。背面一行铅笔：重贴。柜面字不当册。</p>
      <p>褚慈对着灯看。柜门现在那张是后补印刷体，墨比租赁册新一截。抄件右上角那弯水渍，跟这半截毛边能对上弧度。雨淋过，人重贴过。</p>
      <p>柜门是后来补的记号，册是租赁账。淋湿以后贴上去的字，定不了今夜认哪一格。缺附件的格仍可能挂名，夜班只许对照抄件和乡栏，不许按柜门改厅号。</p>
      <p>方永石退班那天把这半截留下，不是让后班当证据原件，是怕人只抬头看柜子。</p>
    </div>
    <p class="foot-desk">标签边还咬着一点雨锈</p>
  </div>
  <script src="../js/seen.js"></script>
  <script src="../js/keyword-search.js"></script>
</body>
</html>
