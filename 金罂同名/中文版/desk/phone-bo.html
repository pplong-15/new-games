  <title>柏年电话摘记</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>话机摘记</strong>
      <div>
        <a class="ghost-btn" href="hall.html">回册</a>
        <a class="ghost-btn" href="log.html">日志</a>
        <form id="search-form" action="../search-results.html" method="get">
          <input id="search-input" name="q" placeholder="摘记用字">
          <button type="submit">查档</button>
        </form>
      </div>
    </header>
    <div class="notice">
      <h2>来电　林柏年</h2>
      <p>三月二十号夜里。方永石字。纸从话机底下抽出来。</p>
    </div>
    <div class="oral">
      <p>原话我按他口气抄：迁出以后别再接待认领。西厅〇七，我爸那个。金罂去祖山了。你们册还挂着是你们缺纸，不是我没办。</p>
      <p>褚慈后来对过乡栏。十八年那份备案，厅号和生年一九三八对得上。缺的是火化存根复印件。乡栏写暂不销册。电话再打回去，已经空号。</p>
      <p>摘记能说明他申请过转出，并要求停止新的认领。摘记看不清祖山现场哪一具，也碰不到南厅。南厅承租人不是他，他今晚不必到场。</p>
      <p>纸角还有方叔后补的半行：空号以后别再拨。缺回执的事交给白天。夜班只把这句话抄进建议理由，别替他销册。</p>
    </div>
    <p class="foot-desk">草稿纸折成四指宽　油印到指甲缝</p>
  </div>
