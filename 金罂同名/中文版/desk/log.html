    <div class="notice">
      <h2>最后一周　摘三天</h2>
      <p>本子按日。褚慈只抄跟今夜两行有关的。其余闲账没搬。</p>
    </div>
    <div class="oral">
      <p>八月十二。柏年打进来。西厅那格金罂早转走了，谁再认就找他算。让他补火化存根。骂了一句。挂了。</p>
      <p>八月十三。来电抄进交接本。回执仍缺那一张。册上西厅还挂着林阿盛。想销。抽屉没销册章。补记　他不接电话了。</p>
      <p>八月十四。退班。便条塞抽屉。同名先对年。南厅承租人吴晚香。别听人家先报哪个村。湿标签那档写过。别再追问柜门。</p>
      <p>后页。邻县问询。石灰窑有人来电话，问本堂有没有一九四四那个阿盛。回没有。那格不在桐溪。</p>
    </div>
    <p class="foot-desk">日志封皮起毛　线装松了一股</p>
