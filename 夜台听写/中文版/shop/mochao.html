      <h4>槐记五金　置顶</h4>
      <p>钉、线、盆、扫帚、细铁丝都有。闸门夜里半落，要货先喊一声。</p>
      <p>价在货上。我懒得磨，落款就一句：莫吵价，看货。</p>
      <p>邻里学过这句来开玩笑。我弟弟不这么收尾，他在县里说话爱拖一个「哈」。</p>
      <p>谁把「莫吵」用到听写近距里，那不是县里的口气。店里的人听得出。</p>
      <p>今晚我在席上跑腿，店暂时交给学徒看着。学徒不会用我的落款发新帖。</p>
      <p>四年前有人把落款改成「可议价」，我当天改回来。可议价不是我。</p>
      <p>学徒若把落款写成「可议」，当他手滑，不当新口头禅。</p>
