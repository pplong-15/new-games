    <h1>顾宅头七礼簿　盛麦抄</h1>
    <div class="meta"><span>抄件</span><span>八月二十日夜</span></div>
    <img class="mood" alt="" src="../img/libu-closed.jpg">
    <p>原簿不外借。夜班看的是我用复写纸揭下来的四页：长房、二房、出嫁女、钱箱。格子里的字按收到的先后，不按谁嗓门大。</p>
    <table>
      <tr><th>页</th><th>记什么</th><th>打开</th></tr>
      <tr><td>甲</td><td>长房那一笔</td><td><a href="chang.html">看代字</a></td></tr>
      <tr><td>乙</td><td>二房席面</td><td><a href="er.html">看零头</a></td></tr>
      <tr><td>丙</td><td>季萍路上</td><td><a href="san.html">看路费</a></td></tr>
      <tr><td>丁</td><td>铁盒放哪</td><td><a href="box.html">看西厢</a></td></tr>
    </table>
    <p>代字不是羞辱，是人没到、钱到了。承办印在村栏，不印在这本簿上。两份纸打架，以哪一份为准，广播站自己标。</p>
    <p>复写纸揭下来会淡。甲页右侧那枚代还看得清。乙页三笔我用铅笔补过一次，怕洇。</p>
    <p><span class="stamp">抄件</span></p>

  <p style="text-align:center;color:#888;font-size:12px">盛麦不改原簿　夜班只看复写　14/42</p>
