    <h1>丙页　顾季萍</h1>
    <div class="meta"><span>预留</span><span>人未到时先空着</span></div>
    <p>这一页下午我先画了格子。出嫁女常担六七，头七正项不往她身上写。她托人带话：路费自己出，六七的包另封，今晚先别管她。</p>
    <p>二十三点四十以前，这一格是空的。空不是漏，是人还在路上。读稿把她的姓名念进厅里，不等于信封进了盒。</p>
    <p>她若进厅只补六七意向，我另起一行，不改甲页。甲页已经有代字，跟她无关。</p>
    <p>班线上若有她的留言，把六七另包四个字对到此页边上即可。</p>
    <p>她小时候的乳名我还记得，不往格子里写。格子只认季萍。乳名上听写，也不算到场。乳名只有屋里老人还喊，播音稿不用。</p>
    <p><span class="stamp">预留</span></p>

  <p style="text-align:center;color:#888;font-size:12px">丙页先空　不顶头七正项　17/42</p>
