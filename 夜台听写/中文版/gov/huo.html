      <h2>临时席西厢不要堆纸扎</h2>
      <p>老屋西厢门窄，纸扎和铁丝堆在过道，烟头一个就完。十九日已口头说过，现补一纸。</p>
      <p>西厢可以放盛麦那只铁盒。盒矮，不挡门。纸人、金山、纸电视，挪到院坝砖地上，离开电线。</p>
      <p>本条里的西厢是屋子。有人听写听到「钱在西房」就以为谱上多出一房，是把方向听成房份。文书室不认第四房。</p>
      <p>槐记溢出来的盆和扫帚，今夜也别再塞回西厢。仲槐自己点头过。</p>
      <p>过道宽度我用脚量过，两脚半。纸扎底座超过这个数，门就合不上。合不上门，烟往屋里灌。</p>
    </div>
    <p class="ft">本条管火　不管礼金名份　25/42</p>
