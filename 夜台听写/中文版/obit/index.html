      <p class="meta">来源：地方版资料间　夜班只读存档</p>
      <p>资料间还开着两篇：顾厚山那则新讣，以及一篇把七七和房份写在一起的旧说明。旧说明不是本镇发明，是早年通讯员从别处抄来的，只作对照，不作全国统一。</p>
      <p>讣栏不播原声，不登遗容。要听厅里谁在说话，回值班机的轴。</p>
