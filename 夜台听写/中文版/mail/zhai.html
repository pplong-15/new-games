<!DOCTYPE html>
<html lang="zh-CN" class="skin-mail-web-2010" data-seen="zhai">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>翟台生　短讯</title>
  <link rel="stylesheet" href="../css/mail-web-2010.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div class="top">
    <b>霜桥站信</b>
    <a href="inbox.html">收件</a>
    <a href="../desk/desktop.html">回机</a>
  </div>
  <div class="panes">
    <div class="folders">
      <a class="write" href="javascript:void(0)">写</a>
      <a class="on" href="inbox.html">收件</a>
    </div>
    <div class="mails">
      <h4>今夜</h4>
      <div class="m unread on">
        <b>五点半交三项</b>
        <span>翟台生　十六点四十一</span>
      </div>
    </div>
    <div class="read">
      <div class="toolbar">
        <button type="button">回复</button>
      </div>
      <h3>五点半交三项</h3>
      <p class="meta">发件人：翟台生<br>收件人：蒲生<br>时　间：十六点四十一</p>
      <p>村委下午把油印塞过来了。承办写成二房。厅里后来有人喊柏川，我听了一耳朵。</p>
      <p>你标：谁在场，谁在说话，钱记哪一房。我六点要有一句站得住的话。有更正就出声，没更正别拆台。</p>
      <p>只写建议。别替任何一房认账。医院夜板我让导诊科转了一份公开值班，钉在桌面。人在不在镇里，看打卡，别看谁嗓门大。</p>
      <p>我困了。你交单。</p>
      <p>附件没有。我不会把油印扫描塞进站信，原件在村栏。你要对照就打开收藏，别等我转发。</p>
    </div>
  </div>
  <p class="ft">此信留在值班机　不抄进大喇叭稿纸　13/42</p>
  <script src="../js/seen.js"></script>
</body>
</html>
