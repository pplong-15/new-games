        <div class="tx">
          纸页连续翻。有人用圆珠笔点格子。<br>
          低声：「这一笔写代……写代就行。」<br>
          【远处碗碟一碰】<br>
          另一人应：「盒在西边那间，别搁香案上。」
        </div>
        <p>这一截姓名几乎听不清。能听清的是「代」，还有一个方向。盛麦管簿子。点格子的声音短、脆，像数钱。三短一长，数到十的习惯。不是哭。</p>
        <p>「西边那间」先别写成谱上的房。东埠厢房和礼单上的房夜里用同一个字，最容易拧。我写过一回房份，又划了。</p>
        <p>礼簿在桌面第二枚图标。这一笔若真写了代，抄件上会留下。碗碟那一声在席上，不在西厢。西边那间是放盒的方向。盛麦怕香灰掉进信封，提过一句。</p>
