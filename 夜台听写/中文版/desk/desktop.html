        <p>图标都是收藏，不是外头随便找来的。时间轴在左上。听写在轴里。礼簿、讣栏、村栏、医院夜板、槐记那条分类、柳浦班线，白班替你钉过。</p>

        <p>开始钮是圆的，没有菜单。夜班不装新软件。收藏坏了就翻抽屉。</p>
