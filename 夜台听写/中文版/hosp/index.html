        <p class="scroll">夜板只公布值班姓名与打卡，不公布病情。</p>
        <p>广播站收藏本页，是因为偶尔要播夜间急诊改点。翟台生下午请导诊把公开班表转了一份，问的是人在不在岗，不是病历。</p>
        <p>三病区走廊灯坏了一支，照片里看不清门牌，这正好。夜班对照姓名即可。</p>
        <p>探视已经停。电话只走导诊。别把本页当成灵堂分机。</p>
        <p>导诊科同意转公开班表，条件是不转床号。广播站收藏遵守这条。人在不在岗，看姓名和打卡就够。走廊照片里门牌糊掉，正好省得有人对照房间号。</p>
