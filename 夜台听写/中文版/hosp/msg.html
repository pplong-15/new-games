      </td>
      <td class="main">
        <p>顾柏川二十二点〇三分留：家里别说我没上班。信封让晚秋写代。行了哈。</p>
        <p>班长回：听到。别用导诊机聊家事。你这句「行了哈」我听得出是你，厅里那句「莫吵」我不熟。</p>
        <p>摘抄到此。病情一字没有。广播站若拿口头禅对人，把「行了哈」和「莫吵」分开就行。</p>
        <p>韦蒲加一句：更衣室时钟快两分，打卡仍以机子为准，二十一点五十分那条不动。</p>
        <p>柏川后半夜还回过一次导诊机，只打了省略号。省略号不当听写，也不当到场。</p>
        <p>「行了哈」在三病区是口头禅。新来的护工学过，学不像，尾音飘。这句摘抄尾音不飘。</p>
      </td>
