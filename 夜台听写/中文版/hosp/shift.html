      </td>
      <td class="main">
        <p>八月二十日夜　三病区</p>
        <p>护工顾柏川。打卡二十一点五十分。应到二十一点四十五，迟到五分，班长口头说过，未记过。</p>
        <p>接班地点在更衣室，不在霜桥东埠。二十一点五十分之后到次日七点，姓名挂在本板，人挂在走廊。</p>
        <p>若有亲属称他已回村，请先对这张板。板不认听写。</p>
        <p>同班还有护士韦蒲、卫生员纪麦。二人与顾宅治丧无关，名单公开是因为夜诊要找得到人。</p>
        <p>打卡条存根在机子底下的小盒，夜班导诊可以核，外单位只看本板。本板已足够否定「人已回村」。</p>
        <p>迟到五分是更衣室拉链卡住，班长懒得写进过失。过失栏空着，不等于人空着。</p>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="ft">打卡机在更衣室门口　27/42</td>
