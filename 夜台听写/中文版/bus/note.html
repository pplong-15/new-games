    <main>
      <section>
        <h2>售票窗夹子</h2>
        <p>顾季萍，柳浦末班。请司机到站让她先打电话。字条是她自己写的，圆珠笔，纸边油。</p>
        <p>背面还有半句：六七另包，头七别记我。售票员说她上车就把这句话重复给邻座听，生怕霜桥有人先下笔。</p>
        <p>二十三点四十以前她人不在东埠。听写二十二点三十一若冒出她的姓名，那是读稿漏音，不是她站在香案边。</p>
        <p>司机不愿出镜。本页没有车厢照片。</p>
        <p>邻座是去霜桥走亲戚的老太太，她后来跟售票员学舌：那女的一路说六七，不说头七。学舌不作证据，字条才算。</p>
        <p>油渍来自车上的煎饼纸。煎饼纸不当符。字条背面那半句被油浸过，仍能认。</p>
      </section>
