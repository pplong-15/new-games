<p>交班人把廊灯油添了，没添满。东厢台灯他不敢动，说烫。柜上的黄纸条他看见了，没揭，揭了怕孙秀兰回来找。</p>
<p>茶炉烧干那事他写在括号里，说不是他。括号写得很小。</p>
<p>交接本不是路引底册。别把「黄纸条」三个字采进四栏。四栏要的是谁对谁做了什么，不是谁没揭纸条。</p>
