<h1>不能证明什么</h1>
<p>出货单不能证明人死。医院须知不能证明人活。旧俗不能证明今夜用了哪一条。孙秀兰的信不能证明她看见过尸体。空间留言不能证明浆是谁踩的。</p>
<p>肩和生辰拆没拆开，这些纸对得上。拆开了，就不要用讣告腔去糊。</p>
<p>这班交完灯可以关。袋留给下一班清。要改句，回值班台还能改，灶口听过的那张除外。</p>
