<h1>著录格式</h1>
<p>一句四栏。谁，在哪，对谁，做了什么。不要写成讣告腔。讣告腔是家属要的，家属要的那种叫<span class="word" data-word="kaibing">开病故路引</span>，那是另一句，也能交，交了走灶口。</p>
<p>你若看见肩和生辰拆开，就不要用讣告腔。讣告腔会把拆开的两栏重新糊上。</p>
<p>格式页教你句子长什么样。它不替你选哪一句。选哪一句，是值班台上那张卡的事。</p>
