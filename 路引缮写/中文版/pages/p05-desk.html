<div class="notice">
<h2>今晚当班</h2>
<p>你是芮秋。代班。二十二时前要交一句著录。不是批，是写。灶口听不听，是后话。</p>
<p>词要从已经打开的纸上采。袋在下头。四栏：谁、在哪、对谁、做了什么。齐了才能整句交。交出去的是建议。</p>
<p>桌上有一份<span class="word" data-word="jijian">急件</span>，是人送来的，不是你找来的。这份急件要你按病故来写。你先看它，不必信它。</p>
<p>这间<span class="word" data-word="luyinfang">路引房</span>只有一盏台灯。灯罩烫过，有疤。</p>
</div>
<div id="sentence-card">
<p>把袋里的词点上四栏。四栏不齐，不收。收了也不告诉你哪一栏对。</p>
<div class="slots">
<div class="slot" data-slot="who"><b>谁</b><span class="val"></span></div>
<div class="slot" data-slot="where"><b>在哪</b><span class="val"></span></div>
<div class="slot" data-slot="whom"><b>对谁</b><span class="val"></span></div>
<div class="slot" data-slot="did"><b>做了什么</b><span class="val"></span></div>
</div>
<button type="button" id="submit-sent">整句交上</button>
<p class="feedback" id="sent-fb"></p>
<div class="hint-box">
<button type="button" id="hint-next">下一档指点</button>
<div id="hint-log"></div>
</div>
</div>
