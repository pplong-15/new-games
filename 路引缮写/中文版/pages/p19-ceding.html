<h1>底册残页</h1>
<p>二零零九年到一四年的底册被雨水泡过，人名糊成片。能认出来的几条，都是过火之后补抄的，补抄的人爱把句子写圆。</p>
<p>残页里有一句：「肩与生辰分家，当夜扣下。」没有写扣下之后人去了哪。没有写没扣下的人后来怎样。</p>
<p>此页不能当今夜的答案。它只能说明这间房以前扣过类似的句。你要交的那一句，还是得用今夜的纸。</p>
