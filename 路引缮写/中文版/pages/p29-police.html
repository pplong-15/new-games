<h1>官道派出所警情摘抄（公开栏）</h1>
<p>本周：丢井盖、酒后砸碗、秤斗争吵。争吵里有姓钱的，未立案，双方散了。</p>
<p>无死亡报案。无寻人报案。摘抄到今晚十八点为止，十八点之后的事不在这张纸上。</p>
<p>此页不能证明钱培死了或没死。它只能证明到十八点为止，没有人来这里报这两件事。</p>
<p>有人想把「未立案」读成「没事」。派出所的纸不做这个保证。</p>
