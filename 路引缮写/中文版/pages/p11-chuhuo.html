<h1>出货单 · 夜字十七</h1>
<p>客户：<span class="word" data-word="qianpei">钱培</span></p>
<p>货色：成人纸人一架，肩宽按<span class="word" data-word="shenliang">身量尺</span>第三档。竹骨新劈的，浆是下午打的，到夜里还黏。</p>
<p>备注栏有铅笔：生辰另纸，不写在这张上。老侯的字，撇很短。</p>
<p>这张单子能证明谁来下单、架子按谁的肩来扎。它不能证明那个人今晚是不是已经停了呼吸。单上没有医院的章，也没有死亡两个字。</p>
<p>钱数：四十。收的是旧版纸币，角上软。老侯把钱压在茶缸下，没进匣。</p>
