<h1>路引缮写旧页</h1>
<p>持证人栏要写生辰所对之人。身量是纸人的事，生辰是路的事。两栏若分属两人，便是把活的名字送上路。</p>
<p>旧页用的说法：不可把活人<span class="word" data-word="xiechi">写成已故持证人</span>。写了，过火的不是纸，是那栏里的生辰。</p>
<p>此页是规矩。规矩能教你怎么填，不能告诉你今夜那两个人谁活着。活不活，要拿医院的空窗和出货单的尺对。</p>
<p>纸边有虫蛀。蛀到「不可」的「不」字，有人以为那条废了。没有废。蛀了也还是那条。</p>
