<div class="top">小满不改名</div>
<img alt="头像" src="../img/avatar-square.jpg" width="80" height="80" onerror="this.style.display='none'">
<p>今天舅把我带到巷子里，说看纸人。纸人没有脸。我问是给谁的，他说你别问。我鞋上沾了白的，洗不掉。</p>
<p>作业没写。语文是默写，我把「满」写成「潘」，老师要叫家长。舅不在，舅妈在医院门口打电话，打着打着蹲下去了。</p>
<p>空间是小孩的嘴。嘴能记下鞋上的浆，不能替你填四栏。四栏里的名字，要到生辰抄件上采。</p>
