<h1>暂扣</h1>
<p id="ending-why">四栏对上了：钱培在纸马铺后院把钱小满扎成替身。路引不过火。纸留柜里，灶口那行空着。</p>
<p>孙秀兰要是来问，把回单给她。回单不管她男人活着还是死了，只写这两栏对不上同一个人，不能送。</p>
<p>钱培人在哪，这些纸钉不住。能挡住的只有「按病故开路」那一句。</p>
