<h1>后院</h1>
<img alt="后院" src="../img/peeling-hallway.jpg" width="480">
<p><span class="word" data-word="houyuan">纸马铺后院</span>地上有一圈未干的浆，鞋印两双，一双大，一双小。小的那双只走到半道，回头了。大的那双在浆圈里转过。</p>
<p>篾刀搁在砖上，刃上没有血，有竹青。纸人架子靠墙，头还没糊上脸。肩的宽度跟出货单第三档对得上。</p>
<p>墙根有一张揉过的黄纸，展开是半个「满」字，下半截在浆里化了。老侯后来说那张纸不是他扔的。</p>
<p>此页只能说明后院今夜动过刀和浆。不能说明刀是给谁用的，也不能说明小鞋印的人现在在哪。</p>
