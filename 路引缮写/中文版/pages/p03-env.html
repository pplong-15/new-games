<img class="hero-photo" alt="院子" src="../img/empty-hall.jpg">
<section>
<p>石桌偏北，缝里有陈年的茶垢。今晚有人在这儿坐过，杯沿有唇印，水是凉的。廊柱上的红漆去年刷过，底下还露着旧绿。</p>
<p>东厢窗纸破了一角，灯从里头漏出来，方方正正一块。西厢堆被褥。南边那道门通向纸马铺的巷，锁是白天锁的，钥匙在老侯那儿，不在车马店。</p>
<p>地上有一截黄表纸边，风刮到台阶下。店里的人用脚拨开，没捡。捡了要送到东厢，没人愿意多走那几步。</p>
