<h1>石津县人民医院急诊须知</h1>
<p>夜班窗口只开到二十三点。<span class="word" data-word="yiyuan">县医院急诊</span>今夜接了十一人，以摔伤、腹痛为多。没有开具死亡证明。没有叫过殓车。</p>
<p>有人打电话来问<span class="word" data-word="xinxing">心梗</span>的床位。值班护士说心内科不在这一栋，电话给过，对方挂了。来访登记本上没有钱姓。</p>
<p>外网查询死亡登记的栏目关掉了。关掉不是因为今夜有事，是因为系统去年就报错，没人修。本页不能当死亡证明，也不能当没死的证明，它只能说：今夜这栋楼的窗口，没写下那个名字。</p>
<p>探视规定、挂号流程从略。有人把这页当成「医院说他死了」的出处，那是读错了。</p>
