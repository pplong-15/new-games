<h2>孙秀兰 → 路引房</h2>
<p>我是<span class="word" data-word="sunxiulan">孙秀兰</span>。我男人<span class="word" data-word="qianpei">钱培</span>下午还在市上，夜里就说没了。医院那边我没进去，门口的人让我别等。我把<span class="word" data-word="jijian">急件</span>按在你们柜上，求你们按病故写，别耽误过火。</p>
<p>孩子我没带来。孩子下午跟他出去过，这会儿不在家。我不敢想。</p>
<p>字有点乱。我不是会写信的人。求你们就按心梗写，别问我看见没有。我什么都没看见，我只听见邻居说纸马铺后院亮着。</p>
<p>这封信能证明她要你写什么。不能证明人已经停了。她自己也写了：医院她没进去。</p>
