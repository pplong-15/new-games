<h1>官道镇车马店仍代写文书　乡里未禁止</h1>
<p>记者昨日路过官道街，见车马店东厢灯亮。店主称只留灯，不参与。乡综合治理办公室一名不愿署名的人说，代写路引不算经营，未接到投诉就不进门。</p>
<p>同版还登了牲口市秤斗纠纷，当事人有姓钱的，只写姓，不写名。编辑说名对不上户口本，不敢登。</p>
<p>晚报不能证明今夜那张急件真假。它只能证明这地方还允许有人在东厢写字，写到后半夜。</p>
