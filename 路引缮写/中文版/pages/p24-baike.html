<h1>路引</h1>
<div class="infobox">民俗文书　各地写法不同</div>
<p>路引是给亡者开的出门条，栏里要有姓名、生辰、去处。石津一带还要过火，不过火只算写了，不算送走。</p>
<p>词条是百科口气，抄过县志，也抄过旅游站。互相打架的地方，词条选择较好听的那种。今夜那一句不要从词条里采。词条里没有钱家的名。</p>
<p>参见：纸扎、丧仪、持证人。这些参见点了也还是空链，本站没做完。</p>
