<h1>替身</h1>
<p>纸人按甲的肩来扎，路引按乙的生辰来写，这叫把乙<span class="word" data-word="zati">扎成替身</span>。甲走夜路，乙替他应名。</p>
<p>旧时用在打仗、瘟疫。官道这地方用在欠债、躲病、躲人。底册上不写动机，只写两栏是不是对着同一个人。</p>
<p>此页仍是规矩。它不能指认今夜是谁在用。后院那圈浆，尺码表上的第三档，生辰抄件上的名字，三样对上，才轮得到这一句。</p>
<p>有人把「替身」理解成纸人长得像。像不像不重要。重要的是肩和生辰是不是拆开的。</p>
