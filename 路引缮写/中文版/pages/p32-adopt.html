<h2>过继</h2>
<p>钱小满于前年<span class="word" data-word="guoji">过继</span>到钱培名下。便条是村委会那张油印，章淡。户口本不在附件里。</p>
<p>过继的意思是：孩子的名，在外面要跟舅父的姓走。生辰还是孩子的生辰。有人把过继理解成「生辰也并过去」。并过去的是名，不是日子。</p>
<p>便条能解释为什么出货单上是舅的名、抄件上是孩子的日子。它不能把两个人并成一个死人。</p>
