<h1>生辰抄件</h1>
<p>姓名：<span class="word" data-word="qianxiaoman">钱小满</span></p>
<p><span class="word" data-word="shengchen">生辰</span>：甲子年八月十四日亥时。抄自旧年过继时那张红纸。红纸在孙秀兰梳妆匣里，今夜不在附件柜，柜里只有这一张抄。</p>
<p>抄件边缘有浆。浆的颜色跟后院地上那圈一样。</p>
<p>此页能证明路引若按这份生辰来写，写进去的是孩子。它不能证明孩子已经走了。它也不能证明舅父已经走了。</p>
