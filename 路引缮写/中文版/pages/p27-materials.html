<h1>今夜用料</h1>
<p>细竹骨十一根。黄纸四刀。浆一碗，剩半碗。颜料没开，脸还没糊。</p>
<p>用料说明纸人做到一半。做到一半的人，不像给已经装棺的人办的货。装棺的货要连夜糊脸，老侯以前接过，脸糊完才睡。</p>
<p>此页是用料。用料不能当生死。它只能让「连夜糊一张亡者的脸」这句话不好使。</p>
