<h1>泰安纸马铺</h1>
<p>巷子最里头。白天卖元宝、锡箔、童男女。夜里有人敲门，老侯也开，开了不聊天。</p>
<img alt="铺面" src="../img/copy-shop.jpg" width="480">
<p>今日上架：黄纸、浆糊、细竹骨。批发价目那栏没做完，点了是空的。要看单子，得认得今天下单的人。</p>
<p>老侯在柜台后面打盹，鼻息很重。墙上钉着一截皮尺，尺上的油是手油，不是机油。</p>
<p><a class="gate" data-file="p11-chuhuo.html" href="p11-chuhuo.html">今日出货单</a>　<a class="gate" data-file="p12-houyuan.html" href="p12-houyuan.html">后院</a>　<a href="../index.html">回车马店</a></p>
<p>铺规写在木板上：付钱的人写谁的名，纸人就按谁的肩。生辰另抄，抄错不退钱。</p>
