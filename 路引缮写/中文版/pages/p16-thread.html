<div class="header">谁家连夜找人写字</div>
<div class="post"><b>1楼 路南老白</b>
<p>刚从车马店门口过，看见孙秀兰蹲着，手里攥着纸。问她，她说钱培没了。我下午还看见钱培在牲口市上跟人吵秤。也许我眼花。</p></div>
<div class="post"><b>2楼 巷口</b>
<p>纸马铺后院灯亮着。老侯半夜接单不是头一回。你们少问。</p></div>
<div class="post"><b>3楼 路南老白</b>
<p>我不是要问清楚。我是说，下午那个人走路还是斜的，肩能扛麻袋。不像要开路的人。</p></div>
<div class="post"><b>4楼 匿名</b>
<p>匿名不说话。匿名把茶杯印在石桌上就走了。</p></div>
<p>这些楼层是嘴。嘴能当风向，不能当栏里的词。词还得去有章、有尺、有生辰的纸上采。</p>
</div>
