<!DOCTYPE html>
<html lang="zh-CN" class="skin-intro-manual">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路引缮写</title>
  <link rel="stylesheet" href="css/intro-manual.css">
  <link rel="stylesheet" href="css/luyin.css">
</head>
<body>
  <header class="intro-hero">
    <div class="image-area"><img alt="" src="img/night-corridor.jpg"></div>
    <h1>路引缮写</h1>
  </header>
  <main>
    <section>
      <h2>今晚</h2>
      <p>你是芮秋。官道车马店东厢路引房代班。二十二时前要交一句著录：谁，在哪，对谁，做了什么。你不批路引，只写建议。</p>
      <p>钱家送来急件，说人没了，要按病故写。急件已经在桌上，不是你找来的。</p>
    </section>
    <section>
      <h2>手怎么动</h2>
      <p>词写在已经打开的纸上，点一下进袋。袋在每页底下。四栏齐了，整句交。不对的句子不会告诉你哪一栏错。</p>
      <p>顶栏那个搜索只能碰到公开页。附件柜里的单子，搜索打不开。</p>
      <p class="boot-actions">
        <a class="enter-link" href="index.html">去车马店。公告里有「路引」两个字，先点。</a>
      </p>
    </section>
    <section>
      <h2>卡了</h2>
      <p>值班台上有指点，一档一档给。前几档只指路，不把整句写死。</p>
      <p>石津县、官道镇、钱家，都是写出来的地方和人。别拿去对门外的门牌。</p>
    </section>
  </main>
</body>
</html>
