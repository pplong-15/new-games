<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青石镇邮政所 · 登记调度系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="screen">
  <div class="boot-log" id="boot-log"></div>
</div>
<div id="login" class="screen hidden">
  <div class="login-box">
    <div class="login-title">青石镇邮政所 · 登记调度系统 v2.31</div>
    <div class="login-body">
      <h1>夜班终端登录</h1>
      <div class="sub">本地局域网 · 操作员权限</div>
      <div class="row"><label>工号</label><input id="login-id" value="0918" readonly></div>
      <div class="row"><label>姓名</label><input value="林远" readonly></div>
      <div class="row"><label>口令</label><input type="password" value="******" readonly></div>
      <div class="login-actions">
        <button class="btn btn-pri" type="button" data-act="login">登录</button>
      </div>
    </div>
  </div>
</div>
<div id="desk" class="screen hidden">
  <div class="win">
    <div class="titlebar">
      <span class="brand">青石镇邮政所 · 登记调度系统</span>
      <span class="ver">v2.40-full</span>
      <span class="spacer"></span>
      <span class="chip" id="night-chip">第1夜</span>
      <span class="chip" id="clock-chip"><span id="clock-date">08-20</span> <b id="clock-time">20:00</b></span>
      <div class="speedbar" title="游戏时钟倍速">
        <button type="button" data-act="speed" data-v="1" class="on">×1</button>
        <button type="button" data-act="speed" data-v="2">×2</button>
        <button type="button" data-act="speed" data-v="5">×5</button>
        <button type="button" data-act="speed" data-v="10">×10</button>
        <button type="button" data-act="pause" id="btn-pause">暂停</button>
      </div>
      <span class="chip" id="pending-chip">待核验 <span id="pending-n">0</span></span>
      <span class="chip">林远 0918</span>
    </div>
    <div class="menubar">
      <button type="button" data-act="menu-sys">系统</button>
      <button type="button" data-act="menu-help">值班须知</button>
      <button type="button" data-act="restart">重新开班</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="work" id="work">
      <section class="station on" id="st1"></section>
      <section class="station" id="st2"></section>
      <section class="station" id="st3"></section>
      <section class="station" id="st4"></section>
      <section class="station" id="st5"></section>
      <section class="station" id="st6"></section>
    </div>
    <div class="statusbar">
      <span>连接：<b>本地</b></span>
      <span>队列：<b id="sb-q">0</b></span>
      <span>已处理：<b id="sb-done">0</b></span>
      <span id="sb-msg">夜班扫描台就绪</span>
      <span class="spacer"></span>
      <span>队列空闲时可用倍速推进时钟</span>
    </div>
  </div>
  <div class="zhao hidden" id="zhao">
    <div class="zt"><span>内部通讯 · 赵德明</span><button type="button" class="iconbtn" data-act="zhao-hide">关闭</button></div>
    <div class="zb" id="zhao-body"></div>
  </div>
</div>
<div id="ending" class="screen hidden">
  <div class="ending-wrap" style="display:flex;align-items:center;flex-wrap:wrap;justify-content:center;">
    <div class="polaroid">
      <div class="pic"><div class="p1"></div><div class="p2"></div></div>
      <div class="cap">村口 · 1998　（手机相册）</div>
    </div>
    <div class="ending-copy" id="ending-copy"></div>
  </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>


  <script src="world-content.js"></script>
</body>
</html>
