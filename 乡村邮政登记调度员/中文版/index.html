<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青石镇邮政所 · 登记调度系统</title>
<style>
:root {
  --bg: #f0f2f5;
  --panel: #fff;
  --text: #333;
  --muted: #666;
  --line: #d9d9d9;
  --blue: #2a5caa;
  --blue-dk: #1a365d;
  --warn: #fff3cd;
  --danger: #8b0000;
  --bad-bd: #ff4444;
  --cancel: #ccc;
  --crt-bg: #0a2a0a;
  --crt: #33ff33;
  --crt-dim: #1a6a1a;
  --crt-hi: #ffff00;
  --oa: #ece9d8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 12px/1.5 SimSun, "宋体", "NSimSun", serif;
  color: var(--text);
  background: #d4d0c8;
  min-height: 100%;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* ===== screens ===== */
.screen { min-height: 100%; }
#boot {
  background: #000;
  color: #c0c0c0;
  font-family: ui-monospace, "Courier New", monospace;
  padding: 48px 28px;
}
#boot .boot-log { white-space: pre-wrap; font-size: 13px; max-width: 640px; }
#boot .blink { animation: blink 1s step-end infinite; }
#login {
  background: #d4d0c8;
  display: flex; align-items: center; justify-content: center;
  min-height: 100%;
}
.login-box {
  width: 360px; background: #f0f0f0; border: 2px solid; border-color: #fff #808080 #808080 #fff;
  
}
.login-title {
  background: #0a246a;
  color: #fff; padding: 6px 10px; font-size: 13px; font-weight: 700;
}
.login-body { padding: 18px 20px 16px; }
.login-body h1 { margin: 0 0 4px; font-size: 16px; color: #1a365d; }
.login-body .sub { color: #666; font-size: 12px; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.row label { width: 72px; color: #444; }
.row input {
  flex: 1; height: 26px; border: 2px inset #d4d0c8; padding: 0 8px; background: #fff;
}
.row input[readonly] { background: #eee; color: #555; }
.login-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn {
  height: 28px; padding: 0 14px; border: 1px solid;
  border-color: #fff #808080 #808080 #fff;
  background: #d4d0c8; color: #000;
}
.btn:hover { filter: brightness(1.04); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-pri { background: #d4d0c8; color: #000; border-color: #fff #808080 #808080 #fff; }
.btn-danger { background: #8b0000; color: #fff; border-color: #5a0000; }
.btn-warn { background: #e6b422; border-color: #b8860b; }
.btn-ghost { background: #f5f5f5; }

/* ===== desktop ===== */
#desk { display: flex; flex-direction: column; height: 100vh; background: #d4d0c8; }
.win {
  flex: 1; margin: 8px; background: var(--bg); border: 2px solid #2a3340;
  display: flex; flex-direction: column; min-height: 0; 
}
.titlebar {
  background: #1a365d;
  color: #fff; display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; font-size: 13px; user-select: none;
}
.titlebar .brand { font-weight: 700; letter-spacing: .02em; }
.titlebar .ver { opacity: .7; font-size: 11px; }
.spacer { flex: 1; }
.chip {
  font-size: 12px; background: #0f2744; border: 1px solid #3d6a9a;
  padding: 2px 8px; border-radius: 2px; display: inline-flex; align-items: center; gap: 6px;
}
.chip.warn { background: #5a4a10; border-color: #c9a227; color: #ffe08a; }
.chip.hot { background: #4a1010; border-color: #ff4444; color: #ffb3b3; }
#pending-n { font-variant-numeric: tabular-nums; font-weight: 700; }
.speedbar { display: flex; gap: 2px; }
.speedbar button, .iconbtn {
  height: 22px; padding: 0 7px; font-size: 11px; border: 1px solid #3d6a9a;
  background: #163154; color: #d6e6f7;
}
.speedbar button.on { background: #2a5caa; border-color: #7ec1ff; color: #fff; }
.menubar {
  background: #e8eaed; border-bottom: 1px solid var(--line);
  display: flex; gap: 2px; padding: 2px 8px; font-size: 12px;
}
.menubar button { border: 0; background: transparent; padding: 3px 8px; color: #333; }
.menubar button:hover { background: #d0d7e2; }
.tabs {
  display: flex; gap: 0; background: #d5dbe3; border-bottom: 1px solid #9aa7b5;
  overflow-x: auto; flex-shrink: 0;
}
.tab {
  border: 1px solid transparent; border-bottom: 0;
  background: transparent; padding: 8px 12px; color: #334; white-space: nowrap;
  position: relative;
}
.tab.on {
  background: var(--bg); border-color: #9aa7b5; font-weight: 700;
  margin-bottom: -1px;
}
.tab .badge {
  position: absolute; top: 2px; right: 4px;
  min-width: 16px; height: 16px; border-radius: 8px;
  background: #c0392b; color: #fff; font-size: 10px; line-height: 16px; text-align: center;
  padding: 0 4px;
}
.tab.blink { animation: tabblink 1s linear infinite; }
.work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.station { flex: 1; min-height: 0; display: none; }
.station.on { display: flex; flex-direction: column; overflow: auto; }
.statusbar {
  background: #e8eaed; border-top: 1px solid var(--line);
  display: flex; gap: 12px; padding: 3px 10px; font-size: 11px; color: #555;
}
.statusbar b { color: #222; font-weight: 600; }

/* ===== shared panels ===== */
.split { display: flex; flex: 1; min-height: 0; }
.col { overflow: auto; min-width: 0; }
.col-l { width: 280px; flex-shrink: 0; border-right: 1px solid var(--line); background: #f7f8fa; }
.col-m { flex: 1; background: #fff; }
.col-r { width: 220px; flex-shrink: 0; border-left: 1px solid var(--line); background: #f4f6f8; }
.hd {
  padding: 8px 12px; font-size: 12px; font-weight: 700; color: #1a365d;
  background: #e8eef6; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between;
}
.list-item {
  display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: start;
  padding: 8px 10px; border-bottom: 1px solid #eef; cursor: pointer;
}
.list-item:hover { background: #eef4fb; }
.list-item.on { background: #d6e8fa; }
.list-item.done { opacity: .55; }
.list-item.anomaly { background: #fff6e8; }
.list-item.anomaly.on { background: #ffe7c2; }
.list-item.danger { background: #fdecea; outline: 1px solid var(--bad-bd); }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: #52c41a; }
.dot.y { background: #faad14; }
.dot.r { background: #f5222d; }
.dot.g { background: #8c8c8c; }
.meta { font-size: 11px; color: #888; }
.detail { padding: 12px 16px; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 13px; margin: 10px 0; }
.kv b { color: #888; font-weight: 500; }
.field-warn { background: var(--warn); color: #333; padding: 2px 6px; }
.field-dead {
  background: #ccc; color: #444; text-decoration: line-through;
  outline: 1px solid var(--bad-bd);
}
.flicker { animation: flicker 1.1s linear infinite; }
.actions { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.hint { font-size: 11px; color: #888; padding: 0 12px 12px; }
.scanbed {
  height: 110px; margin: 8px 0 12px; background: #111; position: relative; overflow: hidden;
  border: 1px solid #333;
}
.barcode {
  position: absolute; inset: 18px 24px 28px;
  background: repeating-linear-gradient(90deg, #eee 0 2px, #111 2px 3px, #eee 3px 5px, #111 5px 6px, #eee 6px 10px);
  opacity: .85;
}
.scanline {
  position: absolute; left: 0; right: 0; height: 2px; background: #ff2a2a;
   display: none; top: 0;
}
.scanning .scanline { display: block; animation: scan 1.25s linear; }
.lamp { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #333; vertical-align: middle; margin-right: 6px; }
.lamp.ok { background: #52c41a; }
.lamp.warn { background: #faad14; }
.lamp.bad { background: #f5222d; }
.lamp.off { background: #666; }

/* station 1 logistics */
#st1 { background: #e8ecf1; }
#st1 .hd { background: #2b5c8a; color: #fff; }

/* station 2 WMS */
#st2 { background: #dce6de; }
#st2 .hd { background: #3d5c45; color: #fff; }
.map {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px;
}
.cell {
  min-height: 88px; background: #f4f7f4; border: 1px solid #9bb39b;
  padding: 8px; font-size: 12px; cursor: pointer; position: relative;
}
.cell:hover { outline: 2px solid #3d5c45; }
.cell.dead {
  background: #c8c8c8; color: #555; border-color: #888;
}
.cell.dead.hot { outline: 2px solid var(--bad-bd); background: #d8d0d0; }
.cell .tag { font-size: 10px; color: #888; }
.cell.dead .tag { color: var(--crt-hi); background: #333; padding: 0 4px; }
.prog { height: 6px; background: #c5d0c5; margin: 8px 12px; }
.prog > i { display: block; height: 100%; background: #3d5c45; }

/* station 3 roster */
#st3 { background: #efe8dc; }
#st3 .hd { background: #6b5a3e; color: #fff; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 10px; background: #f7f1e6; }
.cal span { text-align: center; font-size: 11px; padding: 4px 0; background: #fff; border: 1px solid #e6dcc8; }
.cal .dow { background: #6b5a3e; color: #fff; font-weight: 700; }
.cal .today { outline: 2px solid #8b0000; background: #fff3cd; font-weight: 700; }
.cal .mute { color: #bbb; background: #f3eee4; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; padding: 10px; }
.card {
  display: grid; grid-template-columns: 52px 1fr; gap: 8px;
  background: #fff; border: 1px solid #d7cbb6; padding: 8px; cursor: pointer;
}
.card.on { outline: 2px solid #6b5a3e; }
.card.dead {
  background: #ccc; outline: 1px solid var(--bad-bd);
}
.card.pend { background: #ececec; outline: 1px solid var(--bad-bd); }
.card.dead .nm { text-decoration: line-through; color: #555; }
.photo {
  width: 48px; height: 62px;
  filter: grayscale(1) contrast(.92) brightness(.88);
  image-rendering: pixelated;
  border: 1px solid #888;
}
.stamp {
  display: inline-block; font-size: 10px; border: 1px solid #8b0000; color: #8b0000;
  padding: 0 4px; transform: rotate(-8deg); margin-left: 4px;
}

/* station 4 CRT */
#st4 { background: #031403; color: var(--crt); font-family: ui-monospace, "Courier New", "PingFang SC", monospace; }
#st4 .split { background: var(--crt-bg); }
#st4 .col-l, #st4 .col-m { background: transparent; border-color: #145014; }
#st4 .hd {
  background: #041904; color: var(--crt); border-color: #145014;
  text-shadow: 0 0 4px #33ff33;
}
.crt {
  position: relative;
  text-shadow: 0 0 2px #33ff33aa;
  padding: 8px 10px;
  font-size: 13px;
}
.crt::after {
  content: ""; pointer-events: none; position: absolute; inset: 0;
  background: repeating-linear-gradient(transparent 0 2px, #0003 2px 3px);
}
.tree-line { padding: 2px 4px; cursor: pointer; white-space: pre; }
.tree-line:hover { background: #0d3d0d; }
.tree-line.on { background: var(--crt); color: #041904; text-shadow: none; }
.tree-line.rev { color: var(--crt-hi); }
.tree-line.pend { color: #ff6b6b; }
.cursor { display: inline-block; width: 8px; height: 14px; background: var(--crt); animation: blink 1s step-end infinite; vertical-align: text-bottom; }
.crt-stat { border-top: 1px solid #145014; padding: 6px 10px; font-size: 12px; color: var(--crt-dim); }

/* station 5 OA */
#st5 { background: #f0f0f0; }
#st5 .hd { background: #5a6a7a; color: #fff; }
table.oa { width: 100%; border-collapse: collapse; background: #fff; }
table.oa th, table.oa td { border: 1px solid #c9c9c9; padding: 6px 8px; text-align: left; font-size: 12px; }
table.oa th { background: #e4e7eb; }
table.oa tr { cursor: pointer; }
table.oa tr.on { background: #d6e8fa; }
table.oa tr.pend td:first-child { background: var(--warn); }
table.oa tr.dead { background: #ccc; }
table.oa tr.dead td { text-decoration: line-through; outline: 1px solid var(--bad-bd); }
.oa-foot {
  border-top: 2px solid #8b0000; background: #fff8f8; padding: 12px 16px; font-size: 12px;
}
.oa-foot.alert { animation: growhot 2s ease forwards; }

/* station 6 timeline */
#st6 { background: #f7fafc; }
#st6 .hd { background: #1d4e89; color: #fff; }
.tl { position: relative; padding: 16px 20px 16px 36px; }
.tl::before { content: ""; position: absolute; left: 18px; top: 12px; bottom: 12px; width: 2px; background: #bcd; }
.tl-item { position: relative; margin: 0 0 16px; background: #fff; border: 1px solid #d9e4ef; padding: 10px 12px; }
.tl-item::before {
  content: ""; position: absolute; left: -24px; top: 12px; width: 10px; height: 10px;
  border-radius: 50%; background: #2a5caa; border: 2px solid #fff;
}
.tl-item.bad { border-color: var(--bad-bd); }
.tl-item.bad::before { background: #f5222d; }
.signpic {
  width: 72px; height: 48px; margin-top: 6px; background: #ddd;
  filter: grayscale(1) blur(.4px) contrast(.8);
  border: 1px solid #aaa; position: relative; overflow: hidden;
}
.signpic.bad { outline: 2px solid var(--bad-bd); }
.scribble {
  position: absolute; left: 18px; top: 10px; width: 28px; height: 22px;
  border: 2px solid #444; border-radius: 40% 20% 50% 30%;
  transform: rotate(-18deg); opacity: .45;
}

/* photos / xray */
.xray {
  width: 220px; height: 160px; background: #0b0d10;
  border: 1px solid #333; position: relative; overflow: hidden;
  image-rendering: pixelated; filter: grayscale(1) contrast(1.2) brightness(.7);
}
.xray .body {
  position: absolute; left: 88px; top: 52px; width: 44px; height: 78px;
  border: 1px dashed #9aa; border-radius: 20px 20px 8px 8px; opacity: .55;
}
.xray .head {
  position: absolute; left: 98px; top: 28px; width: 24px; height: 24px;
  border: 1px dashed #9aa; border-radius: 50%; opacity: .55;
}
.xray .noise {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, #fff1 0 1px, transparent 1px 3px);
}
.xray .cap { position: absolute; bottom: 4px; left: 6px; color: #8f8; font-size: 10px; font-family: ui-monospace, monospace; }

.zhao {
  position: absolute; right: 18px; bottom: 36px; width: 280px;
  background: #fff; border: 1px solid #4a6fa5; 
  z-index: 8; font-size: 12px;
}
.zhao .zt {
  background: #3a6ea5; color: #fff; padding: 4px 8px; font-weight: 700;
  display: flex; justify-content: space-between;
}
.zhao .zb { padding: 8px 10px; max-height: 160px; overflow: auto; }
.zhao .zb p { margin: 0 0 8px; }
.zhao .zb p.me { color: #1a365d; }

/* modal */
#modal {
  position: fixed; inset: 0; background: #0005; display: none;
  align-items: center; justify-content: center; z-index: 20;
}
#modal.on { display: flex; }
.dlg { width: min(520px, 92vw); background: #f0f0f0; border: 2px solid #0a246a;  }
.dlg-title { background: #0a246a; color: #fff; padding: 5px 10px; font-weight: 700; }
.dlg-body { padding: 14px 16px; font-size: 13px; }
.dlg-body p { margin: 0 0 8px; }
.dlg-acts { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }
.toast {
  position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%);
  background: #1a365d; color: #fff; padding: 8px 14px; font-size: 12px;
  display: none; z-index: 30; max-width: 90vw;
}
.toast.on { display: block; }

/* night end */
#ending {
  background: #1a1714; color: #ddd; display: flex; align-items: center; justify-content: center;
  min-height: 100%; padding: 24px;
}
.polaroid {
  width: min(420px, 92vw); background: #efe6d6; color: #333; padding: 12px 12px 18px;
   transform: rotate(-1.5deg);
}

.polaroid .pic .p1, .polaroid .pic .p2 {
  position: absolute; bottom: 24px; width: 46px; height: 90px; background: #3334;
  border-radius: 20px 20px 4px 4px;
}
.polaroid .pic .p1 { left: 120px; }
.polaroid .pic .p2 { left: 168px; width: 40px; height: 70px; bottom: 24px; }
.polaroid .cap { font-size: 12px; color: #666; margin-top: 8px; }
.ending-copy { max-width: 520px; margin-left: 28px; font-size: 14px; line-height: 1.7; }
.ending-copy h2 { margin: 0 0 12px; font-weight: 600; color: #efe6d6; }
@media (max-width: 800px) {
  .ending-wrap { flex-direction: column; }
  .ending-copy { margin: 18px 0 0; }
}

.guide { outline: 2px dashed #2a5caa !important; outline-offset: -2px; }

.acro-bar {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  padding: 8px 12px; background: #fff8f0; border-bottom: 1px solid #e8c48a;
  font-family: ui-monospace, "Courier New", "PingFang SC", monospace; font-size: 16px;
}
.acro-ch {
  width: 28px; height: 28px; line-height: 28px; text-align: center;
  border: 1px solid #c9a227; background: #fff; color: #bbb;
}
.acro-ch.on { background: #fff3cd; color: #8b0000; font-weight: 700; border-color: #8b0000; }
.acro-ch.wait { border-style: dashed; }
.acro-ch.miss { background: #eee; color: #999; text-decoration: line-through; }
.acro-hi { color: #8b0000; font-weight: 700; background: #fff3cd; padding: 0 2px; }
.drawer-btn {
  margin: 8px 12px; border: 1px dashed #6b5a3e; background: #f7f1e6;
  padding: 8px 10px; text-align: left; width: calc(100% - 24px);
}
.drawer-btn.hot { animation: tabblink 1.2s linear infinite; }
.log-book { background: #f6f0e4; border: 1px solid #c4b496; padding: 12px 16px; min-height: 220px; }
.log-book h3 { margin: 0 0 8px; font-size: 14px; color: #5a4630; }
.log-book p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; color: #3a3228; }
.log-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.graffiti {
  margin-top: 12px; padding: 8px; background: #efe6d2; font-family: ui-monospace, monospace;
  font-size: 12px; letter-spacing: .4em; color: #6a5a40; transform: rotate(-1deg);
  user-select: text; border: 1px dashed #a09070;
}
.graffiti .dim { opacity: .28; letter-spacing: 0; }
.crt-q { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #145014; }
.crt-q input {
  flex: 1; background: #041904; color: var(--crt); border: 1px solid #145014;
  font-family: inherit; height: 24px; padding: 0 6px;
}
.crt-q button { height: 24px; background: #041904; color: var(--crt); border: 1px solid #33ff33; padding: 0 8px; }
.op-rec { white-space: pre-wrap; color: var(--crt); font-size: 12px; line-height: 1.5; }
.op-rec .blank { color: #ff6b6b; }
.im-line { margin: 0 0 8px; }
.im-line.me { color: #1a365d; }
.xray.two .body { left: 48px; }
.xray.two .head { left: 58px; }
.xray.two .body2 {
  position: absolute; left: 118px; top: 72px; width: 52px; height: 58px;
  border: 1px dashed #9aa; border-radius: 8px 8px 6px 6px; opacity: .55;
}
.xray.two .head2 {
  position: absolute; left: 132px; top: 50px; width: 24px; height: 24px;
  border: 1px dashed #9aa; border-radius: 50%; opacity: .55;
}
.dlg.wide { width: min(640px, 94vw); max-height: 88vh; overflow: auto; }
.final-step { border: 1px solid #c9c9c9; background: #fff; padding: 8px 10px; margin: 8px 0; }
.final-step label { display: block; margin: 4px 0; }
.ending-copy { max-height: 78vh; overflow: auto; padding-right: 8px; }
.polaroid .pic.n2 { filter: grayscale(.85) contrast(.9) brightness(.8); }
.blink-row { animation: tabblink 1s linear infinite; }

@keyframes scan { from { top: 0; } to { top: 100%; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes flicker { 0%, 60% { color: #333; } 61%, 100% { color: #c0392b; } }
@keyframes tabblink { 50% { background: #f8d0d0; } }
@keyframes growhot { from { color: #b8860b; } to { color: #8b0000; font-weight: 700; } }

@media (max-width: 900px) {
  .split { flex-direction: column; }
  .col-l, .col-r { width: auto; border: 0; max-height: 36vh; }
  .titlebar { flex-wrap: wrap; }
  .zhao { position: static; width: auto; margin: 8px; }
  #desk { height: auto; min-height: 100vh; }
  .win { margin: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .scanline, .flicker, .tab.blink, .cursor, .crt::after { animation: none; }
}
</style>

function person(id) { return PERSONS.find(function (p) { return p.id === id; }); }

function timeToMin(t) {
  var p = t.split(":");
  var h = +p[0], m = +p[1];
  return (h < 8 ? h + 24 : h) * 60 + m;
}
function fmtClock(min) {
  var x = ((min % (24 * 60)) + 24 * 60) % (24 * 60);
  var h = Math.floor(x / 60), m = x % 60;
  return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function statusCn(s) {
  return ({ waiting: "未到达", inbox: "待扫描", scanned: "已扫描", sorting: "分拣中", done: "已处理" })[s] || s;
}
function typeCn(s) {

}
function logAct(msg, extra) {
  state.playerLog.push({ t: fmtClock(state.clockMin), night: state.night, msg: msg, extra: extra || null });
}
function ms(id) {
  if (!state.mailState[id]) state.mailState[id] = { status: "waiting", scanned: false };

}
function arrivedMails() {

}
function bumpBadge(tab) {

function toast(msg) {

  toast._t = setTimeout(function () { el.classList.remove("on"); }, 2800);
}
function photoStyle(id) {
  var p = PERSONS.find(function(x){ return x.id === id; });

    return "background:url('" + p.photo + "') center/cover no-repeat #888;filter:grayscale(1) contrast(.92) brightness(.88);";

  var n = 0;
  for (var i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) % 360;
  return "background:linear-gradient(" + (20 + n % 50) + "deg,#bbb,#666 " + (40 + n % 30) + "%,#444);";
}

/* ========== CLOCK ========== */
var lastTs = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  var dt = ts - lastTs;
  lastTs = ts;
  if (state.screen !== "work" || state.paused || state.dialog || state.scanning || state.nightEnded) {
    updateChrome();
    return;
  }
  if (state.phase !== "shift") {
    updateChrome();
    return;
  }
  acc += dt * state.speed;
  var advanced = false;
  while (acc >= MS_PER_GAME_MIN) {
    acc -= MS_PER_GAME_MIN;
    if (state.clockMin < END_MIN) {
      state.clockMin += 1;
      advanced = true;
      spawnByClock();
      fireEvents();
      if (state.clockMin >= END_MIN) {
        state.clockMin = END_MIN;
        break;
      }
    }
  }
  if (advanced) {
    updateChrome();
    if (state.dirty) renderAll();
  } else updateChrome();
}

function spawnByClock() {
  MAILS.forEach(function (m) {
    if (m.tutorial || !m.arriveAt || state.arrived[m.id]) return;
    if ((m.night || 1) !== state.night) return;
    if (m.replaceFor) return;
    if (state.clockMin >= timeToMin(m.arriveAt) && !m.anomaly) arriveMail(m.id, false);
  });
}

function arriveMail(id, isEvent) {
  if (state.arrived[id]) return;
  state.arrived[id] = true;
  ms(id).status = "inbox";
  state.dirty = true;
  bumpBadge(1);
  if (mail(id) && mail(id).type === "return") bumpBadge(5);
  if (!isEvent) toast("扫描台新件 " + mail(id).barcode);
}

}

function acroGot(ch) {
  return !!state.acro[ch];
}

function acroProgress() {
  var s = "";
  ACRONYM_CHARS.forEach(function (c) { if (state.acro[c]) s += c; });
  return s;
}

function maybeRepairAcro(id, ch) {
  if (state.acro[ch] || state.arrived[id]) return;
  var orig = MAILS.filter(function (m) { return m.acroChar === ch && !m.replaceFor; })[0];
  if (!orig) return;
  if (state.decisions[orig.id] !== "cancel" && !state.acroBroken[ch]) return;
  arriveMail(id, true);
  toast("系统补发一封退信，寄件地址首字仍为「" + ch + "」");
  bumpBadge(5);
}

function collectAcro(id) {
  var m = mail(id);
  if (!m || !m.acroChar) return;
  if (state.decisions[id] === "pending" || state.decisions[id] === "scan-bad") {
    state.acro[m.acroChar] = true;
    delete state.acroBroken[m.acroChar];
    var prog = acroProgress();
    if (prog === "水库下面" || prog === "水库下面有" || prog === "水库下面有人") {
      toast("已拼出：" + prog);
    } else {
      toast("寄件地址首字已记录：" + m.acroChar);
    }
  } else if (state.decisions[id] === "cancel") {
    if (!state.acro[m.acroChar]) state.acroBroken[m.acroChar] = true;
    toast("该寄件地址记录已清理。句子在这一位断开了。");
  }
}

}
function closeDialog() {
  state.dialog = null;

  state.dirty = true;
  renderAll();
}
function renderModal() {
  var el = document.getElementById("modal");
  if (!state.dialog) { el.className = ""; el.innerHTML = ""; return; }
  var d = state.dialog;
  el.className = "on";
  el.innerHTML = '<div class="dlg' + (d.wide ? " wide" : "") + '"><div class="dlg-title">' + esc(d.title) + '</div><div class="dlg-body">' +
    d.body + "</div><div class=\"dlg-acts\">" +
    (d.buttons || [{ label: "确定", act: "close", pri: true }]).map(function (b) {
      return '<button type="button" class="btn ' + (b.pri ? "btn-pri" : b.danger ? "btn-danger" : b.warn ? "btn-warn" : "") +
        '" data-act="' + esc(b.act) + '"' + (b.id ? ' data-id="' + esc(b.id) + '"' : "") + ">" + esc(b.label) + "</button>";
    }).join("") + "</div></div>";
}

function decide(id, kind) {
  var m = mail(id);
  if (!m) return;
  if ((kind === "pending" || kind === "cancel") && !ms(id).scanned) {
    startScan(id);
    return;
  }
  state.decisions[id] = kind;
  ms(id).status = "done";
  if (kind === "pending") {
    state.pendingCount += 1;
    if (m.receiverId) state.personMarks[m.receiverId] = "pending";
    toast("已标记待核验，异常队列已更新");
    logAct("标记待核验", id);
    if (id === "m-shen") state.night1ShenChoice = "pending";
    collectAcro(id);
    if (id === "m-lin") { state.linFileViewed = true; fireEvents(); }
  } else if (kind === "cancel") {
    if (m.receiverId) state.personMarks[m.receiverId] = "cancelled";
    toast("已确认注销，关联记录已清理");
    logAct("确认注销", id);
    if (id === "m-shen") state.night1ShenChoice = "cancel";
    collectAcro(id);
    if (id === "m-lin") { state.linFileViewed = true; fireEvents(); }
  } else if (kind === "scan-bad") {
    toast("已标记安检异常");
    logAct("包裹标记异常", id);
  } else {
    toast("已放行并入站");
    logAct("包裹放行", id);
  }
  if (!m.tutorial && kind !== "cancel") autoAssign(id);
  pickNextMail();
  closeDialog();
  maybeFinishTutorial();
}

function confirmNormal(id) {
  var m = mail(id);
  if (!m || !ms(id).scanned) return;
  if (m.anomaly) {
    if (m.type === "return") openReturnDialog(m);
    else if (m.xray) openXrayDialog(m);
    return;
  }
  autoAssign(id);
  ms(id).status = "done";
  logAct("处理完成", id);
  if (m.tutorial) {
    state.tutorialProcessed += 1;
    if (state.tutorialProcessed === 1) {
      pushZhao("就这个流程。正常件按规程走就行。你先把这一筐十封清完。");

function runHistQuery() {
  var raw = (state.histDraft || "").replace(/\s/g, "");
  var up = raw.toUpperCase();
  if (/1998-?0?4-?12/.test(raw) || raw.indexOf("1998年4月12") >= 0) {
    state.query1998 = true;
    state.query1998Count += 1;
    state.histResult = "1998";
    state.viewed["op-1998"] = true;
    if (state.query1998Count >= 3) state.darkLineB = true;
    toast("已调出 1998-04-12 操作记录");
    logAct("查询1998-04-12", String(state.query1998Count));
  } else if (up === "BIND-1998-03" || up === "BIND199803") {
    state.darkLineADecoded = true;
    state.histResult = "bind";
    toast("涂鸦已解码");
    logAct("解码暗线A");
  } else if (up === "HIST-ARCHIVE") {
    state.viewed["hist-archive"] = true;
    state.histResult = "archive";
    toast("归档指令有效。最终抉择时可选用。");
  } else if (up === "FF-ARCHIVE") {
    state.viewed["ff-archive"] = true;
    state.histResult = "ff";
    toast(state.darkLineADecoded ? "保留地址 FF-ARCHIVE 存在。" : "无权限查看该地址空间。");
  } else if (raw === "吴桂芳" || up === "WGF") {
    state.wgfTimeline = true;
    state.histResult = "wgf";
    state.pushed.persons.push("p-wgf");
    toast("已加载吴桂芳关联时间线");
  } else {
    state.histResult = "miss";
    toast("无此操作记录，或权限不足");
  }
  renderAll();
}

function readFinalForm() {
  function val(name, fallback) {
    var el = document.querySelector("input[name='" + name + "']:checked");
    return el ? el.value : fallback;
  }
  return {
    split: val("f-split", "none"),
    rec: val("f-rec", "mix"),
    chen: val("f-chen", "confirm"),
    self: val("f-self", "skip"),
    wgf: val("f-wgf", "keep")
  };
}

function applyFinal(choice) {
  closeDialog();
  state.finalChoice = choice.kind;
  if (choice.kind === "all" || (choice.form && choice.form.rec === "batch")) {
    state.batchChoice = state.batchChoice || "batch";
    showEnding("A");
    return;
  }
  if (choice.kind === "none") {
    state.selfProcessed = false;
    showEnding("B");
    return;
  }
  var f = choice.form || {};
  state.splitMode = f.split;
  state.archiveUsed = f.rec === "archive";
  state.selfProcessed = f.self === "ok" || f.split === "split" || f.split === "redirect";
  state.wgfArchived = f.wgf === "archive";
  if (f.split === "redirect" && state.darkLineADecoded) {
    askRedirectAddress();
    return;
  }
  if (f.split === "split" && state.archiveUsed && state.logFullyRead && state.wgfArchived) {
    if (!state.zhaoToldVisit) {
      toast("赵德明还没把1998年全部说完。把第四件安检图像拿给他。");
      openFinalForm();
      return;
    }
    showEnding("C");
    return;
  }
  showEnding("B");
}

function restart() {
  var fresh = createState();
  Object.keys(state).forEach(function (k) { delete state[k]; });
  Object.assign(state, fresh);
  lastTs = 0; acc = 0;
  state.screen = "login";
  showScreen();

function flushTutorial() {
  if (state.tutorialDone) return;
  MAILS.forEach(function (m) {
    if (!m.tutorial || ms(m.id).status === "done") return;
    ms(m.id).scanned = true;
    autoAssign(m.id);
    ms(m.id).status = "done";
    logAct("培训件按规程处理", m.id);
  });
  maybeFinishTutorial();
  state.dirty = true;
  renderAll();
}

function lampFor(m) {
  if (!ms(m.id).scanned) return { cls: "off", t: "未扫描" };
  var st = villageStatus(m.village);
  if (m.anomaly && m.anomaly.type === "xray-shadow") return { cls: "warn", t: "安检异常" };
  if (st === "cancelled" || st === "merged" || m.type === "return") return { cls: "bad", t: "地址异常" };
  return { cls: "ok", t: "验证通过" };
}

  var list = arrivedMails().slice().sort(function (a, b) {

    var ob = { inbox: 0, scanned: 1, sorting: 2, done: 3 }[ms(b.id).status];

  });
  if (!state.selectedMailId && list[0]) state.selectedMailId = list[0].id;

    var st = ms(x.id);
    var cls = "list-item" + (x.id === state.selectedMailId ? " on" : "") + (st.status === "done" ? " done" : "") +
      (x.anomaly && x.type === "return" ? " anomaly" : "") + (x.xray ? " danger" : "") +
      (x.id === "m-lin" && st.status !== "done" ? " blink-row" : "");
    var dcls = x.anomaly ? "y" : st.status === "done" ? "g" : "ok" === lampFor(x).cls ? "" : "";
    if (x.anomaly) dcls = "y";
    if (x.xray) dcls = "r";
    if (!x.anomaly && !x.xray) dcls = st.status === "done" ? "g" : "";
    return '<div class="' + cls + (state.guide && x.id === "t01" && state.guide === "select" ? " guide" : "") +
      '" data-act="sel-mail" data-id="' + x.id + '"><div class="dot ' + dcls + '"></div><div><b>' +
      esc(x.receiver) + "</b><div class=\"meta\">" + esc(x.barcode) + " · " + esc(x.type === "return" ? "退件" : x.type === "package" ? "包裹" : "平信") +
      (x.arriveAt ? " · " + x.arriveAt : " · 培训") + "</div></div><div class=\"meta\">" + esc(statusCn(st.status)) + "</div></div>";
  }).join("") || '<div class="hint">队列空</div>';

  var mid = "<div class='hd'>邮件详情</div><div class='detail'>";
  if (!m) mid += "<p class='meta'>选择左侧邮件</p>";
  else {

function statusLabel(p) {
  var mk = state.personMarks[p.id];
  if (mk === "pending") return "待核验";
  if (mk === "cancelled") return "已注销";
  if (p.status === "active") return "在岗 / 正常";
  if (p.status === "deceased") return "已注销（因公殉职）";
  if (p.status === "cancelled") return "已注销";
  if (p.status === "missing") return "失踪";
  return p.status;
}
function markedDead(p) {
  return p.status === "deceased" || p.status === "cancelled" || state.personMarks[p.id] === "cancelled";
}

    html += "<p class='field-warn'><b>关联历史地址</b>：青石村三组（搬迁前）<br>备注：1998年4月12日行政区划调整中，此人与以下记录共享合并编码 BIND-1998-03：</p>" +
      "<p>刘小梅（女，1998年时6岁）　林远（男，1998年时10岁）　陈思源（男，1998年时8岁；陈国栋原登记名）</p>" +

      '<button class="btn" data-act="open-person" data-id="p-lin">林远</button></p>';

function renderSt4() {
  function lines(parent, depth) {
    return VILLAGES.filter(function (v) { return v.parent === parent; }).map(function (v) {
      var kids = VILLAGES.some(function (k) { return k.parent === v.id; });
      var open = state.treeOpen[v.id];
      var cls = "tree-line" + (state.selectedVillageId === v.id ? " on" : "") +
        (v.status === "cancelled" || v.status === "merged" ? " rev" : "") +
        (v.id === "v-qingshi" && state.pendingCount ? " pend" : "");
      var mark = kids ? (open ? "[-]" : "[+]") : " · ";
      var extra = "";
      if (v.status === "cancelled") extra = "  *REVOKED-1998*";
      if (v.status === "merged") extra = "  *MERGED*";
      if (v.id === "v-qingshi" && state.pendingCount) extra += "  待核验扩散";
      var s = '<div class="' + cls + '" data-act="tree" data-id="' + v.id + '">' +
        " ".repeat(depth * 2) + mark + " " + v.code + " " + v.name + extra + "</div>";
      if (open && v.groups) {
        v.groups.forEach(function (g) {
          s += '<div class="tree-line" data-act="tree-sel" data-id="' + v.id + '">' +
            " ".repeat((depth + 1) * 2) + "· " + g + "</div>";
        });
      }
      if (open) s += lines(v.id, depth + 1);
      return s;
    }).join("");
  }
  var v = village(state.selectedVillageId);
  var right = "<div class='hd'>记录</div><div class='crt'>";

    right += "NAME=" + esc(v.name) + "\nCODE=" + esc(v.code) + "\nSTATUS=" + esc(v.status).toUpperCase() + "\n";

    if (v.activeCount != null) right += "ACTIVE_PERSONS=" + v.activeCount + "\n";

          p.name + "  " + (p.group || "") + "  " + statusLabel(p) + "</div>";

      right += "\n其余记录已折叠（系统显示合计 34）。";

    if (v.id === "v-lianhua") {

        right += '<div class="tree-line" data-act="open-person" data-id="' + p.id + '">  ' + p.name + "  " + statusLabel(p) + "</div>";
      });
    }
    if (state.histResult === "1998" || (state.query1998 && v.id === "v-qingshi")) {
      right += "\n<span style='color:#ffff00'>--- HIST 1998-04-12 ---</span>\n<div class='op-rec'>" + esc(OP_1998).replace("（空白——没有批文号，没有上级指令编号）", "<span class='blank'>（空白——没有批文号，没有上级指令编号）</span>") + "</div><img src='" + IMG_ARCHIVE + "' style='width:100%;max-height:130px;object-fit:cover;opacity:.72;filter:sepia(.25);margin-top:5px;border:1px solid #145014'>";
      if (state.darkLineB) {
        right += "\n<span style='color:#ffff00'>操作备注（隐藏字段）：合并操作经县移民办张主任口头批准。张主任现已不在本系统辖区内。无法调取其操作记录。</span>\n";

    }
  }
  right += "<span class='cursor'></span></div>";
  if (state.night >= 2 && (state.drawerUnlocked || state.eventsFired["QUERY-HINT"] || state.logFullyRead)) {
    right += "<div class='crt-q'><input id='hist-q' maxlength='24' placeholder='日期或操作码，例 1998-04-12' value='" +
      esc(state.histDraft) + "'><button type='button' data-act='hist-go'>回放</button></div>";
  }
  right += "<div class='crt-stat'>C:\\ADDR\\GRID.DAT　" +
    (state.night >= 2 && (state.drawerUnlocked || state.eventsFired["QUERY-HINT"]) ? "历史回放已开通　无全文检索" : "只读浏览　夜班查询权限未开通") +
    "</div>";
  document.getElementById("st4").innerHTML = '<div class="split"><div class="col col-l"><div class="hd">MS-DOS  ADDR.GRID  4.02</div><div class="crt">' +
    lines(null, 0) + '</div></div><div class="col col-m">' + right + "</div></div>";
}

function renderSt5() {
  var rows = arrivedMails().filter(function (m) { return m.type === "return" || state.decisions[m.id]; });
  var body = rows.map(function (m) {
    var dec = state.decisions[m.id];
    var cls = (state.selectedMailId === m.id ? " on" : "") + (dec === "pending" ? " pend" : "") + (dec === "cancel" ? " dead" : "");
    return "<tr class='" + cls + "' data-act='sel-mail' data-id='" + m.id + "'><td>" + esc(m.barcode) + "</td><td>" +
      esc(m.receiver) + "</td><td>" + esc(m.receiverAddr) + "</td><td>" + esc(m.returnReason || "—") + "</td><td>" +
      (dec === "pending" ? "待核验" : dec === "cancel" ? "已注销" : ms(m.id).scanned ? "待处置" : "未扫描") + "</td></tr>";
  }).join("");
  var m = mail(state.selectedMailId);
  var ops = "";
  if (m && m.type === "return" && ms(m.id).status !== "done") {
    ops = '<button class="btn btn-pri" data-act="scan">扫描并核验</button>';
    if (ms(m.id).scanned) {
      ops += ' <button class="btn btn-danger" data-act="decide-cancel" data-id="' + m.id + '">确认注销</button> ' +
        '<button class="btn btn-warn" data-act="decide-pend" data-id="' + m.id + '">标记待核验</button>';
    }
  }
  var foot = "";
  if (state.night === 1 && (state.wrapShown || state.eventsFired["NIGHT1-WRAP"])) {
    foot = '<div class="oa-foot alert"><b>当前待核验记录数：' + state.pendingCount +
      "</b><br>建议操作：对上述记录执行批量注销以清理异常队列。<br>上次批量注销操作人：陈国栋（工号 0821）　2026-05-20　已注销 47 条<br>" +
      '<button class="btn" data-act="open-person" data-id="p-chen">打开推送档案：陈国栋</button> ' +
      '<button class="btn btn-pri" data-act="end-night">结束夜班</button></div>';
  }
  if (state.night === 2 && state.eventsFired["DECISION-002"] && !state.batchChoice) {
    foot = '<div class="oa-foot alert"><b>79条状态冲突</b><br>系统建议批量注销。<br>' +
      '<button class="btn btn-danger" data-act="decision-batch">确认批量注销</button> ' +
      '<button class="btn btn-pri" data-act="decision-one">逐条处理</button></div>';
  }
  if (state.night === 3 && state.eventsFired["DECISION-FINAL"]) {
    foot = '<div class="oa-foot alert"><b>系统最终提示已推送</b><br>' +
      '<button class="btn btn-pri" data-act="open-final">打开四步操作序列</button></div>';
  }
  if (state.nightEnded && !state.endingId && state.night === 2 && state.batchChoice === "one") {
    foot = '<div class="oa-foot"><button class="btn btn-pri" data-act="start-n3">开始第三夜</button></div>';
  }
  if (state.nightEnded && !state.endingId && state.night === 1) {
    foot += '<div class="oa-foot"><button class="btn btn-pri" data-act="end-night">进入第一夜收束</button></div>';
  }
  var acro = "";
  if (state.night >= 2) {
    acro = '<div class="acro-bar"><span class="meta">寄件地址首字</span>' +
      ACRONYM_CHARS.map(function (c) {
        var cls = "acro-ch";
        if (state.acro[c]) cls += " on";
        else if (state.acroBroken[c]) cls += " miss";
        else cls += " wait";
        return '<span class="' + cls + '">' + (state.acro[c] || state.acroBroken[c] ? c : "·") + "</span>";
      }).join("") +
      "<span class='meta'>" + (acroProgress() || "等待退信流入") + "</span></div>";
  }
  document.getElementById("st5").innerHTML = '<div class="hd">退件列表</div>' + acro +
    '<div class="col" style="overflow:auto;flex:1"><table class="oa"><tr><th>条码</th><th>收件人</th><th>地址</th><th>原因</th><th>状态</th></tr>' +
    (body || "<tr><td colspan='5'>暂无退件。退件将按时流入。</td></tr>") + "</table><div class='detail'>" + ops +
    "<p class='meta'>退件原因（系统标注）：查无此人 / 地址不存在 / 收件人已故 / 村已不存在</p></div>" + foot + "</div>";
}

function renderSt6() {
  var list = RECEIPTS.filter(function (r) { return state.receiptsArrived[r.id]; }).slice().reverse();
  var html = '<div class="hd">投递时间线</div><div class="tl">' + list.map(function (r) {
    var cr = person(r.courierId);
    var bad = !!r.anomaly;
    var on = state.selectedReceiptId === r.id;
    return '<div class="tl-item' + (bad ? " bad" : "") + '" data-act="sel-rcp" data-id="' + r.id +
      '" style="' + (on ? "background:#fff3f0" : "") + '"><div class="meta">' +
      (bad ? '<span class="flicker">' + esc(r.time) + "</span>" : esc(r.time)) +
      "</div><div><b>" + esc(cr ? cr.name : "") + "</b>　工号 " + esc(cr ? cr.jobNo : "") +
      (cr && cr.status === "deceased" ? ' <span class="stamp">已注销</span>' : "") +
      "</div><div class='meta'>" + esc(r.address) + " · " + esc(r.status) + " · 签收人：" + esc(r.signer) +
      "</div><div class='signpic" + (bad ? " bad" : "") + "'>" + (bad ? '<div class="scribble"></div>' : "") +
      "</div>" + (bad ? '<p class="meta">签收图像模糊，隐约可见手写“沈”，笔迹不连贯。</p><p>' +
        '<button class="btn" data-act="open-person" data-id="p-zhou">打开人事档案</button> ' +
        '<button class="btn btn-warn" data-act="mark-zhou">确认异常</button> ' +
        '<button class="btn" data-act="ignore-zhou">忽略</button></p>' : "") + "</div>";

}

/* ========== EVENTS ========== */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  var id = t.getAttribute("data-id");
  if (act === "login") login();
  else if (act === "tab") switchStation(+id);
  else if (act === "speed") { state.speed = +t.getAttribute("data-v"); updateChrome(); }
  else if (act === "pause") {
    if (state.phase === "shift" && !state.nightEnded) state.paused = !state.paused;
    updateChrome();
  }
  else if (act === "restart") restart();
  else if (act === "review") reviewDesk();
  else if (act === "sel-mail") { state.selectedMailId = id; if (state.guide === "select") state.guide = "scan"; state.dirty = true; renderAll(); }
  else if (act === "scan") { if (state.selectedMailId) startScan(state.selectedMailId); }
  else if (act === "confirm-mail") { if (state.selectedMailId) confirmNormal(state.selectedMailId); }
  else if (act === "flush-tut") flushTutorial();
  else if (act === "decide-cancel") decide(id || state.selectedMailId, "cancel");
  else if (act === "decide-pend") decide(id || state.selectedMailId, "pending");
  else if (act === "decide-scan-bad") decide(id || state.selectedMailId, "scan-bad");
  else if (act === "decide-scan-ok") decide(id || state.selectedMailId, "scan-ok");
  else if (act === "open-person") {
    state.selectedPersonId = id;
    state.viewed[id] = true;
    if (id === "p-lin") { state.linFileViewed = true; state.bindViewed = true; fireEvents(); }
    switchStation(3);
  }
  else if (act === "open-vill") {
    state.selectedVillageId = id;
    state.treeOpen["v-county"] = true;
    state.treeOpen["v-town"] = true;
    state.treeOpen[id] = true;
    switchStation(4);
  }
  else if (act === "tree") {
    var v = village(id);
    if (v && VILLAGES.some(function (k) { return k.parent === v.id; })) {
      state.treeOpen[id] = !state.treeOpen[id];
    }
    state.selectedVillageId = id;
    renderSt4();
  }
  else if (act === "tree-sel") {
    state.selectedVillageId = id;
    renderSt4();
  }
  else if (act === "sel-rcp") { state.selectedReceiptId = id; renderSt6(); }
  else if (act === "mark-zhou") {
    if (!state.decisions["r-zhou"]) { state.decisions["r-zhou"] = "anomaly"; state.pendingCount += 1; toast("已确认签收异常"); logAct("周海签收异常"); }
    renderAll();
  }
  else if (act === "ignore-zhou") { state.decisions["r-zhou"] = "ignore"; toast("已忽略该回执"); renderAll(); }
  else if (act === "start-shift") startShift();
  else if (act === "goto-shen") { closeDialog(); state.selectedMailId = "m-shen"; switchStation(1); }
  else if (act === "goto-chain") { closeDialog(); state.selectedMailId = "m-lch"; switchStation(5); }
  else if (act === "goto-zhou") { closeDialog(); state.selectedReceiptId = "r-zhou"; switchStation(6); }
  else if (act === "goto-wgf") { closeDialog(); state.selectedMailId = "m-wgf"; switchStation(1); }
  else if (act === "goto-chen") { closeDialog(); state.selectedPersonId = "p-chen"; state.wrapShown = true; switchStation(3); }
  else if (act === "goto-wrap5") { closeDialog(); state.wrapShown = true; switchStation(5); }
  else if (act === "end-night") endNight();
  else if (act === "start-n2") startNight(2);
  else if (act === "start-n3") startNight(3);
  else if (act === "ending-A") showEnding("A");
  else if (act === "log-open") openLog();
  else if (act === "log-prev") logTurn(-1);
  else if (act === "log-next") logTurn(1);
  else if (act === "hist-go") {
    var hq = document.getElementById("hist-q");
    if (hq) state.histDraft = hq.value;
    runHistQuery();
  }
  else if (act === "goto-acro") { closeDialog(); state.selectedMailId = id; switchStation(5); }
  else if (act === "goto-hist") { closeDialog(); state.treeOpen["v-county"] = true; state.treeOpen["v-town"] = true; state.selectedVillageId = "v-qingshi"; switchStation(4); }
  else if (act === "goto-lin") { closeDialog(); state.selectedMailId = "m-lin"; switchStation(5); }
  else if (act === "goto-wgf2") { closeDialog(); state.selectedMailId = "m-wgf2"; switchStation(1); }
  else if (act === "open-lin-file") openLinFile();
  else if (act === "decision-batch") doBatchCancel();
  else if (act === "decision-one") doOneByOne();
  else if (act === "chat-silence") chatAdvance("silence");
  else if (act === "chat-pkg") chatAdvance("pkg");
  else if (act === "chat-why") chatAdvance("why");
  else if (act === "show-xray-zhao") showXrayToZhao();
  else if (act === "open-final") openFinal();
  else if (act === "final-all") applyFinal({ kind: "all" });
  else if (act === "final-none") applyFinal({ kind: "none" });
  else if (act === "final-some") openFinalForm();
  else if (act === "final-back") openFinal();
  else if (act === "final-exec") applyFinal({ kind: "some", form: readFinalForm() });
  else if (act === "final-addr") commitRedirect();
  else if (act === "del-photo") finishEndingC(true);
  else if (act === "keep-photo") finishEndingC(false);
  else if (act === "zhao-hide") { state.zhaoOpen = false; renderZhao(); }
  else if (act === "close") closeDialog();
  else if (act === "menu-sys") openDialog({ title: "系统", body: "<p>青石镇邮政所登记调度系统 v2.40</p><p>操作员：林远 0918<br>班次：夜班　第" + state.night + "夜</p><p>本终端无外网，无检索模块。地址簿可按日期回放。</p>", buttons: [{ label: "确定", act: "close", pri: true }] });
  else if (act === "menu-help") openDialog({
    title: "值班须知",
    body: "<p>1. 扫描条码，核对地址指示灯。<br>2. 正常件确认录入，系统配发邮路。<br>3. 异常件与退件严格按章处理，不明记录暂按“待核验”登记。<br>4. 历史账册按调档日期查阅。<br>5. 按规程操作，别自己瞎琢磨。——赵德明</p>",
    buttons: [{ label: "确定", act: "close", pri: true }]
  });
});

document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "hist-q") state.histDraft = e.target.value;
});

document.addEventListener("keydown", function (e) {
  if (state.screen !== "work") return;
  if (e.key >= "1" && e.key <= "6") switchStation(+e.key);
  if (e.key === "Escape" && state.dialog) closeDialog();
  if (e.key === "Enter" && e.target && e.target.id === "hist-q") {
    e.preventDefault();
    state.histDraft = e.target.value;
    runHistQuery();
  }
  if (e.key === " " && state.phase === "shift") { e.preventDefault(); state.paused = !state.paused; updateChrome(); }
});

function boot() {
  var lines = [
    "青石镇邮政所",
    "登记调度系统 v2.31",
    "",
    "正在加载地址库........ 完成",
    "加载人员档案.......... 完成",
    "同步投递网格.......... 完成",
    "退件队列.............. 待命",
    "夜班模块.............. 就绪",
    "",
    "按规程操作。确认了就不会再跳了。",
    "",
    "_"
  ];
  var el = document.getElementById("boot-log");
  var i = 0;
  el.textContent = "";
  var t = setInterval(function () {
    if (i >= lines.length) {
      clearInterval(t);
      setTimeout(function () { state.screen = "login"; showScreen(); }, 500);
      return;
    }
    el.textContent += lines[i] + "\n";
    i++;
  }, 180);
}

showScreen();
boot();
requestAnimationFrame(loop);

(function assertUnique() {
  function chk(arr, label) {
    var seen = {};
    arr.forEach(function (x) {
      if (seen[x.id]) throw new Error(label + " duplicate id: " + x.id);
      seen[x.id] = 1;
    });
  }
  chk(MAILS, "MAILS");
  chk(PERSONS, "PERSONS");
  chk(EVENT_TIMELINE, "EVENT_TIMELINE");
  chk(RECEIPTS, "RECEIPTS");
  chk(VILLAGES, "VILLAGES");
})();
