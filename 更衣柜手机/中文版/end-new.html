<body>
  <div class="wrap">
    <h1>他把八月那张收进档案袋</h1>
    <p id="p1"></p>
    <p>匡说这张头发短，看着像今年的人，检查组爱这一口。他没问照相馆抽屉里还躺着哪一袋。米棠如果知道墙上挂的是后来补的脸，会骂你把附加的送出了门。</p>
    <p>机子你还给他看了一眼电量，他挥手让你去搬货。田穗的名字还在本上。脸先换了。人还在不在，变成墙上那张能不能对上工牌。</p>
    <p>档案袋是牛皮的，口上有一截胶带。他用记号笔在袋角写了「穗　新」。巷口那袋旧底他还不知道。你去搬货的时候听见他跟冻品那边喊，墙上的脸明天换。容婶要是早上对墙，会对上一截短刘海。</p>
    <p><a href="introduction.html">纸条还在原处</a></p>
  </div>
  <script src="js/phone.js"></script>
  <script>
    document.getElementById("p1").textContent = gys.seen("seen0812")
      ? "你交出去的是图库里拍摄停在八月十二的那张。系统备注是空的。"
      : "你凭印象把较新的那张指给他。详情页你甚至没点开。";
  </script>
