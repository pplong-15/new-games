<body>
  <div class="wrap">
    <h1>他把三月那张夹进档案</h1>
    <p id="p1"></p>
    <p>匡皱了一下，说复印件本来就糊，你还给他一张三年前的底。你说办证用的是这张，后来坐灯的那张没带出来。他骂了一句家里规矩，还是收下了。至少墙上暂时不会挂八月的脸。</p>
    <p>排班那一格他改成待定。检查组若只认新拍，这口信会给他添麻烦。田穗如果还回来，会先看见自己入职那年的领子。</p>
    <p>档案袋口他没封死。说先应付过检，糊就糊。绿领那张起球的地方他没盯。你把机子扣回隔板的时候，充电接头又松了一次。冻品柜那边灯还亮着。饺子筐下午已经补过。</p>
    <p><a href="introduction.html">纸条还在原处</a></p>
  </div>
  <script src="js/phone.js"></script>
  <script>
    document.getElementById("p1").textContent = gys.seen("seen0314")
      ? "你交的是拍摄停在二十三年三月十四、备注写着入职健康证的那张。"
      : "你按短信里的日子指认了旧底，图库详情你没对过像素。";
  </script>
