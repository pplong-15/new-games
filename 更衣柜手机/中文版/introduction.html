  <title>后仓隔板上的纸条</title>
  <link rel="stylesheet" href="css/intro-manual.css">
</head>
<body>
  <header class="intro-hero">
    <div class="image-area">
      <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="后仓灯管">
        <rect fill="#2a2a22" width="1200" height="220"/>
        <rect fill="#3d3d30" y="160" width="1200" height="60"/>
        <rect fill="#c8c47a" x="80" y="16" width="1040" height="10"/>
        <rect fill="#1e2418" x="90" y="70" width="220" height="90"/>
        <rect fill="#243020" x="340" y="70" width="220" height="90"/>
        <rect fill="#1a2014" x="590" y="70" width="220" height="90"/>
      </svg>
    </div>
    <h1>惠邻值班留下的字</h1>
  </header>
  <main>
    <section class="slip">
      <p>沈梭：</p>
      <p>你今晚来接夜班，先去更衣柜。三号隔板上有部旧安卓，充电线缠着田穗工牌。她白班连着没影，排班空一格。我不要你满城打电话，也不许拿这部机子去连店外面的网。你就翻她机子里还留着的东西。天亮以前到后仓门口，给我一句人还在不在。</p>
      <p>锁屏她去年填应急写过，是工号三七一六。柜钥匙我收了。看完放回原处。货还是你补，别拿这个当借口少拆两件牛奶。</p>
      <p>食品检查要来。墙上那张脸对不上工牌，我先问你，不问派出所。夜班津贴还是那一档。货自己补。抽屉面包硬了也将就。机子看完放回三号，别揣进自己口袋。</p>
      <p class="sign">匡守业<br>八月二十一日晚</p>
      <p class="boot-actions">
        <a class="enter-link" href="lock.html">拿起这部机子</a>
        <a class="ghost" href="backroom.html">先到后仓门口说话</a>
      </p>
    </section>
  </main>
</body>
</html>
