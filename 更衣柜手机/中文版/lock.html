<!DOCTYPE html>
<html lang="zh-CN" class="os-kk lock">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>锁屏</title>
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>
  <div class="bench">
    <div class="handset">
      <div class="ear"></div>
      <div class="glass">
        <div class="sb"><span>中国移动</span><b>03:12</b><span>18%</span></div>
        <div class="app">
          <div class="clock">3:12</div>
          <div class="date">8月21日 周五</div>
          <div class="who">穗　三号柜</div>
          <div class="miss">未接 3　信息 6　计时已停在柜上　工牌线还绕着　电量百分之十八</div>
          <div class="pinrow" id="dots"></div>
          <div class="err" id="err"></div>
          <div class="pad" id="pad"></div>
        </div>
        <div class="sk"><a href="introduction.html">条</a><span></span><span></span></div>
      </div>
      <div class="caps"><span>○</span><span>□</span><span>△</span></div>
    </div>
  </div>
  <script src="js/phone.js"></script>
  <script>
    var pin = "", err = document.getElementById("err"), dots = document.getElementById("dots");
    function draw() { dots.textContent = pin.replace(/./g, "•"); }
    var pad = document.getElementById("pad");
    [1,2,3,4,5,6,7,8,9,"清",0,"开"].forEach(function (n) {
      var b = document.createElement("button");
      b.textContent = n;
      if (n === "开") b.className = "ok";
      b.onclick = function () {
        if (n === "清") { pin = ""; err.textContent = ""; draw(); return; }
        if (n === "开") {
          if (pin === "3716") { location.href = "home.html"; return; }
          err.textContent = "密码错误，再试";
          pin = "";
          draw();
          return;
        }
        if (pin.length < 6) pin += String(n);
        err.textContent = "";
        draw();
      };
      pad.appendChild(b);
    });
  </script>
</body>
</html>
