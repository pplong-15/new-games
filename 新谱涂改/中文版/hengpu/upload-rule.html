    <div class="notice">
      <h2>后进覆盖</h2>
      <p>行以最后进库附件为准。先入的电子页若与后入图冲突，图层盖上，旁注跟附件走。值班不打电话问哪房先结账。照例。</p>
      <p>附件号格式：社号、补字、年号、序号。写成 HP-补- 再加两位年再加两位序。西房端口叫正件，东房端口也收。正件晚到，盖不住已经挂上的补件，除非再送一份更新的正件。今晚没有第二份正件。</p>
      <p>责编只核文件能否打开。印泥新旧不是退件理由。退件只有三种：空文件、缺页、把产业项混进世系栏。印色发蓝，照收。</p>
      <p>本条贴在上传窗左侧。委托人要改行，走挂条。挂条改不了附件号本身。号还在库里，当驳回件也留着。</p>
    </div>
