      <h2>不是整卷脏</h2>
      <p>西房卷二库内目录。一至十三行：怀柏、邻支、女丁另页见标，字还在。第十四行：伯岑。此行被图层盖住。第十五行延木仍占格。第十六行秋仍占格。旁支怀石一房未动。</p>
      <p>卷首无「废」印。整卷作废会在卷首盖。卷首是空的。只有一个格黑。邻行字号、行距、标点与初稿一致。有人说扫描脏会连脏三行。本卷没有连脏。</p>
      <p>目录不恢复图层下的名。要看被盖住以前写过什么，去馆里翻戊寅抄件。本页只证明：脏落在第十四行，不是整卷二房都抹了。</p>
