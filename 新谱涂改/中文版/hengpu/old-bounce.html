      <h2>去年北房</h2>
      <p>旧退单样例。不是今晚这张。去年冬至，北房有人把「请按在谱丁口改岁修」写进建议。系统整单作废。责编批注四个字：产业另簿。原电子页照传。北房那行后来怎么进祠，本台没有续记。</p>
      <p>样例四栏当时勾的是：脏因空着；世系勾了外迁；主件勾了底册；末栏写了丁口。前面有一对上的，末栏一碰，全作废。工号还是 GT-夜。换了一年，规则没换。</p>
      <p>此单留底给后班看。别把样例当成今晚回单。今晚你还没交。交了才有工号页。样例只教一件事：粮的字不要写进世系口。</p>
      <p>合同第一页就写过范围。有人说夜班临时加严。账上不是。去年退，今年还退。</p>
