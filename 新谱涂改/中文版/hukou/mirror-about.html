<body>
  <div class="red">
    <h1>镜像停更</h1>
    <p>二零一一年八月十九日　搬迁后不再追新</p>
  </div>
  <div class="links">
    <a href="index.html">回检索</a>
    <a href="tongbu.html">集体户</a>
    <a href="factory.html">厂函</a>
    <a href="../hengpu/desk.html">回委托台</a>
  </div>
  <div class="wrap">
    <table cellspacing="0" cellpadding="0">
      <tr>
        <td class="box" colspan="2" style="width:100%">
          <h3>只能对旧簿</h3>
          <p style="padding:8px 12px;text-indent:2em">户政旧站那年搬迁，此镜不再追新。纸本仍在库房，镜上只留迁出簿若干叶。活人是否还喘气，镜不能证明。镜只能对旧簿栏目：何时走，填了什么事由，回迁栏空着没有。</p>
          <p style="padding:8px 12px;text-indent:2em">停更之后若有回迁、死亡、分户，都不会写到这面镜子上。有人拿镜像跟今晚电子谱对，对的是旧事由，不是今年谁还活着。把镜像当成活人证明，窗口当年就不认，现在更不认。</p>
          <p style="padding:8px 12px;text-indent:2em">集体户更名对照、道路更名，链早死了。能点开的只有开簿、丁卯那一叶、厂函、集体户残页。不要国徽。不要拿此镜去真窗口复印。复印去了也是过期纸。</p>
        </td>
      </tr>
    </table>
    <p class="ft">停更　不是活人档　10/12</p>
  </div>
