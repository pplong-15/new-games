          <h3>本卷只收走了的户主</h3>
          <p style="padding:8px 12px;text-indent:2em">迁出簿以户主常用名为键。键不是族里人人的名字，也不是谱上的字。芮怀川在册，户还在湾口，未入此簿。簿只收走了的人。走了的那一户，户主栏写怀山，不写怀川，也不写秋。</p>
          <p style="padding:8px 12px;text-indent:2em">有人爱用伯岑来查。字不是户政键。键是户口本上的名。铜埠厂那边若还有集体户残页，键仍是怀山。秋若来查自己，分立页不在迁出簿，须另卷，本镜未收。</p>
          <p style="padding:8px 12px;text-indent:2em">空页至此。沿革摘要、道路更名，链是死的，点了也还停在检索。换户主常用名再开。命中过的人，只有那一叶丁卯迁出。</p>
        </td>
      </tr>
    </table>
    <p class="ft">无此户主　试怀山　8/12</p>
