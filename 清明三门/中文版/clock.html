  <meta charset="utf-8">

  <title>交班钟</title>
  <link rel="stylesheet" href="css/service-cyan-desk.css">
  <link rel="stylesheet" href="css/game-extra.css">
</head>
<body>

<div id="wrap">
  <header><strong>交班钟</strong><div><a class="ghost-btn" href="desk.html">回柜</a></div></header>
  <div class="notice">
    <h2>五点以前把备注写完最好</h2>
    <p id="mini" class="sm-mini"></p>
    <img src="img/wall-clock.jpg" alt="钟" class="doc-img">
    <p>条皖不看你熬了几班。他看白板上有没有能写进备注的句子。钟到了可以交班。纸页收回去，采信还在。</p>
    <p>仇麦秋昨晚就是开满三户走的。他没写完，把难题留给你。</p>
    <p>钟本身不锁系统。别靠它倒计时吓人。</p>
    <p><a href="desk.html">回柜</a>　<a href="note.html">去写备注</a></p>
  </div>
</div>

<section class="pad"><p>钟是墙上那只，指针不准，条皖也不修。五点是口头的。系统不倒计时，不锁死。杭疏可以交班再来，也可以先交一份会被退的备注。仇麦秋就是看钟烦了，开满就走，便条写一半。钟的用处只是提醒：纸页不会在桌上过夜，句子可以。</p></section>
<script src="js/sanmen.js"></script>
<script>
Sanmen.paintMini(document.getElementById('mini'));
</script>
