  <h1>寒食那套字，和墙上那套</h1>
  <p class="meta"><span class="acct">东岗园地方号</span>去年寒食后</p>
  <p id="mini" class="sm-mini"></p>
  
<div id="shut" class="closed-box"><p>对照稿随寒食户收回。</p><p><a href="desk.html">回柜</a></p></div>
<div id="live" style="display:none">
  <p>旧俗寒食禁火。今园贴应急管理禁烧。两套字叠在清明前两日。纪南楼开单只写现场有灰，不抄开元诏。</p>
  <img src="img/old-ticket.jpg" alt="旧纸" class="doc-img">
  <p>有人把禁烧写成有鬼怕火。编辑部不收。历史层只用来对照，不用来结案。</p>
  <p>十二区去年那张单还在档里。码头像集体号，他没写是谁的手。</p>
  <p class="tail">对照稿　不执法<br><a href="han-fa.html">旧单</a>　<a href="han-zhi.html">县志摘</a></p>
  </div>

</article>

<section class="pad"><p>地方号这篇发出去没几天，有人在下面骂编辑不信邪。编辑回：旧俗归旧俗，单子归单子。纪南楼不愿上镜头，稿里只留他那句现场有灰。集体号三个字出现时加了「像」，没有写成确认。对照稿不执法，也不得拿去吓家属。</p></section>
