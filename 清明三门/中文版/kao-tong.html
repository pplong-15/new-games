<section class="pad"><p>催信开头「各位」是群发。中间「请勿自行改去别处」是对着顾晚禾那种人写的，名字没点。车辆只跑南阶一趟，是工会车队自己定的，不是园里限的。预约台勿办改号，这句话他抄给杭疏，也抄给白天窗口。人数请看空表，他懒得在信里再列。</p></section>
