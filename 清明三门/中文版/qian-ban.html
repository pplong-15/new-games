  <title>仇麦秋便条</title>

<body>

<div id="wrap">
  <header><strong>上个班</strong><div><a class="ghost-btn" href="desk.html">回柜</a></div></header>
  <div class="notice">
    <h2>给杭疏</h2>
    <p id="mini" class="sm-mini"></p>
    <p>我开满三户就走了。白板上只留下我点过采信的。没点的，纸天亮被条园长收走。</p>
    <p>别把见过当成能写进备注的句子。我吃过这亏。申柏那张投诉我看了，灰是真的，我没敢写鬼，也没写完。</p>
    <p>柜里核销那一沓，要对照别的页才读得懂。你自己看着办。</p>
    <p>仇麦秋　字难看莫怪</p>
  </div>
</div>

<section class="pad"><p>仇麦秋字往下掉，最后一行又补回来。他不是怕杭疏抢功，是怕条皖追问昨晚为什么没交备注。便条里那句「见过不算数」是他用自己的班换来的。核销那沓他翻过封面，没对照批次，不敢点采信。难题留下，他去睡了。</p></section>
<script src="js/sanmen.js"></script>
<script>
Sanmen.paintMini(document.getElementById('mini'));
</script>
