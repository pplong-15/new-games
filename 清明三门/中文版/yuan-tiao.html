<body>

<div id="wrap">
  <header><strong>条皖手条</strong><div><a class="ghost-btn" href="desk.html">回柜</a></div></header>
  <div class="notice">
    <h2>本班三户。多开的，系统不给。</h2>
    <p id="mini" class="sm-mini"></p>
    <p>杭疏：清明窗口别让夜班改号。柜门你爱开哪三户开哪三户。开过的，交班收回。采信过的，留板上。</p>
    <p>备注里出现改预约、把十二区当南阶放行，按越权锁。别来办公室解释动机。</p>
    <p>这张条不占名额。钉在桌上。</p>
    <p>条皖　四月四日酉时</p>
  </div>
</div>

<section class="pad"><p>条皖写字像钉钉子。他不当场解释限开是为了防谁。办公室白天有人排队改日子，夜班若也改，早上对不上账。杭疏嫌烦，也只能按三户来。条上没有穴号，没有码，只有权和时间。这张不占名额，是怕你开门以前先忘了规矩。</p></section>
