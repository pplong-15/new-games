<body>

<table class="site" cellspacing="0" cellpadding="0">
  <tr><td colspan="2" class="banner">预约码底页</td></tr>
  <tr><td colspan="2" class="nav"><a href="desk.html">回柜</a>|<a href="javascript:void(0)">作废</a></td></tr>
  <tr>
    <td class="left"><h4>码</h4><p>烈集前缀</p><p>南阶</p></td>
    <td class="main"><p id="mini" class="sm-mini"></p>
<div id="shut" class="closed-box"><p>码页在集体户里，名额没轮到。</p><p><a href="desk.html">回柜</a></p></div>
<div id="live" style="display:none">
<p class="scroll">烈集-〇四〇五-二粮　有效日清明当天。</p>
<p>发给涟县第二粮库工会。经办缪石桥。用途：烈士园南阶集体祭扫签到。一码多人，不对应个人穴。</p>
<p>持码进南阶闸机。持码不自动获得十二区配送。</p>
<p>有人把这串抄走当送货口令，底页管不着。底页只管发给谁。</p>
<p><button type="button" class="sm-btn" id="vbtn">采信：码走烈士园集体</button></p>
<p id="vok" class="sm-ok" style="display:none">白板有码的去向了。</p>
<p id="vbad" class="sm-warn" style="display:none"></p>
<p><a href="lie-pi.html">批次</a>　<a href="door-lie.html">回门</a></p>
</div>
</td>
  </tr>
  <tr><td colspan="2" class="ft">码库旧表　宋体十二像素</td></tr>
</table>

<section class="pad"><p>底页用针式打印机打的，〇四〇五是清明当天。二粮是工会简称，不是穴号。一码多人，闸机只认前缀烈集。十二区配送口令从来不是这串。有人抄走，底页多一行「底页不管」。采信码的去向，只到南阶集体为止。</p></section>
<script src="js/sanmen.js"></script>
<script>
Sanmen.paintMini(document.getElementById('mini'));
Sanmen.gate('lie','shut','live');
Sanmen.bindVerify(document.getElementById('vbtn'),'code-martyr',document.getElementById('vok'),document.getElementById('vbad'));

</script>
