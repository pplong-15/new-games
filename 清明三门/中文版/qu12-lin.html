  <h1>十二区三七、三八邻界</h1>
  <div class="meta"><span>绘图：园工</span><span>四月三日补描</span></div>
  <img src="img/stone-path.jpg" alt="石径" class="doc-img">
  <p>两穴中间一条浅沟。纸灰若被风推，会停在沟里。申柏指的灰线，正压在沟上，偏顾穴一侧更多。</p>
  <p>图上不写传说。沟不是门，也不是谁的手。配送员若把供品箱沿沟放下，灰会先沾这边。</p>
  <p>此图只说明邻界位置，不能说明是谁点的火。</p>

</div>

  <p>园工铅笔描　不进备注栏</p>
</article>

<section class="pad"><p>园工用铅笔补描浅沟，橡皮屑还在边。两穴的碑座他不写名字，只写三七、三八。风推纸灰会停沟里，这句话他写得很慢，怕写成有人故意推。配送员沿沟放箱，是他后来补的细字。图说进不了备注栏，只帮杭疏看邻界在哪。</p></section>
