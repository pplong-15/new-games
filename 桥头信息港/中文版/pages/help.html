    <h1>桥头信息港　客服留言</h1>

  <main>
    <section>
      <p>人工已停。下面是以前存的自动回复，按次数往下翻。</p>
    </section>
    <section>
      <h2>第1次</h2>
      <p>先把首页当一份还没关的分类站来读。灰掉的栏目不是装饰。</p>
    </section>
    <section>
      <h2>第2次</h2>
      <p>顶栏一次只收一个词。有的词会甩出两份记录，两份都要看。</p>
    </section>
    <section>
      <h2>第3次</h2>
      <p>同名的人不是同一个人。进空间别拿名片上的电话试。</p>
    </section>
    <section>
      <h2>第4次</h2>
      <p>可以搜「顺路」。后面的词仍然要你自己从打开的页里捡。</p>
    </section>
    <p><a class="enter-link" href="../index.html">回信息港</a></p>
