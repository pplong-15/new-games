        <h2>邻家那截矮墙</h2>
        <p>妈说要跳一下。墙是邻家菜园的，砖松。我跨过去，膝盖蹭破。庵里管事在远处看了一眼，没给纸。我当这就是办完了。</p>
        <p class="saveline">旧页里的跳墙场面没有文书号。<button type="button" class="gm-save" data-save="kou-wushu">收下无文书</button></p>
        <p>后来庵停了，我更把那一眼当成结束。今夜若有人拿这段打「早解除」，栏上对不上。场面不是栏。</p>
        <p>砖松那天邻家骂过，骂的是菜。菜不是疏。他把菜园墙记成办完，柜不认菜园。</p>
      <p>膝盖蹭破他写过两次，第二次删了，还剩一截。一截仍无号。</p><p>管事看了一眼，他写成办完。一眼没有编号。编号在柜里的朱笔旁边，朱笔写的是未解除。</p></article>
