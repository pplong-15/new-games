      <h1>寄名疏　抄件</h1>
      <div class="meta"><span>抄号：瓦疏一七</span><span>原件不在柜</span></div>
      <p>乳名禾禾。寄名法名净禾。认师栏写青瓦庵管事，姓名处墨淡，只剩半个庵字。解除栏空白，后补朱笔：未解除。</p>
      <p class="saveline">青瓦庵寄名疏抄件仍写屈氏禾禾法名净禾状态未解除。<button type="button" class="gm-save" data-save="shu-weijiechu">收进对质用</button></p>
      <p>抄件能证明柜里这一栏。不能证明庵里当年是否看人跳过矮墙。跳过矮墙若无解除栏，仍按未解除登记。</p>
      <p><span class="stamp">抄件</span></p>
      <p>朱笔是缪守匣入柜时补的。他补的是状态，不是故事。故事在旧页里，旧页没有这支朱笔。</p>
<p><a href="keeper.html">他怎么补的</a>　<a href="../chuang/confront.html">拿去点早解除</a></p><p>半个庵字有人当成涂改。涂改要有勘误。没有勘误，半个字只是墨淡。</p><p>认师栏墨淡，有人要你猜住持名字。猜不是今晚的差事。差事是解除栏有没有字。</p></article>
