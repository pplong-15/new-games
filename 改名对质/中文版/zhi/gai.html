<body data-page="zhi-gai">

  <div class="red">
    <h1>变更回执边界</h1>
    <p>只管户口用名</p>
  </div>
  <div class="links"><a href="hun.html">三栏在隔壁</a> <a href="index.html">张贴目录</a></div>
  <div class="wrap">
    
    <div class="box">
      <h3>回执管到哪</h3>
      <p>姓名变更书面回执只证明派出所受理并完成户口用名变更。不管寄名疏，不管民间谱，不管领证窗口会不会另要材料。</p>
      <p>今晚若把回执写成「可配发结婚材料」，等于夜窗替领证窗口做了名齐判断。夜窗没有这支笔。</p>
      <p>邻县回执号不能填进本县这张。号段不同，人不同。</p>
      <p>白班有人把回执复印件塑封，当护身符带着去谱局。谱局不认塑封。塑封只证明他去过派出所。</p>
    </div>

    <p class="ft">边界页　号段不混</p>
  </div>

<p>号段说明写在页脚小字：临户改字不是埠户改字。小字不显眼，显眼的是同名三个字。</p><p>塑封回执带去谱局的事发生过。谱局把塑封退回来，退回单写：不收派出所复印件当更名。</p>
<script src="../js/state.js"></script>
