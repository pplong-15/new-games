  <div class="red">
    <h1>班长手写条扫描</h1>
    <p>字丑　三行够用</p>
  </div>
  <div class="links"><a href="hun.html">三栏正文</a> <a href="../chuang/ticket.html">一八六号</a></div>
  <div class="wrap">
    
    <div class="box">
      <h3>压在玻璃下的</h3>
      <div class="pic"><img alt="" src="../img/bian-tiao.jpg"></div>
      <p>蓝槐字丑。纸条上三行：婚材要名齐。名齐是户口、谱、寄名解除。夜窗只建议，别许原件。</p>
      <p>上个月退过两件，都是户口新名和谱旧名打起来。她怕再退到自己班，才写这么短。</p>
      <p>条子能当尺子，不能当他已经齐的证明。对质时若他引用班长，拿三栏去指，不要拿脾气去指。</p>
      <p>她走时还说：人八点再来，让夜核。许了原件她会骂。骂比退件难听，退件比假齐好改。</p>
    </div>

    <p class="ft">扫描件　不是已经齐</p>
  </div>

<p>她画的圈用油性笔，玻璃上留下一圈影。影不是第三栏已经齐。</p><p>别许原件四个字戳在最后。许是口头答应。口头答应跟按口头发回执是同一类错。</p>
