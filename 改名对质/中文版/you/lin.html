      <h3>再补一句</h3>
      <p class="meta">发件人：席芦　临浦窗口</p>
      <p>不要并案。不要把我们的回执号填进你们的草稿。同名不是同一户。</p>
      <p class="saveline">临浦那户屈晚禾是另一人不能并案。<button type="button" class="gm-save" data-save="lin-buning">收下别并</button></p>
      <p>这封只能证明邻县有过一次同名变更。不能证明埠南这个屈晚禾已经跳墙，也不能证明他谱已改。</p>
      <p>对质时若他抓邻县当稻草，指这一句。没有收下就去指，机子会回你还没收下。</p>

<p>别并两个字她加了下划线。下划线在镜像里变成一条黑。黑不是已并。</p><p>对质里那句邻县回执能用，要先把这句收下。没收下就点，他还能顶。</p>
