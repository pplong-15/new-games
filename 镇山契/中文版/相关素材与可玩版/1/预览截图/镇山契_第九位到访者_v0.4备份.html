.forum-topic-row {
  min-height: 62px;
  padding: 8px 12px;
  color: #263b54;
  background: #f3f4f7;
  border-bottom: 1px solid #c0c7d1;
  text-decoration: none;
}

.forum-topic-row:nth-child(odd) {
  background: #e8ebf0;
}

.forum-topic-row span,
.forum-topic-row small {
  display: block;
  min-width: 0;
}

.forum-topic-row small {
  color: #657184;
}

.forum-post {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr);
  margin: 14px;
  background: #f5f6f8;
  border: 1px solid #8794a7;
}

.forum-post > aside {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 18px;
  color: #526177;
  background: #dde2e9;
  border-right: 1px solid #aab3c0;
  font-size: 0.82rem;
}

.forum-post > div {
  min-width: 0;
  padding: 18px 22px;
}

.forum-post header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px dashed #a4adba;
}

.forum-post header h2 {
  font-size: 1.35rem;
}

/* Archive: sparse institutional directory. */
.site-archive {
  background: #f6f6f2;
  border-top: 8px solid #284f55;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}

.site-archive .fictional-site-header {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 22px;
  align-items: end;
  border-bottom: 1px solid #899997;
}

.site-archive .fictional-site-header p:first-child {
  grid-row: 1 / span 2;
  align-self: center;
  max-width: 8em;
  color: #49605f;
  font-size: 0.78rem;
}

.site-archive .site-search {
  background: #e3e9e7;
}

.filter-details {
  padding: 0 14px 12px;
  border: 1px solid #9eaaa7;
  background: #edf1ef;
}

.directory-table {
  margin: 18px clamp(16px, 3vw, 32px) 32px;
  border-top: 2px solid #526d6c;
}

.directory-head,
.directory-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 130px 190px;
  gap: 14px;
  align-items: center;
  min-height: 56px;
  padding: 8px 12px;
  border-bottom: 1px solid #bcc4c1;
}

.directory-head {
  min-height: 44px;
  color: #fff;
  background: #405f60;
  font-size: 0.8rem;
}

.directory-row {
  color: #263f40;
  text-decoration: none;
}

.directory-row small {
  display: block;
  color: var(--muted);
}

.institution-breadcrumb,
.catalog-record {
  margin: 0 clamp(18px, 5vw, 70px);
}

.institution-breadcrumb {
  padding: 8px 0;
  border-bottom: 1px solid #aeb8b4;
}

.catalog-record {
  padding: 30px 0 48px;
}

.catalog-record > section {
  padding: 18px 22px;
  background: #ecefea;
  border-left: 4px solid #607b77;
}

.print-note {
  color: var(--muted);
  font-size: 0.84rem;
}

/* Folk archive: old paper, black ink, marginal note and blank handover line. */
.site-folk {
  color: #28251e;
  background:
    radial-gradient(circle at 16% 12%, rgba(71, 61, 42, 0.07), transparent 22%),
    repeating-linear-gradient(0deg, rgba(47, 41, 31, 0.022) 0 1px, transparent 1px 5px),
    #e8dfc8;
  border: 1px solid #766d5a;
  font-family: "Songti SC", STSong, SimSun, serif;
}

.site-folk .fictional-site-header {
  text-align: center;
  border: 6px double #39362e;
  border-width: 0 0 6px;
}

.site-folk .fictional-site-header h1 {
  font-size: 2.2rem;
  letter-spacing: 0.18em;
}

.site-folk .site-search {
  margin: 12px clamp(16px, 6vw, 80px);
  border: 1px solid #887f6c;
}

.folk-side-note {
  float: right;
  width: min(290px, 36%);
  padding: 18px;
  border: 1px solid #746d5d;
  border-width: 1px 0 1px 1px;
}

.folk-index {
  padding: 12px clamp(26px, 8vw, 100px) 42px;
  list-style: cjk-ideographic;
}

.folk-index li {
  padding: 13px 8px;
  border-bottom: 1px solid rgba(64, 58, 47, 0.35);
}

.folk-index a {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  color: #28251e;
  text-decoration: none;
}

.folk-index p {
  grid-column: 2;
  margin-bottom: 0;
  color: #5d5749;
}

.folk-nav,
.paper-article {
  margin: 0 clamp(18px, 8vw, 110px);
}

.folk-nav {
  min-height: 44px;
  padding: 8px 0;
  border-bottom: 1px solid #887f6c;
}

.paper-article {
  position: relative;
  padding: 40px 0 58px;
}

.paper-article::after {
  content: "交接栏：________________　日期：________";
  display: block;
  margin-top: 36px;
  padding-top: 12px;
  border-top: 4px double #4b463b;
  color: #615a4c;
  font-size: 0.82rem;
}

.paper-article h2 {
  max-width: 22em;
  font-size: clamp(1.7rem, 4vw, 2.7rem);
}

.paper-deck {
  max-width: 48em;
  color: #595344;
}

.ink-rule {
  width: 100%;
  height: 5px;
  margin: 22px 0;
  border-top: 1px solid #39362e;
  border-bottom: 2px solid #39362e;
}

.paper-article > p:not(.paper-date):not(.paper-deck) {
  max-width: 42em;
  font-size: 1.04rem;
  line-height: 1.95;
}

.paper-article footer {
  margin-top: 30px;
  padding: 10px 0;
  border-top: 1px solid #736c5d;
}

/* Newspaper: scanned sheet first, OCR below/on the side. */
.site-news {
  color: #252525;
  background: #e6e5e0;
  border-top: 10px solid #292929;
  font-family: Georgia, "Songti SC", STSong, SimSun, serif;
}

.site-news .fictional-site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px 28px;
  border-bottom: 3px double #2f2f2f;
}

.site-news .fictional-site-header h1 {
  order: -1;
  width: 100%;
  font-size: 2.55rem;
  letter-spacing: 0.08em;
}

.site-news .site-search {
  background: #d2d2ce;
  border-bottom: 1px solid #858585;
}

.news-date-strip {
  padding: 10px 14px;
  background: #f0eee7;
  border: 1px solid #92918b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.86rem;
}

.news-index {
  columns: 2 300px;
  column-gap: 0;
  margin: 18px;
  border-top: 4px double #3b3b3b;
}

.news-index article {
  break-inside: avoid;
  padding: 16px;
  border-right: 1px solid #999;
  border-bottom: 1px solid #999;
}

.news-index h2 {
  font-size: 1.25rem;
}

.news-index h2 a {
  color: #222;
}

.news-breadcrumb {
  padding: 8px clamp(18px, 5vw, 54px);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  border-bottom: 1px solid #8c8c88;
}

.scan-record {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.7fr);
  gap: 22px;
  padding: clamp(18px, 4vw, 46px);
  align-items: start;
}

.scan-sheet {
  padding: clamp(22px, 5vw, 54px);
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.025) 0 1px, transparent 1px 4px),
    #d9d6cc;
  border: 1px solid #6d6b65;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
  transform: rotate(-0.15deg);
}

.scan-sheet h2 {
  padding: 14px 0;
  border: 4px double #252525;
  border-width: 4px 0;
  font-size: clamp(1.7rem, 4vw, 2.8rem);
}

.scan-lines {
  columns: 2 220px;
  column-gap: 28px;
  column-rule: 1px solid #77756e;
  text-align: justify;
}

.ocr-panel {
  padding: 22px;
  background: #f5f5f1;
  border: 1px solid #999;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
}

/* Geology: query-first technical dataset. */
.site-geology {
  color: #1f3431;
  background: #eef2ed;
  border-color: #54716a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.site-geology .fictional-site-header {
  color: #ecf3ef;
  background:
    linear-gradient(120deg, transparent 60%, rgba(255, 255, 255, 0.06) 60%),
    #31534f;
  border-bottom: 8px solid #91a79e;
}

.site-geology .fictional-site-header h1 {
  font-size: 2rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.site-geology .site-search {
  background: #d8e2dc;
  border-bottom: 1px solid #839b93;
}

.geo-dataset-list {
  margin: 18px clamp(16px, 3vw, 32px) 34px;
  border-top: 2px solid #456a62;
}

.geo-dataset-list > a {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) 130px;
  gap: 14px;
  min-height: 66px;
  padding: 10px 12px;
  color: #274b45;
  border-bottom: 1px solid #adbbb5;
  text-decoration: none;
}

.geo-dataset-list small {
  display: block;
  color: #687b75;
}

.geo-breadcrumb,
.technical-report {
  margin-right: clamp(18px, 5vw, 66px);
  margin-left: clamp(18px, 5vw, 66px);
}

.geo-breadcrumb {
  border-bottom: 1px solid #9caeaa;
}

.technical-report {
  padding: 30px 0 46px;
}

.technical-report > header {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  column-gap: 22px;
  align-items: baseline;
}

.technical-report > header code {
  grid-row: 1 / span 2;
  padding: 8px;
  color: #e9f0ec;
  background: #31534f;
}

.technical-body {
  padding: 18px 22px;
  background:
    linear-gradient(90deg, transparent 39px, rgba(64, 94, 87, 0.15) 40px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(64, 94, 87, 0.09) 32px),
    #f7f8f4;
  border: 1px solid #9aaca6;
}

.technical-report footer {
  margin-top: 18px;
  color: #61736e;
}

/* Ending and dialogs */
.ending-page {
  max-width: 900px;
}

.ending-page::before {
  content: "本轮回执";
  display: inline-block;
  margin-bottom: 18px;
  padding: 5px 12px;
  color: #fff;
  background: #30464b;
  letter-spacing: 0.12em;
}

.endpoint-ledger {
  margin: 24px 0;
}

.unresolved-list {
  margin: 22px 0;
  padding: 0 16px 16px;
  border: 1px solid #9fa49f;
}

.error-code {
  font: 700 0.82rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(19, 25, 25, 0.72);
}

.reset-dialog {
  width: min(520px, 100%);
  padding: 24px;
  background: #f5f1e7;
  border: 1px solid #313e3f;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
}

.boot-state {
  display: grid;
  place-items: center;
  min-height: 70vh;
}

@media (max-width: 700px) {
  .app-shell > main,
  .app-shell > .storage-notice + main,
  .fictional-site,
  .landing-page {
    width: calc(100% - 16px) !important;
    margin-top: 12px !important;
  }

  .session-bar {
    gap: 3px;
    min-height: 48px;
    padding: 0 4px;
  }

  .session-bar > * {
    min-height: 44px;
    margin: 1px 0;
  }

  .session-brand {
    flex-basis: 48px;
    max-width: 48px;
    overflow: hidden;
    padding: 0 4px;
    font-size: 0.76rem;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .session-id {
    flex-basis: 65px;
    max-width: 65px;
    overflow: hidden;
    font-size: 0.66rem;
    line-height: 1.2;
    white-space: normal;
  }

  .session-location {
    font-size: 0.68rem;
  }

  .workbench-return,
  .session-bar button,
  .session-bar .excerpt-status {
    max-width: 92px;
    overflow: hidden;
    padding: 0 5px;
    font-size: 0.68rem;
    line-height: 1.2;
    text-overflow: ellipsis;
  }

  .session-record-actions {
    max-width: 104px;
  }

  .opening-file::before {
    position: static;
    display: inline-block;
    margin-bottom: 18px;
  }

  .creator-contract > div,
  .endpoint-ledger > div,
  .record-metadata > div,
  .current-assignment,
  .receipt-ready,
  .workbench-columns,
  .artifact-cue,
  .controlled-document,
  .site-search,
  .scan-record,
  .technical-report > header {
    grid-template-columns: 1fr;
  }

  .receipt-ready .primary-action {
    grid-column: auto;
    grid-row: auto;
  }

  .workbench-columns aside {
    padding-top: 24px;
    padding-left: 0;
    border-top: 1px solid #a6ada8;
    border-left: 0;
  }

  .human-receipts li,
  .opened-sources li,
  .ordinary-jobs li,
  .related-records li,
  .source-links li {
    grid-template-columns: 1fr;
    gap: 2px;
  }

  .panel-nav {
    grid-template-columns: 1fr;
  }

  .order-grid label {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .controlled-source-nav {
    align-items: flex-start;
    flex-direction: column;
    gap: 2px;
  }

  .document-stamp {
    padding-right: 0;
    padding-bottom: 14px;
    border-right: 0;
    border-bottom: 1px solid #b8bdb7;
  }

  .forum-board-head {
    display: none;
  }

  .forum-topic-row {
    grid-template-columns: 1fr;
    gap: 3px;
  }

  .forum-topic-row > span:nth-child(2),
  .forum-topic-row > span:nth-child(3) {
    display: inline-flex;
    gap: 8px;
    color: #657184;
  }

  .forum-post {
    grid-template-columns: 1fr;
  }

  .forum-post > aside {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    padding: 10px 14px;
    border-right: 0;
    border-bottom: 1px solid #aab3c0;
  }

  .forum-post header {
    display: block;
  }

  .site-archive .fictional-site-header,
  .directory-head,
  .directory-row {
    grid-template-columns: 1fr;
  }

  .site-archive .fictional-site-header p:first-child {
    grid-row: auto;
  }

  .directory-head {
    display: none;
  }

  .directory-row span[role="cell"][data-label]::before {
    content: attr(data-label) "：";
    font-weight: 700;
  }

  .folk-side-note {
    float: none;
    width: auto;
    border-width: 1px;
  }

  .folk-index {
    padding-right: 28px;
    padding-left: 42px;
  }

  .folk-index a {
    grid-template-columns: 1fr;
  }

  .folk-index p {
    grid-column: 1;
  }

  .site-news .fictional-site-header {
    display: block;
  }

  .news-index,
  .scan-lines {
    columns: 1;
  }

  .scan-record {
    display: flex;
    flex-direction: column;
  }

  .scan-sheet {
    order: 1;
    width: 100%;
    transform: none;
  }

  .ocr-panel {
    order: 2;
    width: 100%;
  }

  .geo-dataset-list > a {
    grid-template-columns: 1fr;
    gap: 3px;
  }

  .technical-report > header code {
    grid-row: auto;
    width: fit-content;
  }

  .reaction-actions,
  .result-actions,
  .form-actions,
  .ending-actions,
  .dialog-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .reaction-actions > *,
  .result-actions > *,
  .form-actions > *,
  .ending-actions > *,
  .dialog-actions > * {
    justify-content: center;
    width: 100%;
  }
}

@media (max-width: 390px) {
  :root {
    font-size: 15px;
  }

  .session-brand {
    display: none;
  }

  .session-id {
    flex-basis: 60px;
    max-width: 60px;
  }

  .session-location {
    min-width: 44px;
  }

  .workbench-return {
    max-width: 78px;
  }

  .session-bar button,
  .session-bar .excerpt-status {
    max-width: 88px;
  }

  .session-record-actions {
    max-width: 92px;
  }

  .opening-file,
  .workbench-page,
  .workbench-result,
  .related-chain,
  .ending-page,
  .not-found {
    padding: 18px;
  }

  .tool-heading,
  .artifact-cue,
  .source-links,
  .operation-sheet,
  .hint-drawer,
  .next-question,
  .locked-message {
    margin-right: 12px;
    margin-left: 12px;
  }

  .operation-sheet {
    padding: 14px;
  }

  .choice-option {
    padding: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
  }
}

@media print {
  .session-bar,
  .skip-link,
  button,
  .site-search,
  .reset-trigger {
    display: none !important;
  }

  body {
    background: #fff;
  }

  .app-shell > main {
    width: 100% !important;
    margin: 0 !important;
    box-shadow: none;
  }
}

/* v0.3 — evidence-first, site-specific information architecture */
html,
body,
.app-shell,
.fictional-site,
.institution-page {
  max-width: 100%;
  overflow-x: clip;
}

.app-shell *,
.fictional-site *,
.institution-page * {
  min-width: 0;
}

button,
input,
select,
textarea,
summary,
main a {
  min-height: 44px;
}

button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.choice-option:has(input:focus-visible) {
  outline: 3px solid #0b7480;
  outline-offset: 3px;
}

/* Opening: reality boundary and in-world handover are deliberately separate. */
.handover-page {
  padding: clamp(18px, 4vw, 56px);
}

.handover-sheet {
  width: min(1120px, 100%);
  margin-inline: auto;
}

.opening-boundary-layer,
.handover-inworld-layer {
  border: 1px solid #9d9585;
}

.opening-boundary-layer {
  margin-top: 24px;
  color: #302d27;
  background: #f4efe4;
}

.boundary-layer-heading,
.handover-inworld-layer > header {
  display: grid;
  grid-template-columns: 150px 1fr;
  align-items: baseline;
  gap: 18px;
  padding: 16px 20px;
  border-bottom: 1px solid #a59e90;
}

.boundary-layer-heading > span,
.handover-inworld-layer > header > span {
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.boundary-layer-heading h2,
.handover-inworld-layer > header h2 {
  margin: 0;
}

.boundary-layer-body {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
  gap: 0;
}

.boundary-layer-body > * {
  padding: 22px;
}

.boundary-layer-body > aside {
  border-left: 1px solid #b8b0a1;
  background: #e8e1d3;
}

.handover-inworld-layer {
  margin-top: 22px;
  color: #edf0ea;
  background: #23343b;
  border-color: #17262c;
}

.handover-inworld-layer > header {
  grid-template-columns: 150px minmax(0, 1fr) minmax(220px, 0.55fr);
  border-color: #617178;
}

.handover-inworld-layer > header p {
  margin: 0;
  color: #c7d1cf;
}

.handover-inworld-layer .handover-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 0.9fr);
  gap: 0;
}

.handover-inworld-layer .creator-contract,
.handover-three-steps {
  margin: 0;
  padding: 22px;
}

.handover-inworld-layer .creator-contract {
  border-right: 1px solid #617178;
}

.handover-inworld-layer .creator-contract > div {
  color: #edf3f1;
  background: #1d3036;
  border-color: #50656a;
}

.handover-inworld-layer .creator-contract dt {
  color: #a9c2bd;
}

.handover-inworld-layer .creator-contract dd {
  color: #f5f7f4;
}

.handover-three-steps {
  list-style: none;
}

.handover-three-steps li {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(226, 235, 232, 0.2);
}

.handover-three-steps li > span {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  color: #213239;
  background: #d7e5e1;
  border-radius: 50%;
  font-weight: 800;
}

.handover-three-steps p {
  margin: 2px 0 0;
  color: #c7d1cf;
  font-size: 0.9rem;
}

/* Internal system: business step tree + case area, never a three-card mystery layout. */
.workbench-business-shell,
.workbench-operation-shell {
  display: grid;
  width: min(1440px, 100%);
  margin-inline: auto;
  grid-template-columns: 270px minmax(0, 1fr);
  background: #edf0ee;
  border-right: 1px solid #9ca9a7;
  border-bottom: 1px solid #9ca9a7;
  border-left: 1px solid #9ca9a7;
}

.workbench-process-tree,
.tool-task-rail {
  padding: 20px 16px;
  color: #dfe8e5;
  background: #22343a;
  border-right: 1px solid #0f2228;
}

.workbench-process-tree > h2,
.tool-task-rail > h2 {
  color: #fff;
  font-size: 1rem;
  letter-spacing: 0.08em;
}

.workbench-process-tree > ol,
.panel-procedure {
  margin: 0 0 22px;
  padding: 0;
  list-style: none;
}

.workbench-process-tree > ol > li {
  position: relative;
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 10px;
  padding: 10px 0;
}

.workbench-process-tree > ol > li:not(:last-child)::after {
  position: absolute;
  top: 42px;
  bottom: -6px;
  left: 17px;
  width: 1px;
  background: #728187;
  content: "";
}

.workbench-process-tree > ol > li > span,
.panel-procedure span {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid #819095;
  border-radius: 50%;
  font-size: 0.76rem;
}

.workbench-process-tree li.is-complete > span {
  color: #193137;
  background: #b8d4cc;
}

.workbench-process-tree li.is-current > span,
.panel-procedure li.is-current span {
  color: #1e3136;
  background: #f3d78b;
  border-color: #f3d78b;
}

.workbench-process-tree small {
  display: block;
  color: #aebfbc;
}

.workbench-task-rail {
  padding-top: 16px;
  border-top: 1px solid #64757a;
}

.workbench-task-rail h3 {
  color: #e8efed;
  font-size: 0.88rem;
}

.workbench-task-rail .workbench-job-row {
  color: #17292f;
  background: #dbe6e3;
  border-color: #94a7a2;
}

.workbench-case-area,
.tool-case-area {
  min-width: 0;
  background: #edf0ee;
}

.case-area-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 24px;
  background: #fff;
  border-bottom: 1px solid #b9c2bf;
}

.case-area-heading h2,
.case-area-heading dl,
.case-area-heading dd {
  margin: 0;
}

.case-area-heading > div > span,
.operation-sheet-heading span,
.source-links-heading > span,
.form-actions > div > span {
  color: #506864;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.case-area-heading dl {
  display: flex;
  gap: 22px;
  font-size: 0.82rem;
}

.case-area-heading dl > div {
  display: grid;
  grid-template-columns: auto auto;
  gap: 8px;
}

.workbench-primary-pane {
  padding: 24px;
}

.workbench-support-register {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 0.8fr);
  gap: 1px;
  margin: 0 24px 24px;
  background: #bcc6c3;
  border: 1px solid #bcc6c3;
}

.workbench-support-register > section {
  padding: 18px;
  background: #fff;
}

.workbench-bottom-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px 24px;
  color: #e7eeec;
  background: #2b4148;
}

.workbench-bottom-actions a {
  padding: 8px 14px;
  color: #172a30;
  background: #d8e6e2;
  text-decoration: none;
}

.workbench-operation-shell {
  align-items: stretch;
}

.workbench-operation-shell > .tool-task-rail {
  color: #dfe8e5;
  background: #22343a;
  border-color: #0f2228;
}

.panel-procedure li {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  color: #cbd7d4;
}

.tool-task-rail .panel-nav {
  margin-bottom: 18px;
}

.tool-task-rail .panel-nav > * {
  color: #e9f0ee;
  border-color: #5f7277;
  background: rgba(255, 255, 255, 0.04);
}

.tool-task-rail .artifact-cue {
  color: #d3dfdc;
  border-top: 1px solid #64757a;
}

.workbench-operation-shell > .tool-task-rail .artifact-cue > div {
  color: #dbe6e3;
  background: rgba(255, 255, 255, 0.06);
  border-color: #5f7478;
}

.workbench-operation-shell > .tool-task-rail .artifact-cue h3 {
  color: #f4f7f6;
}

.workbench-operation-shell > .tool-task-rail .artifact-cue p,
.workbench-operation-shell > .tool-task-rail .panel-procedure li {
  color: #dbe6e3;
}

.tool-case-area {
  padding: 22px;
}

.source-links {
  margin: 0 0 18px;
  padding: 0;
  background: #f8fbfa;
  border: 1px solid #76928c;
  box-shadow: none;
}

.source-links-heading {
  display: grid;
  grid-template-columns: 84px minmax(140px, 0.45fr) minmax(260px, 1fr);
  align-items: baseline;
  gap: 14px;
  padding: 14px 16px;
  color: #e8efed;
  background: #315049;
}

.source-links-heading > span {
  color: #f4d98e;
}

.source-links-heading h3,
.source-links-heading p {
  margin: 0;
  color: inherit;
}

.source-links-heading h3 {
  font-size: 1.1rem;
}

.source-links-heading p {
  font-size: 0.86rem;
}

.source-links ul {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding: 0;
}

.source-links li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 6px 12px;
  background: #fff;
  border: 0;
  border-right: 1px solid #ccd5d2;
  border-bottom: 1px solid #ccd5d2;
}

.source-links li a {
  display: grid;
  align-content: center;
  padding: 4px 0;
  font-weight: 700;
}

.source-links li a small {
  color: #62726e;
  font-size: 0.72rem;
  font-weight: 400;
}

.source-links li > b {
  color: #305d54;
  font-size: 0.72rem;
  white-space: nowrap;
}

.operation-sheet {
  padding: 0;
  background: #fff;
  border: 1px solid #b8c3c0;
  box-shadow: none;
}

.operation-sheet-heading {
  display: grid;
  grid-template-columns: minmax(240px, 0.65fr) minmax(280px, 1fr);
  gap: 24px;
  padding: 18px 20px;
  background: #f4f6f5;
  border-bottom: 1px solid #c5cecb;
}

.operation-sheet-heading h2,
.operation-sheet-heading p {
  margin: 0;
}

.operation-sheet form,
.operation-sheet > .saved-panel,
.operation-sheet > .form-error {
  margin: 18px 20px;
}

.operation-sheet .question-block {
  margin: 0;
  padding: 16px 0;
  border: 0;
  border-bottom: 1px solid #d5ddda;
  border-radius: 0;
  background: transparent;
}

.operation-sheet .choice-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.operation-sheet .choice-option {
  min-height: 48px;
  margin: 0;
  border: 1px solid #bdc9c5;
  background: #f9fbfa;
}

.form-actions {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin: 24px -20px -18px;
  padding: 16px 20px;
  background: #e5ebe9;
  border-top: 1px solid #bac7c3;
}

.form-actions > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.form-actions .primary-action,
.form-actions .primary-link {
  color: #fff;
  background: #1f5c53;
  border-color: #17483f;
  text-decoration: none;
}

.secondary-action,
.secondary-link,
.previous-panel-link {
  color: #263e3a;
  background: transparent;
}

.tool-support-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 0.6fr);
  gap: 16px;
  margin-top: 16px;
}

.tool-support-row > * {
  margin: 0;
}

/* Image evidence contract. */
.evidence-visual {
  width: 100%;
  margin: 0 0 16px;
  background: #d5d2ca;
  border: 1px solid #8e918b;
}

.evidence-visual img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 74vh;
  object-fit: contain;
  background: #b9b8b2;
}

.evidence-visual figcaption {
  display: grid;
  gap: 3px;
  padding: 10px 12px;
  color: #343a37;
  background: #eeece5;
  border-top: 1px solid #969a94;
  font-size: 0.78rem;
}

.evidence-alt-equivalent {
  color: #5e6662;
}

.evidence-placeholder-sheet {
  display: grid;
  min-height: 260px;
  place-content: center;
  padding: 24px;
  color: #555b57;
  background: repeating-linear-gradient(-45deg, #e6e5df 0 14px, #deddd7 14px 28px);
  text-align: center;
}

.evidence-placeholder-sheet > span {
  font-weight: 800;
  letter-spacing: 0.14em;
}

.evidence-text-equivalent {
  margin: 14px 0;
  border: 1px solid #b9bfbb;
  background: #f5f5f1;
}

.evidence-text-equivalent > summary {
  display: flex;
  align-items: center;
  padding: 9px 12px;
  font-weight: 700;
  cursor: pointer;
}

.evidence-text-body {
  padding: 14px;
  border-top: 1px solid #c8cdca;
}

/* Forum: 2000s operations frame on index, DOS floor anatomy on threads. */
.forum-page {
  color: #071744;
  background: #d6dce8;
  font-family: Arial, SimSun, sans-serif;
}

.forum-page .forum-frame {
  width: min(1120px, calc(100% - 18px));
  margin-inline: auto;
  background: #edf0f6;
  border: 1px solid #526a99;
  border-radius: 0;
}

.forum-operations-shell {
  display: grid;
  grid-template-columns: 212px minmax(0, 1fr);
  gap: 6px;
  padding: 6px;
}

.forum-ops-sidebar {
  display: grid;
  align-content: start;
  gap: 6px;
}

.forum-login-box,
.forum-section-tree,
.forum-era-warning {
  padding: 8px;
  background: #eef2fa;
  border: 1px solid #8799bd;
}

.forum-login-box h2,
.forum-section-tree h2 {
  margin: -8px -8px 8px;
  padding: 5px 8px;
  color: #fff;
  background: #3f568a;
  font-size: 0.82rem;
}

.forum-login-box label,
.forum-section-tree > * {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  min-height: 34px;
  font-size: 0.78rem;
}

.forum-login-box input {
  width: 100%;
  min-height: 44px;
}

.forum-login-box button {
  width: 100%;
  margin-top: 6px;
}

.forum-board-main {
  min-width: 0;
  background: #fff;
  border: 1px solid #8799bd;
}

.forum-board-main .forum-search-row {
  margin: 0;
  border: 0;
  border-bottom: 1px solid #8799bd;
}

.forum-board-stats {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 8px;
  font-size: 0.76rem;
  background: #e7ebf4;
  border-bottom: 1px solid #a6b1c8;
}

.forum-board-stats dl {
  display: flex;
  gap: 14px;
  margin: 0;
}

.forum-board-stats dl > div {
  display: flex;
  gap: 4px;
}

.forum-page .forum-topic-row {
  border-radius: 0;
}

/* Archive: tree and long field results. */
.archive-directory-tree > * {
  font-family: SimSun, serif;
}

.archive-result-toolbar,
.geo-result-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding: 8px 12px;
  background: #e4e8e2;
  border: 1px solid #a8b1a6;
  font-size: 0.78rem;
}

.archive-page .directory-row > span:last-child {
  display: grid;
  align-content: center;
  gap: 3px;
}

.archive-page .directory-row code {
  color: #354d42;
  font-weight: 700;
}

.archive-tree-stats {
  margin: 16px 0;
  padding: 10px;
  background: #eef0e9;
  border: 1px solid #c1c5bb;
}

.site-register {
  margin-top: 16px;
  font-size: 0.76rem;
}

.site-register > div {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px dotted currentColor;
}

.site-register dt,
.site-register dd {
  margin: 0;
}

/* Folk: narrow 2004 three-column frame and dense text index. */
.folk-site-frame {
  font-family: SimSun, "Songti SC", serif;
}

.folk-site-frame .folk-layout {
  display: grid;
  grid-template-columns: 156px minmax(420px, 1fr) 178px;
  width: min(980px, calc(100% - 14px));
  margin-inline: auto;
  gap: 8px;
  align-items: start;
}

.folk-service-rail {
  padding: 8px;
  color: #1d315d;
  background: #eff2df;
  border: 1px solid #929d77;
  font-size: 0.76rem;
}

.folk-service-rail > section {
  display: grid;
  margin-bottom: 12px;
}

.folk-service-rail .folk-side-note {
  float: none;
  width: auto;
  margin: 0 0 12px;
}

.folk-service-rail > *,
.folk-service-rail .site-register {
  clear: both;
  width: 100%;
  writing-mode: horizontal-tb;
}

.folk-service-rail h2 {
  margin: -4px -4px 5px;
  padding: 4px;
  color: #fff;
  background: #516536;
  font-size: 0.86rem;
}

.folk-service-rail a,
.folk-service-rail span {
  min-height: 30px;
  padding: 4px 1px;
  border-bottom: 1px dotted #919a7d;
}

.folk-site-frame .folk-index {
  font-size: 0.84rem;
}

.folk-site-frame .folk-index li {
  border-bottom-style: dotted;
}

/* Newspaper: date/edition browser, image first and OCR second. */
.news-calendar,
.news-edition-picker {
  margin-top: 14px;
  border: 1px solid #a8a094;
  background: #f8f4e9;
}

.news-calendar header {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  text-align: center;
  border-bottom: 1px solid #aaa396;
}

.news-calendar header button {
  border: 0;
  border-radius: 0;
}

.news-calendar > div {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 6px;
  text-align: center;
  font-size: 0.75rem;
}

.news-calendar > div > * {
  display: grid;
  min-height: 30px;
  place-items: center;
  font-style: normal;
}

.news-calendar > div > b {
  color: #fff;
  background: #8b2d2d;
}

.news-edition-picker {
  display: grid;
}

.news-edition-picker > * {
  min-height: 36px;
  margin: 0;
  padding: 7px 9px;
  border-bottom: 1px solid #c9c1b5;
}

.news-edition-picker > b {
  color: #fff;
  background: #792b2b;
}

.news-date-strip {
  display: grid;
  grid-template-columns: auto minmax(200px, 1fr);
  gap: 4px 16px;
}

.news-date-strip p {
  grid-column: 1 / -1;
  margin: 0;
}

.news-record-layout .scan-record {
  align-items: start;
}

.news-film-strip .evidence-visual,
.news-issue-scan .evidence-visual {
  background: #181818;
  border-color: #1b1b1b;
}

.news-issue-scan .evidence-visual img {
  max-height: none;
}

.news-page .ocr-panel {
  min-width: 0;
}

/* Geology: catalog facets, report attachments and restrained map tools. */
.geo-facet-strip {
  margin: 12px 0;
  border: 1px solid #9ea99f;
  background: #f4f7f4;
}

.geo-facet-strip > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 10px;
  border-bottom: 1px solid #ccd3cd;
}

.geo-facet-strip strong {
  width: 92px;
}

.geo-facet-strip span {
  padding: 4px 10px;
  color: #355647;
  background: #e5ece7;
  border: 1px solid #b2c0b6;
}

.geo-map-tools,
.geo-record-tools {
  margin-top: 18px;
  padding: 10px;
  background: #e5ebe6;
  border: 1px solid #aeb9b0;
}

.geo-map-tools > div,
.geo-record-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.geo-map-tools h3,
.geo-record-tools h3,
.geo-map-tools p,
.geo-record-tools p {
  flex-basis: 100%;
}

.geo-report-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.55fr);
  gap: 14px;
  margin: 18px 0;
}

.geo-attachment-register {
  padding: 14px;
  background: #edf2ee;
  border: 1px solid #abb8ad;
}

.geo-attachment-register dl > div {
  padding: 8px 0;
  border-bottom: 1px solid #c6d0c8;
}

.geo-attachment-register dt,
.geo-attachment-register dd {
  margin: 0;
}

.controlled-source-main .evidence-visual {
  max-width: 1040px;
}

@media (max-width: 900px) {
  .boundary-layer-body,
  .handover-inworld-layer > header,
  .handover-inworld-layer .handover-grid,
  .workbench-business-shell,
  .workbench-operation-shell,
  .workbench-support-register,
  .forum-operations-shell,
  .folk-site-frame .folk-layout,
  .geo-report-workspace {
    grid-template-columns: 1fr;
  }

  .boundary-layer-body > aside,
  .handover-inworld-layer .creator-contract,
  .workbench-process-tree,
  .tool-task-rail {
    border: 0;
    border-top: 1px solid #617178;
  }

  .workbench-process-tree > ol {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .workbench-process-tree > ol > li {
    grid-template-columns: 34px 1fr;
  }

  .workbench-process-tree > ol > li::after {
    display: none;
  }

  .forum-ops-sidebar {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .folk-service-rail {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
}

@media (max-width: 620px) {
  .boundary-layer-heading,
  .handover-inworld-layer > header,
  .operation-sheet-heading,
  .source-links-heading {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .case-area-heading,
  .workbench-bottom-actions,
  .form-actions,
  .news-date-strip {
    align-items: stretch;
    flex-direction: column;
    grid-template-columns: 1fr;
  }

  .case-area-heading,
  .workbench-bottom-actions,
  .form-actions {
    display: flex;
  }

  .source-links ul,
  .operation-sheet .choice-list,
  .tool-support-row {
    grid-template-columns: 1fr;
  }

  .workbench-process-tree > ol,
  .forum-ops-sidebar,
  .folk-service-rail {
    grid-template-columns: 1fr;
  }

  .workbench-process-tree > ol > li {
    padding: 4px 0;
  }

  .case-area-heading dl {
    display: grid;
    gap: 4px;
  }
}

@media (max-width: 390px) {
  .handover-page,
  .tool-case-area,
  .workbench-primary-pane {
    padding: 12px;
  }

  .institution-topbar-inner,
  .external-session-inner {
    padding-inline: 8px;
  }

  .workbench-toolbar {
    padding-inline: 8px;
  }

  .tool-task-rail {
    padding: 10px 12px;
  }

  .tool-task-rail > h2,
  .tool-task-rail .artifact-cue {
    display: none;
  }

  .tool-task-rail .panel-nav {
    margin-bottom: 8px;
  }

  .panel-procedure {
    display: flex;
    gap: 6px;
    margin: 0;
  }

  .panel-procedure li {
    grid-template-columns: 24px 1fr;
    min-height: 44px;
    font-size: 0.72rem;
  }

  .panel-procedure span {
    width: 24px;
    height: 24px;
  }

  .source-links {
    margin-bottom: 10px;
  }

  .source-links-heading,
  .source-links li {
    padding-inline: 10px;
  }

  .source-links li {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .operation-sheet form,
  .operation-sheet > .saved-panel,
  .operation-sheet > .form-error {
    margin-inline: 12px;
  }

  .form-actions {
    margin-inline: -12px;
    padding-inline: 12px;
  }

  .form-actions > div,
  .form-actions button,
  .form-actions a {
    width: 100%;
  }

  .evidence-visual img {
    max-height: 64vh;
  }

  .forum-page .forum-frame,
  .folk-site-frame .folk-layout {
    width: 100%;
  }

  .forum-board-stats,
  .forum-board-stats dl {
    align-items: flex-start;
    flex-direction: column;
  }

  .forum-page .forum-board-head {
    display: none;
  }

  .forum-page .forum-topic-row {
    grid-template-columns: 1fr;
  }

  .archive-result-toolbar,
  .geo-result-toolbar,
  .geo-facet-strip > div {
    align-items: flex-start;
    flex-direction: column;
  }

  .geo-facet-strip strong {
    width: auto;
  }

  .news-calendar > div {
    padding: 3px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  }

/* ========================================================================== */
/* v0.2 — native-site archaeology redesign                                    */
/* Six unrelated web products; one quiet session layer.                       */
/* ========================================================================== */

:root {
  --ui-blue-950: #162c3a;
  --ui-blue-800: #234d67;
  --ui-blue-650: #3d708b;
  --ui-blue-100: #e7eef2;
  --ui-gray-025: #fbfbfa;
  --ui-gray-050: #f4f5f4;
  --ui-gray-100: #e8ebeb;
  --ui-gray-200: #d4d9da;
  --ui-gray-300: #b8c0c2;
  --ui-gray-600: #586367;
  --ui-gray-900: #1f292d;
  --ui-focus: #b45309;
}

html {
  background: #cfd3d4;
}

body {
  background: #dfe2e2;
  background-image: none;
}

.app-shell {
  min-height: 100vh;
}

/* The session belongs to the browser, not to any fictional public site. */
.external-session-strip {
  position: sticky;
  top: 0;
  z-index: 80;
  min-height: 34px;
  color: #353a3c;
  background: #e9e9e6;
  border-bottom: 1px solid #aaa9a4;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
  font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.external-session-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: min(1240px, 100%);
  min-height: 34px;
  margin: 0 auto;
  padding: 0 12px;
}

.external-session-context,
.external-session-actions,
.session-record-actions {
  display: flex;
  align-items: center;
  min-width: 0;
}

.external-session-context {
  gap: 10px;
  overflow: hidden;
}

.external-session-id {
  flex: 0 0 auto;
  padding-right: 10px;
  color: #666a6a;
  border-right: 1px solid #bdbdb8;
  white-space: nowrap;
}

.external-session-source {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.external-session-actions {
  flex: 0 0 auto;
  gap: 8px;
}

.external-session-strip a,
.external-session-strip button,
.external-session-strip .excerpt-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 28px;
  padding: 3px 9px;
  color: #283f4a;
  background: #f6f6f3;
  border: 1px solid #a9adae;
  border-radius: 1px;
  text-decoration: none;
  white-space: nowrap;
}

.external-session-strip button {
  font-size: 12px;
}

.institution-topbar {
  color: #fff;
  background: var(--ui-blue-950);
  border-bottom: 4px solid #4a7e97;
}

.institution-topbar-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  width: min(1280px, calc(100% - 32px));
  min-height: 54px;
  margin: 0 auto;
}

.institution-wordmark {
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-decoration: none;
}

.institution-system-name {
  color: #c8d6dd;

.institution-topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;

.institution-topbar-actions a {

.institution-topbar .session-record-actions {

.institution-topbar .session-record-actions button,

  display: inline-flex;

.workbench-app-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  padding: 22px 26px 18px;
  background: #f5f7f7;
  border-bottom: 1px solid #b9c4c8;
}

.workbench-app-header h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 650;
  letter-spacing: 0;
}

.workbench-app-header .workbench-header-fields {
  width: min(520px, 52%);
  margin: 0;
}

.workbench-toolbar {
  display: flex;
  align-items: center;
  gap: 22px;
  min-height: 44px;
  padding: 0 18px;
  color: #eaf0f3;
  background: #2b566d;
  font-size: 12px;
}

.workbench-toolbar .reset-trigger {
  min-height: 32px;
  margin: 0 0 0 auto;
  padding: 5px 10px;
  color: #fff;
  background: #365f74;
  border-color: #7895a3;
}

.workbench-shell,
.workbench-tool-shell {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr) 285px;
  min-height: 620px;
}

.workbench-task-rail,
.tool-task-rail {
  padding: 18px 14px 36px;
  background: #e9edef;
  border-right: 1px solid #bdc7cb;
}

.workbench-context-rail,
.tool-context-rail {
  padding: 18px 16px 36px;
  background: #f5f6f5;
  border-left: 1px solid #c7ced1;
}

.workbench-primary-pane,
.tool-primary-pane {
  min-width: 0;
  padding: 22px 26px 40px;
}

.workbench-job-row {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 70px;
  gap: 7px;
  align-items: center;
  min-height: 48px;
  padding: 7px 8px;
  color: #314a56;
  border-bottom: 1px solid #c3cccf;
  font-size: 11px;
  text-decoration: none;
}

.workbench-job-row .job-code {
  color: #536872;
  font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow-wrap: anywhere;
}

.workbench-job-row .job-title {
  font-size: 12px;
}

.workbench-job-row .job-status {
  color: #65747a;
  text-align: right;
}

.task-rail-current {
  margin-bottom: 15px;
  background: #d7e4e9;
  border: 1px solid #8da8b4;
  box-shadow: inset 4px 0 #2e657f;
}

.task-rail-paused {
  background: #ede7dc;
  border-color: #b4a58b;
  box-shadow: inset 4px 0 #8a7048;
}

.task-rail-related {
  margin-top: 18px;
}

.workbench-receipts {
  border-top: 1px solid #c1cacd;
  padding-top: 18px;
}

.workbench-task-rail h2,
.workbench-context-rail h2,
.tool-task-rail h2,
.tool-context-rail h2 {
  margin: 0 0 10px;
  color: #344a55;
  font-size: 13px;
  text-transform: none;
}

.workbench-task-rail ul,
.workbench-context-rail ul,
.tool-task-rail ul,
.tool-context-rail ul,
.ordinary-jobs,
.human-receipts,
.opened-sources,
.related-records {
  padding: 0;
  list-style: none;
}

.ordinary-jobs li,
.human-receipts li,
.opened-sources li,
.related-records li {
  display: grid;
  gap: 3px;
  padding: 9px 3px;
  border-bottom: 1px solid #cbd2d4;
}

.ordinary-jobs li {
  grid-template-columns: 58px minmax(0, 1fr);
  font-size: 12px;
}

.ordinary-jobs li span:last-child {
  grid-column: 2;
  color: #68757a;
}

.current-assignment,
.receipt-ready,
.project-reaction {
  margin: 0 0 20px;
  padding: 18px 20px;
  background: #f7f9f9;
  border: 1px solid #abbac0;
  border-left: 5px solid #376c84;
  border-radius: 0;
  box-shadow: none;
}

.current-assignment {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: center;
}

.workbench-assignment-panel {
  grid-template-columns: minmax(0, 1fr) auto;
}

.workbench-assignment-panel > p {
  grid-column: 1;
}

.workbench-assignment-panel > .primary-link {
  grid-column: 2;
  grid-row: 1 / span 2;
}

.project-reaction blockquote {
  margin: 14px 0;
  padding: 12px 16px;
  background: #fff;
  border-left: 3px solid #899ba3;
}

.assignment-label,
.reaction-label,
.eyebrow {
  margin-bottom: 5px;
  color: #55707d;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.08em;
}

/* Workbench forms become field sheets, not card stacks. */
.workbench-tool,
.workbench-result,
.related-chain,
.workbench-source,
.ending-page,
.not-found {
  padding: 24px 28px 42px;
}

.ending-page {
  max-width: none;
}

.ending-page::before {
  content: none;
}

.tool-heading.workbench-app-header,
.receipt-header.workbench-app-header,
.related-chain-header.workbench-app-header,
.endpoint-header.workbench-app-header,
.controlled-source-header.workbench-app-header {
  display: block;
  margin: 0;
  padding: 20px 26px 17px;
}

.tool-heading.workbench-app-header h1,
.receipt-header.workbench-app-header h1,
.related-chain-header.workbench-app-header h1,
.endpoint-header.workbench-app-header h1,
.controlled-source-header.workbench-app-header h1 {
  margin: 0 0 6px;
}

.workbench-toolbar a {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 6px 9px;
  color: #fff;
  text-decoration: underline;
}

.workbench-toolbar button {
  min-height: 44px;
}

.receipt-system-layout,
.related-chain-shell {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(260px, .65fr);
  gap: 0;
  min-height: 420px;
}

.receipt-primary-pane,
.related-chain-primary {
  min-width: 0;
  padding: 22px 26px 36px;
}

.receipt-context-rail,
.related-chain-context {
  padding: 20px 18px 34px;
  background: #f3f5f5;
  border-left: 1px solid #c4cccf;
}

.receipt-context-rail a {
  display: flex;
  min-height: 44px;
  padding: 9px 2px;
  border-bottom: 1px solid #ccd3d5;
}

.system-message {
  margin: 22px 26px 36px;
  padding: 18px 20px;
  background: #f5f7f7;
  border: 1px solid #b6c1c5;
}

.system-error-header {
  padding: 22px 26px;
  background: #edf1f2;
  border-bottom: 3px solid #315f74;
}

.workbench-tool:has(.workbench-tool-shell) {
  padding: 0;
}

.tool-heading,
.artifact-cue,
.source-links,
.operation-sheet,
.hint-drawer,
.next-question,
.locked-message,
.derived-receipt,
.prediction-receipt,
.chain-premise,
.next-source,
.chain-closure {
  margin: 0 0 18px;
  padding: 15px 17px;
  background: #fff;
  border: 1px solid #b7c1c5;
  border-radius: 0;
  box-shadow: none;
}

.tool-heading {
  padding: 0 0 16px;
  border: 0;
  border-bottom: 2px solid #355f73;
}

.tool-heading h1 {
  font-size: 25px;
  letter-spacing: 0;
}

.artifact-cue {
  background: #f4f6f6;
}

.source-links ul {
  display: grid;
  gap: 0;
  padding: 0;
  border-top: 1px solid #c5cccf;
  list-style: none;
}

.source-links li {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr);
  align-items: center;
  min-height: 45px;
  border-bottom: 1px solid #c5cccf;
}

.source-links li::before {
  content: "来源记录";
  color: #647178;
  font-size: 11px;
}

.operation-sheet {
  padding: 0;
  border-top: 3px solid #345f74;
}

.operation-sheet > h2,
.operation-sheet > p,
.operation-sheet > form {
  margin-right: 20px;
  margin-left: 20px;
}

.operation-sheet > h2 {
  margin-top: 20px;
}

.question-block {
  margin: 0;
  padding: 15px 0;
  border: 0;
  border-top: 1px solid #c8d0d3;
}

fieldset.question-block {
  min-width: 0;
}

.question-block > span,
.question-block legend {
  margin-bottom: 8px;
  color: #263c47;
  font-weight: 700;
}

.question-block select,
.question-block input[type="text"],
.question-block input[type="search"],
.question-block textarea,
.false-conclusion select,
.false-conclusion textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  background: #fff;
  border: 1px solid #89999f;
  border-radius: 0;
}

.choice-list {
  display: grid;
  gap: 0;
  border: 1px solid #bdc6c9;
  border-bottom: 0;
}

.choice-option {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  min-height: 44px;
  padding: 8px 11px;
  background: #fff;
  border: 0;
  border-bottom: 1px solid #bdc6c9;
  border-radius: 0;
}

.choice-option:hover {
  background: #eef3f4;
}

.choice-option input {
  width: 17px;
  height: 17px;
  margin: 0;
}

.order-grid {
  border-top: 1px solid #bdc6c9;
}

.order-grid label {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  min-height: 54px;
  padding: 5px 0;
  border-bottom: 1px solid #bdc6c9;
}

.form-actions,
.result-actions,
.reaction-actions,
.ending-actions,
.dialog-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding-top: 16px;
}

.form-error {
  margin: 14px 0;
  padding: 12px 14px;
  color: #6d251e;
  background: #fff1ef;
  border: 1px solid #b8766e;
  border-left: 5px solid #9c3f35;
  border-radius: 0;
}

.panel-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin: 0 0 18px;
  border: 1px solid #9fadb2;
}

.panel-nav > * {
  min-height: 38px;
  padding: 8px 12px;
  background: #edf1f2;
  border: 0;
  border-right: 1px solid #aeb9bd;
  text-decoration: none;
}

/* -------------------------------------------------------------------------- */
/* 2004 local BBS                                                              */
/* -------------------------------------------------------------------------- */

main.fictional-site.forum-page,
main.fictional-site.archive-page,
main.fictional-site.news-page,
main.fictional-site.geo-page {
  width: 100% !important;
  max-width: none;
  min-height: calc(100vh - 34px);
  margin: 0 !important;
  overflow: visible;
  border: 0;
  box-shadow: none;
}

main.fictional-site.site-folk.folk-site-frame {
  width: min(820px, calc(100% - 18px)) !important;
  margin: 12px auto 40px !important;
  overflow: visible;
  box-shadow: 3px 3px 0 rgba(62, 51, 33, 0.2);
}

.site-forum,
.forum-frame {
  color: #182b3c;
  font-family: Tahoma, Arial, SimSun, sans-serif;
}

.forum-frame {
  width: min(980px, calc(100% - 20px));
  min-height: 720px;
  margin: 8px auto 30px;
  background: #eef3f7;
  border: 1px solid #7790a6;
  box-shadow: none;
}

.forum-masthead {
  display: block;
  min-height: 142px;
  padding: 0;
  color: #fff;
  background: #416a91;
  background-image: linear-gradient(135deg, rgba(255,255,255,.08) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.04) 50%, rgba(255,255,255,.04) 75%, transparent 75%);
  background-size: 18px 18px;
  border-bottom: 4px solid #84a3be;
}

.forum-title-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  width: min(980px, calc(100% - 20px));
  min-height: 82px;
  margin: 0 auto;
  padding: 14px 14px 12px;
}

.forum-title-row h1,
.forum-title-row .forum-logo {
  margin: 0;
  color: #fff;
  font-family: SimSun, serif;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-decoration: none;
  text-shadow: 1px 1px 0 #254768;
}

.forum-title-row p {
  max-width: 34em;
  margin: 0;
  color: #dbe7ef;
  font-size: 12px;
  text-align: right;
}

.forum-logo {
  font-family: SimSun, serif;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-shadow: 1px 1px 0 #254768;
}

.forum-tagline,
.forum-mirror-note {
  color: #dbe7ef;
  font-size: 12px;
}

.forum-utility,
.forum-primary-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  min-height: 32px;
  padding: 0 12px;
  background: #d4e0ea;
  border-bottom: 1px solid #8fa5b7;
  font-size: 12px;
}

.forum-utility {
  justify-content: flex-end;
  width: min(980px, calc(100% - 20px));
  margin: 0 auto;
  color: #24405a;
}

.forum-utility a {
  color: #224b70;
}

.forum-primary-nav {
  min-height: 38px;
  padding: 0;
  color: #fff;
  background: #315a81;
}

.forum-primary-nav {
  justify-content: flex-start;
  width: min(980px, calc(100% - 20px));
  margin: 0 auto;
}

.forum-primary-nav a,
.forum-primary-nav span {
  min-height: 38px;
  padding: 10px 15px;
  color: #fff;
  border-right: 1px solid #6687a4;
  text-decoration: none;
}

.forum-board-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  margin: 10px;
  padding: 7px 9px;
  background: #dbe5ee;
  border: 1px solid #9aafc0;
  font-size: 12px;
}

.forum-board-toolbar form {
  display: flex;
  gap: 5px;
}

.forum-search-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  margin: 0 10px;
  padding: 8px;
  background: #dbe5ee;
  border: 1px solid #9aafc0;
  border-top: 0;
  font-size: 12px;
}

.forum-search-row label {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
}

.forum-search-row input {
  min-height: 34px;
  padding: 5px 7px;
  border: 1px solid #8198ab;
}

.forum-search-row button {
  min-height: 34px;
  color: #fff;
  background: #456d91;
  border-color: #2e5273;
}

.forum-result-line {
  margin: 7px 10px 0;
  color: #5f7080;
  font-size: 12px;
}

.forum-board-toolbar input {
  min-height: 34px;
  padding: 5px 7px;
  border: 1px solid #8198ab;
}

.forum-board-toolbar button {
  min-height: 34px;
  padding: 5px 11px;
  color: #fff;
  background: #456d91;
  border-color: #2e5273;
}

.forum-board-table,
.forum-board {
  margin: 10px;
  border: 1px solid #8298ac;
}

.forum-board-head,
.forum-topic-row {
  grid-template-columns: minmax(0, 1fr) 150px 68px;
}

.forum-board-head {
  min-height: 30px;
  padding: 5px 9px;
  background: #52789b;
}

.forum-topic-row {
  min-height: 54px;
  padding: 6px 9px;
  background: #f8fafc;
  border-color: #c0ccd6;
  font-size: 12px;
}

.forum-topic-row:nth-child(odd) {
  background: #edf2f6;
}

.forum-topic-row b {
  color: #214d75;
  font-size: 13px;
  font-weight: 500;
}

.forum-thread {
  margin: 10px;
  border: 1px solid #8298ac;
  border-bottom: 0;
}

.forum-floor {
  display: grid;
  grid-template-columns: 145px minmax(0, 1fr);
  min-height: 180px;
  background: #f9fbfc;
  border-bottom: 1px solid #8298ac;
}

.forum-author {
  padding: 14px 12px;
  background: #e0e8ef;
  border-right: 1px solid #9eb0bf;
  font-size: 12px;
}

.forum-author strong,
.forum-author span {
  display: block;
  margin-bottom: 7px;
}

.forum-post-body {
  min-width: 0;
  padding: 12px 18px 24px;
  font-size: 14px;
  line-height: 1.75;
}

.forum-post-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 7px;
  border-bottom: 1px dashed #aab8c3;
}

.forum-floor-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 5px 12px;
  align-items: start;
  padding-bottom: 8px;
  border-bottom: 1px dashed #aab8c3;
}

.forum-floor-header h1 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 0;
}

.forum-floor-header time {
  grid-column: 1 / -1;
  color: #788895;
  font-size: 11px;
}

.forum-avatar {
  display: grid !important;
  place-items: center;
  width: 48px;
  height: 48px;
  color: #526b7e;
  background: #f2f5f7;
  border: 1px solid #9badba;
  font: 700 21px/1 SimSun, serif;
}

.forum-edit-state,
.forum-signature {
  margin-top: 18px;
  padding-top: 8px;
  color: #788692;
  border-top: 1px dotted #b0bcc5;
  font-size: 11px;
}

.forum-post-tools {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 8px;
  color: #536f86;
  font-size: 11px;
}

.forum-thread-footer,
.forum-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
  padding: 8px 12px;
  color: #607487;
  background: #dbe5ed;
  border-top: 1px solid #91a6b8;
  font-size: 11px;
}

.forum-post-head h1,
.forum-post-head h2 {
  margin: 0;
  font-size: 18px;
}

.forum-floor-no {
  color: #738595;
  font-size: 11px;
  white-space: nowrap;
}

.site-forum .record-metadata {
  display: table;
  width: 100%;
  margin-top: 18px;
  border-collapse: collapse;
}

.site-forum .record-metadata > div {
  display: table-row;
}

.site-forum .record-metadata dt,
.site-forum .record-metadata dd {
  display: table-cell;
  padding: 5px 7px;
  border: 1px solid #b4c1cb;
}

/* -------------------------------------------------------------------------- */
/* Public archive catalogue                                                    */
/* -------------------------------------------------------------------------- */

.archive-page {
  min-height: 760px;
  color: #233936;
  background: #f4f6f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
}

.archive-masthead {
  background: #fff;
  border-bottom: 5px solid #27615c;
}

.archive-identity {
  display: flex;
  align-items: center;
  gap: 16px;
  width: min(1120px, calc(100% - 32px));
  min-height: 92px;
  margin: 0 auto;
}

.archive-identity > div {
  min-width: 0;
}

.archive-identity h1,
.archive-identity > div > a {
  display: block;
  margin: 0 0 4px;
  color: #235650;
  font-size: 27px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-decoration: none;
}

.archive-identity p {
  margin: 0;
  color: #657774;
  font-size: 13px;
}

.archive-era {
  margin-left: auto;
  color: #657774;
  font-size: 12px;
}

.archive-seal {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  color: #fff;
  background: #2a625d;
  border-radius: 50%;
  font: 700 19px/1 SimSun, serif;
}

.archive-title {
  font-size: 27px;
  font-weight: 650;
  letter-spacing: 0.06em;
}

.archive-identity small {
  display: block;
  color: #657774;
}

.archive-primary-nav {
  color: #fff;
  background: #285e59;
}

.archive-primary-nav > div {
  display: flex;
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

.archive-primary-nav {
  display: flex;
  padding-left: max(16px, calc((100% - 1120px) / 2));
}

.archive-primary-nav a,
.archive-primary-nav span {
  min-height: 44px;
  padding: 12px 18px;
  color: #fff;
  border-right: 1px solid #55817d;
  text-decoration: none;
}

.archive-shell,
.archive-record-shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 24px;
  width: min(1120px, calc(100% - 32px));
  margin: 22px auto 48px;
}

.archive-sidebar {
  align-self: start;
  background: #fff;
  border: 1px solid #bcc9c6;
}

.archive-sidebar h2,
.archive-sidebar h3 {
  margin: 0;
  padding: 10px 12px;
  color: #fff;
  background: #4f746f;
  font-size: 14px;
}

.archive-sidebar nav {
  display: grid;
}

.archive-sidebar nav > * {
  min-height: 40px;
  padding: 10px 12px;
  color: #3f5e59;
  border-bottom: 1px solid #d2d9d7;
  text-decoration: none;
}

.archive-facets {
  padding-bottom: 10px;
}

.archive-facets dl {
  margin: 0;
}

.archive-facets dl > div {

    attachment("SRC-PLAN-A", "候选方案A六项现实动作预览", "2026故事内方案卡", "独立编号、限定问题、人员动作、返还、取消与结论范围。", ["一、编号与目的：三件原物沿用各自编号、文书、包装与封识；只回答限定问题RQ-01，不合并权属。", "二、人员、时间、地点：各保管机构另行授权后，由原机构经办人与指定鉴定人员在县联合检验室独立分格台执行，限同一白班三小时；QC-447不在经办名单。", "三、物理动作：各件置于同一外层校准装具的独立分格，彼此不接触；只比较断边微形变与半印相对位置，不补字、不补纸、不重印。", "四、移出与返还：各原机构人员分别核封、启封、看护、复封，白班结束前按原链返还；发现物随后由指定库房验封入藏。", "五、取消与回退：任一机构批准、场地、状态、封识或运输条件不满足即取消；异常时原路复封返还，不改走另一方案。", "六、结论范围：只记录实际动作与RQ-01限定意见；不就1974操作、民俗效力、儿童死亡责任或额外因果出具意见。"], { 你的权限: "仅提交建议", 实际授权: "各原件保管机构", 原物经办: "指定经办人员" }),
    attachment("SRC-PLAN-B", "候选方案B六项现实动作预览", "2026故事内方案卡", "分件保护、数字参见、最终入藏、异常回退与未决边界。", ["一、编号与目的：三件原物保持各自编号和保管链；以最小移动完成保护与数字有界参见，RQ-01接受未决。", "二、人员、时间、地点：各现保管机构的受权文保人员在各自库房正常白班分别执行；没有共同地点或共同时间窗，QC-447不经办。", "三、物理动作：原物不进入共同装具；分别完成现状评估、适宜支撑与封装，保存认证影像、无损检测和统一校准的衍生数据。", "四、移出与入藏：不为比对跨库移出；各件由当前经办人核封，发现物由指定库房验封、核收并完成最终入藏。", "五、异常与回退：任一件状态异常即按自己的保管流程回退，不为缩小未决而增加原物风险。", "六、结论边界：分件保护完成不等于旧契无效、儿童已经获释或额外因果不存在；RQ-01继续保持未决。"], { 你的权限: "仅提交建议", 共同地点: "无", 原物接触: "无" }),

    logged.currentBeat = WORLD.beats[index + 1] ? WORLD.beats[index + 1].id : beat.id;
    return logged;
  }

  function publishNextReaction(state, options) {
    const opts = options || {};
    let next = normalizeState(state);
    if (next.unreadReaction) {
      return { ok: false, state: next, code: "UNREAD_REACTION", message: "上一条项目回执尚未读完。", reactionId: next.unreadReaction };
    }
    const reactionId = next.reactionReadyQueue[0];
    if (!reactionId) return { ok: true, state: next, published: false, message: "当前没有待发布的项目回执。" };

    next.reactionsPosted.push(reactionId);

    return { ok: true, state: next, published: true, reactionId, message: "项目内新回执已发布。" };
  }

  function submitPanel(state, beatId, panelIndex, answers, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const beat = getBeat(beatId);
    if (!beat) return { ok: false, state: next, code: "UNKNOWN_BEAT", message: "该复核步骤不存在。" };
    if (!next.sessionStarted) return { ok: false, state: next, code: "SESSION_REQUIRED", message: "请先建立本机复核会话。" };
    if (next.unreadReaction) return { ok: false, state: next, code: "REACTION_UNREAD", message: "请先回工作台读完项目新回执；公开网页仍可浏览。" };
    if (next.reactionReadyQueue.length) return { ok: false, state: next, code: "REACTION_RETURN_REQUIRED", message: "请先返回工作台取回项目新回执；公开网页仍可浏览。" };
    if (!canAccessBeat(next, beatId)) return { ok: false, state: next, code: "PREREQUISITE", message: "上一项派生产物尚未保存。公开材料仍可浏览。" };
    if (!beat.panels[panelIndex]) return { ok: false, state: next, code: "UNKNOWN_PANEL", message: "该复核面板不存在。" };
    const done = next.completedPanels[beatId] || [];
    if (done.includes(panelIndex)) return { ok: true, state: next, already: true, message: "该面板已经保存。" };
    if (panelIndex !== done.length) return { ok: false, state: next, code: "PANEL_ORDER", message: "请先保存当前面板；你可返回查看此前面板。" };

    const validation = validatePanel(beatId, panelIndex, answers);
    next = appendEvent(next, validation.ok ? "PANEL_VALID" : "PANEL_INVALID", {
      beatId,
      panelIndex,
      code: validation.code,
    }, opts.at);
    if (!validation.ok) {
      next.lastError = { beatId, panelIndex, code: validation.code, message: validation.message };
      return { ...validation, state: next };
    }

    next.lastError = null;
    next.completedPanels[beatId] = done.concat(panelIndex);
    const currentPanel = beat.panels[panelIndex];
    for (const output of currentPanel.outputs) {
      if (output !== "__ENDING__" && ALL_OUTPUT_IDS.has(output) && !next.derivedEvidence.includes(output)) next.derivedEvidence.push(output);
    }
    next = appendEvent(next, "PANEL_SAVED", { beatId, panelIndex, outputs: currentPanel.outputs.filter((id) => id !== "__ENDING__") }, opts.at);

      const seenGeology = next.viewedPublicRoutes.includes("#/geology/record/BP-1998-0719");
      next.predictionIntegrity = seenGeology ? "seen_result" : "blind";
      next = appendEvent(next, "PREDICTION_INTEGRITY_RECORDED", {
        timezone: WORLD.worldTimezone,
        predictionIntegrity: next.predictionIntegrity,
      }, opts.at);
    }

    if (beatId === "B17" && currentPanel.outputs.includes("DER-THIRD-NIGHT-CALCULATION")) {
      next.conditionalMatchRecorded = true;
      next = appendEvent(next, "CONDITIONAL_MATCH_RECORDED", {

    }

    if (beatId === "B18" && isLastPanel) {

      if (next.recommendedBranch && next.recommendedBranch !== branch) {

    return {
      ok: true,
      state: next,
      nextPanel: isLastPanel ? null : panelIndex + 1,
      nextBeat: isLastPanel ? next.currentBeat : beatId,

  }

  function authorizeRecommended(state, options) {
    const opts = options || {};

      && next.completedBeats.every((beatId, index) => beatId === BEAT_IDS[index])
      && (next.completedPanels.B18 || []).length === b18.panels.length;

    if (!next.recommendedBranch) return { ok: false, state: next, code: "NO_RECOMMENDATION", message: "尚无可供机构处理的建议。" };
    if (next.authorizedBranch) return { ok: true, state: next, already: true, branch: next.authorizedBranch };
    if (next.recommendedBranch === "A" && WORLD.qaFacts.branchA !== "PROTOTYPE_ASSUMED_NOT_EXTERNALLY_REVIEWED") {

    }

    next = appendEvent(next, "BRANCH_AUTHORIZED", {
      authorizedBranch: next.authorizedBranch,
      actor: "FIXED_IN_WORLD_INSTITUTIONS",
      prototypeAssumption: next.authorizedBranch === "A" ? WORLD.qaFacts.branchA : null,
    }, opts.at);
    return { ok: true, state: next, branch: next.authorizedBranch, pending: "execution", message: "固定机构已形成独立授权回执。" };

  function executeAuthorized(state, options) {
    const opts = options || {};

    const b18 = getBeat("B18");
    const prerequisitesMet = next.completedBeats.length === 17
      && next.completedBeats.every((beatId, index) => beatId === BEAT_IDS[index])
      && (next.completedPanels.B18 || []).length === b18.panels.length;
    if (!prerequisitesMet) return { ok: false, state: next, code: "BRANCH_PREREQUISITES", message: "B18来源核对与建议前置尚未完整保存。" };

    }
    next.executedBranch = next.authorizedBranch;
    next = appendEvent(next, "BRANCH_EXECUTED", {
      executedBranch: next.executedBranch,
      actor: "FIXED_IN_WORLD_STAFF",
      playerHandledOriginals: false,
    }, opts.at);
    next.executionComplete = true;
    next = appendEvent(next, "EXECUTION_COMPLETE", { executionComplete: true, branch: next.executedBranch }, opts.at);

    if (next.unreadReaction !== reactionId) return { ok: true, state: next, already: true };
    next.unreadReaction = null;
    next = appendEvent(next, "REACTION_READ", { reactionId }, at);
    return { ok: true, state: next };
  }

  function enterFalsePath(state, falseId, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return { ok: false, state: next, code: "UNKNOWN_FALSE_PATH", message: "没有这条公开记录链。" };
    if (!next.sessionStarted) return { ok: false, state: next, code: "SESSION_REQUIRED", message: "请先建立复核会话。" };
    if (!next.falsePaths[falseId].entered) {
      next.falsePaths[falseId].entered = true;
      next = appendEvent(next, "FALSE_PATH_ENTERED", { falseId }, opts.at);
    }
    return { ok: true, state: next, path: clone(path) };
  }

  function advanceFalsePath(state, falseId, stepId, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return { ok: false, state: next, code: "UNKNOWN_FALSE_PATH", message: "没有这条公开记录链。" };
    if (!next.sessionStarted) return { ok: false, state: next, code: "SESSION_REQUIRED", message: "请先建立复核会话。" };
    let branch = next.falsePaths[falseId];
    if (!branch.entered) branch.entered = true;
    const expected = path.steps[branch.stepsSeen.length];
    if (!expected) {
      return {
        ok: true,
        state: next,
        already: true,
        closed: branch.closed,
        needsConclusion: !branch.closed,
      };
    }
    if (stepId !== expected.id) return { ok: false, state: next, code: "FALSE_PATH_ORDER", message: "这条记录没有从当前页直接指向所选页面。" };
    branch.stepsSeen.push(stepId);
    next = appendEvent(next, "FALSE_PATH_STEP", { falseId, stepId, stepNumber: branch.stepsSeen.length }, opts.at);
    branch = next.falsePaths[falseId];
    return {
      ok: true,
      state: next,
      closed: false,
      needsConclusion: branch.stepsSeen.length === path.steps.length,

  function submitFalsePathConclusion(state, falseId, answer, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return { ok: false, state: next, code: "UNKNOWN_FALSE_PATH", message: "没有这条公开记录链。" };
    const branch = next.falsePaths[falseId];
    if (branch.closed) return { ok: true, state: next, already: true, closed: true };
    if (branch.stepsSeen.length !== path.steps.length) {
      return { ok: false, state: next, code: "FALSE_PATH_SOURCES", message: "还有来源页面没有摘录。" };
    }
    if (answer !== path.correctConclusion) {
      next = appendEvent(next, "FALSE_PATH_CONCLUSION_INVALID", { falseId }, opts.at);
      return { ok: false, state: next, code: "FALSE_PATH_BOUNDARY", message: "这个结论超过了来源能排除的范围；请只关闭最窄连接。" };
    }
    branch.closed = true;
    branch.methodLearned = true;
    next.optionalConclusions = next.optionalConclusions.filter((item) => item.via !== falseId);
    next.optionalConclusions.push({ id: path.propositionId, status: "disproved", via: falseId });
    next = appendEvent(next, "FALSE_PATH_CLOSED", {
      falseId,
      propositionId: path.propositionId,
      status: "disproved",
      affectsMainProgress: false,
    }, opts.at);
    return { ok: true, state: next, closed: true, propositionId: path.propositionId, message: "有限排除已保存；主线前置没有改变。" };
  }

  function resolveRoute(hash) {
    const route = typeof hash === "string" && hash ? hash : "#/";
    if (RECORD_BY_ROUTE.has(route)) return { type: "record", route, record: RECORD_BY_ROUTE.get(route) };
    for (const rule of WORLD.routeManifest) {
      const match = route.match(rule.pattern);
      if (match) return { type: rule.type, route, match: match.slice(1) };
    }
    return { type: "not-found", route };
  }

  function markPublicViewed(state, route, options) {
    const opts = options || {};
    let next = normalizeState(state);

  }

  function normalizeQuery(value) {
    return String(value == null ? "" : value)
      .normalize("NFKC")
      .trim()
      .toLocaleLowerCase("zh-CN")
      .replace(/[\s\-—_/:：，。,.]+/g, " ")
      .replace(/^\s+|\s+$/g, "");
  }

  function searchRecords(siteId, query) {
    const site = WORLD.sites.find((item) => item.id === siteId && item.id !== "workbench");
    if (!site) return { ok: false, siteId, query: String(query || ""), normalized: "", count: 0, results: [] };
    const normalized = normalizeQuery(query);
    const candidates = WORLD.records.filter((record) => record.siteId === siteId);
    if (!normalized) return { ok: true, siteId, query: "", normalized, count: candidates.length, results: clone(candidates) };
    const terms = normalized.split(" ").filter(Boolean);
    const results = candidates.filter((record) => {
      const haystack = normalizeQuery([
        record.id,
        record.title,
        record.summary,
        record.date,
        record.meta,
        record.body.join(" "),
        Object.values(record.fields).join(" "),
      ].join(" "));
      return terms.every((term) => haystack.includes(term));
    });
    return { ok: true, siteId, query: String(query), normalized, count: results.length, results: clone(results) };
  }

  function publicRecordText(route) {
    const record = RECORD_BY_ROUTE.get(route);
    if (!record) return null;
    return [record.id, record.siteId, record.route, record.date, record.title, record.meta, record.summary]
      .concat(record.body)
      .concat(Object.entries(record.fields).map(([key, value]) => key + "=" + value))
      .join("\n");
  }

  function resetState(state, options) {
    const opts = options || {};
    const old = normalizeState(state);
    let next = createInitialState({ sessionId: old.sessionId, at: opts.at });
    next = appendEvent(next, "SESSION_RESET", { removedEnding: old.ending, removedEvents: old.eventLog.length }, opts.at);
    return { ok: true, state: next };
  }

  function progressSummary(state) {
    const next = normalizeState(state);
    const panelCount = WORLD.beats.reduce((sum, beat) => sum + beat.panels.length, 0);
    const completedPanelCount = Object.values(next.completedPanels).reduce((sum, values) => sum + values.length, 0);
    return {
      beats: { completed: next.completedBeats.length, total: WORLD.beats.length },
      panels: { completed: completedPanelCount, total: panelCount },
      outputs: { completed: next.derivedEvidence.length, total: WORLD.outcomeSlots.filter((slot) => !slot.some((id) => id.startsWith("ENDING-"))).length },
      outcomeSlots: { completed: next.derivedEvidence.length + (next.ending ? 1 : 0), total: WORLD.outcomeSlots.length },
      falsePathsClosed: WORLD.falsePaths.filter((path) => next.falsePaths[path.id].closed).length,
      ending: next.ending,
      currentBeat: next.currentBeat,
    };
  }

  return Object.freeze({
    SCHEMA_VERSION,
    WORLD,
    createInitialState,
    normalizeState,
    startSession,
    appendEvent,
    getBeat,
    getCurrentBeat,
    canAccessBeat,
    validatePanel,
    canonicalAnswers,
    invalidAnswers,
    revealHint,
    submitPanel,
    publishNextReaction,
    authorizeRecommended,
    executeAuthorized,
    markReactionRead,
    enterFalsePath,
    advanceFalsePath,
    submitFalsePathConclusion,
    resolveRoute,
    markPublicViewed,
    normalizeQuery,
    searchRecords,
    publicRecordText,
    resetState,
    progressSummary,
  });
});
