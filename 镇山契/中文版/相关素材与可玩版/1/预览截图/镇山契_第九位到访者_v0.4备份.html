  };

  let browserState = null;
  let memoryState = null;
  let storageAvailable = true;
  let storageMessage = "";
  let rootElement = null;
  const ui = {
    siteQueries: {},
    pendingDirectHint: null,
    formError: null,
    formDrafts: {},
    falsePathError: null,
    falsePathDrafts: {},
    focusFormError: false,
    resetPending: false,
    lastRoute: null,
    statusMessage: "",
  };

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, "&#096;");
  }

  function unique(values) {
    return Array.from(new Set(values));
  }

  function currentHash() {
    if (typeof location === "undefined") return "#/";
    return location.hash || "#/";
  }

  function routeSiteId(routeInfo) {
    if (routeInfo.type === "record") return routeInfo.record.siteId;
    if (routeInfo.type === "site") return routeInfo.match[0];
    if (routeInfo.type === "landing") return "workbench";
    if (routeInfo.type === "ending" || routeInfo.type === "beat" || routeInfo.type === "false" || routeInfo.type === "workbench") return "workbench";
    return "workbench";
  }

  function documentTitleForRoute(route) {
    const routeInfo = Core.resolveRoute(route || "#/");
    if (routeInfo.type === "landing") return WORK_TITLE;
    if (routeInfo.type === "site") {
      const site = SITE_BY_ID.get(routeInfo.match[0]);
      return site && site.id !== "workbench" ? site.name : `地址未收录 - ${WORK_TITLE}`;
    }
    if (routeInfo.type === "record") {
      const site = SITE_BY_ID.get(routeInfo.record.siteId);
      return site && site.id !== "workbench"
        ? `${routeInfo.record.title} - ${site.name}`
        : `${routeInfo.record.title} - ${WORK_TITLE}`;
    }
    if (routeInfo.type === "beat") {
      const beat = Core.getBeat(routeInfo.match[0]);
      return beat ? `${beat.title} - ${WORK_TITLE}` : `核对记录 - ${WORK_TITLE}`;
    }
    if (routeInfo.type === "false") {
      const path = FALSE_BY_ID.get(routeInfo.match[0]);
      return `${path ? path.title : "参见核对"} - ${WORK_TITLE}`;
    }
    if (routeInfo.type === "ending") return `项目执行回执 - ${WORK_TITLE}`;
    if (routeInfo.type === "workbench") return `卷宗质检工作台 - ${WORK_TITLE}`;
    return `地址未收录 - ${WORK_TITLE}`;
  }

  function forumUiMeta(record) {
    return FORUM_UI_META[record && record.id] || FORUM_UI_FALLBACK;
  }

  function workbenchSourceKind(record) {
    return WORKBENCH_SOURCE_KIND_BY_ID[record && record.id] || "table";
  }

  function normalizeVisualAsset(record, supplied) {
    if (!supplied) return null;
    const asset = typeof supplied === "string" ? { src: supplied } : supplied;
    const rawSrc = asset.src || asset.path || asset.file || "";
    if (!rawSrc) return null;
    const src = rawSrc.includes("/") ? rawSrc : `assets/evidence/${rawSrc}`;
    const caption = asset.caption || record.visualCaption || (record.display && record.display.caption) || record.summary || "本地数字证据影像";
    const alt = asset.alt || record.visualAlt || asset.textEquivalent || caption;
    return {
      src,
      alt,
      caption,
      kind: asset.kind || "image",
    };
  }

  function resolveVisualAsset(record) {
    if (!record) return null;
    return normalizeVisualAsset(record, record.visualAsset || FALLBACK_VISUAL_ASSETS[record.id]);
  }

  function resolveAdditionalVisualAssets(record) {
    const supplied = record && record.display && Array.isArray(record.display.additionalVisualAssets)
      ? record.display.additionalVisualAssets
      : [];
    return supplied.map((asset) => normalizeVisualAsset(record, asset)).filter(Boolean);
  }

  function displayRecordDate(record) {
    return record && record.display && record.display.dateLabel ? record.display.dateLabel : record.date;
  }

  function recordExpectsVisual(record) {
    if (!record) return false;
    if (record.visualAsset || FALLBACK_VISUAL_ASSETS[record.id] || resolveAdditionalVisualAssets(record).length) return true;
    if (record.siteId === "news" && !record.route.includes("/correction/")) return true;
    if (record.siteId === "geology" && /plan|map|survey|profile|diagram/i.test(`${record.id} ${record.contentModel || ""}`)) return true;
    if (record.siteId === "workbench") return ["plan", "waveform", "trace"].includes(workbenchSourceKind(record));
    return false;
  }

  function renderEvidenceVisual(record, options) {
    const config = options || {};
    const assets = [resolveVisualAsset(record), ...resolveAdditionalVisualAssets(record)].filter(Boolean);
    if (!assets.length) {
      if (!(config.placeholder || recordExpectsVisual(record))) return "";
      return `<figure class="evidence-visual evidence-visual-placeholder" data-evidence-state="not-provided" role="group" aria-label="影像未提供">
        <div class="evidence-placeholder-sheet"><span aria-hidden="true">影像未提供</span><p>本地副本只有目录与文字字段。</p></div>
        <figcaption>未提供可核对的原始影像；本页不会用装饰性示意图代替证据。</figcaption>
      </figure>`;
    }
    return `<div class="evidence-visual-group" data-evidence-count="${assets.length}">${assets.map((asset, index) => `<figure class="evidence-visual evidence-visual-${escapeAttr(asset.kind)}" data-evidence-state="available" data-evidence-role="${index === 0 ? "primary" : "supporting"}">
      <img src="${escapeAttr(asset.src)}" alt="${escapeAttr(asset.alt)}" loading="lazy" decoding="async">
      <figcaption><strong>${escapeHtml(asset.caption)}</strong>${asset.alt !== asset.caption ? `<span class="evidence-alt-equivalent">图像等价说明：${escapeHtml(asset.alt)}</span>` : ""}</figcaption>
    </figure>`).join("")}</div>`;
  }

  function renderRecordBody(record, className, heading) {
    const paragraphs = record.body.map((text) => `<p>${escapeHtml(text)}</p>`).join("");
    const classes = className ? ` ${className}` : "";
    if (!resolveVisualAsset(record) && !resolveAdditionalVisualAssets(record).length && !recordExpectsVisual(record)) return `<div class="record-body${classes}">${paragraphs}</div>`;
    return `<details class="evidence-text-equivalent${classes}"><summary>${escapeHtml(heading || "查看文字等价视图与转写")}</summary><div class="evidence-text-body">${paragraphs}</div></details>`;
  }

  function renderSiteRegister(site) {
    if (!site) return "";
    const rows = [
      ["内容语体", site.register],
      ["主要读者", site.audience],
      ["维护状态", site.maintenance],
    ].filter((row) => row[1]);
    if (!rows.length) return "";
    return `<dl class="site-register">${rows.map(([label, value]) => `<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`).join("")}</dl>`;
  }

  function workbenchCopyValue(key, fallback) {
    return WORLD.workbenchCopy && WORLD.workbenchCopy[key] ? WORLD.workbenchCopy[key] : fallback;
  }

  function currentPanelRoute(state) {
    const beat = Core.getCurrentBeat(state);
    const done = state.completedPanels[beat.id] || [];
    return `#/workbench/beat/${beat.id}/panel/${Math.min(done.length, beat.panels.length - 1)}`;
  }

  function recordSessionAction(routeInfo, state) {
    if (routeInfo.type !== "record" || !state.sessionStarted) return "";
    const route = routeInfo.record.route;
    const activeBeat = Core.getCurrentBeat(state);
    const panelIndex = Math.min((state.completedPanels[activeBeat.id] || []).length, activeBeat.panels.length - 1);
    const activePanel = activeBeat.panels[panelIndex];
    const isCurrentSource = activePanel && activePanel.sourceRoutes.includes(route);
    const falseEntry = falseEntryMap[route];
    const expectedFalsePaths = WORLD.falsePaths.filter((path) => {
      const branch = state.falsePaths[path.id];
      const step = path.steps[branch.stepsSeen.length];
      return branch.entered && !branch.closed && step && step.sourceRoute === route;
    });
    const actions = [];
    if (isCurrentSource) actions.push(`<span class="excerpt-status" title="本页已打开；可返回当前核对">本页已打开</span>`);
    for (const expectedFalse of expectedFalsePaths) {
      const branch = state.falsePaths[expectedFalse.id];
      const step = expectedFalse.steps[branch.stepsSeen.length];
      actions.push(`<button type="button" data-action="excerpt-false-source" data-false="${escapeAttr(expectedFalse.id)}" data-step="${escapeAttr(step.id)}">摘录到《${escapeHtml(expectedFalse.title)}》</button>`);
    }
    if (falseEntry && !state.falsePaths[falseEntry].entered) {
      actions.push(`<a href="#/workbench/false/${escapeAttr(falseEntry)}" data-action="enter-false" data-false="${escapeAttr(falseEntry)}">沿页内参见继续核对</a>`);
    }
    return actions.length ? `<div class="session-record-actions">${actions.join("")}</div>` : "";
  }

  function readState() {
    if (typeof localStorage === "undefined") {
      storageAvailable = false;
      storageMessage = "浏览器未提供本机存档；本次会话仍可继续，但关闭页面后不会保留。";
      return memoryState || Core.createInitialState();
    }
    try {
      const raw = localStorage.getItem(WORLD.storageKey);
      if (!raw) return Core.createInitialState();
      return Core.normalizeState(JSON.parse(raw));
    } catch (error) {
      storageAvailable = false;
      storageMessage = "本机存档无法读取，已在内存中建立安全的新会话；旧内容未被执行。";
      return memoryState || Core.createInitialState();
    }
  }

  function writeState(state) {
    browserState = Core.normalizeState(state);
    memoryState = browserState;
    if (typeof localStorage === "undefined") return;
    try {
      localStorage.setItem(WORLD.storageKey, JSON.stringify(browserState));
      storageAvailable = true;
    } catch (error) {
      storageAvailable = false;
      storageMessage = "本机存档写入失败；当前页面仍保留进度，关闭后可能丢失。";
    }
  }

  function renderReaction(state) {
    if (!state.unreadReaction) return "";

    if (!reaction) return "";
    const cta = reactionCtas[reaction.id];
    const alreadyViewed = Boolean(cta && reaction.id !== "R6" && state.viewedPublicRoutes.includes(cta.href));
    const primaryAction = alreadyViewed
      ? `<button type="button" data-action="dismiss-reaction" data-reaction="${escapeAttr(reaction.id)}">这份记录已看过，标为已读并继续</button>`
      : cta ? `<a href="${escapeAttr(cta.href)}" data-reaction-read="${escapeAttr(reaction.id)}">${escapeHtml(cta.label)}</a>` : "";
    const reactionBody = Array.isArray(reaction.segments) && reaction.segments.length
      ? `<div class="reaction-segments">${reaction.segments.map((segment) => `<section><p class="reaction-channel">${escapeHtml(segment.channel || "项目回执")}</p><h3>${escapeHtml(segment.by || reaction.by)}</h3><blockquote>${escapeHtml(segment.text)}</blockquote></section>`).join("")}</div>`
      : `<blockquote>${escapeHtml(reaction.text)}</blockquote>`;

    </section></div>`;
  }

  function renderWorkbench(state) {
    if (!state.sessionStarted) return renderLanding();
    const current = Core.getCurrentBeat(state);
    const currentPanelCount = (state.completedPanels[current.id] || []).length;
    const r6Read = state.reactionsPosted.includes("R6") && state.unreadReaction !== "R6";
    const currentHref = state.ending && r6Read ? `#/end/${state.executedBranch}` : `#/workbench/beat/${current.id}/panel/${Math.min(currentPanelCount, current.panels.length - 1)}`;
    const receiptPending = Boolean(state.unreadReaction || state.reactionReadyQueue.length);
    const ordinary = WORLD.workbenchOrdinary.map((job) => `<li class="workbench-job-row"><span class="job-code">${escapeHtml(job.id)}</span><span class="job-title">${escapeHtml(job.title)}</span><span class="job-status">${escapeHtml(job.status)}</span></li>`).join("");
    const related = WORLD.falsePaths.filter((path) => state.falsePaths[path.id].entered).map((path) => {

      return `<li><a href="#/workbench/false/${escapeAttr(path.id)}">${escapeHtml(path.title)}</a><span>${escapeHtml(status)}</span></li>`;
    }).join("");
    const receipts = state.completedBeats.slice(-6).reverse().map((beatId) => {
      const beat = Core.getBeat(beatId);
      return `<li><strong>${escapeHtml(beat.title)}</strong><span>${escapeHtml(beatBoundaries[beatId])}</span></li>`;
    }).join("");
    const openedSources = state.viewedPublicRoutes.slice(-8).reverse().map((route) => RECORD_BY_ROUTE.get(route)).filter(Boolean).map((record) => `<li><a href="${escapeAttr(record.route)}">${escapeHtml(record.title)}</a><span>${escapeHtml(SITE_BY_ID.get(record.siteId).shortName)}</span></li>`).join("");
    const assignment = receiptPending ? "" : `<section class="current-assignment workbench-assignment-panel" aria-labelledby="current-title">
      <header><p class="assignment-label">${state.ending ? "本轮现实执行已完成" : "当前待核"}</p><h2 id="current-title">${state.ending ? "查看本轮明确回执" : escapeHtml(current.title)}</h2></header><p>${state.ending ? "项目负责人回执读毕后，本轮获准材料核对到此结束。" : escapeHtml(current.operation)}</p>
      <a class="primary-link" href="${escapeAttr(currentHref)}">${state.ending ? "打开明确终点" : "打开当前复核面板"}</a>
    </section>`;
    const taskRailCurrent = receiptPending
      ? `<div class="task-rail-current task-rail-paused workbench-job-row"><span class="job-code">${escapeHtml(WORLD.workOrder)}</span><span class="job-title">先读取项目回执</span><span class="job-status">队列暂停</span></div>`
      : `<a class="task-rail-current workbench-job-row" href="${escapeAttr(currentHref)}" aria-current="step"><span class="job-code">${escapeHtml(WORLD.workOrder)}</span><span class="job-title">${state.ending ? "本轮明确回执" : escapeHtml(current.title)}</span><span class="job-status">${state.ending ? "执行回执" : "当前待核"}</span></a>`;
    return `<main id="main-content" class="workbench-page institution-page" tabindex="-1">
      <header class="workbench-heading workbench-app-header">
        <div><p class="eyebrow">槐县历史专卷数字化复核项目</p><h1 id="page-heading" tabindex="-1">卷宗质检工作台</h1></div>
        <dl class="workbench-header-fields"><div><dt>工号</dt><dd>QC-447</dd></div><div><dt>工单</dt><dd>${escapeHtml(WORLD.workOrder)}</dd></div><div><dt>权限</dt><dd>只读数字副本</dd></div></dl>
      </header>
      <nav class="workbench-toolbar" aria-label="工作台工具栏"><strong>在办工单</strong><span>数字副本核对</span><span>来源访问留痕</span><button class="reset-trigger" type="button" data-action="request-reset">清除本机复核会话并重新开始</button></nav>
      <div class="workbench-business-shell">
        <aside class="workbench-process-tree" aria-label="业务步骤树">
          <h2>业务步骤</h2>
          <ol>
            <li class="is-complete"><span>01</span><div><strong>领取工单</strong><small>QC-447 已领取</small></div></li>
            <li class="is-current"><span>02</span><div><strong>来源核对</strong><small>当前办理</small></div></li>
            <li><span>03</span><div><strong>保存回单</strong><small>逐项形成</small></div></li>
            <li><span>04</span><div><strong>机构处理</strong><small>与个人建议分离</small></div></li>
          </ol>
          <section class="workbench-task-rail" aria-label="当前工单队列"><h3>当前队列</h3>${taskRailCurrent}${related ? `<section class="task-rail-related"><h3>已进入的参见核对</h3><ul class="related-records">${related}</ul></section>` : ""}</section>
        </aside>
        <section class="workbench-case-area">
          <header class="case-area-heading"><div><span>在办件</span><h2>${escapeHtml(WORLD.workOrder)}</h2></div><dl><div><dt>经办人</dt><dd>QC-447</dd></div><div><dt>办理状态</dt><dd>${receiptPending ? "等待回执" : "来源核对中"}</dd></div></dl></header>
          <div class="workbench-primary-pane">
            ${renderReaction(state)}
            ${assignment}
            ${!state.unreadReaction && state.reactionReadyQueue.length ? `<section class="receipt-ready" aria-labelledby="receipt-ready-title"><p class="assignment-label">项目队列有一条待取回记录</p><h2 id="receipt-ready-title">先读取项目新回执</h2><p>每次只取回一条；读完后，工作台才会显示下一项核对。</p><button class="primary-action" type="button" data-action="publish-reaction">读取一条项目新回执</button></section>` : ""}
            <section class="workbench-receipts"><h2>最近形成的核对回单</h2>${receipts ? `<ul class="human-receipts">${receipts}</ul>` : "<p>尚未形成回单。先打开当前复核面板。</p>"}</section>
          </div>
          <div class="workbench-support-register">
            <section><h2>已打开来源</h2>${openedSources ? `<ul class="opened-sources">${openedSources}</ul>` : "<p>从当前复核项打开来源后，会在这里保留访问记录。</p>"}</section>
            <section><h2>同批普通工单</h2><ul class="ordinary-jobs">${ordinary}</ul></section>
          </div>
          <footer class="workbench-bottom-actions"><span>当前操作会写入本机会话；不改写公开网页与原始卷宗。</span><a href="${escapeAttr(currentHref)}">继续办理当前项</a></footer>
        </section>
      </div>
      ${renderResetDialog()}
    </main>`;
  }

  function renderQuestion(question, disabled, currentValue) {
    const disabledAttr = disabled ? " disabled" : "";
    if (question.type === "select") {
      const options = question.options.map((item) => `<option value="${escapeAttr(item.value)}"${currentValue === item.value ? " selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
      return `<label class="question-block"><span>${escapeHtml(question.prompt)}</span><select name="${escapeAttr(question.id)}"${disabledAttr}><option value="">请选择</option>${options}</select>${question.help ? `<small>${escapeHtml(question.help)}</small>` : ""}</label>`;
    }
    if (question.type === "radio" || question.type === "checkboxes") {
      const inputType = question.type === "radio" ? "radio" : "checkbox";
      const selectedValues = Array.isArray(currentValue) ? currentValue : [currentValue];
      const options = question.options.map((item) => `<label class="choice-option"><input type="${inputType}" name="${escapeAttr(question.id)}" value="${escapeAttr(item.value)}"${selectedValues.includes(item.value) ? " checked" : ""}${disabledAttr}><span>${escapeHtml(item.label)}</span></label>`).join("");
      return `<fieldset class="question-block"><legend>${escapeHtml(question.prompt)}</legend><div class="choice-list">${options}</div></fieldset>`;
    }
    if (question.type === "order") {
      const rows = question.correct.map((_, index) => {
        const selectedValue = Array.isArray(currentValue) ? currentValue[index] : null;
        const options = question.options.map((item) => `<option value="${escapeAttr(item.value)}"${selectedValue === item.value ? " selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
        return `<label><span>第${index + 1}位</span><select name="${escapeAttr(question.id)}__${index}"${disabledAttr}><option value="">请选择事件</option>${options}</select></label>`;
      }).join("");
      return `<fieldset class="question-block order-question"><legend>${escapeHtml(question.prompt)}</legend><p>逐位选择；重复或缺项不会通过。</p><div class="order-grid">${rows}</div></fieldset>`;
    }
    return "";
  }

  function renderHints(state, beat, panelIndex) {
    const panel = beat.panels[panelIndex];
    const key = beat.id + ":" + panelIndex;
    const level = Number(state.hints[key] || 0);
    const shown = panel.hints.slice(0, level).map((hint) => `<li><strong>${hint.level} · ${escapeHtml(hint.label)}</strong><p>${escapeHtml(hint.text)}</p></li>`).join("");
    const pending = ui.pendingDirectHint === key;
    let nextControl = "";
    if (level < 3) {
      nextControl = `<button type="button" data-action="reveal-hint" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}">展开第${level + 1}级提示</button>`;
    } else if (level === 3 && !pending) {
      nextControl = `<button type="button" data-action="reveal-hint" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}">请求第4级直接答案</button>`;
    } else if (level === 3 && pending) {
      nextControl = `<div class="direct-hint-confirm" role="alert"><p>第4级会显示完整可执行答案，但不会自动提交。</p><button type="button" data-action="confirm-direct-hint" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}">再次确认并显示</button><button type="button" data-action="cancel-direct-hint">取消</button></div>`;
    } else {
      nextControl = `<p class="hint-complete">四级提示已全部展开。</p>`;
    }
    return `<details class="hint-drawer"${level ? " open" : ""}><summary>分级提示（已展开 ${level}/4）</summary><ol>${shown}</ol>${nextControl}</details>`;
  }

  function renderSourceLinks(state, beat, panelIndex) {
    const routes = beat.panels[panelIndex] ? beat.panels[panelIndex].sourceRoutes : [];
    if (!routes.length) return "";
    return `<aside class="source-links" aria-labelledby="panel-sources-title"><div class="source-links-heading"><span>步骤 1</span><h3 id="panel-sources-title">${escapeHtml(workbenchCopyValue("sourceLabel", "本项来源"))}</h3><p>打开来源核对材料；来源页会直接返回这里。仅打开不会自动完成本项。</p></div><ul>${routes.map((route) => {
      const record = RECORD_BY_ROUTE.get(route);
      const opened = state.viewedPublicRoutes.includes(route);
      const site = record ? SITE_BY_ID.get(record.siteId) : null;
      return `<li><a href="${escapeAttr(route)}"><span>${escapeHtml(record ? record.title : route)}</span><small>${escapeHtml(site ? site.shortName : "来源记录")}</small></a><b>${opened ? "已打开 · 重新查看" : "打开来源"}</b></li>`;
    }).join("")}</ul></aside>`;
  }

  function renderPanelNav(state, beat, activeIndex) {
    if (beat.panels.length < 2) return "";
    const done = state.completedPanels[beat.id] || [];
    return `<nav class="panel-nav" aria-label="本项分屏">${beat.panels.map((panel, index) => {
      const accessible = index <= done.length;
      const status = done.includes(index) ? "已保存" : index === done.length ? "当前" : "等待前屏";
      return accessible
        ? `<a href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${index}"${index === activeIndex ? ' aria-current="step"' : ""}><span>${index + 1}</span>${escapeHtml(panel.title)}<small>${status}</small></a>`
        : `<span class="locked-panel" aria-disabled="true"><span>${index + 1}</span>${escapeHtml(panel.title)}<small>${status}</small></span>`;
    }).join("")}</nav>`;
  }

  function renderBeatPanel(state, beat, panelIndex, uiState) {
    const view = uiState || ui;
    const done = state.completedPanels[beat.id] || [];
    const panel = beat.panels[panelIndex];
    if (!panel) return renderNotFound("该面板编号不存在。", "#/workbench");
    if (panelIndex > done.length) {
      return `<main id="main-content" class="workbench-tool institution-page" tabindex="-1">
        <header class="tool-heading workbench-app-header"><p class="eyebrow">核对类型 · ${escapeHtml(beat.channel)}</p><h1 id="page-heading" tabindex="-1">${escapeHtml(beat.title)}</h1><p>${escapeHtml(beat.operation)}</p></header>
        <nav class="workbench-toolbar" aria-label="核对工具栏"><a href="#/workbench">返回工作台</a><span>当前工单只读</span></nav>
        <div class="workbench-tool-shell">
          <aside class="tool-task-rail">${renderPanelNav(state, beat, panelIndex)}</aside>
          <section class="tool-primary-pane locked-message"><h2>前一屏尚未保存</h2><p>来源仍可浏览，但核对回单必须按可见操作逐屏保存。</p><a href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${done.length}">回到当前面板</a></section>
          <aside class="tool-context-rail"><h2>当前访问边界</h2><p>公开来源仍可直接浏览；核对回单按已保存的分屏顺序形成。</p></aside>
        </div>
      </main>`;
    }
    const saved = done.includes(panelIndex);
    const error = view.formError && view.formError.beatId === beat.id && view.formError.panelIndex === panelIndex ? view.formError : null;
    const draftKey = `${beat.id}:${panelIndex}`;
    const values = saved
      ? Core.canonicalAnswers(beat.id, panelIndex, state.recommendedBranch || "A")
      : view.formDrafts && view.formDrafts[draftKey] ? view.formDrafts[draftKey] : {};
    const questions = panel.questions.map((question) => renderQuestion(question, saved, values[question.id])).join("");
    const resultOutput = panel.outputs.filter((output) => output !== "__ENDING__");
    const afterSave = saved ? `<div class="saved-panel" role="status"><strong>本面板已保存。</strong>${resultOutput.length ? "<p>结构化核对回单已经写入本机会话。</p>" : "<p>这是分屏检查点，下一屏会继续使用本次核对。</p>"}</div>` : "";
    const nextIndex = panelIndex + 1;
    const savedAction = saved
      ? nextIndex < beat.panels.length
        ? `<a class="primary-link" href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${nextIndex}">进入下一面板</a>`
        : beat.id === "B18"
          ? `<a class="primary-link" href="#/workbench/beat/B18/result">查看机构处理状态</a>`
          : `<a class="primary-link" href="#/workbench/beat/${escapeAttr(beat.id)}/result">查看本项回单</a>`
      : `<button class="primary-action" type="submit" aria-label="核对并保存本面板">${escapeHtml(beat.actionLabel || workbenchCopyValue("saveLabel", "保存本项回单"))}</button>`;
    const returnAction = saved
      ? `<a class="secondary-link" href="#/workbench">返回工作台</a>`
      : `<button class="secondary-action" type="submit" data-after-save="workbench">${escapeHtml(workbenchCopyValue("saveLabel", "保存本项回单"))}并返回工作台</button>`;
    const previousAction = panelIndex > 0
      ? `<a class="previous-panel-link" href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${panelIndex - 1}">查看前一屏</a>`
      : `<a class="previous-panel-link" href="#/workbench">返回工作台</a>`;
    return `<main id="main-content" class="workbench-tool institution-page" tabindex="-1">
      <header class="tool-heading workbench-app-header"><p class="eyebrow">核对类型 · ${escapeHtml(beat.channel)}</p><h1 id="page-heading" tabindex="-1">${escapeHtml(beat.title)}</h1><p>${escapeHtml(beat.operation)}</p></header>
      <nav class="workbench-toolbar" aria-label="核对工具栏"><a href="#/workbench">返回工作台</a><strong>工单 ${escapeHtml(WORLD.workOrder)}</strong><span>只读数字副本</span><span>面板 ${panelIndex + 1} / ${beat.panels.length}</span></nav>
      <div class="workbench-operation-shell">
        <aside class="tool-task-rail" aria-label="当前业务步骤">
          <h2>本项步骤</h2>
          ${renderPanelNav(state, beat, panelIndex)}
          <ol class="panel-procedure"><li class="is-current"><span>1</span>打开本项来源</li><li><span>2</span>回来填写</li><li><span>3</span>保存本项回单</li></ol>
          <section class="artifact-cue"><div><h3>当前材料</h3><p>${escapeHtml(beat.artifact)}</p></div><div><h3>核对提示</h3><p>${escapeHtml(beat.cue)}</p></div></section>
        </aside>
        <section class="tool-case-area">
          ${renderSourceLinks(state, beat, panelIndex)}
          <section class="tool-primary-pane operation-sheet" aria-labelledby="panel-title">
            <header class="operation-sheet-heading"><div><span>步骤 2</span><h2 id="panel-title">${escapeHtml(panel.title)}</h2></div><p>${escapeHtml(panel.instruction)}</p></header>
            ${afterSave}
            ${error && !saved ? `<div class="form-error" role="alert" tabindex="-1" data-form-error>${escapeHtml(error.message)}</div>` : ""}
            <form data-action="submit-panel" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}" novalidate>
              ${questions}
              <div class="form-actions"><div><span>步骤 3</span>${savedAction}${returnAction}</div>${previousAction}</div>
            </form>
          </section>
          <div class="tool-support-row">
            ${renderHints(state, beat, panelIndex)}
            <section class="next-question"><h2>保存后留下的问题</h2><p>${escapeHtml(beat.nextQuestion)}</p></section>
          </div>
        </section>
      </div>
    </main>`;
  }

  function renderDispositionStatus(state) {
    const branch = state.recommendedBranch;
    if (!branch) return `<section class="branch-status"><h2>处置建议尚未提交</h2><a href="#/workbench/beat/B18/panel/2">返回建议屏幕</a></section>`;
    const plan = WORLD.plans[branch];
    if (!state.authorizedBranch) {
      return `<section class="branch-status"><p class="receipt-code">你的处置建议：方案${escapeHtml(branch)}</p><h2>建议已记录，机构授权回执尚未读取</h2><p>QC-447没有批准权限。下面的操作只读取项目责任机构独立形成的授权回执，不代表经办人批准。</p><button type="button" data-action="read-authorization">读取项目责任机构授权回执</button></section>`;
    }
    if (!state.executionComplete) {
      return `<section class="branch-status"><p class="receipt-code">你的建议：方案${escapeHtml(branch)} · 机构授权：方案${escapeHtml(state.authorizedBranch)}</p><h2>项目责任机构已授权同一方案</h2><p>${escapeHtml(plan.name)}已进入受权经办队列。下面的操作只读取执行记录。</p><button type="button" data-action="read-execution">读取受权经办人员执行回执</button></section>`;
    }
    const r6Read = state.reactionsPosted.includes("R6") && state.unreadReaction !== "R6";
    return r6Read
      ? `<section class="branch-status"><p class="receipt-code">受权经办人员执行：方案${escapeHtml(state.executedBranch)} · 已完成</p><h2>项目负责人回执已读，本轮处理回执已形成</h2><a class="primary-link" href="#/end/${escapeAttr(state.executedBranch)}">打开完整处理回执</a></section>`
      : `<section class="branch-status"><p class="receipt-code">受权经办人员执行：方案${escapeHtml(state.executedBranch)} · 已完成</p><h2>项目负责人尚有一条最终回执</h2><p>请返回项目工作台读取回执，再打开完整处理回执。</p><a class="primary-link" href="#/workbench">返回项目工作台</a></section>`;
  }

  function renderBeatResultLines(beat) {
    if (!beat || !Array.isArray(beat.resultLines) || !beat.resultLines.length) return "";
    return `<section class="result-line-register" aria-labelledby="result-lines-title"><h2 id="result-lines-title">完成态字段</h2><dl>${beat.resultLines.map((line) => `<div data-result-status="${escapeAttr(line.status || "recorded")}"><dt>${escapeHtml(line.label || "已记录")}</dt><dd>${escapeHtml(line.text || "")}</dd></div>`).join("")}</dl></section>`;
  }

  function renderBeatResult(state, beat, uiState) {
    if (beat.id === "B18") {
      return `<main id="main-content" class="workbench-result institution-page" tabindex="-1">
        <header class="receipt-header workbench-app-header"><p class="eyebrow">项目处理状态</p><h1 id="page-heading" tabindex="-1">来源核对、建议、授权与执行</h1></header>
        <nav class="workbench-toolbar" aria-label="处理状态工具栏"><a href="#/workbench">返回工作台</a><span>建议与批准分离</span><span>受权经办人员执行</span></nav>
        <div class="receipt-system-layout"><section class="receipt-primary-pane">${renderDispositionStatus(state)}</section><aside class="receipt-context-rail"><h2>返回核对材料</h2><a href="#/workbench/beat/B18/panel/0">返回查看三件来源</a><a href="#/workbench/beat/B18/panel/1">返回查看两方案预览</a></aside></div>
      </main>`;
    }
    if (!state.completedBeats.includes(beat.id)) {
      const done = (state.completedPanels[beat.id] || []).length;
      return renderBeatPanel(state, beat, Math.min(done, beat.panels.length - 1), uiState);
    }
    const nextIndex = WORLD.beats.findIndex((item) => item.id === beat.id) + 1;
    const nextBeat = WORLD.beats[nextIndex];
    const nextAction = milestoneBeats.has(beat.id)
      ? `<a class="primary-link" href="#/workbench">返回项目工作台读取新回执</a>`
      : nextBeat ? `<a class="primary-link" href="#/workbench/beat/${escapeAttr(nextBeat.id)}/panel/0">进入下一项核对</a>` : "";
    const predictionReceipt = beat.id === "B17"
      ? state.predictionIntegrity === "blind"
        ? `<section class="prediction-receipt"><h2>本次对照顺序</h2><p>你先封存了第三夜计算，再打开首报进行对照。</p></section>`
        : `<section class="prediction-receipt"><h2>本次对照顺序</h2><p>你在封存计算前已经看过首报；条件结论仍有效，但本次不计作“先算后看”。</p></section>`
      : "";
    return `<main id="main-content" class="workbench-result institution-page" tabindex="-1">
      <header class="receipt-header workbench-app-header"><p class="eyebrow">结构化核对回单</p><h1 id="page-heading" tabindex="-1">${escapeHtml(beat.title)}：已保存</h1></header>
      <nav class="workbench-toolbar" aria-label="回单工具栏"><a href="#/workbench">返回工作台</a><span>本机核对回单</span></nav>
      <div class="receipt-system-layout">
        <section class="receipt-primary-pane"><section class="derived-receipt"><h2>本次核对边界</h2><p>${escapeHtml(beatBoundaries[beat.id])}</p>${renderBeatResultLines(beat)}<h2>仍需追问</h2><p>${escapeHtml(beat.nextQuestion)}</p></section>${predictionReceipt}</section>
        <aside class="receipt-context-rail"><h2>后续操作</h2><div class="result-actions"><a href="#/workbench/beat/${escapeAttr(beat.id)}/panel/0">返回查看本项材料</a>${nextAction}</div></aside>
      </div>
    </main>`;
  }

  function renderBeatRoute(state, routeInfo, uiState) {
    const beatId = routeInfo.match[0];
    const beat = Core.getBeat(beatId);
    if (!beat) return renderNotFound("没有这项核对记录。", "#/workbench");
    if (!Core.canAccessBeat(state, beatId)) {
      return `<main id="main-content" class="workbench-tool institution-page" tabindex="-1"><header class="workbench-app-header"><p class="eyebrow">工单队列</p><h1 id="page-heading" tabindex="-1">这项核对尚未排到当前工单</h1></header><nav class="workbench-toolbar" aria-label="核对工具栏"><a href="#/workbench">返回工作台</a></nav><section class="system-message"><p>已知完整地址仍可打开对应网页；工作台回单按已保存的前置核对顺序形成。</p><a class="primary-link" href="${escapeAttr(currentPanelRoute(state))}">回到当前待核项</a></section></main>`;
    }
    if (routeInfo.route.endsWith("/result")) return renderBeatResult(state, beat, uiState);
    const requested = routeInfo.match[1] == null ? (state.completedPanels[beat.id] || []).length : Number(routeInfo.match[1]);
    const panelIndex = Math.min(Number.isInteger(requested) ? requested : 0, beat.panels.length - 1);
    return renderBeatPanel(state, beat, panelIndex, uiState);
  }

  function renderFalsePath(state, routeInfo, uiState) {
    const view = uiState || ui;
    const falseId = routeInfo.match[0];
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return renderNotFound("没有这条公开记录链。", "#/workbench");
    const branch = state.falsePaths[falseId];
    const seen = path.steps.filter((step) => branch.stepsSeen.includes(step.id));
    const nextStep = path.steps[branch.stepsSeen.length] || null;
    const seenList = seen.map((step) => {
      const record = RECORD_BY_ROUTE.get(step.sourceRoute);
      return `<li><a href="${escapeAttr(step.sourceRoute)}">${escapeHtml(record ? record.title : step.title)}</a><span>字段已记入这条参见核对</span></li>`;
    }).join("");
    const selectedConclusion = view.falsePathDrafts && view.falsePathDrafts[falseId] ? view.falsePathDrafts[falseId] : "";
    const conclusionError = view.falsePathError && view.falsePathError.falseId === falseId ? view.falsePathError : null;
    const conclusionForm = !branch.closed && !nextStep ? `<form class="false-conclusion" data-action="false-conclusion" data-false="${escapeAttr(falseId)}">${conclusionError ? `<div class="form-error" role="alert" tabindex="-1" data-form-error>${escapeHtml(conclusionError.message)}</div>` : ""}<fieldset><legend>${escapeHtml(path.conclusionPrompt)}</legend>${path.conclusionOptions.map((item) => `<label class="choice-option"><input type="radio" name="conclusion" value="${escapeAttr(item.value)}"${selectedConclusion === item.value ? " checked" : ""}><span>${escapeHtml(item.label)}</span></label>`).join("")}</fieldset><button type="submit">提交有限排除</button></form>` : "";
    return `<main id="main-content" class="related-chain institution-page" tabindex="-1">
      <header class="related-chain-header workbench-app-header"><p class="eyebrow">页内参见核对</p><h1 id="page-heading" tabindex="-1">${escapeHtml(path.title)}</h1></header>
      <nav class="workbench-toolbar" aria-label="参见核对工具栏"><a href="#/workbench">随时离开这条记录链，继续主工单</a><span>不改变当前工单前置</span></nav>
      <div class="related-chain-shell">
        <section class="related-chain-primary"><section class="chain-premise"><h2>为什么这条连接值得核对</h2><p>${escapeHtml(path.entry)}</p><p>${escapeHtml(path.hypothesis)}</p></section>
          ${!branch.entered ? `<button type="button" data-action="enter-false" data-false="${escapeAttr(falseId)}">开始沿页内参见核对</button>` : ""}
          ${branch.entered && nextStep ? `<section class="next-source"><h2>下一份来源</h2><p>${escapeHtml(nextStep.fieldPrompt)}</p><a class="primary-link" href="${escapeAttr(nextStep.sourceRoute)}">打开来源页面</a></section>` : ""}
          ${conclusionForm}
          ${branch.closed ? `<section class="chain-closure"><h2>这条连接如何闭合</h2><p>${escapeHtml(path.closure)}</p><p><strong>方法：</strong>${escapeHtml(path.method)}</p><p><strong>边界：</strong>${escapeHtml(path.boundary)}</p><p class="receipt-code">有限排除已保存；不进入当前复核前置。</p></section>` : ""}
        </section>
        <aside class="related-chain-context">${seenList ? `<section><h2>已打开并摘录的来源</h2><ul class="opened-sources">${seenList}</ul></section>` : `<section><h2>已打开并摘录的来源</h2><p>尚未把来源字段记入这条参见核对。</p></section>`}</aside>
      </div>
    </main>`;
  }

        ? "受权经办人员执行已经完成，但项目负责人的最终回执尚未读完。请先返回工作台读取。"

      <nav class="workbench-toolbar" aria-label="终点回执工具栏"><a href="#/workbench">返回已完成工单</a><span>回执状态：已形成</span><button type="button" data-action="request-reset">清除本机复核会话并重新开始</button></nav>

  function renderNotFound(message, safeHref) {
    return `<main id="main-content" class="not-found institution-page system-error-page" tabindex="-1"><header class="system-error-header"><p class="error-code">404 / 未收录</p><h1 id="page-heading" tabindex="-1">这个地址没有对应的公开记录</h1></header><section class="system-message"><p>${escapeHtml(message || "请核对记录编号、站点范围和地址格式。")}</p><a class="primary-link" href="${escapeAttr(safeHref || "#/workbench")}">返回安全入口</a></section></main>`;
  }

  function renderMain(route, state, uiOverrides) {
    const routeInfo = Core.resolveRoute(route);
    if (routeInfo.type === "landing") return renderLanding();
    if (routeInfo.type === "workbench") return renderWorkbench(state);
    if (routeInfo.type === "beat") return renderBeatRoute(state, routeInfo, uiOverrides || ui);
    if (routeInfo.type === "false") return renderFalsePath(state, routeInfo, uiOverrides || ui);
    if (routeInfo.type === "site") return renderSiteHome(routeInfo.match[0], uiOverrides);
    if (routeInfo.type === "record") return renderPublicRecord(routeInfo.record, state);
    if (routeInfo.type === "ending") return renderEnding(state, routeInfo.match[0]);
    return renderNotFound("精确路由清单中没有这个地址。公开记录不会使用宽前缀回退。", state.sessionStarted ? "#/workbench" : "#/");
  }

  function renderRouteToString(route, state, uiOverrides) {
    const normalized = Core.normalizeState(state || Core.createInitialState());
    const routeInfo = Core.resolveRoute(route || "#/");
    return `${renderSessionBar(routeInfo, normalized)}${renderStorageNotice()}${renderStatusLive()}${renderMain(route || "#/", normalized, uiOverrides || ui)}`;
  }

  function parsePanelAnswers(form, beatId, panelIndex) {
    const beat = Core.getBeat(beatId);
    const panel = beat && beat.panels[panelIndex];
    if (!panel) return {};
    const answers = {};
    for (const question of panel.questions) {
      if (question.type === "checkboxes") {
        answers[question.id] = Array.from(form.querySelectorAll(`input[name="${question.id}"]:checked`)).map((input) => input.value);
      } else if (question.type === "radio") {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        answers[question.id] = selected ? selected.value : "";
      } else if (question.type === "order") {
        answers[question.id] = question.correct.map((_, index) => {
          const select = form.querySelector(`select[name="${question.id}__${index}"]`);
          return select ? select.value : "";
        });
      } else {
        const field = form.elements.namedItem(question.id);
        answers[question.id] = field ? field.value : "";
      }
    }
    return answers;
  }

  function setStatus(message) {
    ui.statusMessage = message || "";
  }

  function navigate(hash) {
    if (typeof location === "undefined") return;
    if (location.hash === hash) {
      renderBrowser(true);
    } else {
      location.hash = hash;
    }
  }

  function renderBrowser(focusHeading) {
    if (!rootElement) return;
    const route = currentHash();
    const routeInfo = Core.resolveRoute(route);
    const routeChanged = ui.lastRoute !== null && ui.lastRoute !== route;
    if (routeChanged) {
      ui.formError = null;
      ui.falsePathError = null;
      ui.focusFormError = false;
    }
    const deliberatelyEnteredWorkbench = routeInfo.type === "workbench" && ui.lastRoute !== route;
    if (deliberatelyEnteredWorkbench && browserState.sessionStarted && !browserState.unreadReaction && browserState.reactionReadyQueue.length) {
      const published = Core.publishNextReaction(browserState);
      if (published.ok) writeState(published.state);
    }
    if (routeInfo.type === "record") {
      const viewed = Core.markPublicViewed(browserState, route);
      if (viewed.ok) writeState(viewed.state);
    }
    document.title = documentTitleForRoute(route);
    rootElement.innerHTML = renderRouteToString(route, browserState, ui);
    const shouldFocus = focusHeading || ui.lastRoute !== route;
    ui.lastRoute = route;
    if (ui.focusFormError) {
      const error = rootElement.querySelector("[data-form-error]");
      if (error) error.focus({ preventScroll: false });
      ui.focusFormError = false;
    } else if (shouldFocus) {
      const heading = rootElement.querySelector("#page-heading");
      if (heading) heading.focus({ preventScroll: true });
      if (typeof window !== "undefined" && typeof window.scrollTo === "function") window.scrollTo({ top: 0, left: 0, behavior: "auto" });
    }
  }

  function handleSubmit(event) {
    const form = event.target;
    if (!(form instanceof HTMLFormElement)) return;
    const action = form.dataset.action;
    if (!action) return;
    event.preventDefault();
    if (action === "submit-panel") {
      const beatId = form.dataset.beat;
      const panelIndex = Number(form.dataset.panel);
      const returnToWorkbench = Boolean(event.submitter && event.submitter.dataset.afterSave === "workbench");
      const answers = parsePanelAnswers(form, beatId, panelIndex);
      const result = Core.submitPanel(browserState, beatId, panelIndex, answers);
      writeState(result.state);
      setStatus(result.message);
      if (result.ok) {
        delete ui.formDrafts[`${beatId}:${panelIndex}`];
        ui.formError = null;
        ui.focusFormError = false;
        if (returnToWorkbench) navigate("#/workbench");
        else if (result.pending === "authorization") navigate("#/workbench/beat/B18/result");
        else if (result.nextPanel != null) navigate(`#/workbench/beat/${beatId}/panel/${result.nextPanel}`);
        else navigate(`#/workbench/beat/${beatId}/result`);
      } else {
        ui.formDrafts[`${beatId}:${panelIndex}`] = JSON.parse(JSON.stringify(answers));
        ui.formError = { beatId, panelIndex, message: result.message };
        ui.focusFormError = true;
        renderBrowser(false);
      }
      return;
    }
    if (action === "site-search") {
      const siteId = form.dataset.site;
      const input = form.elements.namedItem("query");
      ui.siteQueries[siteId] = input ? String(input.value) : "";
      setStatus(`站内检索完成：${ui.siteQueries[siteId]}`);
      renderBrowser(false);
      return;
    }
    if (action === "false-conclusion") {
      const selected = form.querySelector('input[name="conclusion"]:checked');
      const falseId = form.dataset.false;
      const selectedValue = selected ? selected.value : "";
      const result = Core.submitFalsePathConclusion(browserState, falseId, selectedValue);
      writeState(result.state);
      setStatus(result.message);
      if (result.ok) {
        delete ui.falsePathDrafts[falseId];
        ui.falsePathError = null;
        ui.focusFormError = false;
      } else {
        ui.falsePathDrafts[falseId] = selectedValue;
        ui.falsePathError = { falseId, message: result.message };
        ui.focusFormError = true;
      }
      renderBrowser(false);
    }
  }

  function handleClick(event) {
    const reactionLink = event.target.closest("[data-reaction-read]");
    if (reactionLink) {
      const result = Core.markReactionRead(browserState, reactionLink.dataset.reactionRead);
      if (result.ok) writeState(result.state);
      return;
    }
    const control = event.target.closest("[data-action]");
    if (!control) return;
    const action = control.dataset.action;
    if (action === "start-session") {
      const result = Core.startSession(browserState);
      writeState(result.state);
      setStatus("本机复核会话已建立。工作台未接触任何原物。 ");
      navigate("#/workbench");
    } else if (action === "dismiss-reaction") {
      const result = Core.markReactionRead(browserState, control.dataset.reaction);
      if (result.ok) writeState(result.state);
      setStatus("项目回执已标为已读。 ");
      renderBrowser(false);
    } else if (action === "reveal-hint") {
      const beatId = control.dataset.beat;
      const panelIndex = Number(control.dataset.panel);
      const result = Core.revealHint(browserState, beatId, panelIndex);
      if (result.code === "DIRECT_CONFIRM_REQUIRED") {
        ui.pendingDirectHint = beatId + ":" + panelIndex;
      } else if (result.ok) {
        writeState(result.state);
        setStatus(`第${result.level}级提示已展开。`);
      }
      renderBrowser(false);
    } else if (action === "confirm-direct-hint") {
      const beatId = control.dataset.beat;
      const panelIndex = Number(control.dataset.panel);
      const result = Core.revealHint(browserState, beatId, panelIndex, { confirmDirect: true });
      if (result.ok) writeState(result.state);
      ui.pendingDirectHint = null;
      setStatus("第4级直接答案已展开；系统没有自动提交。 ");
      renderBrowser(false);
    } else if (action === "cancel-direct-hint") {
      ui.pendingDirectHint = null;
      renderBrowser(false);
    } else if (action === "enter-false") {
      const result = Core.enterFalsePath(browserState, control.dataset.false);
      writeState(result.state);
      setStatus("页内参见已加入本机核对；它不改变当前工单前置。 ");
      navigate(`#/workbench/false/${control.dataset.false}`);
    } else if (action === "excerpt-false-source") {
      const result = Core.advanceFalsePath(browserState, control.dataset.false, control.dataset.step);
      writeState(result.state);
      setStatus("本页普通字段已摘录；请回到参见核对页。 ");
      navigate(`#/workbench/false/${control.dataset.false}`);
    } else if (action === "publish-reaction") {
      const result = Core.publishNextReaction(browserState);
      writeState(result.state);
      setStatus(result.message);
      renderBrowser(false);
    } else if (action === "read-authorization") {
      const result = Core.authorizeRecommended(browserState);
      writeState(result.state);
      setStatus(result.message);
      renderBrowser(false);
    } else if (action === "read-execution") {
      const result = Core.executeAuthorized(browserState);
      writeState(result.state);
      setStatus(result.message);
      if (result.ok) navigate("#/workbench");
      else renderBrowser(false);
    } else if (action === "request-reset") {
      ui.resetPending = true;
      renderBrowser(false);
      const dialog = rootElement.querySelector(".reset-dialog button");
      if (dialog) dialog.focus();
    } else if (action === "cancel-reset") {
      ui.resetPending = false;
      renderBrowser(false);
    } else if (action === "confirm-reset") {
      const result = Core.resetState(browserState);
      try {
        if (typeof localStorage !== "undefined") localStorage.removeItem(WORLD.storageKey);
      } catch (error) {
        storageAvailable = false;
      }
      writeState(result.state);
      ui.resetPending = false;
      ui.pendingDirectHint = null;
      ui.formError = null;
      ui.formDrafts = {};
      ui.falsePathError = null;
      ui.falsePathDrafts = {};
      ui.focusFormError = false;
      ui.siteQueries = {};
      setStatus("本机复核会话已清除；公开世界数据没有改变。 ");
      navigate("#/");
    }
  }

  function handleKeydown(event) {
    if (event.key === "Escape") {
      if (ui.resetPending) {
        ui.resetPending = false;
        renderBrowser(false);
      } else if (ui.pendingDirectHint) {
        ui.pendingDirectHint = null;
        renderBrowser(false);
      }
    }
  }

  function initBrowser() {
    rootElement = document.getElementById("app");
    if (!rootElement) return;
    browserState = readState();
    writeState(browserState);
    rootElement.addEventListener("submit", handleSubmit);
    rootElement.addEventListener("click", handleClick);
    document.addEventListener("keydown", handleKeydown);
    window.addEventListener("hashchange", () => renderBrowser(true));
    renderBrowser(false);
  }

  return Object.freeze({
    WORK_TITLE,
    FORUM_UI_META,
    WORKBENCH_SOURCE_KIND_BY_ID,
    escapeHtml,
    documentTitleForRoute,
    forumUiMeta,
    workbenchSourceKind,
    renderRouteToString,
    renderMain,
    renderPublicRecord,
    renderSiteHome,
    renderBeatPanel,
    renderEnding,
    renderNotFound,
    parsePanelAnswers,
    initBrowser,
  });
});

</script>
</body>
</html>
