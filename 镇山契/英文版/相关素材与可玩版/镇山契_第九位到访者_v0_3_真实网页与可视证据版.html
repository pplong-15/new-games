  const REACTION_BY_ID = new Map(WORLD.reactions.map((reaction) => [reaction.id, reaction]));
  const FALSE_BY_ID = new Map(WORLD.falsePaths.map((path) => [path.id, path]));
  const WORK_TITLE = "Mountain-Garrison Compact: Ninth Visitor";
  const FORUM_UI_META = Object.freeze({

        </aside>

          <div class="workbench-primary-pane">
            ${renderReaction(state)}

            ${!state.unreadReaction && state.reactionReadyQueue.length ? `<section class="receipt-ready" aria-labelledby="receipt-ready-title"><p class="assignment-label">The project queue has one record waiting to be taken</p><h2 id="receipt-ready-title">Read the new project receipt first</h2><p>Take one at a time. The next check shows only after you finish reading.</p><button class="primary-action" type="button" data-action="publish-reaction">Read one new project receipt</button></section>` : ""}

  }

  function renderQuestion(question, disabled, currentValue) {
    const disabledAttr = disabled ? " disabled" : "";
    if (question.type === "select") {
      const options = question.options.map((item) => `<option value="${escapeAttr(item.value)}"${currentValue === item.value ? " selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
      return `<label class="question-block"><span>${escapeHtml(question.prompt)}</span><select name="${escapeAttr(question.id)}"${disabledAttr}><option value="">Select</option>${options}</select>${question.help ? `<small>${escapeHtml(question.help)}</small>` : ""}</label>`;
    }
    if (question.type === "radio" || question.type === "checkboxes") {
      const inputType = question.type === "radio" ? "radio" : "checkbox";
      const selectedValues = Array.isArray(currentValue) ? currentValue : [currentValue];
      const options = question.options.map((item) => `<label class="choice-option"><input type="${inputType}" name="${escapeAttr(question.id)}" value="${escapeAttr(item.value)}"${selectedValues.includes(item.value) ? " checked" : ""}${disabledAttr}><span>${escapeHtml(item.label)}</span></label>`).join("");
      return `<fieldset class="question-block"><legend>${escapeHtml(question.prompt)}</legend><div class="choice-list">${options}</div></fieldset>`;
    }
    if (question.type === "order") {
      const rows = question.correct.map((_, index) => {
        const selectedValue = Array.isArray(currentValue) ? currentValue[index] : null;
        const options = question.options.map((item) => `<option value="${escapeAttr(item.value)}"${selectedValue === item.value ? " selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
        return `<label><span>Place ${index + 1}</span><select name="${escapeAttr(question.id)}__${index}"${disabledAttr}><option value="">Select an event</option>${options}</select></label>`;
      }).join("");
      return `<fieldset class="question-block order-question"><legend>${escapeHtml(question.prompt)}</legend><p>Pick each place. Repeats or gaps will not pass.</p><div class="order-grid">${rows}</div></fieldset>`;
    }
    return "";
  }

  function renderHints(state, beat, panelIndex) {
    const panel = beat.panels[panelIndex];
    const key = beat.id + ":" + panelIndex;
    const level = Number(state.hints[key] || 0);
    const shown = panel.hints.slice(0, level).map((hint) => `<li><strong>${hint.level} · ${escapeHtml(hint.label)}</strong><p>${escapeHtml(hint.text)}</p></li>`).join("");
    const pending = ui.pendingDirectHint === key;
    let nextControl = "";
    if (level < 3) {
      nextControl = `<button type="button" data-action="reveal-hint" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}">Open hint level ${level + 1}</button>`;
    } else if (level === 3 && !pending) {
      nextControl = `<button type="button" data-action="reveal-hint" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}">Request the level-4 direct answer</button>`;
    } else if (level === 3 && pending) {
      nextControl = `<div class="direct-hint-confirm" role="alert"><p>Level 4 shows a full executable answer. It does not auto-submit.</p><button type="button" data-action="confirm-direct-hint" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}">Confirm again and show</button><button type="button" data-action="cancel-direct-hint">Cancel</button></div>`;
    } else {
      nextControl = `<p class="hint-complete">All four hint levels are open.</p>`;
    }
    return `<details class="hint-drawer"${level ? " open" : ""}><summary>Graded hints (${level}/4 open)</summary><ol>${shown}</ol>${nextControl}</details>`;
  }

  function renderSourceLinks(state, beat, panelIndex) {
    const routes = beat.panels[panelIndex] ? beat.panels[panelIndex].sourceRoutes : [];
    if (!routes.length) return "";
    return `<aside class="source-links" aria-labelledby="panel-sources-title"><div class="source-links-heading"><span>Step 1</span><h3 id="panel-sources-title">${escapeHtml(workbenchCopyValue("sourceLabel", "This item's sources"))}</h3><p>Open the source materials. Source pages return here. Opening a page does not finish this item by itself.</p></div><ul>${routes.map((route) => {
      const record = RECORD_BY_ROUTE.get(route);
      const opened = state.viewedPublicRoutes.includes(route);
      const site = record ? SITE_BY_ID.get(record.siteId) : null;
      return `<li><a href="${escapeAttr(route)}"><span>${escapeHtml(record ? record.title : route)}</span><small>${escapeHtml(site ? site.shortName : "Source record")}</small></a><b>${opened ? "Opened · view again" : "Open source"}</b></li>`;
    }).join("")}</ul></aside>`;
  }

  function renderPanelNav(state, beat, activeIndex) {
    if (beat.panels.length < 2) return "";
    const done = state.completedPanels[beat.id] || [];
    return `<nav class="panel-nav" aria-label="Screens for this item">${beat.panels.map((panel, index) => {
      const accessible = index <= done.length;
      const status = done.includes(index) ? "Saved" : index === done.length ? "Current" : "Waiting on previous";
      return accessible
        ? `<a href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${index}"${index === activeIndex ? ' aria-current="step"' : ""}><span>${index + 1}</span>${escapeHtml(panel.title)}<small>${status}</small></a>`
        : `<span class="locked-panel" aria-disabled="true"><span>${index + 1}</span>${escapeHtml(panel.title)}<small>${status}</small></span>`;
    }).join("")}</nav>`;
  }

  function renderBeatPanel(state, beat, panelIndex, uiState) {
    const view = uiState || ui;
    const done = state.completedPanels[beat.id] || [];
    const panel = beat.panels[panelIndex];
    if (!panel) return renderNotFound("That panel ID does not exist。", "#/workbench");
    if (panelIndex > done.length) {
      return `<main id="main-content" class="workbench-tool institution-page" tabindex="-1">
        <header class="tool-heading workbench-app-header"><p class="eyebrow">Check type · ${escapeHtml(beat.channel)}</p><h1 id="page-heading" tabindex="-1">${escapeHtml(beat.title)}</h1><p>${escapeHtml(beat.operation)}</p></header>
        <nav class="workbench-toolbar" aria-label="Check toolbar"><a href="#/workbench">Return to workbench</a><span>Current work order is read-only</span></nav>
        <div class="workbench-tool-shell">
          <aside class="tool-task-rail">${renderPanelNav(state, beat, panelIndex)}</aside>
          <section class="tool-primary-pane locked-message"><h2>The previous screen is not saved</h2><p>Sources stay browsable, but check returns must be saved screen by screen with visible actions.</p><a href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${done.length}">Return to the current panel</a></section>
          <aside class="tool-context-rail"><h2>Current access bound</h2><p>Public sources stay directly readable. Check returns follow the saved split-screen order.</p></aside>
        </div>
      </main>`;
    }

    const draftKey = `${beat.id}:${panelIndex}`;
    const values = saved
      ? Core.canonicalAnswers(beat.id, panelIndex, state.recommendedBranch || "A")
      : view.formDrafts && view.formDrafts[draftKey] ? view.formDrafts[draftKey] : {};
    const questions = panel.questions.map((question) => renderQuestion(question, saved, values[question.id])).join("");
    const resultOutput = panel.outputs.filter((output) => output !== "__ENDING__");
    const afterSave = saved ? `<div class="saved-panel" role="status"><strong>This panel is saved.</strong>${resultOutput.length ? "<p>The structured check return is written to the local session.。</p>" : "<p>This is a split-screen checkpoint. The next screen will keep using this check.。</p>"}</div>` : "";
    const nextIndex = panelIndex + 1;
    const savedAction = saved
      ? nextIndex < beat.panels.length
        ? `<a class="primary-link" href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${nextIndex}">Go to the next panel</a>`
        : beat.id === "B18"
          ? `<a class="primary-link" href="#/workbench/beat/B18/result">View agency handling status</a>`
          : `<a class="primary-link" href="#/workbench/beat/${escapeAttr(beat.id)}/result">View this item's return</a>`
      : `<button class="primary-action" type="submit" aria-label="${escapeAttr(beat.actionLabel || workbenchCopyValue("saveLabel", "Save this item's return"))}">${escapeHtml(beat.actionLabel || workbenchCopyValue("saveLabel", "Save this item's return"))}</button>`;
    const returnAction = saved
      ? `<a class="secondary-link" href="#/workbench">Return to workbench</a>`
      : `<button class="secondary-action" type="submit" data-after-save="workbench">${escapeHtml(workbenchCopyValue("saveLabel", "Save this item's return"))} and return to the workbench</button>`;
    const previousAction = panelIndex > 0
      ? `<a class="previous-panel-link" href="#/workbench/beat/${escapeAttr(beat.id)}/panel/${panelIndex - 1}">View previous screen</a>`
      : `<a class="previous-panel-link" href="#/workbench">Return to workbench</a>`;
    return `<main id="main-content" class="workbench-tool institution-page" tabindex="-1">
      <header class="tool-heading workbench-app-header"><p class="eyebrow">Check type · ${escapeHtml(beat.channel)}</p><h1 id="page-heading" tabindex="-1">${escapeHtml(beat.title)}</h1><p>${escapeHtml(beat.operation)}</p></header>
      <nav class="workbench-toolbar" aria-label="Check toolbar"><a href="#/workbench">Return to workbench</a><strong>Work order ${escapeHtml(WORLD.workOrder)}</strong><span>Read-only digital copies</span><span>Panel ${panelIndex + 1} / ${beat.panels.length}</span></nav>
      <div class="workbench-operation-shell">
        <aside class="tool-task-rail" aria-label="Current business steps">
          <h2>Steps for this item</h2>

          <ol class="panel-procedure"><li class="is-current"><span>1</span>Open this item's sources</li><li><span>2</span>Return and fill in</li><li><span>3</span>Save this item's return</li></ol>
          <section class="artifact-cue"><div><h3>Current material</h3><p>${escapeHtml(beat.artifact)}</p></div><div><h3>Check cue</h3><p>${escapeHtml(beat.cue)}</p></div></section>
        </aside>
        <section class="tool-case-area">
          ${renderSourceLinks(state, beat, panelIndex)}
          <section class="tool-primary-pane operation-sheet" aria-labelledby="panel-title">
            <header class="operation-sheet-heading"><div><span>Step 2</span><h2 id="panel-title">${escapeHtml(panel.title)}</h2></div><p>${escapeHtml(panel.instruction)}</p></header>
            ${afterSave}
            ${error && !saved ? `<div class="form-error" role="alert" tabindex="-1" data-form-error>${escapeHtml(error.message)}</div>` : ""}
            <form data-action="submit-panel" data-beat="${escapeAttr(beat.id)}" data-panel="${panelIndex}" novalidate>
              ${questions}
              <div class="form-actions"><div><span>Step 3</span>${savedAction}${returnAction}</div>${previousAction}</div>
            </form>
          </section>
          <div class="tool-support-row">
            ${renderHints(state, beat, panelIndex)}
            <section class="next-question"><h2>Question left after save</h2><p>${escapeHtml(beat.nextQuestion)}</p></section>
          </div>
        </section>
      </div>
    </main>`;

  function renderDispositionStatus(state) {
    const branch = state.recommendedBranch;
    if (!branch) return `<section class="branch-status"><h2>Disposition advice not yet submitted</h2><a href="#/workbench/beat/B18/panel/2">Return to the advice screen</a></section>`;
    const plan = WORLD.plans[branch];
    if (!state.authorizedBranch) {
      return `<section class="branch-status"><p class="receipt-code">Your disposition advice: Plan ${escapeHtml(branch)}</p><h2>Advice is recorded. The agency authorization receipt is not yet read.</h2><p>QC-447 has no approval power. The control below only reads an authorization receipt formed independently by the responsible agency. It is not a handler approval.</p><button type="button" data-action="read-authorization">Read the responsible agency's authorization receipt</button></section>`;
    }
    if (!state.executionComplete) {
      return `<section class="branch-status"><p class="receipt-code">Your advice: Plan ${escapeHtml(branch)} · agency authorization: Plan ${escapeHtml(state.authorizedBranch)}</p><h2>The responsible agency has authorized the same plan</h2><p>${escapeHtml(plan.name)}is in the authorized-handler queue. The control below only reads the execution record.</p><button type="button" data-action="read-execution">Read the authorized handler's execution receipt</button></section>`;
    }
    const r6Read = state.reactionsPosted.includes("R6") && state.unreadReaction !== "R6";
    return r6Read
      ? `<section class="branch-status"><p class="receipt-code">Authorized-handler execution: Plan ${escapeHtml(state.executedBranch)} · complete</p><h2>Project-lead receipt is read. This-round handling receipt is formed.</h2><a class="primary-link" href="#/end/${escapeAttr(state.executedBranch)}">Open the full handling receipt</a></section>`
      : `<section class="branch-status"><p class="receipt-code">Authorized-handler execution: Plan ${escapeHtml(state.executedBranch)} · complete</p><h2>The project lead still has one final receipt</h2><p>Return to the project workbench, read the receipt, then open the full handling receipt.</p><a class="primary-link" href="#/workbench">Return to the project workbench</a></section>`;
  }

  function renderBeatResultLines(beat) {
    if (!beat || !Array.isArray(beat.resultLines) || !beat.resultLines.length) return "";
    return `<section class="result-line-register" aria-labelledby="result-lines-title"><h2 id="result-lines-title">What this check recorded</h2><dl>${beat.resultLines.map((line) => `<div data-result-status="${escapeAttr(line.status || "recorded")}"><dt>${escapeHtml(line.label || "Recorded")}</dt><dd>${escapeHtml(line.text || "")}</dd></div>`).join("")}</dl></section>`;
  }

  function renderBeatResult(state, beat, uiState) {
    if (beat.id === "B18") {
      return `<main id="main-content" class="workbench-result institution-page" tabindex="-1">
        <header class="receipt-header workbench-app-header"><p class="eyebrow">Project handling status</p><h1 id="page-heading" tabindex="-1">Source check, advice, authorization, and execution</h1></header>
        <nav class="workbench-toolbar" aria-label="Handling-status toolbar"><a href="#/workbench">Return to workbench</a><span>Advice kept apart from approval</span><span>Authorized-handler execution</span></nav>
        <div class="receipt-system-layout"><section class="receipt-primary-pane">${renderDispositionStatus(state)}</section><aside class="receipt-context-rail"><h2>Return to check materials</h2><a href="#/workbench/beat/B18/panel/0">Return to the three source cards</a><a href="#/workbench/beat/B18/panel/1">Return to the two-plan preview</a></aside></div>
      </main>`;
    }
    if (!state.completedBeats.includes(beat.id)) {
      const done = (state.completedPanels[beat.id] || []).length;
      return renderBeatPanel(state, beat, Math.min(done, beat.panels.length - 1), uiState);
    }
    const nextIndex = WORLD.beats.findIndex((item) => item.id === beat.id) + 1;
    const nextBeat = WORLD.beats[nextIndex];
    const nextAction = milestoneBeats.has(beat.id)
      ? `<a class="primary-link" href="#/workbench">Return to the workbench for the new receipt</a>`
      : nextBeat ? `<a class="primary-link" href="#/workbench/beat/${escapeAttr(nextBeat.id)}/panel/0">Go to the next check</a>` : "";
    const predictionReceipt = beat.id === "B17"
      ? state.predictionIntegrity === "blind"
        ? `<section class="prediction-receipt"><h2>Order of this comparison</h2><p>You sealed the third-night calculation first, then opened the first report for comparison.</p></section>`
        : `<section class="prediction-receipt"><h2>Order of this comparison</h2><p>You had already seen the first report before sealing the calculation. The conditional conclusion still holds; this round is not counted as calculate-then-look.</p></section>`
      : "";
    return `<main id="main-content" class="workbench-result institution-page" tabindex="-1">
      <header class="receipt-header workbench-app-header"><p class="eyebrow">Structured check return</p><h1 id="page-heading" tabindex="-1">${escapeHtml(beat.title)}: saved</h1></header>
      <nav class="workbench-toolbar" aria-label="Return-form toolbar"><a href="#/workbench">Return to workbench</a><span>Local check return</span></nav>
      <div class="receipt-system-layout">
        <section class="receipt-primary-pane"><section class="derived-receipt"><h2>Bound of this check</h2><p>${escapeHtml(beatBoundaries[beat.id])}</p>${renderBeatResultLines(beat)}<h2>Still to ask</h2><p>${escapeHtml(beat.nextQuestion)}</p></section>${predictionReceipt}</section>
        <aside class="receipt-context-rail"><h2>Next actions</h2><div class="result-actions"><a href="#/workbench/beat/${escapeAttr(beat.id)}/panel/0">Return to this item's materials</a>${nextAction}</div></aside>
      </div>
    </main>`;
  }

  function renderBeatRoute(state, routeInfo, uiState) {
    const beatId = routeInfo.match[0];
    const beat = Core.getBeat(beatId);
    if (!beat) return renderNotFound("There is no such check record.", "#/workbench");
    if (!Core.canAccessBeat(state, beatId)) {
      return `<main id="main-content" class="workbench-tool institution-page" tabindex="-1"><header class="workbench-app-header"><p class="eyebrow">Work-order queue</p><h1 id="page-heading" tabindex="-1">This check is not on the current work order yet</h1></header><nav class="workbench-toolbar" aria-label="Check toolbar"><a href="#/workbench">Return to workbench</a></nav><section class="system-message"><p>Known full addresses still open their pages. Workbench returns follow the saved prerequisite order.</p><a class="primary-link" href="${escapeAttr(currentPanelRoute(state))}">Return to the current check</a></section></main>`;
    }
    if (routeInfo.route.endsWith("/result")) return renderBeatResult(state, beat, uiState);
    const requested = routeInfo.match[1] == null ? (state.completedPanels[beat.id] || []).length : Number(routeInfo.match[1]);
    const panelIndex = Math.min(Number.isInteger(requested) ? requested : 0, beat.panels.length - 1);
    return renderBeatPanel(state, beat, panelIndex, uiState);
  }

  function renderFalsePath(state, routeInfo, uiState) {
    const view = uiState || ui;
    const falseId = routeInfo.match[0];
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return renderNotFound("There is no such public-record chain.", "#/workbench");
    const branch = state.falsePaths[falseId];
    const seen = path.steps.filter((step) => branch.stepsSeen.includes(step.id));
    const nextStep = path.steps[branch.stepsSeen.length] || null;
    const seenList = seen.map((step) => {
      const record = RECORD_BY_ROUTE.get(step.sourceRoute);
      return `<li><a href="${escapeAttr(step.sourceRoute)}">${escapeHtml(record ? record.title : step.title)}</a><span>Fields are logged on this see-also check</span></li>`;
    }).join("");
    const selectedConclusion = view.falsePathDrafts && view.falsePathDrafts[falseId] ? view.falsePathDrafts[falseId] : "";
    const conclusionError = view.falsePathError && view.falsePathError.falseId === falseId ? view.falsePathError : null;

          ${conclusionForm}
          ${branch.closed ? `<section class="chain-closure"><h2>How this connection closes</h2><p>${escapeHtml(path.closure)}</p><p><strong>Method: </strong>${escapeHtml(path.method)}</p><p><strong>Bound: </strong>${escapeHtml(path.boundary)}</p><p class="receipt-code">Limited exclusion saved. It does not enter the current QC gates.</p></section>` : ""}

  function renderSiteHome(siteId, uiOverrides) {
    const site = SITE_BY_ID.get(siteId);
    if (!site || siteId === "workbench") return renderNotFound("This site does not exist.", "#/workbench");
    const query = uiOverrides && uiOverrides.siteQueries ? uiOverrides.siteQueries[siteId] || "" : ui.siteQueries[siteId] || "";
    const result = Core.searchRecords(siteId, query);
    const noResult = (result.kind === "miss" || result.kind === "multi" || result.kind === "invalid") && result.count === 0
      ? `<div class="site-empty"><h2>No matching records</h2><p>${escapeHtml(result.message || "Try another word from a page you already read.")}</p></div>`
      : result.kind === "empty"
        ? `<div class="site-empty"><p>${escapeHtml(result.message)}</p></div>`
        : result.kind === "forbidden"
          ? `<div class="site-empty"><h2>This file is forbidden</h2><p>${escapeHtml(result.message)}</p></div>`
          : "";
    if (siteId === "forum") return renderForumHome(site, query, result, noResult);
    if (siteId === "archive") return renderArchiveHome(site, query, result, noResult);
    if (siteId === "folk") return renderFolkHome(site, query, result, noResult);
    if (siteId === "news") return renderNewsHome(site, query, result, noResult);
    return renderGeologyHome(site, query, result, noResult);
  }

  function renderEnding(state, branch) {
    const finalReceiptRead = state.reactionsPosted.includes("R6") && state.unreadReaction !== "R6" && !state.reactionReadyQueue.includes("R6");
    if (!state.executionComplete || state.executedBranch !== branch || state.ending !== "ENDING-" + branch || !finalReceiptRead) {
      const pendingMessage = state.executionComplete && state.executedBranch === branch
        ? "Authorized-handler execution is complete, but the project lead's final receipt is not yet read. Return to the workbench first.。"
        : "Disposition advice、Agency authorization and authorized-handler execution must be recorded separately. Opening an address directly cannot skip those business nodes.。";
      return `<main id="main-content" class="ending-page pending-ending institution-page" tabindex="-1"><header class="endpoint-header workbench-app-header"><p class="eyebrow">Project execution receipt</p><h1 id="page-heading" tabindex="-1">Final receipt is not yet formed</h1></header><nav class="workbench-toolbar" aria-label="Endpoint-receipt toolbar"><a href="#/workbench">Return to the project workbench</a><span>Receipt status: waiting</span></nav><section class="system-message pending-endpoint-message"><p>${escapeHtml(pendingMessage)}</p><a class="primary-link" href="#/workbench">Return to the project workbench</a></section></main>`;
    }
    const ending = WORLD.endings[branch];
    const plan = WORLD.plans[branch];
    const optional = state.optionalConclusions.length
      ? `<section><h2>Optional exclusions you actually closed</h2><ul>${state.optionalConclusions.map((item) => {
        const path = FALSE_BY_ID.get(item.via);
        return `<li>${escapeHtml(path ? path.title : "A related-record link")}: this claim no longer fits</li>`;
      }).join("")}</ul></section>`
      : "";
    return `<main id="main-content" class="ending-page ending-${escapeAttr(branch)} institution-page" tabindex="-1">
      <header class="endpoint-header workbench-app-header"><p class="eyebrow">Project execution receipt · Plan ${escapeHtml(branch)}</p><h1 id="page-heading" tabindex="-1">This-round QC is finished</h1><p>Work order ${escapeHtml(WORLD.workOrder)} · QC-447</p></header>
      <nav class="workbench-toolbar" aria-label="Endpoint-receipt toolbar"><a href="#/workbench">Return to the completed work order</a><span>Receipt status: formed</span><button type="button" data-action="request-reset">Clear local QC session and start over</button></nav>
      <dl class="endpoint-ledger endpoint-status-grid">
        <div><dt>Work-order status</dt><dd>Submitted; this-round QC complete</dd></div>
        <div><dt>Chosen disposition</dt><dd>${escapeHtml(ending.selected)}</dd></div>
        <div><dt>Live execution</dt><dd>Complete</dd></div>
        <div><dt>Original files</dt><dd>Not rewritten</dd></div>
        <div><dt>Unresolved questions</dt><dd>Expandable</dd></div>
        <div><dt>Chapter end</dt><dd>Approved materials for this round are checked</dd></div>
      </dl>
      <div class="endpoint-body-grid"><section class="endpoint-primary-pane"><section class="execution-summary"><h2>Authorized-handler execution record</h2><p>${escapeHtml(ending.execution)}</p><p>${escapeHtml(ending.observed)}</p><p><strong>Professional bound: </strong>${escapeHtml(plan.outcome)}</p></section><section class="shared-ending-boundary"><h2>Check bounds neither disposition changes</h2><p>The old-index SoleActor link is ruled out. The three children have been renamed separately. Natural mechanism is sufficient. Child-death responsibility, whether the compact was received or withdrawn, and extra supernatural causation are not established by these sources, and they are not disproved either.</p></section></section><aside class="endpoint-context-rail"><details class="unresolved-list"><summary>Expand questions still unresolved</summary><ul>${WORLD.unresolved.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></details>${optional}</aside></div>
      <div class="ending-actions"><a href="#/workbench">Return to the completed work order</a><button type="button" data-action="request-reset">Clear local QC session and start over</button></div>
      ${renderResetDialog()}
    </main>`;
  }

  function renderNotFound(message, safeHref) {
    return `<main id="main-content" class="not-found institution-page system-error-page" tabindex="-1"><header class="system-error-header"><p class="error-code">404 / not listed</p><h1 id="page-heading" tabindex="-1">This address has no matching public record</h1></header><section class="system-message"><p>${escapeHtml(message || "Check the record number, site bound, and address format.")}</p><a class="primary-link" href="${escapeAttr(safeHref || "#/workbench")}">Return to a safe entry</a></section></main>`;
  }

  function renderMain(route, state, uiOverrides) {
    const routeInfo = Core.resolveRoute(route);
    if (routeInfo.type === "landing") return renderLanding();
    if (routeInfo.type === "workbench") return renderWorkbench(state);
    if (routeInfo.type === "beat") return renderBeatRoute(state, routeInfo, uiOverrides || ui);
    if (routeInfo.type === "false") return renderFalsePath(state, routeInfo, uiOverrides || ui);
    if (routeInfo.type === "site") return renderSiteHome(routeInfo.match[0], uiOverrides);
    if (routeInfo.type === "record") return renderPublicRecord(routeInfo.record, state);
    if (routeInfo.type === "ending") return renderEnding(state, routeInfo.match[0]);
    return renderNotFound("This address is not on the exact-route list. Public records do not fall back to a wide prefix.", state.sessionStarted ? "#/workbench" : "#/");
  }

  function renderRouteToString(route, state, uiOverrides) {
    const normalized = Core.normalizeState(state || Core.createInitialState());
    const routeInfo = Core.resolveRoute(route || "#/");
    return `${renderSessionBar(routeInfo, normalized)}${renderStorageNotice()}${renderStatusLive()}${renderMain(route || "#/", normalized, uiOverrides || ui)}`;
  }

  function parsePanelAnswers(form, beatId, panelIndex) {
    const beat = Core.getBeat(beatId);
    const panel = beat && beat.panels[panelIndex];
    if (!panel) return {};
    const answers = {};
    for (const question of panel.questions) {
      if (question.type === "checkboxes") {
        answers[question.id] = Array.from(form.querySelectorAll(`input[name="${question.id}"]:checked`)).map((input) => input.value);
      } else if (question.type === "radio") {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        answers[question.id] = selected ? selected.value : "";
      } else if (question.type === "order") {
        answers[question.id] = question.correct.map((_, index) => {
          const select = form.querySelector(`select[name="${question.id}__${index}"]`);
          return select ? select.value : "";
        });
      } else {
        const field = form.elements.namedItem(question.id);
        answers[question.id] = field ? field.value : "";
      }
    }
    return answers;
  }

  function setStatus(message) {
    ui.statusMessage = message || "";
  }

  function navigate(hash) {
    if (typeof location === "undefined") return;
    if (location.hash === hash) {
      renderBrowser(true);
    } else {
      location.hash = hash;
    }
  }

  function renderBrowser(focusHeading) {
    if (!rootElement) return;
    const route = currentHash();
    const routeInfo = Core.resolveRoute(route);
    const routeChanged = ui.lastRoute !== null && ui.lastRoute !== route;
    if (routeChanged) {
      ui.formError = null;
      ui.falsePathError = null;
      ui.focusFormError = false;
    }
    const deliberatelyEnteredWorkbench = routeInfo.type === "workbench" && ui.lastRoute !== route;
    if (deliberatelyEnteredWorkbench && browserState.sessionStarted && !browserState.unreadReaction && browserState.reactionReadyQueue.length) {
      const published = Core.publishNextReaction(browserState);
      if (published.ok) writeState(published.state);
    }
    if (routeInfo.type === "record") {
      const viewed = Core.markPublicViewed(browserState, route);
      if (viewed.ok) writeState(viewed.state);
    }
    document.title = documentTitleForRoute(route);
    rootElement.innerHTML = renderRouteToString(route, browserState, ui);
    const shouldFocus = focusHeading || ui.lastRoute !== route;
    ui.lastRoute = route;
    if (ui.focusFormError) {
      const error = rootElement.querySelector("[data-form-error]");
      if (error) error.focus({ preventScroll: false });
      ui.focusFormError = false;
    } else if (shouldFocus) {
      const heading = rootElement.querySelector("#page-heading");
      if (heading) heading.focus({ preventScroll: true });
      if (typeof window !== "undefined" && typeof window.scrollTo === "function") window.scrollTo({ top: 0, left: 0, behavior: "auto" });
    }
  }

  function handleSubmit(event) {
    const form = event.target;
    if (!(form instanceof HTMLFormElement)) return;
    const action = form.dataset.action;
    if (!action) return;
    event.preventDefault();
    if (action === "submit-panel") {
      const beatId = form.dataset.beat;
      const panelIndex = Number(form.dataset.panel);
      const returnToWorkbench = Boolean(event.submitter && event.submitter.dataset.afterSave === "workbench");
      const answers = parsePanelAnswers(form, beatId, panelIndex);
      const result = Core.submitPanel(browserState, beatId, panelIndex, answers);
      writeState(result.state);
      setStatus(result.message);
      if (result.ok) {
        delete ui.formDrafts[`${beatId}:${panelIndex}`];
        ui.formError = null;
        ui.focusFormError = false;
        if (returnToWorkbench) navigate("#/workbench");
        else if (result.pending === "authorization") navigate("#/workbench/beat/B18/result");
        else if (result.nextPanel != null) navigate(`#/workbench/beat/${beatId}/panel/${result.nextPanel}`);
        else navigate(`#/workbench/beat/${beatId}/result`);
      } else {
        ui.formDrafts[`${beatId}:${panelIndex}`] = JSON.parse(JSON.stringify(answers));
        ui.formError = { beatId, panelIndex, message: result.message };
        ui.focusFormError = true;
        renderBrowser(false);
      }
      return;
    }
    if (action === "site-search") {
      const siteId = form.dataset.site;
      const input = form.elements.namedItem("query");
      const q = input ? String(input.value).trim() : "";
      ui.siteQueries[siteId] = q;
      setStatus(q
        ? `Site search finished: ${q}`
        : "Enter one search word.");
      renderBrowser(false);
      return;
    }
    if (action === "false-conclusion") {
      const selected = form.querySelector('input[name="conclusion"]:checked');
      const falseId = form.dataset.false;
      const selectedValue = selected ? selected.value : "";
      const result = Core.submitFalsePathConclusion(browserState, falseId, selectedValue);
      writeState(result.state);
      setStatus(result.message);
      if (result.ok) {
        delete ui.falsePathDrafts[falseId];
        ui.falsePathError = null;
        ui.focusFormError = false;
      } else {
        ui.falsePathDrafts[falseId] = selectedValue;
        ui.falsePathError = { falseId, message: result.message };
        ui.focusFormError = true;
      }
      renderBrowser(false);
    }
  }

  function handleClick(event) {
    const reactionLink = event.target.closest("[data-reaction-read]");
    if (reactionLink) {
      const result = Core.markReactionRead(browserState, reactionLink.dataset.reactionRead);
      if (result.ok) writeState(result.state);
      return;
    }
    const control = event.target.closest("[data-action]");
    if (!control) return;
    const action = control.dataset.action;
    if (action === "start-session") {
      const result = Core.startSession(browserState);
      writeState(result.state);
      setStatus("Local QC session started. The workbench has not touched any original.");
      navigate("#/workbench");
    } else if (action === "dismiss-reaction") {
      const result = Core.markReactionRead(browserState, control.dataset.reaction);
      if (result.ok) writeState(result.state);
      setStatus("Project receipt marked read. ");
      renderBrowser(false);
    } else if (action === "reveal-hint") {
      const beatId = control.dataset.beat;
      const panelIndex = Number(control.dataset.panel);
      const result = Core.revealHint(browserState, beatId, panelIndex);
      if (result.code === "DIRECT_CONFIRM_REQUIRED") {
        ui.pendingDirectHint = beatId + ":" + panelIndex;
      } else if (result.ok) {
        writeState(result.state);
        setStatus(`Hint level ${result.level} is open.`);
      }
      renderBrowser(false);
    } else if (action === "confirm-direct-hint") {
      const beatId = control.dataset.beat;
      const panelIndex = Number(control.dataset.panel);
      const result = Core.revealHint(browserState, beatId, panelIndex, { confirmDirect: true });
      if (result.ok) writeState(result.state);
      ui.pendingDirectHint = null;
      setStatus("Level-4 direct answer is open; nothing was auto-submitted. ");
      renderBrowser(false);
    } else if (action === "cancel-direct-hint") {
      ui.pendingDirectHint = null;
      renderBrowser(false);
    } else if (action === "enter-false") {
      const result = Core.enterFalsePath(browserState, control.dataset.false);
      writeState(result.state);
      setStatus("In-page see-also is on this local check. It does not change the current work-order gates. ");
      navigate(`#/workbench/false/${control.dataset.false}`);
    } else if (action === "excerpt-false-source") {
      const result = Core.advanceFalsePath(browserState, control.dataset.false, control.dataset.step);
      writeState(result.state);
      setStatus("Ordinary fields from this page are excerpted. Return to the see-also check. ");
      navigate(`#/workbench/false/${control.dataset.false}`);
    } else if (action === "publish-reaction") {
      const result = Core.publishNextReaction(browserState);
      writeState(result.state);
      setStatus(result.message);
      renderBrowser(false);
    } else if (action === "read-authorization") {
      const result = Core.authorizeRecommended(browserState);
      writeState(result.state);
      setStatus(result.message);
      renderBrowser(false);
    } else if (action === "read-execution") {
      const result = Core.executeAuthorized(browserState);
      writeState(result.state);
      setStatus(result.message);
      if (result.ok) navigate("#/workbench");
      else renderBrowser(false);
    } else if (action === "request-reset") {
      ui.resetPending = true;
      renderBrowser(false);
      const dialog = rootElement.querySelector(".reset-dialog button");
      if (dialog) dialog.focus();
    } else if (action === "cancel-reset") {
      ui.resetPending = false;
      renderBrowser(false);
    } else if (action === "confirm-reset") {
      const result = Core.resetState(browserState);
      try {
        if (typeof localStorage !== "undefined") localStorage.removeItem(WORLD.storageKey);
      } catch (error) {
        storageAvailable = false;
      }
      writeState(result.state);
      ui.resetPending = false;
      ui.pendingDirectHint = null;
      ui.formError = null;
      ui.formDrafts = {};
      ui.falsePathError = null;
      ui.falsePathDrafts = {};
      ui.focusFormError = false;
      ui.siteQueries = {};
      setStatus("Local QC session cleared. Public world data did not change. ");
      navigate("#/");
    }
  }

  function handleKeydown(event) {
    if (event.key === "Escape") {
      if (ui.resetPending) {
        ui.resetPending = false;
        renderBrowser(false);
      } else if (ui.pendingDirectHint) {
        ui.pendingDirectHint = null;
        renderBrowser(false);
      }
    }
  }

  function initBrowser() {
    rootElement = document.getElementById("app");
    if (!rootElement) return;
    browserState = readState();
    writeState(browserState);
    rootElement.addEventListener("submit", handleSubmit);
    rootElement.addEventListener("click", handleClick);
    document.addEventListener("keydown", handleKeydown);
    window.addEventListener("hashchange", () => renderBrowser(true));
    renderBrowser(false);
  }

  return Object.freeze({
    WORK_TITLE,
    FORUM_UI_META,
    WORKBENCH_SOURCE_KIND_BY_ID,
    escapeHtml,
    documentTitleForRoute,
    forumUiMeta,
    workbenchSourceKind,
    renderRouteToString,
    renderMain,
    renderPublicRecord,
    renderSiteHome,
    renderBeatPanel,
    renderEnding,
    renderNotFound,
    parsePanelAnswers,
    initBrowser,
  });
});

</script>
</body>
</html>
