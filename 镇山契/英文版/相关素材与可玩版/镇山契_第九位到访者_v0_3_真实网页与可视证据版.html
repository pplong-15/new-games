<!doctype html>
<html lang="en">
<head>

  <title>Mountain-Garrison Compact: Ninth Visitor | fictional playable prototype</title>
  <style>
/* inlined: styles.css */
:root {
  color-scheme: light;
  --ink: #20221f;
  --muted: #64675f;
  --paper: #f5f1e7;
  --canvas: #d7d1c4;
  --line: #aaa394;
  --navy: #23333c;
  --navy-2: #344953;
  --accent: #315b5b;
  --focus: #176f78;
  --warning: #6d4f28;
  --danger: #70423d;
  --radius: 3px;
  --shadow: 0 14px 36px rgba(33, 31, 25, 0.13);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Segoe UI", "Segoe UI", "Segoe UI", sans-serif;
  font-synthesis: none;
  line-height: 1.65;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--canvas);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    linear-gradient(rgba(255, 255, 255, 0.17) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
    var(--canvas);
  background-size: 28px 28px;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button,
select,
input[type="search"] {
  min-height: 46px;
}

button,
a,
summary,
.choice-option {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: #254f55;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

nav a,
main a,
button,
summary {
  min-height: 44px;
}

main a {
  display: inline-flex;
  align-items: center;
  padding: 6px 2px;
}

button {
  border: 1px solid #6f746c;
  border-radius: var(--radius);
  padding: 9px 15px;
  background: #f7f5ef;
  cursor: pointer;
}

button:hover,
a:hover {
  filter: brightness(0.94);
}

button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

button:disabled,
select:disabled,
input:disabled {
  cursor: not-allowed;
  opacity: 0.7;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1,
h2,
h3 {
  line-height: 1.3;
}

h1 {
  font-size: clamp(1.8rem, 4vw, 3rem);
  letter-spacing: 0.02em;
}

h2 {
  font-size: clamp(1.18rem, 2.4vw, 1.55rem);
}

h3 {
  font-size: 1.05rem;
}

#page-heading:focus,
main[tabindex="-1"]:focus {
  outline: none;
}

dl,
ol,
ul {
  margin-top: 0;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.skip-link {
  position: fixed;
  top: 4px;
  left: 8px;
  z-index: 100;
  min-height: 44px;
  padding: 10px 14px;
  color: #fff;
  background: #16282e;
  transform: translateY(-120%);
}

.skip-link:focus {
  transform: translateY(0);
}

.session-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  min-height: 52px;
  padding: 0 10px;
  color: #eef1eb;
  background: #1f3037;
  border-bottom: 1px solid #0d171b;
  box-shadow: 0 4px 18px rgba(16, 20, 20, 0.22);
}

.session-bar > * {
  display: inline-flex;
  align-items: center;
  min-width: 0;
  min-height: 44px;
  margin: 4px 0;
}

.session-bar a {
  color: #f3f1e7;
  text-decoration: none;
}

.session-brand {
  flex: 0 0 auto;
  padding: 0 8px;
  border-right: 1px solid #627179;
  font-family: "Songti SC", SimSun, serif;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.session-id {
  flex: 0 0 auto;
  color: #bdcac8;
  font-size: 0.78rem;
  white-space: nowrap;
}

.session-location {
  flex: 1 1 auto;
  overflow: hidden;
  color: #fff;
  font-size: 0.86rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.workbench-return,
.session-bar button,
.session-bar .excerpt-status {
  flex: 0 0 auto;
  justify-content: center;
  padding: 0 10px;
  border: 1px solid #7c8b90;
  border-radius: 2px;
  font-size: 0.78rem;
  white-space: nowrap;
}

.session-bar button {
  min-height: 44px;
  margin: 4px 0;
  color: #152226;
  background: #d5ded8;
}

.session-bar .excerpt-status {
  color: #d7dfda;
  border-style: dashed;
}

.session-record-actions {
  display: flex;
  flex: 0 1 auto;
  gap: 4px;
  max-width: min(46vw, 520px);
  overflow-x: auto;
  scrollbar-width: none;
}

.session-record-actions::-webkit-scrollbar {
  display: none;
}

.session-record-actions > * {
  flex: 0 0 auto;
}

.session-record-actions button,
.session-record-actions .excerpt-status {
  margin: 0;
}

.storage-notice {
  padding: 10px max(16px, calc((100% - 1040px) / 2));
  color: #f9f7ee;
  background: #72563b;
}

.app-shell > main,
.app-shell > .storage-notice + main {
  width: min(1040px, calc(100% - 32px));
  margin: 28px auto 64px;
}

.eyebrow,
.assignment-label,
.reaction-label,
.panel-count,
.catalog-id,
.paper-date,
.receipt-code {
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.primary-action,
.primary-link {
  justify-content: center;
  min-height: 48px;
  padding: 10px 18px;
  color: #fff;
  background: var(--navy);
  border: 1px solid #15262d;
  border-radius: var(--radius);
  font-weight: 700;
  text-decoration: none;
}

.danger-action,
.reset-trigger {
  color: #fff;
  background: var(--danger);
  border-color: #58302c;
}

/* Opening file */
.landing-page {
  position: relative;
  width: min(860px, calc(100% - 32px)) !important;
  margin-top: 48px !important;
}

.opening-file {
  position: relative;
  padding: clamp(24px, 6vw, 64px);
  background: #ede6d4;
  border: 1px solid #9f9888;
  box-shadow: var(--shadow);
}

.opening-file::before {
  content: "QA-26-0813-447";
  position: absolute;
  top: 18px;
  right: 22px;
  padding: 4px 9px;
  color: #5b5244;
  border: 1px solid #8c8373;
  font: 0.72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  transform: rotate(-1deg);
}

.opening-file h1 {
  max-width: 14em;
  margin: 0 0 12px;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: clamp(2.2rem, 6vw, 3.8rem);
  font-weight: 650;
  letter-spacing: 0.07em;
}

.subtitle {
  max-width: 48em;
  padding-bottom: 24px;
  color: #49493f;
  border-bottom: 1px solid #9b9485;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 1.08rem;
}

.prototype-notice,
.content-note {
  margin: 24px 0;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid #b3aa99;
}

.prototype-notice summary,
.content-note summary,
.filter-details summary,
.hint-drawer summary,
.unresolved-list summary {
  display: flex;
  align-items: center;
  font-weight: 700;
  cursor: pointer;
}

.prototype-notice p:last-child,
.content-note p:last-child {
  margin-bottom: 0;
}

.creator-contract,
.endpoint-ledger,
.record-metadata {
  display: grid;
  gap: 1px;
  padding: 1px;
  background: #aaa394;
}

.creator-contract > div,
.endpoint-ledger > div,
.record-metadata > div {
  display: grid;
  grid-template-columns: minmax(110px, 0.32fr) 1fr;
  gap: 14px;
  padding: 12px 14px;
  background: #f7f3e9;
}

dt {
  color: #4e544f;
  font-weight: 700;
}

dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.offline-note {
  margin: 20px 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}

/* Workbench */
.workbench-page,
.workbench-tool,
.workbench-result,
.related-chain,
.workbench-source,
.ending-page,
.not-found {
  background: #f3f1ea;
  border: 1px solid #9ca29e;
  box-shadow: var(--shadow);
}

.workbench-page,
.workbench-result,
.related-chain,
.ending-page,
.not-found {
  padding: clamp(20px, 4vw, 44px);
}

.workbench-heading,
.tool-heading {
  padding-bottom: 18px;
  border-bottom: 3px double #7d8885;
}

.workbench-heading h1,
.tool-heading h1,
.controlled-source-header h1 {
  margin-bottom: 8px;
}

.current-assignment,
.receipt-ready {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 24px;
  margin: 22px 0;
  padding: 20px;
  background: #e3e9e5;
  border: 1px solid #84908b;
  border-left: 6px solid #425f60;
}

.receipt-ready .primary-action {
  grid-column: 2;
  grid-row: 1 / span 3;
}

.current-assignment h2,
.receipt-ready h2,
.current-assignment p,
.receipt-ready p {
  margin-bottom: 4px;
}

.project-reaction {
  margin: 22px 0;
  padding: 20px;
  color: #e9eee9;
  background: #273940;
  border-left: 6px solid #98aaa5;
}

.project-reaction .reaction-label {
  color: #aabdb8;
}

.project-reaction blockquote {
  margin: 12px 0;
  padding: 4px 0 4px 18px;
  border-left: 1px solid #90a29e;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 1.05rem;
}

.reaction-actions,
.result-actions,
.form-actions,
.ending-actions,
.dialog-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.project-reaction a,
.project-reaction button {
  color: #18262b;
  background: #e9ece5;
  border-color: #b7c3bf;
}

.workbench-columns {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.8fr);
  gap: 30px;
  margin-top: 28px;
}

.workbench-columns aside {
  padding-left: 24px;
  border-left: 1px solid #a6ada8;
}

.human-receipts,
.opened-sources,
.ordinary-jobs,
.related-records,
.source-links ul {
  padding: 0;
  list-style: none;
}

.human-receipts li,
.opened-sources li,
.ordinary-jobs li,
.related-records li,
.source-links li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  min-height: 52px;
  padding: 7px 9px;
  border-bottom: 1px solid #c3c7c1;
}

.human-receipts li {
  grid-template-columns: minmax(130px, 0.42fr) 1fr;
  align-items: start;
}

.opened-sources span,
.ordinary-jobs span:last-child,
.related-records span,
.source-links span {
  color: var(--muted);
  font-size: 0.8rem;
}

.reset-trigger {
  margin-top: 30px;
}

/* Work panels */
.workbench-tool {
  overflow: hidden;
}

.tool-heading,
.artifact-cue,
.source-links,
.operation-sheet,
.hint-drawer,
.next-question,
.locked-message {
  margin-right: clamp(18px, 4vw, 42px);
  margin-left: clamp(18px, 4vw, 42px);
}

.tool-heading {
  margin-top: clamp(22px, 4vw, 42px);
}

.panel-nav {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1px;
  margin: 24px 0;
  padding: 1px;
  background: #9ca7a3;
}

.panel-nav > a,
.panel-nav > .locked-panel {
  display: grid;
  grid-template-columns: 32px 1fr;
  grid-template-rows: auto auto;
  align-items: center;
  min-height: 68px;
  padding: 9px 12px;
  background: #eef0eb;
  text-decoration: none;
}

.panel-nav > a[aria-current="step"] {
  background: #d7e1dc;
  box-shadow: inset 0 -4px #496c68;
}

.panel-nav > * > span:first-child {
  grid-row: 1 / span 2;
  font: 700 1rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
}

.panel-nav small {
  color: var(--muted);
}

.locked-panel {
  color: #737872;
}

.artifact-cue {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin-top: 22px;
  margin-bottom: 22px;
  padding: 1px;
  background: #adb1aa;
}

.artifact-cue > div {
  padding: 18px;
  background: #ebe9e1;
}

.artifact-cue h2 {
  margin-bottom: 6px;
  font-size: 0.95rem;
}

.artifact-cue p {
  margin-bottom: 0;
}

.source-links {
  padding: 18px;
  background: #e8e6de;
  border: 1px solid #a7aba5;
}

.source-links h3,
.source-links > p {
  margin-bottom: 6px;
}

.operation-sheet {
  margin-top: 24px;
  margin-bottom: 24px;
  padding: clamp(18px, 4vw, 34px);
  background: #fffdf7;
  border: 1px solid #999e98;
}

.question-block {
  display: block;
  margin: 22px 0;
  padding: 0;
  border: 0;
}

.question-block > span,
.question-block > legend,
.false-conclusion legend {
  margin-bottom: 8px;
  font-weight: 700;
}

.question-block select,
.question-block > select {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 8px 36px 8px 12px;
  background: #f8f6ef;
  border: 1px solid #777e78;
}

.choice-list {
  display: grid;
  gap: 8px;
}

.choice-option {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 10px;
  align-items: center;
  min-height: 48px;
  padding: 8px 12px;
  background: #f1f0e9;
  border: 1px solid #a5aaa4;
  cursor: pointer;
}

.choice-option:has(input:checked) {
  background: #dce8e3;
  border-color: #4a6f69;
}

.choice-option input {
  width: 20px;
  height: 20px;
  margin: 0;
}

.order-grid {
  display: grid;
  gap: 9px;
}

.order-grid label {
  display: grid;
  grid-template-columns: 76px 1fr;
  align-items: center;
}

.order-grid select {
  width: 100%;
}

.saved-panel,
.form-error,
.locked-message {
  margin: 16px 0;
  padding: 14px 16px;
  border-left: 5px solid #56736e;
  background: #e2ebe6;
}

.form-error {
  color: #562f2c;
  background: #eee2df;
  border-color: #80534c;
}

.hint-drawer {
  margin-top: 20px;
  margin-bottom: 20px;
  padding: 0 16px 16px;
  background: #e7e5dc;
  border: 1px solid #a7a69c;
}

.hint-drawer ol {
  padding-left: 1.4rem;
}

.hint-drawer li {
  padding: 10px 0;
  border-bottom: 1px solid #c3c1b8;
}

.direct-hint-confirm {
  padding: 15px;
  background: #ece2cf;
  border: 1px solid #9d835e;
}

.next-question {
  margin-top: 24px;
  margin-bottom: 36px;
  padding: 18px 20px;
  color: #e9eee9;
  background: #2f4146;
}

.derived-receipt,
.branch-status,
.chain-premise,
.next-source,
.chain-closure,
.execution-summary,
.shared-ending-boundary {
  margin: 22px 0;
  padding: 20px;
  background: #eceae2;
  border: 1px solid #a8aaa3;
}

/* Controlled workbench attachment */
.workbench-source {
  padding-bottom: 34px;
}

.controlled-source-header {
  padding: clamp(22px, 5vw, 48px);
  color: #ecf0ec;
  background: #293b43;
  border-bottom: 6px solid #a9b5af;
}

.controlled-source-header > p:first-child {
  color: #b8c6c1;
  font: 0.76rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 0.08em;
}

.controlled-source-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 7px clamp(18px, 4vw, 42px);
  background: #d9ded9;
  border-bottom: 1px solid #929a95;
}

.controlled-source-nav span {
  color: #59635f;
  font-size: 0.83rem;
}

.controlled-document,
.custody-boundary {
  margin: 26px clamp(18px, 5vw, 60px);
}

.controlled-document {
  display: grid;
  grid-template-columns: minmax(130px, 0.28fr) minmax(0, 1fr);
  gap: 28px;
  padding: clamp(20px, 4vw, 36px);
  background: #fffef9;
  border: 1px solid #a4a9a4;
  box-shadow: 0 8px 24px rgba(38, 47, 43, 0.1);
}

.document-stamp {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 18px;
  border-right: 1px solid #b8bdb7;
}

.document-stamp span {
  width: fit-content;
  padding: 4px 12px;
  border: 2px solid #526761;
  font-weight: 800;
  letter-spacing: 0.2em;
}

.document-stamp small {
  color: var(--muted);
}

.document-body p {
  padding: 9px 0;
  border-bottom: 1px solid #deded7;
}

.controlled-document .record-metadata {
  grid-column: 1 / -1;
}

.custody-boundary {
  padding: 16px 20px;
  border: 1px dashed #77847e;
}

/* Optional record chains */
.related-chain {
  max-width: 820px;
}

.false-conclusion fieldset {
  padding: 18px;
  border: 1px solid #959c96;
}

.chain-closure {
  border-left: 6px solid #566f6b;
}

/* Shared fictional-site shell. Each site below has its own information shape. */
.fictional-site {
  width: min(1120px, calc(100% - 24px)) !important;
  margin-top: 18px !important;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid #878c86;
  box-shadow: var(--shadow);
}

.fictional-site-header {
  padding: 22px clamp(18px, 4vw, 42px);
}

.fictional-site-header h1 {
  margin-bottom: 4px;
}

.fictional-site-header p {
  margin-bottom: 3px;
}

.site-search {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  padding: 12px clamp(16px, 3vw, 32px);
}

.site-search label {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
}

.site-search input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #777d77;
}

.result-count,
.site-empty,
.filter-details,
.folk-side-note,
.news-date-strip {
  margin: 16px clamp(16px, 3vw, 32px);
}

.result-count {
  color: var(--muted);
  font-size: 0.86rem;
}

.record-metadata {
  margin: 20px 0;
}

/* Forum: dense boards and two-column posts. */
.site-forum {
  color: #172536;
  background: #e7eaf0;
  border-color: #667387;
  font-family: Arial, "Segoe UI", sans-serif;
}

.site-forum .fictional-site-header {
  color: #fff;
  background: linear-gradient(#435a78, #2c405c);
  border-bottom: 3px solid #8190a2;
}

.site-forum .fictional-site-header h1 {
  font-size: 2rem;
  font-weight: 500;
}

.site-forum .site-search,
.forum-toolbar,
.forum-breadcrumb {
  background: #cdd4de;
  border-bottom: 1px solid #8f9bac;
}

.forum-toolbar,
.forum-breadcrumb {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  padding: 8px 18px;
  font-size: 0.86rem;
}

.forum-board {
  margin: 14px;
  border: 1px solid #8794a7;
}

.forum-board-head,
.forum-topic-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 170px 74px;
  gap: 10px;
  align-items: center;
}

.forum-board-head {
  padding: 8px 12px;
  color: #fff;
  background: #425874;
  font-size: 0.78rem;
}

.forum-topic-row {
  min-height: 62px;
  padding: 8px 12px;
  color: #263b54;
  background: #f3f4f7;
  border-bottom: 1px solid #c0c7d1;
  text-decoration: none;
}

.forum-topic-row:nth-child(odd) {
  background: #e8ebf0;
}

.forum-topic-row span,
.forum-topic-row small {
  display: block;
  min-width: 0;
}

.forum-topic-row small {
  color: #657184;
}

.forum-post {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr);
  margin: 14px;
  background: #f5f6f8;
  border: 1px solid #8794a7;
}

.forum-post > aside {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 18px;
  color: #526177;
  background: #dde2e9;
  border-right: 1px solid #aab3c0;
  font-size: 0.82rem;
}

.forum-post > div {
  min-width: 0;
  padding: 18px 22px;
}

.forum-post header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px dashed #a4adba;
}

.forum-post header h2 {
  font-size: 1.35rem;
}

/* Archive: sparse institutional directory. */
.site-archive {
  background: #f6f6f2;
  border-top: 8px solid #284f55;
  font-family: "Segoe UI", "Segoe UI", sans-serif;
}

.site-archive .fictional-site-header {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 22px;
  align-items: end;
  border-bottom: 1px solid #899997;
}

.site-archive .fictional-site-header p:first-child {
  grid-row: 1 / span 2;
  align-self: center;
  max-width: 8em;
  color: #49605f;
  font-size: 0.78rem;
}

.site-archive .site-search {
  background: #e3e9e7;
}

.filter-details {
  padding: 0 14px 12px;
  border: 1px solid #9eaaa7;
  background: #edf1ef;
}

.directory-table {
  margin: 18px clamp(16px, 3vw, 32px) 32px;
  border-top: 2px solid #526d6c;
}

.directory-head,
.directory-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 130px 190px;
  gap: 14px;
  align-items: center;
  min-height: 56px;
  padding: 8px 12px;
  border-bottom: 1px solid #bcc4c1;
}

.directory-head {
  min-height: 44px;
  color: #fff;
  background: #405f60;
  font-size: 0.8rem;
}

.directory-row {
  color: #263f40;
  text-decoration: none;
}

.directory-row small {
  display: block;
  color: var(--muted);
}

.institution-breadcrumb,
.catalog-record {
  margin: 0 clamp(18px, 5vw, 70px);
}

.institution-breadcrumb {
  padding: 8px 0;
  border-bottom: 1px solid #aeb8b4;
}

.catalog-record {
  padding: 30px 0 48px;
}

.catalog-record > section {
  padding: 18px 22px;
  background: #ecefea;
  border-left: 4px solid #607b77;
}

.print-note {
  color: var(--muted);
  font-size: 0.84rem;
}

/* Folk archive: old paper, black ink, marginal note and blank handover line. */
.site-folk {
  color: #28251e;
  background:
    radial-gradient(circle at 16% 12%, rgba(71, 61, 42, 0.07), transparent 22%),
    repeating-linear-gradient(0deg, rgba(47, 41, 31, 0.022) 0 1px, transparent 1px 5px),
    #e8dfc8;
  border: 1px solid #766d5a;
  font-family: "Songti SC", STSong, SimSun, serif;
}

.site-folk .fictional-site-header {
  text-align: center;
  border: 6px double #39362e;
  border-width: 0 0 6px;
}

.site-folk .fictional-site-header h1 {
  font-size: 2.2rem;
  letter-spacing: 0.18em;
}

.site-folk .site-search {
  margin: 12px clamp(16px, 6vw, 80px);
  border: 1px solid #887f6c;
}

.folk-side-note {
  float: right;
  width: min(290px, 36%);
  padding: 18px;
  border: 1px solid #746d5d;
  border-width: 1px 0 1px 1px;
}

.folk-index {
  padding: 12px clamp(26px, 8vw, 100px) 42px;
  list-style: cjk-ideographic;
}

.folk-index li {
  padding: 13px 8px;
  border-bottom: 1px solid rgba(64, 58, 47, 0.35);
}

.folk-index a {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  color: #28251e;
  text-decoration: none;
}

.folk-index p {
  grid-column: 2;
  margin-bottom: 0;
  color: #5d5749;
}

.folk-nav,
.paper-article {
  margin: 0 clamp(18px, 8vw, 110px);
}

.folk-nav {
  min-height: 44px;
  padding: 8px 0;
  border-bottom: 1px solid #887f6c;
}

.paper-article {
  position: relative;
  padding: 40px 0 58px;
}

.paper-article::after {
  content: "Handover line: ________________  Date: ________";
  display: block;
  margin-top: 36px;
  padding-top: 12px;
  border-top: 4px double #4b463b;
  color: #615a4c;
  font-size: 0.82rem;
}

.paper-article h2 {
  max-width: 22em;
  font-size: clamp(1.7rem, 4vw, 2.7rem);
}

.paper-deck {
  max-width: 48em;
  color: #595344;
}

.ink-rule {
  width: 100%;
  height: 5px;
  margin: 22px 0;
  border-top: 1px solid #39362e;
  border-bottom: 2px solid #39362e;
}

.paper-article > p:not(.paper-date):not(.paper-deck) {
  max-width: 42em;
  font-size: 1.04rem;
  line-height: 1.95;
}

.paper-article footer {
  margin-top: 30px;
  padding: 10px 0;
  border-top: 1px solid #736c5d;
}

/* Newspaper: scanned sheet first, OCR below/on the side. */
.site-news {
  color: #252525;
  background: #e6e5e0;
  border-top: 10px solid #292929;
  font-family: Georgia, "Songti SC", STSong, SimSun, serif;
}

.site-news .fictional-site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px 28px;
  border-bottom: 3px double #2f2f2f;
}

.site-news .fictional-site-header h1 {
  order: -1;
  width: 100%;
  font-size: 2.55rem;
  letter-spacing: 0.08em;
}

.site-news .site-search {
  background: #d2d2ce;
  border-bottom: 1px solid #858585;
}

.news-date-strip {
  padding: 10px 14px;
  background: #f0eee7;
  border: 1px solid #92918b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.86rem;
}

.news-index {
  columns: 2 300px;
  column-gap: 0;
  margin: 18px;
  border-top: 4px double #3b3b3b;
}

.news-index article {
  break-inside: avoid;
  padding: 16px;
  border-right: 1px solid #999;
  border-bottom: 1px solid #999;
}

.news-index h2 {
  font-size: 1.25rem;
}

.news-index h2 a {
  color: #222;
}

.news-breadcrumb {
  padding: 8px clamp(18px, 5vw, 54px);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  border-bottom: 1px solid #8c8c88;
}

.scan-record {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.7fr);
  gap: 22px;
  padding: clamp(18px, 4vw, 46px);
  align-items: start;
}

.scan-sheet {
  padding: clamp(22px, 5vw, 54px);
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.025) 0 1px, transparent 1px 4px),
    #d9d6cc;
  border: 1px solid #6d6b65;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
  transform: rotate(-0.15deg);
}

.scan-sheet h2 {
  padding: 14px 0;
  border: 4px double #252525;
  border-width: 4px 0;
  font-size: clamp(1.7rem, 4vw, 2.8rem);
}

.scan-lines {
  columns: 2 220px;
  column-gap: 28px;
  column-rule: 1px solid #77756e;
  text-align: justify;
}

.ocr-panel {
  padding: 22px;
  background: #f5f5f1;
  border: 1px solid #999;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
}

/* Geology: query-first technical dataset. */
.site-geology {
  color: #1f3431;
  background: #eef2ed;
  border-color: #54716a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.site-geology .fictional-site-header {
  color: #ecf3ef;
  background:
    linear-gradient(120deg, transparent 60%, rgba(255, 255, 255, 0.06) 60%),
    #31534f;
  border-bottom: 8px solid #91a79e;
}

.site-geology .fictional-site-header h1 {
  font-size: 2rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.site-geology .site-search {
  background: #d8e2dc;
  border-bottom: 1px solid #839b93;
}

.geo-dataset-list {
  margin: 18px clamp(16px, 3vw, 32px) 34px;
  border-top: 2px solid #456a62;
}

.geo-dataset-list > a {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) 130px;
  gap: 14px;
  min-height: 66px;
  padding: 10px 12px;
  color: #274b45;
  border-bottom: 1px solid #adbbb5;
  text-decoration: none;
}

.geo-dataset-list small {
  display: block;
  color: #687b75;
}

.geo-breadcrumb,
.technical-report {
  margin-right: clamp(18px, 5vw, 66px);
  margin-left: clamp(18px, 5vw, 66px);
}

.geo-breadcrumb {
  border-bottom: 1px solid #9caeaa;
}

.technical-report {
  padding: 30px 0 46px;
}

.technical-report > header {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  column-gap: 22px;
  align-items: baseline;
}

.technical-report > header code {
  grid-row: 1 / span 2;
  padding: 8px;
  color: #e9f0ec;
  background: #31534f;
}

.technical-body {
  padding: 18px 22px;
  background:
    linear-gradient(90deg, transparent 39px, rgba(64, 94, 87, 0.15) 40px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(64, 94, 87, 0.09) 32px),
    #f7f8f4;
  border: 1px solid #9aaca6;
}

.technical-report footer {
  margin-top: 18px;
  color: #61736e;
}

/* Ending and dialogs */
.ending-page {
  max-width: 900px;
}

.ending-page::before {
  content: "This-round receipt";
  display: inline-block;
  margin-bottom: 18px;
  padding: 5px 12px;
  color: #fff;
  background: #30464b;
  letter-spacing: 0.12em;
}

.endpoint-ledger {
  margin: 24px 0;
}

.unresolved-list {
  margin: 22px 0;
  padding: 0 16px 16px;
  border: 1px solid #9fa49f;
}

.error-code {
  font: 700 0.82rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(19, 25, 25, 0.72);
}

.reset-dialog {
  width: min(520px, 100%);
  padding: 24px;
  background: #f5f1e7;
  border: 1px solid #313e3f;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
}

.boot-state {
  display: grid;
  place-items: center;
  min-height: 70vh;
}

  .forum-post {

  .forum-post > aside {

  }

  }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {

@media print {

  .skip-link,
  button,

    background: #fff;
  }

    width: 100% !important;

    box-shadow: none;
  }

/* v0.3 — evidence-first, site-specific information architecture */
html,
body,
.app-shell,
.fictional-site,
.institution-page {
  max-width: 100%;
  overflow-x: clip;
}

.app-shell *,
.fictional-site *,
.institution-page * {
  min-width: 0;
}

button,
input,
select,
textarea,
summary,
main a {
  min-height: 44px;
}

button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.choice-option:has(input:focus-visible) {
  outline: 3px solid #0b7480;
  outline-offset: 3px;
}

/* Opening: reality boundary and in-world handover are deliberately separate. */
.handover-page {
  padding: clamp(18px, 4vw, 56px);
}

.handover-sheet {
  width: min(1120px, 100%);
  margin-inline: auto;
}

.opening-boundary-layer,
.handover-inworld-layer {
  border: 1px solid #9d9585;
}

.opening-boundary-layer {
  margin-top: 24px;
  color: #302d27;
  background: #f4efe4;
}

.boundary-layer-heading,
.handover-inworld-layer > header {
  display: grid;
  grid-template-columns: 150px 1fr;
  align-items: baseline;
  gap: 18px;
  padding: 16px 20px;
  border-bottom: 1px solid #a59e90;
}

.boundary-layer-heading > span,
.handover-inworld-layer > header > span {
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.boundary-layer-heading h2,
.handover-inworld-layer > header h2 {
  margin: 0;
}

.boundary-layer-body {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
  gap: 0;
}

.boundary-layer-body > * {
  padding: 22px;
}

.boundary-layer-body > aside {
  border-left: 1px solid #b8b0a1;
  background: #e8e1d3;
}

.handover-inworld-layer {
  margin-top: 22px;
  color: #edf0ea;
  background: #23343b;
  border-color: #17262c;
}

.handover-inworld-layer > header {
  grid-template-columns: 150px minmax(0, 1fr) minmax(220px, 0.55fr);
  border-color: #617178;
}

.handover-inworld-layer > header p {
  margin: 0;
  color: #c7d1cf;
}

.handover-inworld-layer .handover-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 0.9fr);
  gap: 0;
}

.handover-inworld-layer .creator-contract,
.handover-three-steps {
  margin: 0;
  padding: 22px;
}

.handover-inworld-layer .creator-contract {
  border-right: 1px solid #617178;
}

.handover-inworld-layer .creator-contract > div {
  color: #edf3f1;
  background: #1d3036;
  border-color: #50656a;
}

.handover-inworld-layer .creator-contract dt {
  color: #a9c2bd;
}

.handover-inworld-layer .creator-contract dd {
  color: #f5f7f4;
}

.handover-three-steps {
  list-style: none;
}

.handover-three-steps li {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(226, 235, 232, 0.2);
}

.handover-three-steps li > span {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  color: #213239;
  background: #d7e5e1;
  border-radius: 50%;
  font-weight: 800;
}

.handover-three-steps p {
  margin: 2px 0 0;
  color: #c7d1cf;
  font-size: 0.9rem;
}

/* Internal system: business step tree + case area, never a three-card mystery layout. */
.workbench-business-shell,
.workbench-operation-shell {
  display: grid;
  width: min(1440px, 100%);
  margin-inline: auto;
  grid-template-columns: 270px minmax(0, 1fr);
  background: #edf0ee;
  border-right: 1px solid #9ca9a7;
  border-bottom: 1px solid #9ca9a7;
  border-left: 1px solid #9ca9a7;
}

.workbench-process-tree,
.tool-task-rail {
  padding: 20px 16px;
  color: #dfe8e5;
  background: #22343a;
  border-right: 1px solid #0f2228;
}

.workbench-process-tree > h2,
.tool-task-rail > h2 {
  color: #fff;
  font-size: 1rem;
  letter-spacing: 0.08em;
}

.workbench-process-tree > ol,
.panel-procedure {
  margin: 0 0 22px;
  padding: 0;
  list-style: none;
}

.workbench-process-tree > ol > li {
  position: relative;
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 10px;
  padding: 10px 0;
}

.workbench-process-tree > ol > li:not(:last-child)::after {
  position: absolute;
  top: 42px;
  bottom: -6px;
  left: 17px;
  width: 1px;
  background: #728187;
  content: "";
}

.workbench-process-tree > ol > li > span,
.panel-procedure span {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid #819095;
  border-radius: 50%;
  font-size: 0.76rem;
}

.workbench-process-tree li.is-complete > span {
  color: #193137;
  background: #b8d4cc;
}

.workbench-process-tree li.is-current > span,
.panel-procedure li.is-current span {
  color: #1e3136;
  background: #f3d78b;
  border-color: #f3d78b;
}

.workbench-process-tree small {
  display: block;
  color: #aebfbc;
}

.workbench-task-rail {
  padding-top: 16px;
  border-top: 1px solid #64757a;
}

.workbench-task-rail h3 {
  color: #e8efed;
  font-size: 0.88rem;
}

.workbench-task-rail .workbench-job-row {
  color: #17292f;
  background: #dbe6e3;
  border-color: #94a7a2;
}

.workbench-case-area,
.tool-case-area {
  min-width: 0;
  background: #edf0ee;
}

.case-area-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 24px;
  background: #fff;
  border-bottom: 1px solid #b9c2bf;
}

.case-area-heading h2,
.case-area-heading dl,
.case-area-heading dd {
  margin: 0;
}

.case-area-heading > div > span,
.operation-sheet-heading span,
.source-links-heading > span,
.form-actions > div > span {
  color: #506864;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.case-area-heading dl {
  display: flex;
  gap: 22px;
  font-size: 0.82rem;
}

.case-area-heading dl > div {
  display: grid;
  grid-template-columns: auto auto;
  gap: 8px;
}

.workbench-primary-pane {
  padding: 24px;
}

.workbench-support-register {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 0.8fr);
  gap: 1px;
  margin: 0 24px 24px;
  background: #bcc6c3;
  border: 1px solid #bcc6c3;
}

.workbench-support-register > section {
  padding: 18px;
  background: #fff;
}

.workbench-bottom-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px 24px;
  color: #e7eeec;
  background: #2b4148;
}

.workbench-bottom-actions a {
  padding: 8px 14px;
  color: #172a30;
  background: #d8e6e2;
  text-decoration: none;
}

.workbench-operation-shell {
  align-items: stretch;
}

.workbench-operation-shell > .tool-task-rail {
  color: #dfe8e5;
  background: #22343a;
  border-color: #0f2228;
}

.panel-procedure li {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  color: #cbd7d4;
}

.tool-task-rail .panel-nav {
  margin-bottom: 18px;
}

.tool-task-rail .panel-nav > * {
  color: #e9f0ee;
  border-color: #5f7277;
  background: rgba(255, 255, 255, 0.04);
}

.tool-task-rail .artifact-cue {
  color: #d3dfdc;
  border-top: 1px solid #64757a;
}

.workbench-operation-shell > .tool-task-rail .artifact-cue > div {
  color: #dbe6e3;
  background: rgba(255, 255, 255, 0.06);
  border-color: #5f7478;
}

.workbench-operation-shell > .tool-task-rail .artifact-cue h3 {
  color: #f4f7f6;
}

.workbench-operation-shell > .tool-task-rail .artifact-cue p,
.workbench-operation-shell > .tool-task-rail .panel-procedure li {
  color: #dbe6e3;
}

.tool-case-area {
  padding: 22px;
}

.source-links {
  margin: 0 0 18px;
  padding: 0;
  background: #f8fbfa;
  border: 1px solid #76928c;
  box-shadow: none;
}

.source-links-heading {
  display: grid;
  grid-template-columns: 84px minmax(140px, 0.45fr) minmax(260px, 1fr);
  align-items: baseline;
  gap: 14px;
  padding: 14px 16px;
  color: #e8efed;
  background: #315049;
}

.source-links-heading > span {
  color: #f4d98e;
}

.source-links-heading h3,
.source-links-heading p {
  margin: 0;
  color: inherit;
}

.source-links-heading h3 {
  font-size: 1.1rem;
}

.source-links-heading p {
  font-size: 0.86rem;
}

.source-links ul {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding: 0;
}

.source-links li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 6px 12px;
  background: #fff;
  border: 0;
  border-right: 1px solid #ccd5d2;
  border-bottom: 1px solid #ccd5d2;
}

.source-links li a {
  display: grid;
  align-content: center;
  padding: 4px 0;
  font-weight: 700;
}

.source-links li a small {
  color: #62726e;
  font-size: 0.72rem;
  font-weight: 400;
}

.source-links li > b {
  color: #305d54;
  font-size: 0.72rem;
  white-space: nowrap;
}

.operation-sheet {
  padding: 0;
  background: #fff;
  border: 1px solid #b8c3c0;
  box-shadow: none;
}

.operation-sheet-heading {
  display: grid;
  grid-template-columns: minmax(240px, 0.65fr) minmax(280px, 1fr);
  gap: 24px;
  padding: 18px 20px;
  background: #f4f6f5;
  border-bottom: 1px solid #c5cecb;
}

.operation-sheet-heading h2,
.operation-sheet-heading p {
  margin: 0;
}

.operation-sheet form,
.operation-sheet > .saved-panel,
.operation-sheet > .form-error {
  margin: 18px 20px;
}

.operation-sheet .question-block {
  margin: 0;
  padding: 16px 0;
  border: 0;
  border-bottom: 1px solid #d5ddda;
  border-radius: 0;
  background: transparent;
}

.operation-sheet .choice-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.operation-sheet .choice-option {
  min-height: 48px;
  margin: 0;
  border: 1px solid #bdc9c5;
  background: #f9fbfa;
}

.form-actions {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin: 24px -20px -18px;
  padding: 16px 20px;
  background: #e5ebe9;
  border-top: 1px solid #bac7c3;
}

.form-actions > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.form-actions .primary-action,
.form-actions .primary-link {
  color: #fff;
  background: #1f5c53;
  border-color: #17483f;
  text-decoration: none;
}

.secondary-action,
.secondary-link,
.previous-panel-link {
  color: #263e3a;
  background: transparent;
}

.tool-support-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 0.6fr);
  gap: 16px;
  margin-top: 16px;
}

.tool-support-row > * {
  margin: 0;
}

/* Image evidence contract. */
.evidence-visual {
  width: 100%;
  margin: 0 0 16px;
  background: #d5d2ca;
  border: 1px solid #8e918b;
}

.evidence-visual img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 170vh;
  object-fit: contain;
  background: #b9b8b2;
}

.evidence-visual figcaption {
  display: grid;
  gap: 3px;
  padding: 10px 12px;
  color: #343a37;
  background: #eeece5;
  border-top: 1px solid #969a94;
  font-size: 0.78rem;
}

.evidence-same-object {
  color: #4a524e;
  font-weight: 700;
}

.evidence-alt-equivalent {
  color: #5e6662;
}

.evidence-placeholder-sheet {
  display: grid;
  min-height: 260px;
  place-content: center;
  padding: 24px;
  color: #555b57;
  background: repeating-linear-gradient(-45deg, #e6e5df 0 14px, #deddd7 14px 28px);
  text-align: center;
}

.evidence-placeholder-sheet > span {
  font-weight: 800;
  letter-spacing: 0.14em;
}

.evidence-text-equivalent {
  margin: 14px 0;
  border: 1px solid #b9bfbb;
  background: #f5f5f1;
}

.evidence-text-equivalent > summary {
  display: flex;
  align-items: center;
  padding: 9px 12px;
  font-weight: 700;
  cursor: pointer;
}

.evidence-text-body {
  padding: 14px;
  border-top: 1px solid #c8cdca;
}

/* Forum: 2000s operations frame on index, DOS floor anatomy on threads. */
.forum-page {
  color: #071744;
  background: #d6dce8;
  font-family: Arial, SimSun, sans-serif;
}

.forum-page .forum-frame {
  width: min(1120px, calc(100% - 18px));
  margin-inline: auto;
  background: #edf0f6;
  border: 1px solid #526a99;
  border-radius: 0;
}

.forum-operations-shell {
  display: grid;
  grid-template-columns: 212px minmax(0, 1fr);
  gap: 6px;
  padding: 6px;
}

.forum-ops-sidebar {
  display: grid;
  align-content: start;
  gap: 6px;
}

.forum-login-box,
.forum-section-tree,
.forum-era-warning {
  padding: 8px;
  background: #eef2fa;
  border: 1px solid #8799bd;
}

.forum-login-box h2,
.forum-section-tree h2 {
  margin: -8px -8px 8px;
  padding: 5px 8px;
  color: #fff;
  background: #3f568a;
  font-size: 0.82rem;
}

.forum-login-box label,
.forum-section-tree > * {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  min-height: 34px;
  font-size: 0.78rem;
}

.forum-login-box input {
  width: 100%;
  min-height: 44px;
}

.forum-login-box button {
  width: 100%;
  margin-top: 6px;
}

.forum-board-main {
  min-width: 0;
  background: #fff;
  border: 1px solid #8799bd;
}

.forum-board-main .forum-search-row {
  margin: 0;
  border: 0;
  border-bottom: 1px solid #8799bd;
}

.forum-board-stats {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 8px;
  font-size: 0.76rem;
  background: #e7ebf4;
  border-bottom: 1px solid #a6b1c8;
}

.forum-board-stats dl {
  display: flex;
  gap: 14px;
  margin: 0;
}

.forum-board-stats dl > div {
  display: flex;
  gap: 4px;
}

.forum-page .forum-topic-row {
  border-radius: 0;
}

/* Archive: tree and long field results. */
.archive-directory-tree > * {
  font-family: SimSun, serif;
}

.archive-result-toolbar,
.geo-result-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding: 8px 12px;
  background: #e4e8e2;
  border: 1px solid #a8b1a6;
  font-size: 0.78rem;
}

.archive-page .directory-row > span:last-child {
  display: grid;
  align-content: center;
  gap: 3px;
}

.archive-page .directory-row code {
  color: #354d42;
  font-weight: 700;
}

.archive-tree-stats {
  margin: 16px 0;
  padding: 10px;
  background: #eef0e9;
  border: 1px solid #c1c5bb;
}

.site-register {
  margin-top: 16px;
  font-size: 0.76rem;
}

.site-register > div {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px dotted currentColor;
}

.site-register dt,
.site-register dd {
  margin: 0;
}

/* Folk: narrow 2004 three-column frame and dense text index. */
.folk-site-frame {
  font-family: SimSun, "Songti SC", serif;
}

.folk-site-frame .folk-layout {
  display: grid;
  grid-template-columns: 156px minmax(420px, 1fr) 178px;
  width: min(980px, calc(100% - 14px));
  margin-inline: auto;
  gap: 8px;
  align-items: start;
}

.folk-service-rail {
  padding: 8px;
  color: #1d315d;
  background: #eff2df;
  border: 1px solid #929d77;
  font-size: 0.76rem;
}

.folk-service-rail > section {
  display: grid;
  margin-bottom: 12px;
}

.folk-service-rail .folk-side-note {
  float: none;
  width: auto;
  margin: 0 0 12px;
}

.folk-service-rail > *,
.folk-service-rail .site-register {
  clear: both;
  width: 100%;
  writing-mode: horizontal-tb;
}

.folk-service-rail h2 {
  margin: -4px -4px 5px;
  padding: 4px;
  color: #fff;
  background: #516536;
  font-size: 0.86rem;
}

.folk-service-rail a,
.folk-service-rail span {
  min-height: 30px;
  padding: 4px 1px;
  border-bottom: 1px dotted #919a7d;
}

.folk-site-frame .folk-index {
  font-size: 0.84rem;
}

.folk-site-frame .folk-index li {
  border-bottom-style: dotted;
}

/* Newspaper: date/edition browser, image first and OCR second. */
.news-calendar,
.news-edition-picker {
  margin-top: 14px;
  border: 1px solid #a8a094;
  background: #f8f4e9;
}

.news-calendar header {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  text-align: center;
  border-bottom: 1px solid #aaa396;
}

.news-calendar header button {
  border: 0;
  border-radius: 0;
}

.news-calendar > div {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 6px;
  text-align: center;
  font-size: 0.75rem;
}

.news-calendar > div > * {
  display: grid;
  min-height: 30px;
  place-items: center;
  font-style: normal;
}

.news-calendar > div > b {
  color: #fff;
  background: #8b2d2d;
}

.news-edition-picker {
  display: grid;
}

.news-edition-picker > * {
  min-height: 36px;
  margin: 0;
  padding: 7px 9px;
  border-bottom: 1px solid #c9c1b5;
}

.news-edition-picker > b {
  color: #fff;
  background: #792b2b;
}

.news-date-strip {
  display: grid;
  grid-template-columns: auto minmax(200px, 1fr);
  gap: 4px 16px;
}

.news-date-strip p {
  grid-column: 1 / -1;
  margin: 0;
}

.news-record-layout .scan-record {
  align-items: start;
}

.news-film-strip .evidence-visual,
.news-issue-scan .evidence-visual {
  background: #181818;
  border-color: #1b1b1b;
}

.news-issue-scan .evidence-visual img {
  max-height: none;
}

.news-page .ocr-panel {
  min-width: 0;
}

/* Geology: catalog facets, report attachments and restrained map tools. */
.geo-facet-strip {
  margin: 12px 0;
  border: 1px solid #9ea99f;
  background: #f4f7f4;
}

.geo-facet-strip > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 10px;
  border-bottom: 1px solid #ccd3cd;
}

.geo-facet-strip strong {
  width: 92px;
}

.geo-facet-strip span {
  padding: 4px 10px;
  color: #355647;
  background: #e5ece7;
  border: 1px solid #b2c0b6;
}

.geo-map-tools,
.geo-record-tools {
  margin-top: 18px;
  padding: 10px;
  background: #e5ebe6;
  border: 1px solid #aeb9b0;
}

.geo-map-tools > div,
.geo-record-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.geo-map-tools h3,
.geo-record-tools h3,
.geo-map-tools p,
.geo-record-tools p {
  flex-basis: 100%;
}

.geo-report-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.55fr);
  gap: 14px;
  margin: 18px 0;
}

.geo-attachment-register {
  padding: 14px;
  background: #edf2ee;
  border: 1px solid #abb8ad;
}

.geo-attachment-register dl > div {
  padding: 8px 0;
  border-bottom: 1px solid #c6d0c8;
}

.geo-attachment-register dt,
.geo-attachment-register dd {
  margin: 0;
}

.controlled-source-main .evidence-visual {
  max-width: 1040px;
}

@media (max-width: 900px) {
  .boundary-layer-body,
  .handover-inworld-layer > header,
  .handover-inworld-layer .handover-grid,
  .workbench-business-shell,
  .workbench-operation-shell,
  .workbench-support-register,
  .forum-operations-shell,
  .folk-site-frame .folk-layout,
  .geo-report-workspace {
    grid-template-columns: 1fr;
  }

  .boundary-layer-body > aside,
  .handover-inworld-layer .creator-contract,
  .workbench-process-tree,
  .tool-task-rail {
    border: 0;
    border-top: 1px solid #617178;
  }

  .workbench-process-tree > ol {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .workbench-process-tree > ol > li {
    grid-template-columns: 34px 1fr;
  }

  .workbench-process-tree > ol > li::after {
    display: none;
  }

  .forum-ops-sidebar {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .folk-service-rail {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .forum-board-main {
    order: -1;
  }
}

@media (max-width: 620px) {
  .boundary-layer-heading,
  .handover-inworld-layer > header,
  .operation-sheet-heading,
  .source-links-heading {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .case-area-heading,
  .workbench-bottom-actions,
  .form-actions,
  .news-date-strip {
    align-items: stretch;
    flex-direction: column;
    grid-template-columns: 1fr;
  }

  .case-area-heading,
  .workbench-bottom-actions,
  .form-actions {
    display: flex;
  }

  .source-links ul,
  .operation-sheet .choice-list,
  .tool-support-row {
    grid-template-columns: 1fr;
  }

  .workbench-process-tree > ol,
  .forum-ops-sidebar,
  .folk-service-rail {
    grid-template-columns: 1fr;
  }

  .workbench-process-tree > ol > li {
    padding: 4px 0;
  }

  .case-area-heading dl {
    display: grid;
    gap: 4px;
  }
}

@media (max-width: 390px) {
  .handover-page,
  .tool-case-area,
  .workbench-primary-pane {
    padding: 12px;
  }

  .institution-topbar-inner,
  .external-session-inner {
    padding-inline: 8px;
  }

  .workbench-toolbar {
    padding-inline: 8px;
  }

  .tool-task-rail {
    padding: 10px 12px;
  }

  .tool-task-rail > h2,
  .tool-task-rail .artifact-cue {
    display: none;
  }

  .tool-task-rail .panel-nav {
    margin-bottom: 8px;
  }

  .panel-procedure {
    display: flex;
    gap: 6px;
    margin: 0;
  }

  .panel-procedure li {
    grid-template-columns: 24px 1fr;
    min-height: 44px;
    font-size: 0.72rem;
  }

  .panel-procedure span {
    width: 24px;
    height: 24px;
  }

  .source-links {
    margin-bottom: 10px;
  }

  .source-links-heading,
  .source-links li {
    padding-inline: 10px;
  }

  .source-links li {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .operation-sheet form,
  .operation-sheet > .saved-panel,
  .operation-sheet > .form-error {
    margin-inline: 12px;
  }

  .form-actions {
    margin-inline: -12px;
    padding-inline: 12px;
  }

  .form-actions > div,
  .form-actions button,
  .form-actions a {
    width: 100%;
  }

  .evidence-visual img {
    max-height: 64vh;
  }

  .forum-page .forum-frame,
  .folk-site-frame .folk-layout {
    width: 100%;
  }

  .forum-board-stats,
  .forum-board-stats dl {
    align-items: flex-start;
    flex-direction: column;
  }

  .forum-page .forum-board-head {
    display: none;
  }

  .forum-page .forum-topic-row {
    grid-template-columns: 1fr;
  }

  .archive-result-toolbar,
  .geo-result-toolbar,
  .geo-facet-strip > div {
    align-items: flex-start;
    flex-direction: column;
  }

  .geo-facet-strip strong {
    width: auto;
  }

  .news-calendar > div {
    padding: 3px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.news-film-identity p,

.news-film-frame-rail {

.news-film-frame-rail span {

.news-film-transcript {

.news-photography-log {

}

.news-issue-scan {

.news-edition-running-head {

.news-issue-copy {

.news-correction-record {

.news-correction-before,

.news-correction-log > dl > div {

/* Six institutional attachment viewers. */

.controlled-source-shell > .controlled-source-context {

.source-view-heading > span {

.source-view-heading h2 {

}

.source-table-notes,
.source-media-transcript {

}

.source-field-table .record-metadata,
.source-plan-fields .record-metadata,
.source-timeline-fields .record-metadata,
.source-media-fields .record-metadata,
.source-trace-fields .record-metadata,
.source-workflow-fields .record-metadata {

  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.source-field-table .record-metadata > div,
.source-plan-fields .record-metadata > div,
.source-timeline-fields .record-metadata > div,
.source-media-fields .record-metadata > div,
.source-trace-fields .record-metadata > div,
.source-workflow-fields .record-metadata > div {

  border-width: 0 1px 1px 0;
}

.source-field-table dt,
.source-plan-fields dt,
.source-timeline-fields dt,
.source-media-fields dt,
.source-trace-fields dt,
.source-workflow-fields dt,
.source-field-table dd,
.source-plan-fields dd,
.source-timeline-fields dd,
.source-media-fields dd,
.source-trace-fields dd,
.source-workflow-fields dd {

}

.source-field-table dt,
.source-plan-fields dt,
.source-timeline-fields dt,
.source-media-fields dt,
.source-trace-fields dt,

.source-plan-canvas {

  grid-template-columns: 92px minmax(0, 1fr);

.source-plan-axis::after {

.source-plan-annotations {

}

.source-timeline-events {

}

  left: 10px;

}

}

.timeline-marker {
  position: absolute;
  top: 16px;
  left: -28px;

  height: 12px;

  border: 3px solid #416d80;
  border-radius: 50%;
}

.source-waveform-display {
  display: flex;
  align-items: center;
  justify-content: space-around;

  padding: 24px;

  box-shadow: inset 0 0 0 1px #3a5864;

.source-waveform-display i:nth-child(3n + 1) { height: 72%; }

.source-trace-observation > span {

.source-workflow-steps {

  padding: 0;
  border-top: 1px solid #aebbc0;

.source-workflow-steps li {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr);

.workflow-step-number {

.source-workflow-steps p {
  align-self: center;
  padding: 12px 14px;

@media (max-width: 680px) {

  .source-media-fields .record-metadata,

  .source-workflow-fields .record-metadata,

  .news-correction-header,
  .news-correction-note {

  .news-correction-before {
    border-right: 0;
    border-bottom: 1px solid #aaa59a;
  }

  .news-film-frame-rail {
    margin-right: -22px;
    margin-left: -22px;
    gap: 14px;
  }

  .news-film-transcript,
  .news-issue-copy {

  }

  .source-plan-canvas {
    grid-template-columns: 58px minmax(0, 1fr);
    min-height: 230px;
    padding: 14px;
  }

  .source-plan-annotations {

  }

  .source-trace-board {
    grid-template-columns: 1fr;
  }

  .source-field-table .record-metadata > div,
  .source-plan-fields .record-metadata > div,
  .source-timeline-fields .record-metadata > div,
  .source-media-fields .record-metadata > div,
  .source-trace-fields .record-metadata > div,
  .source-workflow-fields .record-metadata > div {
    grid-template-columns: 100px minmax(0, 1fr);
  }
}

/* ========================================================================== */
/* v0.2 — native-site archaeology redesign                                    */
/* Six unrelated web products; one quiet session layer.                       */
/* ========================================================================== */

:root {
  --ui-blue-950: #162c3a;
  --ui-blue-800: #234d67;
  --ui-blue-650: #3d708b;
  --ui-blue-100: #e7eef2;
  --ui-gray-025: #fbfbfa;
  --ui-gray-050: #f4f5f4;
  --ui-gray-100: #e8ebeb;
  --ui-gray-200: #d4d9da;
  --ui-gray-300: #b8c0c2;
  --ui-gray-600: #586367;
  --ui-gray-900: #1f292d;
  --ui-focus: #b45309;
}

html {
  background: #cfd3d4;
}

body {
  background: #dfe2e2;
  background-image: none;
}

.app-shell {
  min-height: 100vh;
}

/* The session belongs to the browser, not to any fictional public site. */
.external-session-strip {
  position: sticky;
  top: 0;
  z-index: 80;
  min-height: 34px;
  color: #353a3c;
  background: #e9e9e6;
  border-bottom: 1px solid #aaa9a4;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
  font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.external-session-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: min(1240px, 100%);
  min-height: 34px;
  margin: 0 auto;
  padding: 0 12px;
}

.external-session-context,
.external-session-actions,
.session-record-actions {
  display: flex;
  align-items: center;
  min-width: 0;
}

.external-session-context {
  gap: 10px;
  overflow: hidden;
}

.external-session-id {
  flex: 0 0 auto;
  padding-right: 10px;
  color: #666a6a;
  border-right: 1px solid #bdbdb8;
  white-space: nowrap;
}

.external-session-source {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.external-session-actions {
  flex: 0 0 auto;
  gap: 8px;
}

.external-session-strip a,
.external-session-strip button,
.external-session-strip .excerpt-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 28px;
  padding: 3px 9px;
  color: #283f4a;
  background: #f6f6f3;
  border: 1px solid #a9adae;
  border-radius: 1px;
  text-decoration: none;
  white-space: nowrap;
}

.external-session-strip button {
  font-size: 12px;
}

.institution-topbar {
  color: #fff;
  background: var(--ui-blue-950);
  border-bottom: 4px solid #4a7e97;
}

.institution-topbar-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  width: min(1280px, calc(100% - 32px));
  min-height: 54px;
  margin: 0 auto;
}

.institution-wordmark {
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-decoration: none;
}

.institution-system-name {
  color: #c8d6dd;
  font-size: 13px;
}

.institution-topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  font-size: 12px;
}

.institution-topbar-actions a {
  min-height: 34px;
  padding: 7px 11px;
  color: #fff;
  border: 1px solid #66899a;
  text-decoration: none;
}

.institution-topbar .session-record-actions {
  max-width: none;
  overflow: visible;
}

.institution-topbar .session-record-actions button,
.institution-topbar .session-record-actions a,
.institution-topbar .session-record-actions .excerpt-status {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  margin: 0;
  padding: 6px 9px;
  color: #fff;
  background: #31586b;
  border: 1px solid #7895a3;
  border-radius: 0;
  font-size: 12px;
  text-decoration: none;
}

.institution-session {
  color: #b9cbd3;
}

/* Internal project surfaces — administrative, dense, square. */
.institution-page,
.workbench-tool,
.workbench-result,
.related-chain,
.workbench-source,
.ending-page,
.not-found {
  width: min(1280px, calc(100% - 32px));
  margin: 22px auto 48px;
  padding: 0;
  color: #263238;
  background: #fff;
  border: 1px solid #aeb8bc;
  border-radius: 0;
  box-shadow: 0 2px 10px rgba(25, 42, 50, 0.08);

.handover-page {

.opening-file.handover-sheet {

.handover-page .content-note {

.creator-contract > div {

.creator-contract dt {

.handover-actions {

.primary-action,
.primary-link,

.primary-action,
.primary-link {

  background: #285d78;

    return clone(question.correct);
  }

  function answerEqual(question, actual, expected) {
    if (question.type === "checkboxes") {
      if (!Array.isArray(actual) || !Array.isArray(expected)) return false;
      const uniqueActual = stableUnique(actual);
      if (uniqueActual.length !== actual.length) return false;
      const left = uniqueActual.sort();
      const right = stableUnique(expected).sort();
      return left.length === right.length && left.every((value, index) => value === right[index]);
    }
    if (question.type === "order") {
      return Array.isArray(actual) && Array.isArray(expected)
        && actual.length === expected.length
        && actual.every((value, index) => value === expected[index]);
    }
    return typeof actual === "string" && actual === expected;
  }

  function validatePanel(beatId, panelIndex, answers) {
    const beat = getBeat(beatId);
    const panel = beat && beat.panels[panelIndex];
    if (!panel) return { ok: false, code: "UNKNOWN_PANEL", message: "That QC panel does not exist.", errors: [] };
    if (!answers || typeof answers !== "object" || Array.isArray(answers)) {
      return { ok: false, code: "MALFORMED_INPUT", message: "The submit format cannot be read. Please choose again.", errors: [] };
    }
    const known = new Set(panel.questions.map((question) => question.id));
    const extra = Object.keys(answers).filter((key) => !known.has(key));
    if (extra.length) return { ok: false, code: "EXTRA_FIELDS", message: "The submit includes a field this panel does not have. Clear it and retry.", errors: extra };

    const branch = answers.branch === "A" || answers.branch === "B" ? answers.branch : null;
    const errors = [];
    for (const question of panel.questions) {
      const actual = answers[question.id];
      const expected = expectedFor(question, branch);
      if (typeof actual === "undefined" || actual === "" || (Array.isArray(actual) && actual.length === 0)) {
        errors.push({ id: question.id, code: "MISSING" });
      } else if (!answerEqual(question, actual, expected)) {
        errors.push({ id: question.id, code: "MISMATCH" });
      }
    }
    if (errors.length) {
      const first = panel.questions.find((question) => question.id === errors[0].id);
      const message = errors.length === 1 && errors[0].code === "MISSING"
        ? "One item is still empty:" + (first ? first.prompt : "Current field") + "。"
        : errors.every((error) => error.code === "MISSING")
          ? "Fields are still empty. Finish the visible check items on this panel first."
          : "This combination still has fields that do not agree. Return to the visible material and check item by item with this panel's method.";
      return {
        ok: false,
        code: errors[0].code,
        message,
        errors,
      };
    }
    return { ok: true, code: "VALID", message: "Check items agree.", errors: [] };
  }

  function canonicalAnswers(beatId, panelIndex, branch) {
    const beat = getBeat(beatId);
    const panel = beat && beat.panels[panelIndex];
    if (!panel) return null;
    const selectedBranch = branch === "B" ? "B" : "A";
    return Object.fromEntries(panel.questions.map((question) => [question.id, expectedFor(question, selectedBranch)]));
  }

  function invalidAnswers(beatId, panelIndex) {
    const beat = getBeat(beatId);
    const panel = beat && beat.panels[panelIndex];
    return panel ? clone(panel.invalid) : null;
  }

  function panelKey(beatId, panelIndex) {
    return beatId + ":" + panelIndex;
  }

  function revealHint(state, beatId, panelIndex, options) {
    const normalized = normalizeState(state);
    const beat = getBeat(beatId);
    const panel = beat && beat.panels[panelIndex];
    if (!panel) return { ok: false, state: normalized, code: "UNKNOWN_PANEL", message: "That hint does not exist." };
    const key = panelKey(beatId, panelIndex);
    const current = Number(normalized.hints[key] || 0);
    if (current >= 4) return { ok: true, state: normalized, level: 4, already: true };
    const nextLevel = current + 1;
    const opts = options || {};
    if (nextLevel === 4 && opts.confirmDirect !== true) {
      return { ok: false, state: normalized, code: "DIRECT_CONFIRM_REQUIRED", message: "Level 4 will show the full executable answer. Please confirm again.", pendingLevel: 4 };
    }
    normalized.hints[key] = nextLevel;
    if (nextLevel === 4) normalized.directHintConfirmations[key] = true;
    const logged = appendEvent(normalized, "HINT_REVEALED", { beatId, panelIndex, level: nextLevel }, opts.at);
    return { ok: true, state: logged, level: nextLevel, hint: clone(panel.hints[nextLevel - 1]) };
  }

  function completeBeat(next, beat, at) {
    if (!next.completedBeats.includes(beat.id)) next.completedBeats.push(beat.id);
    const reaction = REACTION_BY_BEAT.get(beat.id);
    let logged = appendEvent(next, "BEAT_COMPLETED", { beatId: beat.id }, at);
    if (reaction && !logged.reactionsPosted.includes(reaction.id) && !logged.reactionReadyQueue.includes(reaction.id)) {
      logged.reactionReadyQueue.push(reaction.id);
      logged = appendEvent(logged, "REACTION_READY", { reactionId: reaction.id, afterBeat: beat.id }, at);
    }
    const index = BEAT_IDS.indexOf(beat.id);
    logged.currentBeat = WORLD.beats[index + 1] ? WORLD.beats[index + 1].id : beat.id;
    return logged;
  }

  function publishNextReaction(state, options) {
    const opts = options || {};
    let next = normalizeState(state);
    if (next.unreadReaction) {
      return { ok: false, state: next, code: "UNREAD_REACTION", message: "The previous project receipt is not yet fully read.", reactionId: next.unreadReaction };
    }
    const reactionId = next.reactionReadyQueue[0];
    if (!reactionId) return { ok: true, state: next, published: false, message: "There is no project receipt waiting to publish." };
    next.reactionReadyQueue.shift();
    next.reactionsPosted.push(reactionId);
    next.unreadReaction = reactionId;
    next = appendEvent(next, "REACTION_POSTED", { reactionId }, opts.at);
    return { ok: true, state: next, published: true, reactionId, message: "A new in-project receipt has been published." };
  }

  function submitPanel(state, beatId, panelIndex, answers, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const beat = getBeat(beatId);
    if (!beat) return { ok: false, state: next, code: "UNKNOWN_BEAT", message: "That QC step does not exist." };
    if (!next.sessionStarted) return { ok: false, state: next, code: "SESSION_REQUIRED", message: "Start a local QC session first." };
    if (next.unreadReaction) return { ok: false, state: next, code: "REACTION_UNREAD", message: "Return to the workbench and finish the new project receipt first. Public pages stay browsable." };
    if (next.reactionReadyQueue.length) return { ok: false, state: next, code: "REACTION_RETURN_REQUIRED", message: "Return to the workbench and take the new project receipt first. Public pages stay browsable." };
    if (!canAccessBeat(next, beatId)) return { ok: false, state: next, code: "PREREQUISITE", message: "The previous derived product is not yet saved. Public material stays browsable." };
    if (!beat.panels[panelIndex]) return { ok: false, state: next, code: "UNKNOWN_PANEL", message: "That QC panel does not exist." };
    const done = next.completedPanels[beatId] || [];
    if (done.includes(panelIndex)) return { ok: true, state: next, already: true, message: "That panel is already saved." };
    if (panelIndex !== done.length) return { ok: false, state: next, code: "PANEL_ORDER", message: "Save the current panel first. You may return to view earlier panels." };

    const validation = validatePanel(beatId, panelIndex, answers);
    next = appendEvent(next, validation.ok ? "PANEL_VALID" : "PANEL_INVALID", {
      beatId,
      panelIndex,
      code: validation.code,
    }, opts.at);
    if (!validation.ok) {
      next.lastError = { beatId, panelIndex, code: validation.code, message: validation.message };
      return { ...validation, state: next };
    }

    next.lastError = null;
    next.completedPanels[beatId] = done.concat(panelIndex);
    const currentPanel = beat.panels[panelIndex];
    for (const output of currentPanel.outputs) {
      if (output !== "__ENDING__" && ALL_OUTPUT_IDS.has(output) && !next.derivedEvidence.includes(output)) next.derivedEvidence.push(output);
    }
    next = appendEvent(next, "PANEL_SAVED", { beatId, panelIndex, outputs: currentPanel.outputs.filter((id) => id !== "__ENDING__") }, opts.at);

    if (beatId === "B17" && panelIndex === 0) {
      const seenGeology = next.viewedPublicRoutes.includes("#/geology/record/BP-1998-0719");
      next.predictionIntegrity = seenGeology ? "seen_result" : "blind";
      next = appendEvent(next, "PREDICTION_INTEGRITY_RECORDED", {
        timezone: WORLD.worldTimezone,
        predictionIntegrity: next.predictionIntegrity,
      }, opts.at);
    }

    if (beatId === "B17" && currentPanel.outputs.includes("DER-THIRD-NIGHT-CALCULATION")) {
      next.conditionalMatchRecorded = true;
      next = appendEvent(next, "CONDITIONAL_MATCH_RECORDED", {
        status: "conditional_match",
        timezone: WORLD.worldTimezone,
        predictionIntegrity: next.predictionIntegrity,
      }, opts.at);
    }

    const isLastPanel = panelIndex === beat.panels.length - 1;
    if (beatId === "B18" && isLastPanel) {
      const branch = answers.branch;
      if (next.recommendedBranch && next.recommendedBranch !== branch) {
        return { ok: false, state: normalizeState(state), code: "BRANCH_LOCKED", message: "Another piece of advice has already entered the agency-receipt queue." };
      }
      next.recommendedBranch = branch;
      next = appendEvent(next, "BRANCH_RECOMMENDED", { recommendedBranch: branch, actor: "QC-447", authority: "advice_only" }, opts.at);
      return { ok: true, state: next, pending: "authorization", branch, message: "Disposition advice is recorded. Waiting on a fixed agency-authorization event." };
    }

    if (isLastPanel) next = completeBeat(next, beat, opts.at);
    return {
      ok: true,
      state: next,
      nextPanel: isLastPanel ? null : panelIndex + 1,
      nextBeat: isLastPanel ? next.currentBeat : beatId,
      message: isLastPanel ? "This item's check return is saved." : "This panel is saved. You may enter the next panel.",
    };
  }

  function authorizeRecommended(state, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const b18 = getBeat("B18");
    const prerequisitesMet = next.completedBeats.length === 17
      && next.completedBeats.every((beatId, index) => beatId === BEAT_IDS[index])
      && (next.completedPanels.B18 || []).length === b18.panels.length;
    if (!prerequisitesMet) return { ok: false, state: next, code: "BRANCH_PREREQUISITES", message: "B18 source check and advice gates are not yet fully saved." };
    if (!next.recommendedBranch) return { ok: false, state: next, code: "NO_RECOMMENDATION", message: "There is not yet advice available for agency handling." };
    if (next.authorizedBranch) return { ok: true, state: next, already: true, branch: next.authorizedBranch };
    if (next.recommendedBranch === "A" && WORLD.qaFacts.branchA !== "PROTOTYPE_ASSUMED_NOT_EXTERNALLY_REVIEWED") {
      return { ok: false, state: next, code: "A_PROTOTYPE_FIXTURE_MISSING", message: "Plan A fixture is not declared. It cannot be authorized." };
    }
    next.authorizedBranch = next.recommendedBranch;
    next = appendEvent(next, "BRANCH_AUTHORIZED", {
      authorizedBranch: next.authorizedBranch,
      actor: "FIXED_IN_WORLD_INSTITUTIONS",
      prototypeAssumption: next.authorizedBranch === "A" ? WORLD.qaFacts.branchA : null,
    }, opts.at);
    return { ok: true, state: next, branch: next.authorizedBranch, pending: "execution", message: "The fixed agency has formed an independent authorization receipt." };
  }

  function executeAuthorized(state, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const b18 = getBeat("B18");
    const prerequisitesMet = next.completedBeats.length === 17
      && next.completedBeats.every((beatId, index) => beatId === BEAT_IDS[index])
      && (next.completedPanels.B18 || []).length === b18.panels.length;
    if (!prerequisitesMet) return { ok: false, state: next, code: "BRANCH_PREREQUISITES", message: "B18 source check and advice gates are not yet fully saved." };
    if (!next.authorizedBranch) return { ok: false, state: next, code: "NO_AUTHORIZATION", message: "The agency-authorization event is not yet formed." };
    if (next.executionComplete) return { ok: true, state: next, already: true, branch: next.executedBranch };
    if (next.executedBranch && next.executedBranch !== next.authorizedBranch) {
      return { ok: false, state: next, code: "MUTUAL_EXCLUSION", message: "The other branch has already executed. This branch is permanently refused." };
    }
    next.executedBranch = next.authorizedBranch;
    next = appendEvent(next, "BRANCH_EXECUTED", {
      executedBranch: next.executedBranch,
      actor: "FIXED_IN_WORLD_STAFF",
      playerHandledOriginals: false,
    }, opts.at);
    next.executionComplete = true;
    next = appendEvent(next, "EXECUTION_COMPLETE", { executionComplete: true, branch: next.executedBranch }, opts.at);
    next.ending = "ENDING-" + next.executedBranch;
    next = appendEvent(next, "ENDING_MINTED", { ending: next.ending, afterExecutionComplete: true }, opts.at);
    const beat = getBeat("B18");
    next = completeBeat(next, beat, opts.at);
    next.currentBeat = "B18";
    return { ok: true, state: next, branch: next.executedBranch, ending: next.ending, message: "Fixed staff finished execution. The endpoint receipt is cast." };
  }

  function markReactionRead(state, reactionId, at) {
    let next = normalizeState(state);
    if (!next.reactionsPosted.includes(reactionId)) return { ok: false, state: next, code: "REACTION_NOT_POSTED" };
    if (next.unreadReaction !== reactionId) return { ok: true, state: next, already: true };
    next.unreadReaction = null;
    next = appendEvent(next, "REACTION_READ", { reactionId }, at);
    return { ok: true, state: next };
  }

  function enterFalsePath(state, falseId, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return { ok: false, state: next, code: "UNKNOWN_FALSE_PATH", message: "There is no such public-record chain." };
    if (!next.sessionStarted) return { ok: false, state: next, code: "SESSION_REQUIRED", message: "Start a QC session first." };
    if (!next.falsePaths[falseId].entered) {
      next.falsePaths[falseId].entered = true;
      next = appendEvent(next, "FALSE_PATH_ENTERED", { falseId }, opts.at);
    }
    return { ok: true, state: next, path: clone(path) };
  }

  function advanceFalsePath(state, falseId, stepId, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return { ok: false, state: next, code: "UNKNOWN_FALSE_PATH", message: "There is no such public-record chain." };
    if (!next.sessionStarted) return { ok: false, state: next, code: "SESSION_REQUIRED", message: "Start a QC session first." };
    let branch = next.falsePaths[falseId];
    if (!branch.entered) branch.entered = true;
    const expected = path.steps[branch.stepsSeen.length];
    if (!expected) {
      return {
        ok: true,
        state: next,
        already: true,
        closed: branch.closed,
        needsConclusion: !branch.closed,
      };
    }
    if (stepId !== expected.id) return { ok: false, state: next, code: "FALSE_PATH_ORDER", message: "This record has no direct pointer from the current page to the chosen page." };
    branch.stepsSeen.push(stepId);
    next = appendEvent(next, "FALSE_PATH_STEP", { falseId, stepId, stepNumber: branch.stepsSeen.length }, opts.at);
    branch = next.falsePaths[falseId];
    return {
      ok: true,
      state: next,
      closed: false,
      needsConclusion: branch.stepsSeen.length === path.steps.length,
      nextStep: path.steps[branch.stepsSeen.length] || null,
    };
  }

  function submitFalsePathConclusion(state, falseId, answer, options) {
    const opts = options || {};
    let next = normalizeState(state);
    const path = FALSE_BY_ID.get(falseId);
    if (!path) return { ok: false, state: next, code: "UNKNOWN_FALSE_PATH", message: "There is no such public-record chain." };
    const branch = next.falsePaths[falseId];
    if (branch.closed) return { ok: true, state: next, already: true, closed: true };
    if (branch.stepsSeen.length !== path.steps.length) {
      return { ok: false, state: next, code: "FALSE_PATH_SOURCES", message: "Source pages are still not excerpted." };
    }
    if (answer !== path.correctConclusion) {
      next = appendEvent(next, "FALSE_PATH_CONCLUSION_INVALID", { falseId }, opts.at);
      return { ok: false, state: next, code: "FALSE_PATH_BOUNDARY", message: "This conclusion exceeds what the sources can exclude. First close only the one that fits." };
    }
    branch.closed = true;
    branch.methodLearned = true;
    next.optionalConclusions = next.optionalConclusions.filter((item) => item.via !== falseId);
    next.optionalConclusions.push({ id: path.propositionId, status: "disproved", via: falseId });
    next = appendEvent(next, "FALSE_PATH_CLOSED", {
      falseId,
      propositionId: path.propositionId,
      status: "disproved",
      affectsMainProgress: false,
    }, opts.at);
    return { ok: true, state: next, closed: true, propositionId: path.propositionId, message: "Limited exclusion is saved. Main-line gates did not change." };
  }

  function resolveRoute(hash) {
    const route = typeof hash === "string" && hash ? hash : "#/";
    if (RECORD_BY_ROUTE.has(route)) return { type: "record", route, record: RECORD_BY_ROUTE.get(route) };
    for (const rule of WORLD.routeManifest) {
      const match = route.match(rule.pattern);
      if (match) return { type: rule.type, route, match: match.slice(1) };
    }
    return { type: "not-found", route };
  }

  function markPublicViewed(state, route, options) {
    const opts = options || {};
    let next = normalizeState(state);
    if (!RECORD_BY_ROUTE.has(route)) return { ok: false, state: next, code: "UNKNOWN_PUBLIC_ROUTE" };
    if (!next.viewedPublicRoutes.includes(route)) {
      next.viewedPublicRoutes.push(route);
      next = appendEvent(next, "PUBLIC_RECORD_VIEWED", { route, recordId: RECORD_BY_ROUTE.get(route).id }, opts.at);
    }
    return { ok: true, state: next, record: clone(RECORD_BY_ROUTE.get(route)) };
  }

  function normalizeQuery(value) {
    return String(value == null ? "" : value)
      .normalize("NFKC")
      .trim()
      .toLocaleLowerCase("en")
      .replace(/[\s\-—_/:：，。,.]+/g, " ")
      .replace(/^\s+|\s+$/g, "");
  }

  function classifyHanWord(value) {
    const raw = String(value == null ? "" : value).trim();
    if (!raw) {
      return { ok: false, kind: "empty", query: "", msg: "Enter one search word." };
    }
    if (/[\s\u3000]/.test(raw)) {
      return { ok: false, kind: "multi", query: raw, msg: "Search one word at a time." };
    }
    if (!/^([\u4e00-\u9fff]+|[A-Za-z][A-Za-z0-9]*)$/.test(raw)) {
      return { ok: false, kind: "invalid", query: raw, msg: "Use a single word already on an opened page. Spaces and symbols will not hit a record." };
    }
    return { ok: true, kind: "ok", query: raw, msg: "" };
  }

  function searchRecords(siteId, query) {
    const site = WORLD.sites.find((item) => item.id === siteId && item.id !== "workbench");
    if (!site) return { ok: false, siteId, query: String(query || ""), kind: "invalid", count: 0, results: [], message: "There is no such site." };
    const checked = classifyHanWord(query);
    const ordinary = WORLD.records.filter((record) => record.siteId === siteId && record.kind === "ordinary");
    if (checked.kind === "empty") {
      return { ok: true, siteId, query: "", kind: "empty", count: ordinary.length, results: clone(ordinary), message: checked.msg };
    }
    if (!checked.ok) {
      return { ok: true, siteId, query: checked.query, kind: checked.kind, count: 0, results: [], message: checked.msg };
    }
    const q = checked.query;
    const ids = [];
    let forbidden = false;
    const n = String(q).toLowerCase();
    (WORLD.searchKeywords || []).forEach((row) => {
      if (!(row.queries || []).some((item) => String(item).toLowerCase() === n)) return;
      if (row.siteId !== "*" && row.siteId !== siteId) return;
      if (row.forbidden) forbidden = true;
      (row.opens || []).forEach((id) => { if (!ids.includes(id)) ids.push(id); });
    });
    const results = WORLD.records.filter((record) => ids.includes(record.id));
    if (forbidden) {
      return { ok: true, siteId, query: q, kind: "forbidden", count: results.length, results: clone(results), message: "This file is forbidden." };
    }
    if (!results.length) {
      return { ok: true, siteId, query: q, kind: "miss", count: 0, results: [], message: "Sorry, no results related to “" + q + "”. Try another word from a page you already read." };
    }
    return { ok: true, siteId, query: q, kind: "hit", count: results.length, results: clone(results), message: results.length + " matching result(s)." };
  }

  function publicRecordText(route) {
    const record = RECORD_BY_ROUTE.get(route);
    if (!record) return null;
    return [record.id, record.siteId, record.route, record.date, record.title, record.meta, record.summary]
      .concat(record.body)
      .concat(Object.entries(record.fields).map(([key, value]) => key + "=" + value))
      .join("\n");
  }

  function resetState(state, options) {
    const opts = options || {};
    const old = normalizeState(state);
    let next = createInitialState({ sessionId: old.sessionId, at: opts.at });
    next = appendEvent(next, "SESSION_RESET", { removedEnding: old.ending, removedEvents: old.eventLog.length }, opts.at);
    return { ok: true, state: next };
  }

  function progressSummary(state) {
    const next = normalizeState(state);
    const panelCount = WORLD.beats.reduce((sum, beat) => sum + beat.panels.length, 0);
    const completedPanelCount = Object.values(next.completedPanels).reduce((sum, values) => sum + values.length, 0);
    return {
      beats: { completed: next.completedBeats.length, total: WORLD.beats.length },
      panels: { completed: completedPanelCount, total: panelCount },
      outputs: { completed: next.derivedEvidence.length, total: WORLD.outcomeSlots.filter((slot) => !slot.some((id) => id.startsWith("ENDING-"))).length },
      outcomeSlots: { completed: next.derivedEvidence.length + (next.ending ? 1 : 0), total: WORLD.outcomeSlots.length },
      falsePathsClosed: WORLD.falsePaths.filter((path) => next.falsePaths[path.id].closed).length,
      ending: next.ending,
      currentBeat: next.currentBeat,
    };
  }

  return Object.freeze({
    SCHEMA_VERSION,
    WORLD,
    createInitialState,
    normalizeState,
    startSession,
    appendEvent,
    getBeat,
    getCurrentBeat,
    canAccessBeat,
    validatePanel,
    canonicalAnswers,
    invalidAnswers,
    revealHint,
    submitPanel,
    publishNextReaction,
    authorizeRecommended,
    executeAuthorized,
    markReactionRead,
    enterFalsePath,
    advanceFalsePath,
    submitFalsePathConclusion,
    resolveRoute,
    markPublicViewed,
    normalizeQuery,
    classifyHanWord,
    searchRecords,
    publicRecordText,
    resetState,
    progressSummary,
  });
});

})(typeof globalThis !== "undefined" ? globalThis : this, function (WORLD, Core) {
