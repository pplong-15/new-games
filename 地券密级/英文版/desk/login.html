<!DOCTYPE html>
<html lang="en" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digitization desk · Internal login</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/game-extra.css">
</head>
<body class="login-page">
  <div id="wrap">
    <header>
      <strong>Anpu Archives · Digitization</strong>
      <form class="dq-dead" action="login.html" method="get">
        <input name="q" placeholder="Night-shift search is off">
        <button type="submit">Search</button>
      </form>
    </header>
    <form class="login-box dq-layer-internal" id="dq-login" action="home.html" method="post">
      <h1>Internal catalog login</h1>
      <label for="user">Badge ID</label>
      <input id="user" name="user" type="text" autocomplete="off">
      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password" autocomplete="off">
      <button type="submit">Enter internal</button>
      <p class="hint">Use Zhai Pu's badge from the drawer. Id and password are in the handover book, not in this page's nav, and not in gray catalog copy.</p>
      <p class="dq-err" id="dq-err"></p>
    </form>
    <p style="text-align:center"><a href="shift.html">Open the handover book</a>　<a href="lock.html">Restricted-cabinet login</a>　<a href="../public/index.html">Back to the public site</a></p>
  </div>
  <script src="../js/state.js"></script>
  <script>DQ.bindLogin("internal", "home.html");</script>
</body>
</html>
