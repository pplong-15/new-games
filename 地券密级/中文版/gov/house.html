  <div class="wrap">
    <p>户主栏后手写侯启明（承其父户）。房屋东至石阶，西至自家猪圈，南至乡路，北至岗脊下沿。公告管的是还住人的屋子，不管坡上穴。</p>
    <p>把这句东至拿去对公开层买地券，石阶对石阶。拿去对内部层「侯宅后墙」，对不上。所里若看见内部那句，会先问这堵墙，不会先问亡者叫什么。</p>
    <p>公告不是阴契，也不能拿来教人改券。摘录到此。原公告在乡政府旧档，本所只有复印件一角。</p>
    <p class="ft">宅基地摘　只管在世房屋　东至写石阶</p>
