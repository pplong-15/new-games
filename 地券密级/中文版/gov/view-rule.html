  <div class="links">

  <div class="wrap">
    <p>查阅备注记录各来源怎么写，允许写「互相打架，建议另核」。禁止写「据此认定原件亡者为某某」「准予按某层更正地籍」「同意迁葬」。</p>
    <p>买地券是名分契约，不是当代土地使用权证书。所里拿它对照公墓证和宅基地公告时，只标冲突，不替任何一层做唯一真伪裁决。</p>
    <p>值班人员若越权定性，系统退回，例会记名。退回不是惩罚开柜，是不让一张备注变成裁决书。</p>
    <p class="ft">口径摘录　建议可以　裁决不行</p>
  </div>
