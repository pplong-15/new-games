    <p>证上分区写南岭公墓西坡。四至只写分区桩号，不写侯宅，不写石阶，不写后墙。使用人栏空着待核，经办当时没填姓。</p>
    <p>一九九一年公墓扩建以后，旧穴有的并进分区，有的还在图纸外。本摘要不能指出 047 对应哪一根桩，也不能拿来开穴。</p>
    <p>有人想按证上格式自制使用证，本所不提供样张，也不讲解防伪。摘要只为对照：公墓证不管侯家那堵墙。</p>
    <p class="ft">使用证摘　分区桩号　无侯宅字样</p>
