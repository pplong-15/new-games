  <div class="wrap">
    <p>申请人侯启明，南岭乡西坡住户。申请事项：核对安档-地券-1983-047 公开目录与其宅基地证是否同一套东至。所里不审阴宅买卖，只要求档案馆交查阅备注。</p>
    <p>备注必须写满五栏：时间、钱主、四至、中保、亡者。缺一栏，例会空着。经办人不管你信哪一层，只管格子齐不齐。</p>
    <p>侯启明在申请里写：公开网上东至若是石阶，与证上一致，请按此回复。他没提内部，也没提限制。所里不能替他把另外两层抹掉，但也不会在申请上点名要你进限制柜。</p>
    <p>本页把档号和五栏摊在眼前。口令不在这里。</p>
    <p class="ft">申请抄件　五栏要有字　所里不发开柜令</p>
