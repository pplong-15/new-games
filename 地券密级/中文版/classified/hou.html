      <div class="row"><span>西坡石阶，请人对照证上东至</span><span>南岭</span><span>8月19日</span></div>
      <p>侯启明。不是卖屋，不是卖穴。证上东至写石阶。有人把后墙说成界。谁能对照纸面，工钱面议，不进我家睡觉那一间。</p>
      <p>阴地、重写券文、开穴，一概不谈。谈了的请出去。我只要所里那张表别把后墙写死。</p>
      <p>本条不能证明内部层是谁改的，只能证明住户怕哪一句东至。工钱面议写在黄页，所里不认黄页当证据。你要是馆里的人，别回这条，走申请。</p>
