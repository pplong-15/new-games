<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字化室　内部登入</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/game-extra.css">
</head>
<body class="login-page">
  <div id="wrap">
    <header>
      <strong>安浦档案·数字化室</strong>
      <form class="dq-dead" action="login.html" method="get">
        <input name="q" placeholder="夜班检索未开通">
        <button type="submit">检索</button>
      </form>
    </header>
    <form class="login-box dq-layer-internal" id="dq-login" action="home.html" method="post">
      <h1>内部目录登入</h1>
      <label for="user">工号</label>
      <input id="user" name="user" type="text" autocomplete="off">
      <label for="pass">口令</label>
      <input id="pass" name="pass" type="password" autocomplete="off">
      <button type="submit">进入内部</button>
      <p class="hint">用抽屉里翟浦那张牌。工号和口令写在交接本，不在本页导航，也不在馆讯灰字里。</p>
      <p class="dq-err" id="dq-err"></p>
    </form>
    <p style="text-align:center"><a href="shift.html">打开交接本</a>　<a href="lock.html">限制柜登入</a>　<a href="../public/index.html">回公开网</a></p>
  </div>
  <script src="../js/state.js"></script>
  <script>DQ.bindLogin("internal", "home.html");</script>
</body>
</html>
