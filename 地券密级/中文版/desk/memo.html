      <h2>047 为何拆成三层</h2>
      <p>公开层维持展陈口径，方便网上检索。内部层写入与一九九一年宅基地公告打架的东至，以及钱主改兄为弟。限制层锁原钞件转写，夜班默认不进。</p>
      <p>亡者栏：侯成山另葬东岗。此券亡者栏后改。后改之前写谁，见限制柜。我没有把那一行同步到公开网，也没有在展陈卡上改回来。</p>
      <p>分开是规矩，不是让谁消失。谁要把限制层写进能投影的表，自己担问话。备用牌在我抽屉，夜班若非用不可，看邮箱。</p>
