<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字化室　限制柜登入</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/game-extra.css">
</head>
<body class="login-page">
  <div id="wrap">
    <header>
      <strong>安浦档案·限制阅览</strong>
      <span>备用牌用完放回</span>
    </header>
    <form class="login-box" id="dq-login" action="restricted-047.html" method="post">
      <h1>限制层</h1>
      <label for="user">密级工号</label>
      <input id="user" name="user" type="text" autocomplete="off">
      <label for="pass">密级口令</label>
      <input id="pass" name="pass" type="password" autocomplete="off">
      <button type="submit">打开限制目录</button>
      <p class="hint">白班曲晚棠的备用牌。号码和口令在她给值班邮箱的那封信里。本页不提示第一字，也不设灰栏目。</p>
      <p class="dq-err" id="dq-err"></p>
    </form>
    <p style="text-align:center"><a href="login.html">内部登入</a>　<a href="../mail/login.html">先开邮箱</a>　<a href="home.html">值班台</a></p>
  </div>
  <script src="../js/state.js"></script>
  <script>DQ.bindLogin("restrict", "restricted-047.html");</script>
</body>
</html>
