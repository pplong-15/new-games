      <p class="meta">来源：人事短讯　2018-12-02</p>
      <p>申敬之，南岭乡人，早年在乡文书室，后调县档案馆，任至局长。同事称他经手过南岭墓券展。他本人只说了一句：柜子该锁的锁上。</p>
      <p>短讯未写买地券，未写中保，未写分柜批示。那些字在馆内日志。本报只发人事。</p>
      <p>退休后他开过一个个人博客，更新很慢。链接不在本报站内，值班的人若要看，自己记博客地址。</p>
