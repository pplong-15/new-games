      <h1>入夏以来南岭旧渠水位偏低</h1>
      <p class="meta">来源：社会短讯　2024-07-19</p>
      <p>水利站称降雨少，旧渠清淤未排上日程。放羊的人说羊会下渠饮水。与公墓桩号、宅基地东至均无对照计划。</p>
      <p>有读者来信问：旧渠是不是买地券上的西至。本报未向档案馆核字段，也不把水利站的浅水写成地界变更。短讯到此为止。</p>
      <p>值班的人若看见乡谈里有人把渠和四至搅在一起，当闲话。本篇不能写入 047 任何一栏。羊找到了也一样，跟钱主无关。</p>
