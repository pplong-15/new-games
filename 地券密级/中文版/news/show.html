      <h1>县档案馆展出南岭买地券</h1>
      <p class="meta">来源：文化新闻　2016-09-18</p>
      <p>展柜里一张西坡侯氏券被写成完整故事：钱主侯万石，亡者侯成山，中保后土。馆长申敬之在剪彩时说，展陈求观众能看懂，细节留在库房。</p>
      <p>记者问原件能否拍照。馆方说扫描件可以，砖面不行。记者问有没有另一份转写。馆长说：柜外那张要能挂。</p>
      <p>本报道按发布会记录。未核对砖上每一个字。读者若只看这篇，会以为侯家券只有一版。</p>
