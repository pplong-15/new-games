      <h1>南岭公墓西坡扩建昨日破土</h1>
      <p class="meta">来源：本报通讯员　1991-04-07</p>
      <p><img class="dq-inline" alt="" src="../img/slope.jpg"></p>
      <p>乡里称旧穴分散，管理不便，西坡划进公墓分区。石阶一带仍留作住户通道，不并进墓区。报道未点侯姓，也未点葛姓。</p>
      <p>有村民担心扩建会动到还没有迁的旧葬。乡文书当时说：先钉桩，不迁骨。本报按此写。后来桩号进了使用证，旧券上的四至没有人在会上对过。</p>
      <p>此文只能证明一九九一年有过扩建口径。不能证明 047 那穴是否被钉进桩号，也不能当开穴许可。</p>
