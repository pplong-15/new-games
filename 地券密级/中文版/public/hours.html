    <h1>来访与电子件时间</h1>
    <div class="meta"><span>门房抄件</span><span>与西库不是同一把钥匙</span></div>
    <p>来访：周二至周五上午九点到十一点半，下午两点到四点半。周一整理库房。周末不接待，节前常提前关门，具体看门上纸条。</p>
    <p>电子目录：机房不断电的晚上也能点。夜班助理只看屏幕，不开西库门。有人按门铃要看砖，请让他次日再来，不要把抽屉里的牌借出去。</p>
    <p>文保所例会若在周六早上，备注必须在周五夜里交进数字化室。交晚了，投影空着，问的是值班名字，不是券。</p>
    <p>本页没有档号，没有口令。钟点不能当四至用。</p>
