    <p>A4 黑白两角。扫描件自带水印，再复印一次仍然糊。彩色要白班，夜班没有硒鼓。</p>
    <p>有人问能不能把砖拓下来带回家。不能。拓包不外借。有人问能不能按著录格式自己刻一块。本馆不指导刻写，也不给朱砂配方。</p>
    <p>缴费在一楼东窗。发票科目写「资料复制」，不要写券名。本页没有工号，没有四至，没有亡者。有人把收费标准抄进备注，所里会当没看见。</p>
