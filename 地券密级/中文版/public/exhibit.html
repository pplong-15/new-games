    <h1>二〇一六年南岭墓券展　说明卡底稿</h1>
    <div class="meta"><span>撰稿：展陈组</span><span>当时馆长：申敬之</span></div>
    <p><img class="dq-inline" alt="" src="../img/brick.jpg"></p>
    <p>展柜要一张能讲完的侯家券。西坡、冬月、钱主侯万石、亡者侯成山，观众问起来好答。中保写成后土，避免把还在世的乡文书姓名摊在玻璃上。</p>
    <p>底稿有一行被铅笔划掉：原钞件钱主另有写法，亡者栏与东岗在葬者不符。划掉的理由写在边距：展陈求完整，细节归内部。此行未进说明卡，也未进公开目录。</p>
    <p>展陈组不管宅基地。墙外那户若来问东至，让他们走所里，不要在展厅改卡。</p>
    <p>本底稿只能证明当年柜子上挂过哪一版话。不能证明砖上原本写谁。</p>

    <p>页脚：展陈底稿不是原钞　铅笔划掉的句子未进柜</p>
