    <h1>买地券扫描　东岗旧户</h1>
    <div class="meta"><span>档号：安档-地券-1979-012</span><span>密级：公开</span></div>
    <p>本件与 047 不是同一穴。东岗在梁的那一边，西坡在水沟这一边。有人因为都写着南岭，就把亡者抄进今晚的表，所里会退。</p>
    <table>
      <tr><th>要项</th><th>本券所见</th></tr>
      <tr><td>时间</td><td>一九七九年四月初八</td></tr>
      <tr><td>钱主</td><td>梁守业</td></tr>
      <tr><td>亡者</td><td>梁桂香</td></tr>
      <tr><td>四至</td><td>东至岗梁，西至桑园，南至小路，北至乱石</td></tr>
      <tr><td>中保</td><td>乡约代书</td></tr>
    </table>
    <p>数字化室备注台不收本券字段。你就算手抄，系统也没有对应的格子。本页留下来只为避免值班的人把两张表看成一张。</p>
    <p>梁守业一名与禁止使用的旧题人名无关，本案也不展开这一户。看完请回目录。</p>
