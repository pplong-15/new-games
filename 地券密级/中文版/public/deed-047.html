    <h1>买地券扫描　公开著录</h1>
    <div class="meta"><span>档号：安档-地券-1983-047</span><span>密级：公开</span></div>
    <p><img class="dq-inline" alt="" src="../img/paper.jpg"></p>
    <p>本件据二〇一六年墓券展陈卡录入。砖面朱书在扫描里发糊，下列字段按展陈卡，不按西库原钞。原钞若另有转写，不在本页。</p>
    <table>
      <tr><th>要项</th><th>公开层所见</th></tr>
      <tr><td>时间</td><td>一九八三年冬月十六</td></tr>
      <tr><td>钱主</td><td>侯万石</td></tr>
      <tr><td>亡者</td><td>侯成山</td></tr>
      <tr><td>四至</td><td>东至石阶，西至水沟，南至老槐，北至岗脊</td></tr>
      <tr><td>中保</td><td>后土神祇</td></tr>
      <tr><td>地段</td><td>南岭公墓西坡</td></tr>
    </table>
    <p>本页只能证明网上目录如此写。不能证明下葬当天谁在场，也不能证明砖上每一个字都被认全。钱数一行展陈卡从缺，缺的位置不要用套语去补。</p>
