    <h1>西库门上那张纸</h1>
    <div class="meta"><span>门房抄给信息公开网</span><span>钥匙不在夜班</span></div>
    <p>西库周五锁双簧。砖石券、未转写朱书、限制柜纸片，都在里头。夜班助理若被来人按铃，只准说：明天带介绍信。不许把数字化室的牌递出去顶钥匙。</p>
    <p>有人以为看见扫描就等于进过西库。不对。扫描是白班灯光下拍的，缺角、反光、朱砂发黑，都可能。你在屏幕上对字段，不等于你摸过砖。</p>
    <p>047 的原钞件据分拣备忘在限制柜。本门条不写它在第几屉，写了也开不了。门条只提醒一件事：今晚的活在屏幕上结束。</p>
    <p>投诉开库的电话贴在门房白天那班。夜班分机只会响，没人记。别把分机号写进备注，所里不收。</p>
