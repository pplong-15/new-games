    <h1>开放查阅须知</h1>
    <div class="meta"><span>发布：开放审核组</span><span>适用于电子件</span></div>
    <p>读者可阅已经挂网的扫描和著录。砖石原件、朱书未转写件、限制柜里的纸，一律不外借，不拍照，不临摹成新券。本馆不提供「按格式重写一份」的服务。</p>
    <p>查阅备注由值班人员填写，只记录各层目录看见什么、有无互相打架。备注不是鉴定书，不能当迁葬批准，也不能当宅基地变更依据。</p>
    <p>在世后人若对四至有异议，走文保所申请，不走夜班电话。夜班电话只报机器是否还开着。</p>
    <p>把公开层字段抄进个人博客、乡帖、黄页，本站不拦，也不背书。馆方只承认数字化室提交的那一版备注。</p>
