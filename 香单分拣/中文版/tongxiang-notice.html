      <td class="left"><h4>七月</h4>
<p>孤衣</p>
<p>不改龛</p></td>
      <td class="main"><p>盂兰期间，本会只办孤衣、供灯各一桌。不代任何家族改祖龛称谓。有人把会里列过的无嗣者写成正祀，打印冲突由代办店自己消化。</p>
<p>司徒秋：福泽若接到私人申请，请按底账分桌。会里的预算桌和私人正祀，别印成同一张。</p>
<p>会费催缴另页。今夜暂停。本通知不教开门。河灯实名以外的步骤也不写。</p>
<p>孤衣预算就那一栏。有人要把守成改出门，司徒秋得在会上解释为什么名录还写无嗣。解释归会里。香铺夜班只管别把两张单印成同一桌签。</p></td>
    </tr>
