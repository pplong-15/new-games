    <h1>河灯那年我站在西段</h1>
    <p class="meta"><span class="acct">湄湾夜读</span>2024-08-18<span class="orig">札记</span></p>
    <img class="hero-pic" alt="" src="img/lanterns.jpg">
    <p>西段亲水平台人挤人。东段黑，有人说安静。值守把我们往西赶。灯壳后来有一些漂到栏杆，环卫用网捞。</p>
<p>有人把灯当成给某一个人的信。我只看见纸和蜡烛。别把这篇抄进代办建议，当放灯许可。我后来看见有人把截图发到香铺群里，配字「夜读说可以放」。我没说。</p>
<p>东段后来画了红线。红线不是风水，是取水口。谁要在桥东第二棵树下放，城管页写了禁。</p>
<p>我那天没有写谁家的亡人。灯上若有人用圆珠笔写名字，值守会让擦掉再放。这篇里没有那个名字。读者也别来问我代填。西段那夜灯是好看。好看盖不了章。</p>
    <p class="tail">阅读 —　赞 —　虚构地方稿　35/40</p>
