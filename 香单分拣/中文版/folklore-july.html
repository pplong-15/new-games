    <h1>七月那些口头忌讳</h1>
    <p class="meta"><span class="acct">湄湾夜读</span>2023-08-09<span class="orig">札记</span></p>
    
    <p>街上爱说七月不嫁娶、不搬家。登记处没这条规定。酒楼接不接桌，是老板怕闲话，不是法律。</p>
<p>有人跑来香铺问能不能办酒，香铺又不是宴席部。把口头忌讳写成「不准结婚」，是把聊天上升成章。</p>
<p>这篇是夜读自己的闲笔。里面没有开鬼门步骤。也没有谁家的底账。当聊天看。当真，去问自己家里的老人。别问网单夜班。</p>
<p>中元那一周真正能写进告示的，是禁烧和禁放的路段。其余的随嘴。</p>
<p>有读者要我列「七月能做 / 不能做」清单。我不列。列了就会被抄进化香铺建议栏，变成假章。婚期去登记处。搬家去自己签合同。</p>
    <p class="tail">阅读 —　赞 —　俗信不是法条　37/40</p>
