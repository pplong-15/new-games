    <div class="list"><h4>退单原文</h4>
<div class="postbody">
<p>蓝秋荻：纪晚秋下午发消息，说今年改正祀，孤衣不要了。料裁了一半。钱怎么退她没说清楚，先挂在这儿给福泽对账。</p>
<p>她不是问我能不能进龛。她直接说改。我又不是祠堂。</p>
<p>这条能说明她不是手滑填错栏。不能说明开平同意，不能说明会里除名，不能说明寺里改芳名。</p>
<p>要找猫的人请去别的帖，那帖跟今夜无关。</p>
<p>我把她原话留着：改正祀，孤衣不要了。福泽若还把她那封按手滑处理，对账会对不上。钱怎么退，等她回东莞那条消息。</p>
</div></div>
