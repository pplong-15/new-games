    <h3>河堤东段　十四至十六禁放</h3>
<p>桥东第二棵树至污水提升井这一段，夜间禁放河灯。西段亲水平台仍开放，须实名领号，当场熄灭余火。</p>
<p>有人把东段画进手绘，图安静。安静的那段去年有过漂到取水口的灯壳，环卫加了班。本栏不讨论灯是不是给某个人，只标哪一段不能放。</p>
<table class="sheet">
  <tr><th>段</th><th>灯</th><th>值守</th></tr>
  <tr><td>西段亲水平台</td><td>可，须领号</td><td>有</td></tr>
  <tr><td>桥东第二棵树以下</td><td>禁</td><td>无</td></tr>
</table>
<p>夜读那篇写过河灯好看。好看是她的稿。本栏不认稿。</p>
<p>西段领号要身份证。东段没有号可领。代办若把东段手绘当成西段，灯漂到提升井，环卫会找店。不会找夜读。</p>
    <p class="ft">河道栏　33/40</p>
