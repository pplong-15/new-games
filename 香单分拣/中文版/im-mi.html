    <header>
      <strong>福泽收银　内线便条</strong>
      <div>
        <a class="ghost-btn" href="desk.html">回队列</a>
        <form id="search-form" action="search-closed.html" method="get" style="display:inline">

    <div class="notice">
      
      <h2>贴在显示器下沿</h2>
<p>纪家那封别瞎过。开平下午打来。嗓门大。我一边找零一边听。他说牌还是伯元，六月十九。别让东莞那个表妹乱填。</p>
<p>电话没录。摘记在内线簿。你要看就点开推送。屈南不在。他要是问我，我就说夜班自己对底账。</p>
<p>零钱箱锁了。桶里的盘香是给明天早上的。别拆给网单用。何家若先到，按老样子走。别跟纪家搅在一堆。</p>
<p>我十点的车。你饿了抽屉里有面包。硬是硬了点。</p>
<p>开平没留书面。他重复忌日的时候，柜台前面还有人等找零。我要是写错一个字，你按底账。别按我的字。</p>
<p>找零那叠五块是早上留下的。别拆成网单找零。早上我要对过数才能走。</p>
    </div>
