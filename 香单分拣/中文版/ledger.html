      <h2>第二格目录</h2>
<p>本店给熟客留手写底账，不是谱局，也不是户籍。目录只开今夜用得着的几房。</p>
<table>
<tr><th>房</th><th>正祀</th><th>忌日</th><th>备注</th></tr>
<tr><td>何宅</td><td>何立山</td><td>六月初三</td><td>熟客</td></tr>
<tr><td>纪家宅</td><td>纪伯元</td><td>六月十九</td><td>另见细条</td></tr>
<tr><td>童宅</td><td>（无）</td><td>—</td><td>只做过灯</td></tr>
</table>
<p>底账证明本店曾经按这个字摆过桌。它不能证明祠堂承认，也不能在夜班手里改一行。</p>
<p>童宅没有正祀条，是因为他们只来续过灯。别把空行理解成可以随便填一个名字进去。纪家宅那一行有细条，点开才看得见「不入龛」三个字是写给谁的。</p>
