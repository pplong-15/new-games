    <h3>南门巷口为什么画红线</h3>
<p>巷口空地紧贴两户窗台。纸灰会进窗。值守点改到旧粮站，是因为那里有水龙头，不是因为风水。</p>
<p>图上不写门牌。居民若按门牌去对，对错了也不怪本栏。香铺后台若把「巷口代烧」写成放行，罚单会回到店招，不会回到夜班个人。</p>
<p>本页只解释地点。往生叫什么名字、进哪一桌，公示栏没有这一格。</p>
<p>旧粮站后院的水龙头去年冻裂过一次。街道换了塑料阀。值守认阀。不认香铺回执。谁把巷口空地写成「指定点」，抄告写店名。</p>
<p>红线是喷漆，不是粉。下雨会花。花了也还是禁。居民拿花了的线来争，值守仍认阀。</p>
