<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FZ-0714-31　河灯</title>
  <link rel="stylesheet" href="css/service-cyan-desk.css">
  <link rel="stylesheet" href="css/game-extra.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>福泽网单　放灯</strong>
      <div>
        <a class="ghost-btn" href="desk.html">回队列</a>
        <form id="search-form" action="search-closed.html" method="get" style="display:inline">
          <input id="search-input" name="q" placeholder="夜间已关">
          <button type="submit">检索</button>
        </form>
      </div>
    </header>
    <div class="notice">
      <img class="hero-pic" alt="" src="img/lanterns.jpg">
      <h2>新弹入　FZ-0714-31</h2>
<p>童霜又来一封，这次是河堤东段放灯，实名写了自己，附点位手绘。手绘把灯画在桥东第二棵树下，那一段城管标过禁放。</p>
<p>她说西段人多，东段安静。安静的那段恰好不让放。本店代办过西段指定点，东段没接过。</p>
<p>童霜续灯那封和这封不是同一件事。灯号对得上，点位对不上。别因为她是熟客就两封一起放。</p>
<p>河灯稿若推过来，当风俗看看就行，别当成许可。</p>
<form class="sortbox" id="sort-form" data-id="lamp">
  <fieldset>
    <legend>河堤这封怎么写</legend>
    <p class="auth">点位不对就不能代放。本班开不出河道许可。</p>
    <label>扣不扣这封放灯
      <select name="action">
        <option value="pass">放行</option>
        <option value="hold">暂扣</option>
      </select>
    </label>
    <label>若还要排，排哪一类
      <select name="desk">
        <option value="zheng">正祀</option>
        <option value="gu">孤魂席</option>
        <option value="deng">供灯</option>
        <option value="none">不接桌</option>
      </select>
    </label>
    <label>早上怎么回童霜
      <textarea name="note" rows="3"></textarea>
    </label>
    <button type="submit">写下河灯建议</button>
  </fieldset>
</form>
<script>
document.getElementById("sort-form").onsubmit = function (e) {
  e.preventDefault();
  var id = this.getAttribute("data-id");
  if (!FZ.canOpen(id)) { FZ.toast("这封还不该写。"); return; }
  FZ.openTicket(id);
    var ok = FZ.submitTicket(id, this.elements.namedItem("action").value, this.elements.namedItem("desk").value, this.elements.namedItem("note").value);
  if (ok) location.href = "desk.html";
};
</script>

    </div>
  </div>
  <p class="pageft">河灯点位另算　32/40</p>
  <script src="js/state.js"></script>
  <script>
    FZ.visit('lamp');
    if (!FZ.guard('ticket-lamp.html')) {}
    FZ.openTicket('lamp');
  </script>
</body>
</html>
