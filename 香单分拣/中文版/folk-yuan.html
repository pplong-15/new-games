    <h1>中元与盂兰（馆藏条目）</h1>
    <div class="meta"><span>编号：民抄-15</span><span>来源：岁时卡片</span></div>
    
    <p>卡片把民间祭祖、道教中元、佛家盂兰盆写在同一周。动词是名册、放灯、分桌，不是开门迎鬼。</p>
<p>目连故事在馆里只当孝债模板，不写成必须下地狱。当代入口是网上供灯、城管禁烧、同乡会通知。旅游稿若把鬼月写成攻略，本馆不收。</p>
<p>条目没有纪守成，没有纪伯元。要对今夜那两个人，去香铺底账和会里名录，别在馆藏里找私名。</p>
<p>十四还是十五，湄湾街上两套都有。本卡片不替香铺决定今夜印哪一天。窗口关了以后，八月不能补写成「已按时」——那句是馆里对节会档案说的，不是对你这班网单说的。</p>
    <p><span class="stamp">摘抄</span></p>
