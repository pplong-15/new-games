    <h2>夜间检索已关闭</h2>
    <p>福泽网单夜班不提供全文检索。附件跟申请走，打开某一封以后，栏里会多几条。把词丢进框里不会多出新页。</p>
    <p>城管、寺庙、同乡会自己的框也接到这里。白天他们各自有人值，夜里只留推送。</p>
    <p>去年有夜班把「守成」丢进框里指望多出一份没推过的档。框是死的。底账在铁柜，芳名在寺网推送，不在检索结果里。</p>
    <p>抱歉，没有找到可列出的结果。请回队列看已经弹入的单。空串、英文、数字也一样，不会另开门。</p>
    <p>有人把「纪守成」三字拆开再丢进来，结果仍是这一页。夜间关闭就是关闭，不是考你换一种拼法。</p>
