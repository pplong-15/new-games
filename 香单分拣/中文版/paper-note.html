    <div class="list"><h4>算料</h4>
<div class="postbody">
<p>孤衣一套，纸料两刀，金箔边已经贴了。客人不要，料没法改成别人的尺寸。我按半套收，福泽那边若还代办孤衣，别再跟我订同一套。</p>
<p>会里那桌若仍走，我另备会务款的料，不跟私人退单搅。谁要把人改正祀，纸扎铺不奉陪刻字。</p>
<p>算料页只谈钱和尺寸。门怎么开不谈。七月嫁不嫁也不谈。</p>
<p>半套金箔边若福泽晨班还要孤衣，让他们另说尺寸。别默契成「私人那套改个名就能用」。会务款和私人退单我分两本账。</p>
<p>金箔边裁剩下的碎末我收进铁盒，不另卖。福泽别来问能不能凑一套。凑不了。</p>
</div></div>
