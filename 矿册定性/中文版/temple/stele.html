        <p class="scroll">辛卯年腊月补刻。按村中口述列八名，便于摆香。</p>
        <p>碑阳自右而左：霍成山、翁二海、尚小满、宁广福、葛万才、蓝守田、尹福来、曲培义。邢贵林不在石上。谭秋生不在石上。</p>
        <p>祝长河按能祭的单位刻。不按罐笼。蓝守田人已迁柏岚。尹福来人在外省。宁广福人在县城生孩子。葛万才人在卸砖。这些话他听过。仍说少一个摆不上。晚报社会组把这八个做成遇难名单。本庙没有发过更正。碑阴捐资另纸。不列遇难。有人把碑阳当成安监名单，是进错了庙门。</p>
