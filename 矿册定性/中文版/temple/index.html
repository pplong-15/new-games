        <p class="scroll">祝长河：少一个名字，今年的祭圆不上。问人数去看碑，问钱去看账。</p>
        <p>本庙不是安监。也不发抚恤。网页若把碑上的人全部写成井下，那是别人的表。账上有活人捐的香。有外包工还的愿。有外省寄来的一笔。抄的时候别把「寄」字吃掉。</p>
        <p>创建记只讲为啥立庙。不讲十二月九日风机。来访先看碑，再翻账。祝长河人在西洼村。电话写在创建记落款。县志办联查用名字就能找到他。</p>
