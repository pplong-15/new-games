      </td>
      <td class="main">
        <p>西洼有窑以来，工者祀窑神于井口。岁以腊月十八为祭，求风平火熄。庙小，香火却不绝。村中老人谓：窑要人，亦要规矩。规矩在人，不在妄言再祭一人便可复工。</p>
        <p>本记只述立庙。事故人数、风机停转、请假与迁出，皆不入记。有司若以本记当调查，是看错了文体。祝长河识字不多，请人写了这段，自己在腊月十八仍按八名摆香。</p>
        <p>信仰层归庙。结案层归安监。两层叠在同一天，容易吵，却不能焊成一句神罚。</p>
      </td>
