      <p id="a">西洼煤矿是虚构馆藏条目，用于县志办对照。井口架子还在，牌子早卸了。馆里只收沿革和技术说明，不把庙碑人数写成遇难人数。</p>
      <p>要传说看窑神条，条上写明非事故结论。要知道蓝守田、尹福来为何还在网页上，看旧花名说明。安监入井三人在安监旧站，本馆不重复造一份遇难表。</p>
