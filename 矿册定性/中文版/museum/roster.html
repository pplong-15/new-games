  <div class="wrap">
    <h1>二〇一一年年终花名为何未划</h1>
    <p class="lemma">保管员漏划　不是返矿</p>
    <div class="main">
      <table class="box">
        <tr><td colspan="2"><h3>对照</h3></td></tr>
        <tr><td class="k">蓝守田</td><td>二〇一〇年四月迁柏岚。表上仍在。</td></tr>
        <tr><td class="k">尹福来</td><td>二〇〇八年九月务工迁出。表上仍在。</td></tr>
        <tr><td class="k">复印</td><td>网页矿册把整页年终表扫进去，未对照增减簿。</td></tr>
      </table>
      <p>矿停产前，年终表图省事，离职的人不划。事故后有人做网页，整页一扫，迁出户变成遇难。工会迁出摘录能对上这两行。</p>
      <p>已迁的去向应当勾「已迁」，不要勾井下，也不要和葛万才那种从未当班的还愿人混成一类。花名证明他曾经是矿工，不证明他当天在罐笼里。</p>
    </div>
