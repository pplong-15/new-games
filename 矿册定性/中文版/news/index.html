      <h1>资料间还挂着西洼那一周</h1>
      <p class="meta">来源：地方新闻组　镜像整理　二〇一二年一月</p>
      <p>读者要查西洼，先会撞上米晚晴那篇「窑神还要一个名额」。社会组随后把庙碑八个名字排成遇难名单。文化栏写腊月十八。祭和复工挤在同一周。多年后桂绣英找过来。后续稿压在最底下。</p>
      <p>资料间不改旧稿。安监说三人。本报当年按八人走。这是当时的版面。不是现在的结论。县志办若要人数，别只剪头版。</p>
