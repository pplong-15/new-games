    <h1>西洼煤矿事故抚恤发放底</h1>
    <div class="meta"><span>编号：抚发-2012-03</span><span>三户</span></div>
    <table>
      <tr><th>户</th><th>遇难人</th><th>备注</th></tr>
      <tr><td>01</td><td>霍成山</td><td>班长。家属领。不要窑神说法进回执。</td></tr>
      <tr><td>02</td><td>翁二海</td><td>运输。妻代领。</td></tr>
      <tr><td>03</td><td>尚小满</td><td>支护。父代领。入矿未满月。</td></tr>
    </table>
    <p>宁广福一行空白，未立户。葛万才未立户。曲培义未立户。蓝守田、尹福来未立户。邢贵林、谭秋生未立户。</p>
    <p>房阿菊批：发放以安监入井名单为准。碑上多出来的名字，本室不办。有单位希望补第八份「把祭圆了」，未准。霍家女人领钱时说，回执上若出现窑神，她把钱放下也要把那几个字划掉。翁户没说话。尚小满的父亲问入矿第三周算不算正式工，本室按入井事实办，工龄争议另卷，不在这本发放底里打。</p>
    <p><span class="stamp">已发</span></p>
    <p>底册装订线在左。25/39</p>
