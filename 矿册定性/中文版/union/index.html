    <h1>西洼事故抚恤卷　室藏目录</h1>
    <div class="meta"><span>室号：工抚-西洼</span><span>保管：房阿菊</span></div>
    <img class="mood" alt="" src="../img/booklet.jpg">
    <p>本室只登记已经办过的钱和转来的劳资抄件。晚报八人、庙碑八名，不在发放范围。有人拿名额来要第八份，挡回去。</p>
    <p>目录三页：<a href="fuxu.html">抚恤发放底</a>，只列霍、翁、尚三户；<a href="leave.html">请假抄件</a>，宁广福十二月九日；<a href="move.html">迁出摘录</a>，蓝守田、尹福来。</p>
    <p>临聘可以抄，不能改发放。桂绣英来过，不要钱，只要看假条还在不在。房阿菊让她看了，并告诉她账上那笔香资不是抚恤。</p>
    <p><span class="stamp">内部</span></p>
    <p>卷皮旧，钉锈。联查「抚恤」能回到本室。24/39</p>
