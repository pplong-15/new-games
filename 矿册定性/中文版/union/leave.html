    <h1>劳资转来　请假条抄件</h1>
    <div class="meta"><span>原件在矿办邮箱</span><span>抄于二〇一一年十二月十日</span></div>
    <img class="mood" alt="" src="../img/folded.jpg">
    <p>请假人宁广福。事由：妻子桂绣英临产，赴县城妇幼陪床。起止：十二月九日早八点至十日早八点。班长霍成山代签「同意」，八点前已出门，未入井。</p>
    <p>抄件与邮箱扫描一致。检身表无宁广福。抚恤未立户。碑上有他，是后来的口述。</p>
    <p>房阿菊：桂绣英来看过这张。她说孩子夜里才生，人一直在走廊坐着。有人劝她把名额认了好领钱，她不要。抄件比邮箱原件少一句「曲培义知会一声」，意思一样。假条能证明他不该进事故册，不能证明庙里会铲碑。铲碑不是临聘的权限。</p>

    <p><span class="stamp">抄件</span></p>
    <p>纸边油。26/39</p>
