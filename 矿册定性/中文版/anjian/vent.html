<!DOCTYPE html>
<html lang="zh-CN" class="skin-gov-redbar" data-seen="vent">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通风异常摘录</title>
  <link rel="stylesheet" href="../css/gov-redbar.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div class="red">
    <h1>西翼风机停转记录</h1>
    <p>不当神罚　不当索祭</p>
  </div>
  <div class="links">
    <a href="summary.html">回到摘要</a>
    <a href="resume.html">评估被谁挤开</a>
    <form id="search-form" action="../search-results.html" method="get" style="display:inline">
      <input name="q" placeholder="查通风">
      <button type="submit">翻风机</button>
    </form>
  </div>
  <div class="wrap">
    <img class="mood" alt="" src="../img/vent.jpg">
    <table cellspacing="0" cellpadding="0">
      <tr>
        <td class="box" colspan="2">
          <h3>技术页</h3>
          <p>十二月九日十六点五十分，西翼局部风机停转。曲培义在调度室电话报矿长办公室，录音摘录：「风机停了，霍班已经下去，先撤人。」对方回复先稳住，晚上庙里还有事。</p>
          <p>十七点后燃爆。本页只证明地面调度知道通风异常，不能证明曲培义入井。瓦斯按浓度和火源写，不按窑神写。</p>
          <p>钱不器：有人要把本页改成「神示停风」，被挡。县志若采用口述八人，请至少把风机停转留在注释。</p>
        </td>
      </tr>
    </table>
    <p class="ft">摘录有删节　全文在鉴定袋　13/39</p>
  </div>
