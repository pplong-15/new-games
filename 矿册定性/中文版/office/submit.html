<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk" data-seen="submit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送复核建议</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
  <link rel="stylesheet" href="../css/patches.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>建议单　牟砚秋收这张</strong>
      <div>
        <a class="ghost-btn" href="register.html">改勾</a>
        <form id="search-form" action="../search-results.html" method="get">
          <input id="search-input" name="q" placeholder="临送再对一人">
          <button type="submit">补查</button>
        </form>
      </div>
    </header>
    <div class="notice">
      <h2>交出去就不能改口</h2>
      <p>权限仍是建议。十行都有勾，这台机子才收。空一行她明早对稿时会把整张退回来。戴厚山那种空表她已经见过一次。</p>
      <p>勾成什么样，回执就按什么样写后果。传说写进人数，霍家会从另一头来。真入井的人被勾丢，工会那三户抚恤会对不上志稿。这台机子字库老。敲慢一点。送出去不能改口。</p>
    </div>
    <div class="sms" id="formbox">
      <p>工号韩洲　日期八月二十一日夜　接收人牟砚秋</p>
      <p>点下面这一下，等于承认你对过能对的存档，或者承认你打算按晚报那套走。</p>
      <p><button type="button" id="send-btn">把十行去向送去复核</button></p>
      <p id="send-warn" hidden>还有空行。面板上没勾齐的名字，这张单不收。</p>
    </div>
    <p class="foot-desk">建议单锁在本机　7/39</p>
  </div>
  <script src="../js/seen.js"></script>
  <script src="../js/register.js"></script>
  <script src="../js/keyword-search.js"></script>
</body>
</html>
