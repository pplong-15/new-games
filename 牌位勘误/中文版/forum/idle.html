  <div class="title">北侧临位那家还换木主吗</div>
  <div class="floor">
    <div class="who">
      <div class="av"></div>
      <b>城南纸扎</b>
      <span class="n">1楼</span>
    </div>
    <div class="txt">
      <span class="n">2026-08-19 11:04</span>
      <p>谭家淑慈那张红纸出了头七还竖着。我叔做木主的，货在店里放了十天，人说来取，没来。不是咒她。人早故了。就是纸该换木，木还在我店里吃灰。</p>
    </div>
  </div>
  <div class="floor">
    <div class="who">
      <div class="av"></div>
      <b>匿名</b>
      <span class="n">2楼</span>
    </div>
    <div class="txt">
      <span class="n">2026-08-19 12:20</span>
      <p>超期跟活人上牌不是一回事。别跑去文书室把两行写成一张卡。纸钱价今晚也不要问我，问也是白天的价。</p>
    </div>
  </div>
  <div class="floor">
    <div class="who">
      <div class="av"></div>
      <b>城南纸扎</b>
      <span class="n">3楼</span>
    </div>
    <div class="txt">
      <span class="n">2026-08-19 12:41</span>
      <p>知道。我就是怕夜班临工看见北侧临位，当成今夜那个钩。淑慈故了。钩在第三行。</p>
    </div>
  </div>
  <div class="ft">可见三层　城南纸扎闲话　别当馆里的单</div>
