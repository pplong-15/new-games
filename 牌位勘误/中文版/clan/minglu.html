      <td class="left">
        <h4>摘谁</h4>
        <p>只摘与今夜纸位撞名的几行。旁支不贴。</p>
      </td>
      <td class="main">
        <p>翟守椿　已故　八月十四　东房上一代　通讯栏划黑。</p>
        <p>翟禾生　在世　东房长孙　通讯：县粮库宿舍。会费收到六月。</p>
        <p>翟晚香　在世　女　不入丁口，只留通讯。</p>
        <p>孟秋萍　在世　继室　入会身份写「眷属」，不写「配已故」。</p>
        <p>江纫　除名　一九九八年离　通讯删除。会里不再列她。</p>
        <p>本表能对「会里还把禾生当活人」。不能对户口，不能对坟。若殡仪红纸把他写成先考，和本表冲突的是红纸，不是本表自动作废。</p>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="ft">春核摘抄　非正式谱</td>
