      <td class="main">
        <p class="scroll">书记蒲敬山：东房预留事，已发馆方业务组。会内勿转发到丧期窗口。</p>
        <p>本会是县城翟姓联谊，不是祠堂管委会，更不是殡仪馆。名录登记自愿。登记「在世」只表示会里还收到这个人的会费或通讯，不代替户口。</p>
        <p>二〇二四年有人要把继室写进东昭配氏，长房不服。会里调解过一次，没写成决议。蒲敬山后来改走「生位预留」，想先占格。预留该走馆里侧门。他发进了十七点出纸的那条线。</p>
        <p>本站表格宽七百七八，宋体十二。办公时间写在页脚。来访请先看名录，不要把首页当紧急公告。</p>
      </td>
