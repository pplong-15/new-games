      <td class="left">
        <h4>时</h4>
        <p>八月二十日十六点五十分。</p>
      </td>
      <td class="main">
        <p>致沥江殡仪业务组祁：东房应入祀预留一份，请先占东昭，免被继室挪走。名单：翟禾生（在世，长孙，粮库）。其余旁支下次再补。蒲敬山。</p>
        <p>落款有会章扫描，章上字糊。蒲敬山写过「在世」仍要占东昭，字在这张底上。馆方办不办、禾生同不同意，底稿里没有。亡者栏以馆里受理为准。</p>
        <p>祁蔓四点五十八回了一个字：收。出纸记录在十七点十分。公共信箱里那封回字，时间对得上。会章糊成一团，年号看不清，只辨得出「翟」旁。</p>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="ft">底稿　非法律文书</td>
