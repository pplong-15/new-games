        <h4>窗口</h4>
        <p><a href="../public/shengwei-window.html">馆侧门怎么收</a></p>
      </td>
      <td class="main">
        <p>禄位给活人。写法不称先考。墨色常用朱，不称成主。点主那一套用不上。</p>
        <p>有人把禄位和丧期纸位看成「反正都是牌」。会里吃过亏：一九九九年邻县一家把预留送进丧棚，第二天本人来上香，看见自己的讳，闹到县里。本会此后在简说里加一句：预留不进丧棚，不进十七点那一趟红纸。</p>
        <p>蒲敬山八月二十日那张名单标题仍写应入祀预留。标题对。线路错。线路错了，馆模板会把它印成先考。印成先考，是窗口的事，不是禄位这条规矩自己要进厅。</p>
      </td>
    </tr>
