        <h2>长生禄位不走丧期门</h2>
        <p>生位是给还在的人预留的位子。有的人家给在世父母做，有的给自己做。颜色常用红底金边，写法也不称先考先妣。本馆侧门窗口收这类，每周二、五下午。</p>
        <p>生位可以在家龛里占一格。不能排进今晚要送东厅的丧期纸位。排进去，看着就是一张亡者牌。会里若发「应入祀预留」，请走侧门，不要塞进业务组十七点那一趟出纸。</p>
        <p>八月二十日翟氏会有传真进馆，标题带预留。若该名出现在二十一夜的丧期排，属于走错门，不是生位本身不成立。生位成立与否，本站不裁判，只分窗口。</p>
        <p>侧门不办点主。活人的禄位也不点主。</p>
      </section>
