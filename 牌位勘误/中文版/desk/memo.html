<body>
  <div id="wrap">
    <header>
      <strong>前任临工撕剩的备忘</strong>
      <div>
        <a class="ghost-btn" href="home.html">台</a>
      </div>
    </header>
    <div class="notice">
      <h2>卡住再往下翻，别一上来看第四折</h2>
      <p>一折：第三块牌上的人和委托摘要里的亡者，先对是不是同一个。对不上，别急着抄打印件。</p>
      <p>二折：晚报地方版、会里名录的在世栏，能对人还在不在。配氏有没有写错，看热线更正那条。</p>
      <p>三折：会里传真和生位页说明这张纸从哪条窗口进来。亡者栏别拿传真顶，还得看受理那天怎么填。</p>
      <p>四折：讳写受理亡者翟守椿。配氏写继室并注在世，或今晚干脆不写。龛写东昭属亡者。牌面那人标在世。主件用委托摘要加讣告。权限只停在建议。</p>
    </div>
    <p style="padding:12px 16px;font-size:13px">备忘不是馆规。前任怕自己再把生位抄进丧期排，才留下这四折。第四折会替你把栏填完，能不看就不看。</p>
  </div>
