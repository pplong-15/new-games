<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>著录回单·只拧一处</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>回单　半道</strong>
      <div>
        <a class="ghost-btn" href="card.html">改卡</a>
      </div>
    </header>
    <div class="notice">
      <h2>白班预览：配氏或龛动了，钩子还在</h2>
      <p id="why"></p>
      <p>江纫可以离开双人牌。东昭也可以从字面上改属。可牌面若仍把粮库的人当先考，或者在世栏仍按已故勾，厅里竖起来的还是一个活人的讳。</p>
      <p>权限你没越。所以回单没废。只是建议停在半道。白班会问：到底谁故了。</p>
    </div>
    <p style="padding:12px 16px;font-size:13px">晚报那篇领奖和地方名录的「在世」，就是给在世栏用的。主件仍要回到委托摘要，不是帖。</p>
  </div>
  <script src="../js/engine.js"></script>
  <script>
    var f = PW.get("card") || {};
    var how = f.hui === "hesheng"
      ? "配氏你改过了，讳还停在翟禾生。钩子在讳，不在配氏。"
      : "讳已经回到守椿，在世栏却仍按打印件勾了已故。两栏拧着，白班没法按暂扣预览。";
    document.getElementById("why").textContent = how;
  </script>
</body>
</html>
