  <div id="wrap">
    <header>
      <strong>详页　临位二</strong>
      <div>
        <a class="ghost-btn" href="list.html">回排</a>
      </div>
    </header>
    <div class="notice">
      <h2>纸位出了丧期</h2>
      <p>先妣谭门淑慈之位。无配。拟位北侧临位。出纸日期八月二日。头七已过，木主还没来换。馆规把这种情况叫超期纸位，不算活人入龛。</p>
    </div>
    <table>
      <thead><tr><th>项</th><th>记</th></tr></thead>
      <tbody>
        <tr><td>亡故</td><td>七月廿八，医院死亡证明复印件在白班夹里</td></tr>
        <tr><td>错在哪</td><td>该换木主没换，纸位还占着临位</td></tr>
        <tr><td>今夜卡</td><td>不收这一行。超期换木主走另一张单</td></tr>
      </tbody>
    </table>
    <p style="padding:12px 16px;font-size:13px">有人会把「超期」听成「不该有牌」。淑慈人故了。错的是纸位还占着临位，木主没来换。第三行相反：红纸已经印了，人可能还在上班。纸扎店那楼问货还在不在，是店里闲话。</p>
    <p style="padding:0 16px 16px;font-size:13px"><a href="../forum/idle.html">纸扎店那楼</a></p>
  </div>
