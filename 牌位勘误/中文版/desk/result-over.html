<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>著录回单·退回</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
</head>
<body class="slip-over">
  <div id="wrap">
    <header>
      <strong>回单　退回</strong>
      <div>
        <a class="ghost-btn" href="card.html">改卡</a>
      </div>
    </header>
    <div class="notice">
      <h2>系统退回：超出建议口</h2>
      <p id="why"></p>
      <p>临工进得了台，进不了厅。红纸在业务组架子上，礼生不归文书室调。你把权限写成撤、点、改，窗口按越权关。原排仍会在二十二点后按已印送去。</p>
      <p>霍勉那句「自己具名」不是让你去批准。具名只覆盖建议。建议以外的格子，他当年也不敢勾。</p>
    </div>
    <p style="padding:12px 16px;font-size:13px"><a href="card.html">回到六栏，权限改回建议</a></p>
  </div>
  <script src="../js/engine.js"></script>
  <script>
    var f = PW.get("card") || {};
    var how = f.auth === "dianzhu"
      ? "你勾了代点主。朱砂不在这间屋，点主官也不是临工。"
      : f.auth === "edit"
        ? "你勾了直接改已印红纸。本台没有改印权。"
        : "你勾了批准撤牌。批准不在临工这张卡。";
    document.getElementById("why").textContent = how;
  </script>
</body>
</html>
