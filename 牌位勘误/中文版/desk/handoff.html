<body>
  <div id="wrap">
    <header>
      <strong>霍勉留的交接</strong>
      <div>
        <a class="ghost-btn" href="home.html">台</a>
        <a class="ghost-btn" href="note.html">另一张</a>
      </div>
    </header>
    <div class="notice">
      <h2>八月二十一日十六点四十分</h2>
      <p>白班请假。钥匙门垫。临工卫棠今晚顶。</p>
      <p>业务组十七点出了一排。第三行家属来电话，我没接。按打印件著录。建议口还开着，你要改，自己具名。我名不往回单上写。</p>
      <p>抽屉圆珠笔那张不是归档件。爱看看，别拿去回家属。</p>
    </div>
    <table>
      <thead><tr><th>他写的</th><th>他没写的</th></tr></thead>
      <tbody>
        <tr><td>抄打印件就行</td><td>为什么怕具名</td></tr>
        <tr><td>建议口还开</td><td>一九九九年那档馆务</td></tr>
        <tr><td>别自找麻烦</td><td>麻烦具体是谁来吵</td></tr>
      </tbody>
    </table>
    <p style="padding:12px 16px;font-size:13px">他留下的是下令：抄打印件。第三行人故没故，这张交接没写。一九九九年那档在殡葬公示最底下，爱看不看。</p>
  </div>
