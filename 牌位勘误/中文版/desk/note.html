      <h2>翟晚香　八月二十一日十五点</h2>
      <p>文书室的人看一下。我弟叫翟禾生。粮库的。人没死。牌上写成先考是谁出的纸？娘要给爹占东边那格，蒲书记又要给活人留位子，你们一张纸印两头。我不能点主，家里要男丁。他又不认红纸。你们别把活人抬进厅。</p>
      <p>我电话晚香自己的号，霍师傅挂了。我去帖上说。</p>
    </div>
    <p style="padding:12px 16px;font-size:13px">字迹丑，有一处「先考」写成「先拷」，又划掉。本张不是委托，不是死亡证明。它只能说明有人来吵过「弟弟还在」。人到底在不在，要看晚报地方版和会里名录怎么写。</p>
