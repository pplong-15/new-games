<body>
  <div id="wrap">
    <header>
      <strong>详页　临位四</strong>
      <div>
        <a class="ghost-btn" href="list.html">回排</a>
      </div>
    </header>
    <div class="notice">
      <h2>外姓</h2>
      <p>先亡佟三喜之位。无配氏。拟龛写成东昭旁格。委托号委佟〇八一八。丧主佟小芽。户别：佟，不是翟。</p>
    </div>
    <table>
      <thead><tr><th>疑点</th><th>本台怎么记</th></tr></thead>
      <tbody>
        <tr><td>旁格贴着翟龛</td><td>像搬运时把纸位插错槽</td></tr>
        <tr><td>人是否故</td><td>委托与短讣都写八月十七病故，这一户不是活人入龛</td></tr>
        <tr><td>跟第三行</td><td>不是一家，不能并进同一张方案卡</td></tr>
      </tbody>
    </table>
    <p style="padding:12px 16px;font-size:13px">外姓入错槽是真错，白班可以另开挪槽建议。今夜卡是冲着第三行开的。把佟三喜填进翟家的讳，系统当乱填。小芽若来电话，记下来，别写进六栏。</p>
  </div>
</body>
