<!DOCTYPE html>
<html lang="zh-CN" class="skin-service-cyan-desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸位详页·第一行</title>
  <link rel="stylesheet" href="../css/service-cyan-desk.css">
</head>
<body>
  <div id="wrap">
    <header>
      <strong>详页　临位一</strong>
      <div>
        <a class="ghost-btn" href="list.html">回排</a>
      </div>
    </header>
    <div class="notice">
      <h2>对得上的样子</h2>
      <p>先考姚公炳川之位。配孙妩氏。拟安西厅穆位。出纸人仍是祁蔓。委托号委姚〇八一二。晚报八月十三发过短讣，亡者栏就是炳川，丧主是儿子姚石。</p>
    </div>
    <table>
      <thead><tr><th>核对</th><th>结果</th></tr></thead>
      <tbody>
        <tr><td>委托亡者</td><td>姚炳川</td></tr>
        <tr><td>牌面讳</td><td>姚炳川</td></tr>
        <tr><td>配氏</td><td>孙妩，二零一九年已故，双人牌两边都是故人</td></tr>
        <tr><td>龛</td><td>西穆，与姚家旁支约定一致</td></tr>
      </tbody>
    </table>
    <p style="padding:12px 16px;font-size:13px">这一行拿来当尺子。尺子的意思是：对得上会长这样。第三行要对成这样才写「可按亡者著录」。别把炳川的龛、配氏抄去填翟家的卡。晚报边栏也有他家短讣，字更少，更干净。</p>
  </div>
</body>
</html>
