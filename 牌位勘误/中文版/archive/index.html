    <h1>特藏室夜间可阅抄件</h1>
    <div class="meta"><span>馆藏号　家礼-沥-07</span><span>值班　岑书兰</span></div>
    <p>本室只提供朱子家礼神主条的馆藏影印，及沥江旧礼生摘录。原纸不外借。夜间对文书室开放，是因为馆方和县图有旧协议，不是对客。</p>
    <p>抄件能说明旧时怎么写讳、怎么点主、配氏怎么注。不能批准今夜挪牌，不能替人成主。当代法律不把牌位当处分依据，本室也不装成法庭。</p>
    <table>
      <tr><th>抄件</th><th>摘什么</th></tr>
      <tr><td><a href="zhuzi.html">神主条</a></td><td>考妣、讳、纸与木</td></tr>
      <tr><td><a href="dianzhu.html">点主摘</a></td><td>朱砂一点，纸位未成主</td></tr>
      <tr><td><a href="peishi.html">配氏摘</a></td><td>在世、已离、双亡</td></tr>
    </table>
    <p>夜间阅览须在登记簿写工号。卫棠若来，写卫-0821即可。岑书兰不讲解，只指目录。问「今夜第三行怎么写」，她会把人推回文书室，说特藏室不代填卡。</p>
    <p>空木主照片一张，无字，防有人把图当成已点之主。<span class="stamp">馆藏</span></p>
