    <h1>成主在朱砂，不在打印机</h1>
    <div class="meta"><span>礼生旧摘</span><span>附物件照</span></div>
    <p>点主：礼生蘸朱，于「王」上加一点，成「主」。未点，纸位只是纸。印得再红，也不算成主。馆方只出纸，不代点，旧摘与今窗口一致。</p>
    <p>朱砂盘、笔，见下图。图上无字。本页不教如何点，不写口诀，不写谁有资格。写这些越界。</p>
    <p>临工方案卡若勾「代点主」，窗口会退。退的理由在这：朱砂不在文书室，点主官也不归临工调。</p>
    <p>生位、禄位不走这一套。活人的位子不加点。<span class="stamp">摘录</span></p>
