    <h1>神主　讳与介质</h1>
    <div class="meta"><span>抄自馆藏家礼　神主章</span><span>岑书兰句读</span></div>
    <p>神主者，可移之位，与墓碑定点不同。面上书考或妣，书讳，书关系。纸可暂，木为常。暂者用于丧期，常者入家龛。</p>
    <p>书讳当据亡者。丧主之名，不宜移作先考。旧时偶有把付钱人写成亡者，礼生退回重写。沥江旧摘录里骂过这种「买纸写自己」。</p>
    <p>本抄件是句读，不是今夜操作指南。文书室若要对第三行，看受理亡者是谁，不看谁签的字。</p>
    <p>空木主无字。有字的原件不扫描上网，以免把馆藏当成某家的真主。<span class="stamp">影印</span></p>
