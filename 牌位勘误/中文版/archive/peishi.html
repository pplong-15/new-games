    <h1>双人牌上的氏</h1>
    <div class="meta"><span>沥江旧礼生条</span><span>与今热线可对</span></div>
    <p>配氏书已故之偶，宜。书在世之继室，须注「存」或「在世」，不可写成考妣皆亡，抢一格成双主。书已离且尚在者，旧摘以为不宜，谓人还在铺上，牌上先死，最惹争。</p>
    <p>江纫若已离、尚在，回填配氏，正是旧摘所斥。孟秋萍尚在，若要写，注在世；若今晚这张是丧期纸，也可以空着，等木主时再议。</p>
    <p>本条是馆藏句读。离婚不离婚，旧礼生条不写人名。晚报热线那篇才记下谁来声明。两页对过，仍按建议口走。<span class="stamp">旧摘</span></p>
