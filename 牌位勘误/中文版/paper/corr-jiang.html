      <h1>热线：勿将江纫写入亡者配氏</h1>
      <p class="meta">值班　杭疏桐　二〇二六年八月十九日　热线摘</p>
      <p>江纫来电。称一九九八年与翟守椿协议离婚，自己在县城南开铺，人好好的。有亲戚传话，说殡仪纸位配氏栏写了她。她不回翟家，也不争龛，只要名字离开亡者那一行。</p>
      <p>本报十五日讣闻已按家属要求划掉「配江纫氏」。馆里打印件若仍写她，不归本报改。热线只记来电人声明在世且已离。馆方改没改纸，本报未见回函。</p>
      <p>她拒绝提供铺面地址见报。记录到此。</p>
