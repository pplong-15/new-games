      <h1>先考翟公守椿讣告</h1>
      <p class="meta">来源：家属送稿　二〇二六年八月十五日　03版</p>
      <p>翟守椿，沥江县城南人，八月十四日病故，享年六十七。家奠择于八月十六日。随即移殡仪东厅。丧主翟禾生。继室孟秋萍。女晚香。</p>
      <p>稿末原有「配江纫氏」四字，十五日上午家属来电话划掉，说早年已离，勿见报。见报稿以本版为准。本报未见死亡证明原件，只见送稿和划改记录。</p>
      <p>礼金、花圈、车次不在本栏刊。要问厅里哪一天安位，问馆，别问报社值班。</p>
