<!DOCTYPE html>
<html lang="zh-CN" class="skin-mail-web-2010">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>信箱·霍勉草稿</title>
  <link rel="stylesheet" href="../css/mail-web-2010.css">
</head>
<body>
  <div class="top">
    <b>文书室公共信箱</b>
    <span class="unread-n">读　霍</span>
    <a href="inbox.html">回箱</a>
  </div>
  <div class="panes">
    <div class="folders">
      <a class="on" href="inbox.html">收件箱</a>
      <a href="javascript:void(0)">草稿</a>
    </div>
    <div class="mails">
      <h4>仅自己</h4>
      <div class="m unread on">
        <b>不外发　自己看</b>
        <span>8月21日 15:02</span>
      </div>
    </div>
    <div class="read">
      <div class="toolbar">
        <button type="button">未外发</button>
      </div>
      <h3>不外发　自己看</h3>
      <p class="meta">
        发件人：huo.mian@binyi.local<br>
        收件人：huo.mian@binyi.local<br>
        时间：2026-08-21 15:02
      </p>
      <p>一九九九年那张通报还挂在公示最底下。生位混进丧期排，家属堵门，点的是我的名。今夜第三行又像。临工叫卫棠。交接我写成按打印件。建议口留给她。我名不往回单上写。</p>
      <p>不是要害粮库那个人。是怕自己再当那支笔。她要改，让她具名。她要抄，也行。我先走。</p>
      <p>这封没有外发记录。他自己写给自己。六栏不从这封抄。</p>
    </div>
  </div>
  <p class="ft">自发自收　暗箱</p>
</body>
</html>
