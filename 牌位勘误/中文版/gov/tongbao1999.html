  <div class="red">
    <h1>馆务通报　一九九九年十一月</h1>
    <p>旧档扫描　人名只留值班书记员</p>
  </div>
  <div class="links">
    <a href="index.html">回公示</a>
    <a href="../mail/from-huo.html">霍勉给自己的信</a>
  </div>
  <div class="wrap">
    <p style="background:#fff;padding:12px;line-height:1.7;font-size:14px">十一月三日，有家属堵门，称丧期纸位写了尚在之人。查：会里预留名单被业务组排进东厅。当日值班书记员霍勉在出纸复核栏签字。馆方事后把窗口拆开，生位改走侧门。霍勉作检查，调离白班窗口，改值夜班文书。</p>
    <p style="background:#fff;padding:12px;line-height:1.7;font-size:14px;margin-top:8px">当年堵门那一档，窗口后来拆开了，生位改走侧门。霍勉从白班调到夜班文书，检查还在卷里。今夜第三行是不是同一套手续，本通报写不到，得看今晚的委托摘要和那张传真。旧档不代替新单。</p>
    <p class="ft">旧档　暗线　非必读</p>
  </div>
