    <div class="notice">
      <h2>阙禾走时留的两句</h2>
      <p>法在板上，别改板。</p>
      <p>过门能试记，打回的留下。</p>
      <p>他没写第三句。抽屉里那张碎纸不是他的。邮箱密码跟工号同一张门框字背面：夜岗公共箱，不用另猜。</p>
      <p>二十二点窗关。关了以后贺连舟队仍会在门口站着，除非你写下不放行。站着不是我的事。写不写，是。</p>
    </div>
    <p class="mk-side"><a href="../mail/inbox.html">公共箱</a>　12/44</p>

  </div>
  <script src="../js/engine.js"></script>
  
<p class="mk-side">他写两句就骑车走了。巷口灯还没全亮。我听第一句像嫌我手贱，听第二句又像留了条活路。活路就是试记。试记不是让我改法，是让我自己撞一次，撞完才肯信板是真的。</p>
<p class="mk-side">公共箱密码跟工号背靠背，省得再写一张。写多了会丢。丢了的条我见过，在抽屉碎纸里。</p>
