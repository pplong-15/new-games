  <div class="ft">地方讨论　不使用品牌　楼层自洽</div>

<div class="floor"><div class="who"><div class="av"></div><b>卜巷</b><span class="n">4楼</span></div><div class="txt"><span class="n">19:50</span><p>晚秧那句换白，我截过。她后来求我删，我没删。删了夜岗更看不见。看见了也别把我写成证人，我只是问门口为什么红。</p></div></div>
<p>姜篾插进来是怕自己被写成正门那一脚。他二门有柜，柜跟红布无关。无关的人最急着声明无关。</p>
