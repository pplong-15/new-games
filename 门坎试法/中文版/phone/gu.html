<body>
  <div class="phone">
    <div class="hd">收件箱</div>
    <div class="sub">顾扃　20:02</div>
    <div class="menu">
      <p>条上写丧。嘴上说喜。钥匙不换发。</p>
      <p>夜岗建议来了早上再看。别打电话催第二把。</p>
    </div>
    <div class="hint">他只认条。跟钥匙室字条同一张嘴，更短。27/44</div>
    <div class="ft"><a class="back" href="inbox.html">回列表</a>　<a href="../key/note.html">匣盖</a></div>

  </div>
  
<p>顾扃不爱用机子。这条像被连舟催急了才回。第二把是红穗那种装饰匙，匣子里根本没有。没有的东西他不补。</p><p>早上再看，指的是你的建议回单，不是他夜里改簿子。簿子下午就写死了。</p>
<p>催第二把的电话他没接。没接的人用短讯把话堵死，堵死了才肯睡觉。睡前他把匣盖盖上，盖上也不上锁。</p>
</body>
