<body>
  <div class="phone">
    <div class="hd">收件箱</div>
    <div class="sub">穆三刀　19:48</div>
    <div class="menu">
      <p>杠擦了。别记我。</p>
      <p>贺守石那头还在等抬。连舟不让门口说丧。</p>
      <p>我帮忙。我不是头。坎高，有人喊快。皮蹭到木头我听见了。</p>
    </div>
    <div class="hint">短讯能证明有人用这台机说杠擦了、说等抬。不能当目击笔录，不能指定是谁的杠。25/44</div>
    <div class="ft"><a class="back" href="inbox.html">回列表</a></div>

  </div>
  <script src="../js/engine.js"></script><script>MK.mark("seen.sms");</script>
<p>他打字慢，像戴手套。贺守石三个字他肯写，连舟两个字他不肯在门口喊。帮忙的人把脏的一趟扔给记格子的人，自己只求别上记录员那一栏。</p><p>等抬的意思是丧还没走完。走完才谈进堂布置。布置的匙下午就发了，用途写丧。他这句话跟簿子对得上。</p>
<p>他最后没署名。机子显示的名是指挥部存的。存的时候大概是白天哪个白班问过他电话。</p>
