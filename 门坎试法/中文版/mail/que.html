<body>
  <div class="top"><b>自发一封</b> <a href="inbox.html">回列表</a></div>
  <div class="panes">
    <div class="folders">
      <a href="inbox.html">来信</a>
      <a class="on" href="que.html">自发</a>
    </div>
    <div class="mails">
      <h4>自发</h4>
      <div class="m unread"><b><a href="rework.html">片子作废那张单</a></b><span>婚庆</span></div>
      <div class="m unread on"><b>白班写给白班</b><span>阙禾　去年夜</span></div>
    </div>
    <div class="read">
      <h3>写给我自己，别外发</h3>
      <p class="meta">发件人：阙禾　收件人：阙禾　去年夜</p>
      <p>下次再有人用喜的名进这条巷，过门先按丧记。先看记录，再听嘴。窗口爱红，你别跟着红。</p>
      <p>试记口留给夜岗。我不当夜岗的笔。板要写死。写死了会有人嫌。嫌比再赔一回片子强。</p>
      <p>这封解释他为何写得硬。不看也能交对。看了，别把他的怕写成今夜铁证。37/44</p>
    </div>

  </div>
  <p class="ft">自发未外发　怕不是铁证</p>
<p>他写「嫌比再赔一回片子强」的时候，大概已经决定把法写死。写死之后，夜岗若来改板，他就有理由把责任推回去。推回去不是害你。是他不想再当被追责的那一个白班。</p>
