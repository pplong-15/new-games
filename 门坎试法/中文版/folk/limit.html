<p>有人把旧抄打印出来往建议表上一贴，当自己读过今夜。贴了也不算打开过短信，不算打开过簿子。旧抄是背景。背景不能替你勾四栏。</p><p>虚构县名写在页脚，免得真有人拿去对乡志。对上也是别人的乡。</p>
<p>词条编辑栏写着网友，网友不敢具名。不敢具名的抄本，更不能抬去开堂门。</p>
